Facebook is a self-enhancer's paradise because people can____.","A":"present their dishonest profiles","B":"define their traditional lifestyles","C":"share their intellectual pursuits","D":"withhold their unflattering sides","answer":"D"}]},{"name":"Text 3","instruction":"","passage":"The concept of man versus machine is at least as old as the industrial revolution, but this phenomenon tends to be most acutely felt during economic downturns and fragile recoveries. And yet, it would be a mistake to think we are right now simply experiencing the painful side of a boom and bust cycle. Certain jobs have gone away for good, outmoded by machines. Since technology has such an insatiable appetite for eating up human jobs, this phenomenon will continue to restructure our economy in ways we cannot immediately foresee.\n\nWhen there is rapid improvement in the price and performance of technology, jobs that were once thought to be immune from automation suddenly become threatened. This argument has attracted a lot of attention, via the success of the book Race Against the Machine, by Erik Brynjolfsson and Andrew McAfee, who both hail from MIT's Center for Digital Business.\n\nThis is a powerful argument, and a scary one. And yet, John Hagel, author of The Power of Pull and other books, says Brynjolfsson and McAfee miss the reason why these jobs are so vulnerable to technology in the first place.\n\nHagel says we have designed jobs in the U.S. that tend to be \"tightly scripted\" and \"highly standardized\" ones that leave no room for \"individual initiative or creativity\". In short, these are the types of jobs that machines can perform much better at than human beings. That is how we have put a giant target sign on the backs of American workers, Hagel says.\n\nIt's time to reinvent the formula for how work is conducted, since we are still relying on a very 20th century notion of work, Hagel says. In our rapidly changing economy, we more than ever need people in the workplace who can take initiative and exercise their imagination \"to respond to unexpected events\". That is not something machines are good at. They are designed to perform very predictable activities.\n\nAs Hagel notes, Brynjolfsson and McAfee indeed touched on this point in their book. We need to reframe race against the machine as race with the machine. In other words, we need to look at the ways in which machines can augment human labor rather than replace it. So then the problem is not really about technology, but rather, \"how do we innovate our institutions and our work practices?\"","questions":[{"no":31,"stem":"According to the first paragraph, economic downturns would____.","A":"ease the competition of man vs. machine","B":"highlight machines' threat to human jobs","C":"provoke a painful technological revolution","D":"outmode our current economic structure","answer":"B"},{"no":32,"stem":"The authors of Race Against the Machine argue that____.","A":"technology is diminishing man's job opportunities","B":"automation is accelerating technological development","C":"certain jobs will remain intact after automation","D":"man will finally win the race against machine","answer":"A"},{"no":33,"stem":"Hagel argues that jobs in the U.S. are often____.","A":"performed by innovative minds","B":"scripted with an individual style","C":"standardized without a clear target","D":"designed against human creativity","answer":"D"},{"no":34,"stem":"According to the last paragraph, Brynjolfsson and McAfee discussed____.","A":"the predictability of machine behavior in practice","B":"the formula for how work is conducted efficiently","C":"the ways machines replace human labor in modern times","D":"the necessity of human involvement in the workplace","answer":"D"},{"no":35,"stem":"Which of the following could be the most appropriate title for the text?","A":"How to Innovate Our Work Practices?","B":"Machines Will Replace Human Labor","C":"Can We Win the Race Against Machines?","D":"Economic Downturns Stimulate Innovations","answer":"C"}]},{"name":"Text 4","instruction":"","passage":"When the government talks about infrastructure contributing to the economy the focus is usually on roads, railways, broadband and energy. Housing is seldom mentioned.\n\nWhy is that? To some extent the housing sector must shoulder the blame. We have not been good at communicating the real value that housing can contribute to economic growth. Then there is the scale of the typical housing project. It is hard to shove for attention among multibillion-pound infrastructure projects, so it is inevitable that the attention is focused elsewhere. But perhaps the most significant reason is that the issue has always been so politically charged.\n\nNevertheless, the affordable housing situation is desperate. Waiting lists increase all the time and we are simply not building enough new homes.\n\nThe comprehensive spending review offers an opportunity for the government to help rectify this. It needs to put historical prejudices to one side and take some steps to address our urgent housing need.\n\nThere are some indications that it is preparing to do just that. The communities minister, Don Foster, has hinted that George Osborne, Chancellor of the Exchequer, may introduce more flexibility to the current cap on the amount that local authorities can borrow against their housing stock debt. Evidence shows that 60,000 extra new homes could be built over the next five years if the cap were lifted, increasing GDP by 0.6%.\n\nMinisters should also look at creating greater certainty in the rental environment, which would have a significant impact on the ability of registered providers to fund new developments from revenues.\n\nBut it is not just down to the government. While these measures would be welcome in the short term, we must face up to the fact that the existing £4.5bn programme of grants to fund new affordable housing, set to expire in 2015, is unlikely to be extended beyond then. The Labour party has recently announced that it will retain a large part of the coalition's spending plans if it returns to power. The housing sector needs to accept that we are very unlikely to ever return to the era of large-scale public grants. We need to adjust to this changing climate.\n\nWhile the government's commitment to long-term funding may have changed, the very pressing need for more affordable housing is real and is not going away.","questions":[{"no":36,"stem":"The author believes that the housing sector____.","A":"has attracted much attention","B":"involves certain political factors","C":"shoulders too much responsibility","D":"has lost its real value in economy","answer":"B"},{"no":37,"stem":"It can be learned that affordable housing has____.","A":"increased its home supply","B":"offered spending opportunities","C":"suffered government biases","D":"disappointed the government","answer":"C"},{"no":38,"stem":"According to Paragraph 5, George Osborne may____.","A":"allow greater government debt for housing","B":"stop local authorities from building homes","C":"prepare to reduce housing stock debt","D":"release a lifted GDP growth forecast","answer":"A"},{"no":39,"stem":"It can be inferred that a stable rental environment would____.","A":"lower the costs of registered providers","B":"lessen the impact of government interference","C":"contribute to funding new developments","D":"relieve the ministers of responsibilities","answer":"C"},{"no":40,"stem":"The author believes that after 2015, the government may____.","A":"implement more policies to support housing","B":"review the need for large-scale public grants","C":"renew the affordable housing grants programme","D":"stop generous funding to the housing sector","answer":"D"}]}],"newtype":{"form":"matching","instruction":"Read the following text and match each of the numbered items in the left column to its corresponding information in the right column. There are two extra choices in the right column. Mark your answers on the ANSWER SHEET. (10 points)","passage":"Emerging in the late Sixties and reaching a peak in the Seventies, Land Art was one of a range of new forms, including Body Art, Performance Art, Action Art and Installation Art, which pushed art beyond the traditional confines of the studio and gallery. Rather than portraying landscape, land artists used the physical substance of the land itself as their medium.\n\nThe British land art, typified by Richard Long's piece, was not only more domestically scaled, but a lot quirkier than its American counterpart. Indeed, while you might assume that an exhibition of Land Art would consist only of records of works rather than the works themselves, Long's photograph of his work is the work. Since his \"action\" is in the past, the photograph is its sole embodiment.\n\nThat might seem rather an obscure point, but it sets the tone for an exhibition that contains a lot of black-and-white photographs and relatively few natural objects.\n\nLong is Britain's best-known Land Artist and his Stone Circle, a perfect ring of purplish rocks from Portishead beach laid out on the gallery floor, represents the elegant, rarefied side of the form. The Boyle Family, on the other hand, stand for its dirty, urban aspect. Comprising artists Mark Boyle and Joan Hills and their children, they recreated random sections of the British landscape on gallery walls. Their Olaf Street Study, a square of brick-strewn waste ground, is one of the few works here to embrace the commonplaceness that characterises most of our experience of the landscape most of the time.\n\nParks feature, particularly in the earlier works, such as John Hilliard's very funny Across the Park, in which a long-haired stroller is variously smiled at by a pretty girl and unwittingly assaulted in a sequence of images that turn out to be different parts of the same photograph.\n\nGenerally however British land artists preferred to get away from towns, gravitating towards landscapes that are traditionally considered beautiful such as the Lake District or the Wiltshire Downs. While it probably wasn't apparent at the time, much of this work is permeated by a spirit of romantic escapism that the likes of Wordsworth would have readily understood. Derek Jarman's yellow-tinted film Towards Avebury, a collection of long, mostly still shots of the Wiltshire landscape, evokes a tradition of English landscape painting stretching from Samuel Palmer to Paul Nash.\n\nIn the case of Hamish Fulton, you can't help feeling that the Scottish artist has simply found a way of making his love of walking pay. A typical work, such as Seven Days, consists of a single beautiful black-and-white photograph taken on an epic walk, with the mileage and number of days taken listed beneath. British Land Art as shown in this well selected, but relatively modestly scaled exhibition wasn't about imposing on the landscape, more a kind of landscape-orientated light conceptual art created passing through. It had its origins in the great outdoors, but the results were as gallery-bound as the paintings of Turner and Constable.","options":{"A":"originates from a long walk that the artist took.","B":"illustrates a kind of landscape-orientated light conceptual art.","C":"reminds people of the English landscape painting tradition.","D":"represents the elegance of the British land art.","E":"depicts the ordinary side of the British land art.","F":"embodies a romantic escape into the Scottish outdoors.","G":"contains images from different parts of the same photograph."},"items":[{"no":41,"stem":"Stone Circle","answer":"D"},{"no":42,"stem":"Olaf Street Study","answer":"E"},{"no":43,"stem":"Across the Park","answer":"G"},{"no":44,"stem":"Towards Avebury","answer":"C"},{"no":45,"stem":"Seven Days","answer":"A"}],"questions":null},"translation":{"instruction":"Translate the following text into Chinese. Write your translation on the ANSWER SHEET. (15 points)","passage":"Most people would define optimism as being endlessly happy, with a glass that's perpetually half full. But that's exactly the kind of false cheerfulness that positive psychologists wouldn't recommend. \"Healthy optimism means being in touch with reality,\" says Tal Ben-Shahar, a Harvard professor. According to Ben-Shahar, realistic optimists are those who make the best of things that happen, but not those who believe everything happens for the best.\n\nBen-Shahar uses three optimistic exercises. When he feels down – say, after giving a bad lecture – he grants himself permission to be human. He reminds himself that not every lecture can be a Nobel winner; some will be less effective than others. Next is reconstruction. He analyzes the weak lecture, learning lessons for the future about what works and what doesn't. Finally, there is perspective, which involves acknowledging that in the grand scheme of life, one lecture really doesn't matter."},"writing":[{"part":"A","type":"应用文","instruction":"47. Directions:","prompt":"Suppose you are going to study abroad and share an apartment with John, a local student. Write him an email to\n1)tell him about your living habits, and\n2)ask for advice about living there.\nDo not use your own name. Use \"Li Ming\" instead.\nDo not write your address. (10 points)"},{"part":"B","type":"图表作文","instruction":"48. Directions:","prompt":"Write an essay based on the following chart. In your writing, you should\n1)interpret the chart, and\n2)give your comments.\nYou should write about 150 words on the ANSWER SHEET. (15 points)","chart_desc":"柱状图（分组柱状图），标题为\"20年间中国城镇人口与乡村人口变化图\"。纵轴为人口数量（单位：百万），刻度0—1000；横轴为年份，含1990年、2000年、2010年三组；蓝色柱代表城镇人口，绿色柱代表乡村人口。数据：1990年城镇人口300百万、乡村人口834百万；2000年城镇人口458百万、乡村人口807百万；2010年城镇人口666百万、乡村人口674百万。趋势：20年间城镇人口持续大幅上升（300→458→666），乡村人口持续下降（834→807→674），2010年城乡人口数量已基本持平。"}]},{"year":2015,"sources":["https://english-exam.lazynote.cn/kaoyan/paper/2015-english-two/"],"notes":"正文来自懒笔记整卷页；答案字母来自该页答案速查表（与全网常见机构答案一致）。Part B为小标题heading形式，文章标题Some Old Truths to Help You Overcome Tough Times。","missing":[],"cloze":{"instruction":"Read the following text. Choose the best word(s) for each numbered blank and mark A, B, C or D on the ANSWER SHEET. (10 points)","passage":"In our contemporary culture, the prospect of communicating with – or even looking at – a stranger is virtually unbearable. Everyone around us seems to agree by the way they cling to their phones, even without a {{1}} on a subway.\n\nIt's a sad reality – our desire to avoid interacting with other human beings – because there's {{2}} to be gained from talking to the stranger standing by you. But you wouldn't know it, {{3}} into your phone. This universal protection sends the {{4}} : \"Please don't approach me.\"\n\nWhat is it that makes us feel we need to hide {{5}} our screens?\n\nOne answer is fear, according to Jon Wortmann, an executive mental coach. We fear rejection, or that our innocent social advances will be {{6}} as \"weird.\" We fear we'll be {{7}} . We fear we'll be disruptive.\n\nStrangers are inherently {{8}} to us, so we are more likely to feel {{9}} when communicating with them compared with our friends and acquaintances. To avoid this uneasiness, we {{10}} to our phones. \"Phones become our security blanket,\" Wortmann says. \"They are our happy glasses that protect us from what we perceive is going to be more {{11}} .\"\n\nBut once we rip off the band-aid, tuck our smartphones in our pockets and look up, it doesn't {{12}} so bad. In one 2011 experiment, behavioral scientists Nicholas Epley and Juliana Schroeder asked commuters to do the unthinkable: Start a {{13}} . They had Chicago train commuters talk to their fellow {{14}} . \"When Dr. Epley and Ms. Schroeder asked other people in the same train station to {{15}} how they would feel after talking to a stranger, the commuters thought their {{16}} would be more pleasant if they sat on their own,\" The New York Times summarizes. Though the participants didn't expect a positive experience, after they {{17}} with the experiment, \"not a single person reported having been embarrassed.\"\n\n{{18}} , these commutes were reportedly more enjoyable compared with those without communication, which makes absolute sense, {{19}} human beings thrive off of social connections. It's that {{20}} : Talking to strangers can make you feel connected.","questions":[{"no":1,"A":"signal","B":"permit","C":"ticket","D":"record","answer":"A"},{"no":2,"A":"nothing","B":"little","C":"another","D":"much","answer":"D"},{"no":3,"A":"beaten","B":"plugged","C":"guided","D":"brought","answer":"B"},{"no":4,"A":"message","B":"code","C":"notice","D":"sign","answer":"A"},{"no":5,"A":"under","B":"beyond","C":"behind","D":"from","answer":"C"},{"no":6,"A":"misapplied","B":"misinterpreted","C":"misadjusted","D":"mismatched","answer":"B"},{"no":7,"A":"judged","B":"fired","C":"replaced","D":"delayed","answer":"A"},{"no":8,"A":"unreasonable","B":"ungrateful","C":"unconventional","D":"unfamiliar","answer":"D"},{"no":9,"A":"comfortable","B":"confident","C":"anxious","D":"angry","answer":"C"},{"no":10,"A":"attend","B":"turn","C":"take","D":"point","answer":"B"},{"no":11,"A":"dangerous","B":"mysterious","C":"violent","D":"boring","answer":"A"},{"no":12,"A":"bend","B":"resist","C":"hurt","D":"decay","answer":"C"},{"no":13,"A":"lecture","B":"debate","C":"conversation","D":"negotiation","answer":"C"},{"no":14,"A":"trainees","B":"employees","C":"researchers","D":"passengers","answer":"D"},{"no":15,"A":"reveal","B":"choose","C":"predict","D":"design","answer":"C"},{"no":16,"A":"voyage","B":"flight","C":"walk","D":"ride","answer":"D"},{"no":17,"A":"went through","B":"did away","C":"caught up","D":"put up","answer":"A"},{"no":18,"A":"In turn","B":"In fact","C":"In particular","D":"In consequence","answer":"B"},{"no":19,"A":"unless","B":"whereas","C":"if","D":"since","answer":"D"},{"no":20,"A":"funny","B":"simple","C":"logical","D":"rare","answer":"B"}],"fills":{"1":"signal","2":"much","3":"plugged","4":"message","5":"behind","6":"misinterpreted","7":"judged","8":"unfamiliar","9":"anxious","10":"turn","11":"dangerous","12":"hurt","13":"conversation","14":"passengers","15":"predict","16":"ride","17":"went through","18":"In fact","19":"since","20":"simple"}},"reading":[{"name":"Text 1","instruction":"Read the following four texts. Answer the questions after each text by choosing A, B, C or D. Mark your answers on the ANSWER SHEET. (40 points)","passage":"A new study suggests that contrary to most surveys, people are actually more stressed at home than at work. Researchers measured people's cortisol, which is a stress marker, while they were at work and while they were at home and found it higher at what is supposed to be a place of refuge.\n\n\"Further contradicting conventional wisdom, we found that women as well as men have lower levels of stress at work than at home,\" writes one of the researchers, Sarah Damaske. In fact women even say they feel better at work, she notes. \"It is men, not women, who report being happier at home than at work.\" Another surprise is that the findings hold true for both those with children and without, but more so for nonparents. This is why people who work outside the home have better health.\n\nWhat the study doesn't measure is whether people are still doing work when they're at home, whether it is household work or work brought home from the office. For many men, the end of the workday is a time to kick back. For women who stay home, they never get to leave the office. And for women who work outside the home, they often are playing catch-up with household tasks. With the blurring of roles, and the fact that the home front lags well behind the workplace in making adjustments for working women, it's not surprising that women are more stressed at home.\n\nBut it's not just a gender thing. At work, people pretty much know what they're supposed to be doing: working, making money, doing the tasks they have to do in order to draw an income. The bargain is very pure: Employee puts in hours of physical or mental labor and employee draws out life-sustaining moola.\n\nOn the home front, however, people have no such clarity. Rare is the household in which the division of labor is so clinically and methodically laid out. There are a lot of tasks to be done, there are inadequate rewards for most of them. Your home colleagues – your family – have no clear rewards for their labor; they need to be talked into it, or if they're teenagers, threatened with complete removal of all electronic devices. Plus, they're your family. You cannot fire your family. You never really get to go home from home.\n\nSo it's not surprising that people are more stressed at home. Not only are the tasks apparently infinite, the co-workers are much harder to motivate.","questions":[{"no":21,"stem":"According to Paragraph 1, most previous surveys found that home____.","A":"offered greater relaxation than the workplace","B":"was an ideal place for stress measurement","C":"generated more stress than the workplace","D":"was an unrealistic place for relaxation","answer":"A"},{"no":22,"stem":"According to Damaske, who are likely to be the happiest at home?","A":"Working mothers.","B":"Childless husbands.","C":"Working fathers.","D":"Childless wives.","answer":"B"},{"no":23,"stem":"The blurring of working women's roles refers to the fact that____.","A":"their home is also a place for kicking back","B":"they are both bread winners and housewives","C":"there is often much housework left behind","D":"it is difficult for them to leave their office","answer":"B"},{"no":24,"stem":"The word \"moola\" (Line 4, Para. 4) most probably means____.","A":"skills","B":"energy","C":"earnings","D":"nutrition","answer":"C"},{"no":25,"stem":"The home front differs from the workplace in that____.","A":"family labor is often adequately rewarded","B":"home is hardly a cozier working environment","C":"household tasks are generally more motivating","D":"division of labor at home is seldom clear-cut","answer":"D"}]},{"name":"Text 2","instruction":"","passage":"For years, studies have found that first-generation college students – those who do not have a parent with a college degree – lag other students on a range of education achievement factors. Their grades are lower and their dropout rates are higher. But since such students are most likely to advance economically if they succeed in higher education, colleges and universities have pushed for decades to recruit more of them. This has created \"a paradox\" in that recruiting first-generation students, but then watching many of them fail, means that higher education has \"continued to reproduce and widen, rather than close\" an achievement gap based on social class, according to the depressing beginning of a paper forthcoming in the journal Psychological Science.\n\nBut the article is actually quite optimistic, as it outlines a potential solution to this problem, suggesting that an approach (which involves a one-hour, next-to-no-cost program) can close 63 percent of the achievement gap (measured by such factors as grades) between first-generation and other students.\n\nThe authors of the paper are from different universities, and their findings are based on a study involving 147 students (who completed the project) at an unnamed private university. First generation was defined as not having a parent with a four-year college degree. Most of the first-generation students (59.1 percent) were recipients of Pell Grants, a federal grant for undergraduates with financial need, while this was true only for 8.6 percent of the students with at least one parent with a four-year degree.\n\nTheir thesis – that a relatively modest intervention could have a big impact – was based on the view that first-generation students may be most lacking not in potential but in practical knowledge about how to deal with the issues that face most college students. They cite past research by several authors to show that this is the gap that must be narrowed to close the achievement gap.\n\nMany first-generation students \"struggle to navigate the middle-class culture of higher education, learn the 'rules of the game,' and take advantage of college resources,\" they write. And this becomes more of a problem when colleges don't talk about the class advantages and disadvantages of different groups of students. \"Because US colleges and universities seldom acknowledge how social class can affect students' educational experiences, many first-generation students lack insight about why they are struggling and do not understand how students 'like them' can improve.\"","questions":[{"no":26,"stem":"Recruiting more first-generation students has____.","A":"reduced their dropout rates","B":"narrowed the achievement gap","C":"missed its original purpose","D":"depressed college students","answer":"C"},{"no":27,"stem":"The authors of the research article are optimistic because____.","A":"their findings appeal to students","B":"the recruiting rate has increased","C":"the problem is solvable","D":"their approach is costless","answer":"C"},{"no":28,"stem":"The study suggests that most first-generation students____.","A":"are from single-parent families","B":"study at private universities","C":"are in need of financial support","D":"have failed their college","answer":"C"},{"no":29,"stem":"The authors of the paper believe that first-generation students____.","A":"may lack opportunities to apply for research projects","B":"are inexperienced in handling their issues at college","C":"can have a potential influence on other students","D":"are actually indifferent to the achievement gap","answer":"B"},{"no":30,"stem":"We may infer from the last paragraph that____.","A":"universities often reject the culture of the middle-class","B":"students are usually to blame for their lack of resources","C":"social class greatly helps enrich educational experiences","D":"colleges are partly responsible for the problem in question","answer":"D"}]},{"name":"Text 3","instruction":"","passage":"Even in traditional offices, \"the lingua franca of corporate America has gotten much more emotional and much more right-brained than it was 20 years ago,\" said Harvard Business School professor Nancy Koehn. She started spinning off examples. \"If you and I parachuted back to Fortune 500 companies in 1990, we would see much less frequent use of terms like journey, mission, passion. There were goals, there were strategies, there were objectives, but we didn't talk about energy; we didn't talk about passion.\"\n\nKoehn pointed out that this new era of corporate vocabulary is very \"team\"-oriented – and not by coincidence. \"Let's not forget sports – in male-dominated corporate America, it's still a big deal. It's not explicitly conscious; it's the idea that I'm a coach, and you're my team, and we're in this together. There are lots and lots of CEOs in very different companies, but most think of themselves as coaches and this is their team and they want to win.\"\n\nThese terms are also intended to infuse work with meaning – and, as Rakesh Khurana, another professor, points out, increase allegiance to the firm. \"You have the importation of terminology that historically used to be associated with non-profit organizations and religious organizations: terms like vision, values, passion, and purpose,\" said Khurana.\n\nThis new focus on personal fulfillment can help keep employees motivated amid increasingly loud debates over work-life balance. The \"mommy wars\" of the 1990s are still going on today, prompting arguments about why women still can't have it all and books like Sheryl Sandberg's Lean In, whose title has become a buzzword in its own right. Terms like unplug, offline, life-hack, bandwidth, and capacity are all about setting boundaries between the office and the home. But if your work is your \"passion,\" you'll be more likely to devote yourself to it, even if that means going home for dinner and then working long after the kids are in bed.\n\nBut this seems to be the irony of office speak: Everyone makes fun of it, but managers love it, companies depend on it, and regular people willingly absorb it. As a linguist once said, \"You can get people to think it's nonsense at the same time that you buy into it.\" In a workplace that's fundamentally indifferent to your life and its meaning, office speak can help you figure out how you relate to your work – and how your work defines who you are.","questions":[{"no":31,"stem":"According to Nancy Koehn, office language has become____.","A":"less strategic","B":"less energetic","C":"more objective","D":"more emotional","answer":"D"},{"no":32,"stem":"\"Team\"-oriented corporate vocabulary is closely related to ____.","A":"sports culture","B":"gender difference","C":"historical incidents","D":"athletic executives","answer":"A"},{"no":33,"stem":"Khurana believes that the importation of terminology aims to____.","A":"revive historical terms","B":"promote company image","C":"foster corporate cooperation","D":"strengthen employee loyalty","answer":"D"},{"no":34,"stem":"It can be inferred that Lean In____.","A":"voices for working women","B":"appeals to passionate workaholics","C":"triggers debates among mommies","D":"praises motivated employees","answer":"A"},{"no":35,"stem":"Which of the following statements is true about office speak?","A":"Linguists believe it to be nonsense.","B":"Regular people mock it but accept it.","C":"Companies find it to be fundamental.","D":"Managers admire it but avoid it.","answer":"B"}]},{"name":"Text 4","instruction":"","passage":"Many people talked of the 288,000 new jobs the Labor Department reported for June, along with the drop in the unemployment rate to 6.1 percent, as good news. And they were right. For now it appears the economy is creating jobs at a decent pace. We still have a long way to go to get back to full employment, but at least we are now finally moving forward at a faster pace.\n\nHowever, there is another important part of the jobs picture that was largely overlooked. There was a big jump in the number of people who report voluntarily working part-time. This figure is now 830,000 (4.4 percent) above its year ago level.\n\nBefore explaining the connection to the Obamacare, it is worth making an important distinction. Many people who work part-time jobs actually want full-time jobs. They take part-time work because this is all they can get. An increase in involuntary part-time work is evidence of weakness in the labor market and it means that many people will be having a very hard time making ends meet.\n\nThere was an increase in involuntary part-time in June, but the general direction has been down. Involuntary part-time employment is still far higher than before the recession, but it is down by 640,000 (7.9 percent) from its year ago level.\n\nWe know the difference between voluntary and involuntary part-time employment because people tell us. The survey used by the Labor Department asks people if they worked less than 35 hours in the reference week. If the answer is \"yes,\" they are classified as working part-time. The survey then asks whether they worked less than 35 hours in that week because they wanted to work less than full time or because they had no choice. They are only classified as voluntary part-time workers if they tell the survey taker they chose to work less than 35 hours a week.\n\nThe issue of voluntary part-time relates to Obamacare because one of the main purposes was to allow people to get insurance outside of employment. For many people, especially those with serious health conditions or family members with serious health conditions, before Obamacare the only way to get insurance was through a job that provided health insurance.\n\nHowever, Obamacare has allowed more than 12 million people to either get insurance through Medicaid or the exchanges. These are people who may previously have felt the need to get a full-time job that provided insurance in order to cover themselves and their families. With Obamacare there is no longer a link between employment and insurance.","questions":[{"no":36,"stem":"Which part of the jobs picture was neglected?","A":"The prospect of a thriving job market.","B":"The increase of voluntary part-time jobs.","C":"The possibility of full employment.","D":"The acceleration of job creation.","answer":"B"},{"no":37,"stem":"Many people work part-time because they____.","A":"prefer part-time jobs to full-time jobs","B":"feel that is enough to make ends meet","C":"cannot get their hands on full-time jobs","D":"haven't seen the weakness of the market","answer":"C"},{"no":38,"stem":"Involuntary part-time employment in the US____.","A":"shows a general tendency of decline","B":"is harder to acquire than one year ago","C":"satisfies the real need of the jobless","D":"is lower than before the recession","answer":"A"},{"no":39,"stem":"It can be learned that with Obamacare, ____.","A":"it is no longer easy for part-timers to get insurance","B":"full-time employment is still essential for insurance","C":"it is still challenging to get insurance for family members","D":"employment is no longer a precondition to get insurance","answer":"D"},{"no":40,"stem":"The text mainly discusses____.","A":"employment in the US","B":"part-timer classification","C":"insurance through Medicaid","D":"Obamacare's trouble","answer":"A"}]}],"newtype":{"form":"heading","instruction":"Read the following text and answer the questions by choosing the most suitable subheading from the list A-G for each of the numbered paragraphs (41-45). There are two extra subheadings which you do not need to use. Mark your answers on the ANSWER SHEET. (10 points)","passage":"Unfortunately, life is not a bed of roses. We are going through life facing sad experiences. Moreover, we are grieving various kinds of loss: a friendship, a romantic relationship or a house. Hard times may hold you down at what usually seems like the most inopportune time, but you should remember that they won't last forever.\n\nWhen our time of mourning is over, we press forward, stronger with a greater understanding and respect for life. Furthermore, these losses make us mature and eventually move us toward future opportunities for growth and happiness. I want to share these old truths I've learned along the way.\n\n{{41}}\n\nFear is both useful and harmful. This normal human reaction is used to protect us by signaling danger and preparing us to deal with it. Unfortunately, people create inner barriers with the help of exaggerating fears. My favorite actor Will Smith once said, \"Fear is not real. It is a product of thoughts you create. Do not misunderstand me. Danger is very real. But fear is a choice.\" I do completely agree that fears are just the product of our luxuriant imagination.\n\n{{42}}\n\nIf you are surrounded by problems and cannot stop thinking about the past, try to focus on the present moment. Many of us are weighed down by the past or anxious about the future. You may feel guilt over your past, but you are poisoning the present with the things and circumstances you cannot change. Value the present moment and remember how fortunate you are to be alive. Enjoy the beauty of the world around and keep your eyes open to see the possibilities before you. Happiness is not a point in the future and not a moment from the past, but a mindset that can be designed into the present.\n\n{{43}}\n\nSometimes it is easy to feel bad because you are going through tough times. You can be easily caught up by life problems that you forget to pause and appreciate the things you have. Only strong people prefer to smile and value their life instead of crying and complaining about something.\n\n{{44}}\n\nNo matter how isolated you might feel and how serious the situation is, you should always remember that you are not alone. Try to keep in mind that almost everyone respects and wants to help you if you are trying to make a good change in your life, especially your dearest and nearest people. You may have a circle of friends who provide constant good humor, help and companionship. If you have no friends or relatives, try to participate in several online communities, full of people who are always willing to share advice and encouragement.\n\n{{45}}\n\nToday many people find it difficult to trust their own opinion and seek balance by gaining objectivity from external sources. This way you devalue your opinion and show that you are incapable of managing your own life. When you are struggling to achieve something important you should believe in yourself and be sure that your decision is the best. You live in your skin, think your own thoughts, have your own values and make your own choices.","options":{"A":"You are not alone","B":"Experience helps you grow","C":"Pave your own unique path","D":"Most of your fears are unreal","E":"Think about the present moment","F":"Don't fear responsibility for your life","G":"There are many things to be grateful for"},"items":[{"no":41,"answer":"D"},{"no":42,"answer":"E"},{"no":43,"answer":"G"},{"no":44,"answer":"A"},{"no":45,"answer":"C"}],"questions":null},"translation":{"instruction":"Translate the following text into Chinese. Write your translation on the ANSWER SHEET. (15 points)","passage":"Think about driving a route that's very familiar. It could be your commute to work, a trip into town or the way home. Whichever it is, you know every twist and turn like the back of your hand. On these sorts of trips it's easy to lose concentration on the driving and pay little attention to the passing scenery. The consequence is that you perceive that the trip has taken less time than it actually has.\n\nThis is the well-travelled road effect: People tend to underestimate the time it takes to travel a familiar route.\n\nThe effect is caused by the way we allocate our attention. When we travel down a well-known route, because we don't have to concentrate much, time seems to flow more quickly. And afterwards, when we come to think back on it, we can't remember the journey well because we didn't pay much attention to it. So we assume it was shorter."},"writing":[{"part":"A","type":"应用文","instruction":"47. Directions:","prompt":"Suppose your university is going to host a summer camp for high school students.\nWrite a notice to\n1)briefly introduce the camp activities, and\n2)call for volunteers.\nYou should write about 100 words on the ANSWER SHEET.\nDo not use your name or the name of your university.\nDo not write your address. (10 points)"},{"part":"B","type":"图表作文","instruction":"48. Directions:","prompt":"Write an essay based on the following chart. In your writing, you should\n1)interpret the chart, and\n2)give your comments.\nYou should write about 150 words on the ANSWER SHEET. (15 points)","chart_desc":"饼图（立体饼图），标题为\"我国某市居民春节假期花销比例\"。共四个分项：新年礼物占40.0%（最大一块），交通占20.0%，聚会吃饭占20.0%，其他占20.0%。"}]},{"year":2016,"sources":["https://english-exam.lazynote.cn/kaoyan/paper/2016-english-two/"],"notes":"正文来自懒笔记整卷页；答案字母来自该页答案速查表。Part B为小标题heading形式，文章标题Act Your Shoe Size, Not Your Age。","missing":[],"cloze":{"instruction":"Read the following text. Choose the best word(s) for each numbered blank and mark A, B, C or D on the ANSWER SHEET. (10 points)","passage":"Happy people work differently. They're more productive, more creative, and willing to take greater risks. And new research suggests that happiness might influence {{1}} firms work, too.\n\nCompanies located in places with happier people invest more, according to a recent research paper. {{2}} , firms in happy places spend more on R&D (research and development). That's because happiness is linked to the kind of longer-term thinking {{3}} for making investments for the future.\n\nThe researchers wanted to know if the {{4}} and inclination for risk-taking that come with happiness would {{5}} the way companies invested. So they compared U.S. cities' average happiness {{6}} by Gallup polling with the investment activity of publicly traded firms in those areas.\n\n{{7}} enough, firms' investment and R&D intensity were correlated with the happiness of the area in which they were {{8}} . But is it really happiness that's linked to investment, or could something else about happier cities {{9}} why firms there spend more on R&D? To find out, the researchers controlled for various {{10}} that might make firms more likely to invest – like size, industry, and sales – and for indicators that a place was {{11}} to live in, like growth in wages or population. The link between happiness and investment generally {{12}} even after accounting for these things.\n\nThe correlation between happiness and investment was particularly strong for younger firms, which the authors {{13}} to \"less codified decision making process\" and the possible presence of \"younger and less {{14}} managers who are more likely to be influenced by sentiment.\" The relationship was {{15}} stronger in places where happiness was spread more {{16}} . Firms seem to invest more in places where most people are relatively happy, rather than in places with happiness inequality.\n\n{{17}} this doesn't prove that happiness causes firms to invest more or to take a longer-term view, the authors believe it at least {{18}} at that possibility. It's not hard to imagine that local culture and sentiment would help {{19}} how executives think about the future. \"It surely seems plausible that happy people would be more forward-thinking and creative and {{20}} R&D more than the average,\" said one researcher.","questions":[{"no":1,"A":"why","B":"how","C":"where","D":"when","answer":"B"},{"no":2,"A":"In return","B":"In particular","C":"In contrast","D":"In conclusion","answer":"B"},{"no":3,"A":"necessary","B":"famous","C":"perfect","D":"sufficient","answer":"A"},{"no":4,"A":"individualism","B":"realism","C":"optimism","D":"modernism","answer":"C"},{"no":5,"A":"miss","B":"echo","C":"spoil","D":"change","answer":"D"},{"no":6,"A":"imagined","B":"measured","C":"assumed","D":"invented","answer":"B"},{"no":7,"A":"Sure","B":"Odd","C":"Unfortunate","D":"Often","answer":"A"},{"no":8,"A":"divided","B":"advertised","C":"overtaxed","D":"headquartered","answer":"D"},{"no":9,"A":"summarize","B":"overstate","C":"explain","D":"emphasize","answer":"C"},{"no":10,"A":"factors","B":"stages","C":"levels","D":"methods","answer":"A"},{"no":11,"A":"desirable","B":"sociable","C":"reliable","D":"reputable","answer":"A"},{"no":12,"A":"resumed","B":"emerged","C":"held","D":"broke","answer":"C"},{"no":13,"A":"assign","B":"attribute","C":"transfer","D":"compare","answer":"B"},{"no":14,"A":"serious","B":"civilized","C":"ambitious","D":"experienced","answer":"D"},{"no":15,"A":"instead","B":"thus","C":"also","D":"never","answer":"C"},{"no":16,"A":"rapidly","B":"directly","C":"regularly","D":"equally","answer":"D"},{"no":17,"A":"While","B":"Until","C":"After","D":"Since","answer":"A"},{"no":18,"A":"arrives","B":"jumps","C":"hints","D":"strikes","answer":"C"},{"no":19,"A":"share","B":"rediscover","C":"simplify","D":"shape","answer":"D"},{"no":20,"A":"pray for","B":"lean towards","C":"send out","D":"give away","answer":"B"}],"fills":{"1":"how","2":"In particular","3":"necessary","4":"optimism","5":"change","6":"measured","7":"Sure","8":"headquartered","9":"explain","10":"factors","11":"desirable","12":"held","13":"attribute","14":"experienced","15":"also","16":"equally","17":"While","18":"hints","19":"shape","20":"lean towards"}},"reading":[{"name":"Text 1","instruction":"Read the following four texts. Answer the questions after each text by choosing A, B, C or D. Mark your answers on the ANSWER SHEET. (40 points)","passage":"It's true that high-school coding classes aren't essential for learning computer science in college. Students without experience can catch up after a few introductory courses, said Tom Cortina, the assistant dean at Carnegie Mellon's School of Computer Science.\n\nHowever, Cortina said, early exposure is beneficial. When younger kids learn computer science, they learn that it's not just a confusing, endless string of letters and numbers – but a tool to build apps, or create artwork, or test hypotheses. It's not as hard for them to transform their thought processes as it is for older students. Breaking down problems into bite-sized chunks and using code to solve them becomes normal. Giving more children this training could increase the number of people interested in the field and help fill the jobs gap, Cortina said.\n\nStudents also benefit from learning something about coding before they get to college, where introductory computer-science classes are packed to the brim, which can drive the less-experienced or less-determined students away.\n\nThe Flatiron School, where people pay to learn programming, started as one of the many coding bootcamps that have become popular for adults looking for a career change. The high-schoolers get the same curriculum, but \"we try to gear lessons toward things they're interested in,\" said Victoria Friedman, an instructor. For instance, one of the apps the students are developing suggests movies based on your mood.\n\nThe students in the Flatiron class probably won't drop out of high school and build the next Facebook. Programming languages have a quick turnover, so the \"Ruby on Rails\" language they learned may not even be relevant by the time they enter the job market. But the skills they learn – how to think logically through a problem and organize the results – apply to any coding language, said Deborah Seehorn, an education consultant for the state of North Carolina.\n\nIndeed, the Flatiron students might not go into IT at all. But creating a future army of coders is not the sole purpose of the classes. These kids are going to be surrounded by computers – in their pockets, in their offices, in their homes – for the rest of their lives. The younger they learn how computers think, how to coax the machine into producing what they want – the earlier they learn that they have the power to do that – the better.","questions":[{"no":21,"stem":"Cortina holds that early exposure to computer science makes it easier to____.","A":"complete future job training","B":"remodel the way of thinking","C":"formulate logical hypotheses","D":"perfect artwork production","answer":"B"},{"no":22,"stem":"In delivering lessons for high-schoolers, Flatiron has considered their____.","A":"experience","B":"interest","C":"career prospects","D":"academic backgrounds","answer":"B"},{"no":23,"stem":"Deborah Seehorn believes that the skills learned at Flatiron will____.","A":"help students learn other computer languages","B":"have to be upgraded when new technologies come","C":"need improving when students look for jobs","D":"enable students to make big quick money","answer":"A"},{"no":24,"stem":"According to the last paragraph, Flatiron students are expected to____.","A":"bring forth innovative computer technologies","B":"stay longer in the information technology industry","C":"become better prepared for the digitalized world","D":"compete with a future army of programmers","answer":"C"},{"no":25,"stem":"The word \"coax\" (Line 4, Para. 6) is closest in meaning to____.","A":"persuade","B":"frighten","C":"misguide","D":"challenge","answer":"A"}]},{"name":"Text 2","instruction":"","passage":"Biologists estimate that as many as 2 million lesser prairie chickens – a kind of bird living on stretching grasslands – once lent red to the often grey landscape of the midwestern and southwestern United States. But just some 22,000 birds remain today, occupying about 16% of the species' historic range.\n\nThe crash was a major reason the U.S. Fish and Wildlife Service (USFWS) decided to formally list the bird as threatened. \"The lesser prairie chicken is in a desperate situation,\" said USFWS Director Daniel Ashe. Some environmentalists, however, were disappointed. They had pushed the agency to designate the bird as \"endangered,\" a status that gives federal officials greater regulatory power to crack down on threats. But Ashe and others argued that the \"threatened\" tag gave the federal government flexibility to try out new, potentially less confrontational conservation approaches. In particular, they called for forging closer collaborations with western state governments, which are often uneasy with federal action, and with the private landowners who control an estimated 95% of the prairie chicken's habitat.\n\nUnder the plan, for example, the agency said it would not prosecute landowners or businesses that unintentionally kill, harm, or disturb the bird, as long as they had signed a range-wide management plan to restore prairie chicken habitat. Negotiated by USFWS and the states, the plan requires individuals and businesses that damage habitat as part of their operations to pay into a fund to replace every acre destroyed with 2 new acres of suitable habitat. The fund will also be used to compensate landowners who set aside habitat. USFWS also set an interim goal of restoring prairie chicken populations to an annual average of 67,000 birds over the next 10 years. And it gives the Western Association of Fish and Wildlife Agencies (WAFWA), a coalition of state agencies, the job of monitoring progress. Overall, the idea is to let \"states remain in the driver's seat for managing the species,\" Ashe said.\n\nNot everyone buys the win-win rhetoric. Some Congress members are trying to block the plan, and at least a dozen industry groups, four states, and three environmental groups are challenging it in federal court. Not surprisingly, industry groups and states generally argue it goes too far; environmentalists say it doesn't go far enough. \"The federal government is giving responsibility for managing the bird to the same industries that are pushing it to extinction,\" says biologist Jay Lininger.","questions":[{"no":26,"stem":"The major reason for listing the lesser prairie chicken as threatened is____.","A":"its drastically decreased population","B":"the underestimate of the grassland acreage","C":"a desperate appeal from some biologists","D":"the insistence of private landowners","answer":"A"},{"no":27,"stem":"The \"threatened\" tag disappointed some environmentalists in that it____.","A":"was a give-in to governmental pressure","B":"would involve fewer agencies in action","C":"granted less federal regulatory power","D":"went against conservation policies","answer":"C"},{"no":28,"stem":"It can be learned from Paragraph 3 that unintentional harm-doers will not be prosecuted if they____.","A":"agree to pay a sum for compensation","B":"volunteer to set up an equally big habitat","C":"offer to support the WAFWA monitoring job","D":"promise to raise funds for USFWS operations","answer":"A"},{"no":29,"stem":"According to Ashe, the leading role in managing the species is____.","A":"the federal government","B":"the wildlife agencies","C":"the landowners","D":"the states","answer":"D"},{"no":30,"stem":"Jay Lininger would most likely support____.","A":"industry groups","B":"the win-win rhetoric","C":"environmental groups","D":"the plan under challenge","answer":"C"}]},{"name":"Text 3","instruction":"","passage":"That everyone's too busy these days is a cliché. But one specific complaint is made especially mournfully: There's never any time to read.\n\nWhat makes the problem thornier is that the usual time-management techniques don't seem sufficient. The web's full of articles offering tips on making time to read: \"Give up TV\" or \"Carry a book with you at all times.\" But in my experience, using such methods to free up the odd 30 minutes doesn't work. Sit down to read and the flywheel of work-related thoughts keeps spinning – or else you're so exhausted that a challenging book's the last thing you need. The modern mind, Tim Parks, a novelist and critic, writes, \"is overwhelmingly inclined toward communication… It is not simply that one is interrupted; it is that one is actually inclined to interruption.\" Deep reading requires not just time, but a special kind of time which can't be obtained merely by becoming more efficient.\n\nIn fact, \"becoming more efficient\" is part of the problem. Thinking of time as a resource to be maximised means you approach it instrumentally, judging any given moment as well spent only in so far as it advances progress toward some goal. Immersive reading, by contrast, depends on being willing to risk inefficiency, goallessness, even time-wasting. Try to slot it in as a to-do list item and you'll manage only goal-focused reading – useful, sometimes, but not the most fulfilling kind. \"The future comes at us like empty bottles along an unstoppable and nearly infinite conveyor belt,\" writes Gary Eberle in his book Sacred Time, and \"we feel a pressure to fill these different-sized bottles (days, hours, minutes) as they pass, for if they get by without being filled, we will have wasted them.\" No mind-set could be worse for losing yourself in a book.\n\nSo what does work? Perhaps surprisingly, scheduling regular times for reading. You'd think this might fuel the efficiency mind-set, but in fact, Eberle notes, such ritualistic behaviour helps us \"step outside time's flow\" into \"soul time.\" You could limit distractions by reading only physical books, or on single-purpose e-readers. \"Carry a book with you at all times\" can actually work, too – providing you dip in often enough, so that reading becomes the default state from which you temporarily surface to take care of business, before dropping back down. On a really good day, it no longer feels as if you're \"making time to read,\" but just reading, and making time for everything else.","questions":[{"no":31,"stem":"The usual time-management techniques don't work because____.","A":"what they can offer does not ease the modern mind","B":"what challenging books demand is repetitive reading","C":"what people often forget is carrying a book with them","D":"what deep reading requires cannot be guaranteed","answer":"D"},{"no":32,"stem":"The \"empty bottles\" metaphor illustrates that people feel a pressure to____.","A":"update their to-do lists","B":"make passing time fulfilling","C":"carry their plans through","D":"pursue carefree reading","answer":"B"},{"no":33,"stem":"Eberle would agree that scheduling regular times for reading helps____.","A":"encourage the efficiency mind-set","B":"develop online reading habits","C":"promote ritualistic reading","D":"achieve immersive reading","answer":"D"},{"no":34,"stem":"\"Carry a book with you at all times\" can work if____.","A":"reading becomes your primary business of the day","B":"all the daily business has been promptly dealt with","C":"you are able to drop back to business after reading","D":"time can be evenly split for reading and business","answer":"A"},{"no":35,"stem":"The best title for this text could be____.","A":"How to Enjoy Easy Reading","B":"How to Find Time to Read","C":"How to Set Reading Goals","D":"How to Read Extensively","answer":"B"}]},{"name":"Text 4","instruction":"","passage":"Against a backdrop of drastic changes in economy and population structure, younger Americans are drawing a new 21st-century road map to success, the latest poll has found.\n\nAcross generational lines, Americans continue to prize many of the same traditional milestones of a successful life, including getting married, having children, owning a home, and retiring in their sixties. But while young and old mostly agree on what constitutes the finish line of a fulfilling life, they offer strikingly different paths for reaching it.\n\nYoung people who are still getting started in life were more likely than older adults to prioritize personal fulfillment in their work, to believe they will advance their careers most by regularly changing jobs, to favor communities with more public services and a faster pace of life, to agree that couples should be financially secure before getting married or having children, and to maintain that children are best served by two parents working outside the home, the survey found.\n\nFrom career to community and family, these contrasts suggest that in the aftermath of the searing Great Recession, those just starting out in life are defining priorities and expectations that will increasingly spread through virtually all aspects of American life, from consumer preferences to housing patterns to politics.\n\nYoung and old converge on one key point: Overwhelming majorities of both groups said they believe it is harder for young people today to get started in life than it was for earlier generations. While younger people are somewhat more optimistic than their elders about the prospects for those starting out today, big majorities in both groups believe those \"just getting started in life\" face a tougher climb than earlier generations in reaching such signpost achievements as securing a good-paying job, starting a family, managing debt, and finding affordable housing.\n\nPete Schneider considers the climb tougher today. Schneider, a 27-year-old auto technician from the Chicago suburbs, says he struggled to find a job after graduating from college. Even now that he is working steadily, he said, \"I can't afford to pay my monthly mortgage payments on my own, so I have to rent rooms out to people to make that happen.\" Looking back, he is struck that his parents could provide a comfortable life for their children even though neither had completed college when he was young. \"I still grew up in an upper middle-class home with parents who didn't have college degrees,\" Schneider said. \"I don't think people are capable of that anymore.\"","questions":[{"no":36,"stem":"One cross-generation mark of a successful life is____.","A":"trying out different lifestyles","B":"having a family with children","C":"working beyond retirement age","D":"setting up a profitable business","answer":"B"},{"no":37,"stem":"It can be learned from Paragraph 3 that young people tend to____.","A":"favor a slower life pace","B":"hold an occupation longer","C":"attach importance to pre-marital finance","D":"give priority to childcare outside the home","answer":"C"},{"no":38,"stem":"The priorities and expectations defined by the young will____.","A":"become increasingly clear","B":"focus on materialistic issues","C":"depend largely on political preferences","D":"reach almost all aspects of American life","answer":"D"},{"no":39,"stem":"Both young and old agree that____.","A":"good-paying jobs are less available","B":"the old made more life achievements","C":"housing loans today are easy to obtain","D":"getting established is harder for the young","answer":"D"},{"no":40,"stem":"Which of the following is true about Schneider?","A":"He found a dream job after graduating from college.","B":"His parents believe working steadily is a must for success.","C":"His parents' good life has little to do with a college degree.","D":"He thinks his job as a technician quite challenging.","answer":"C"}]}],"newtype":{"form":"heading","instruction":"Read the following text and answer the questions by choosing the most suitable subheading from the list A-G for each of the numbered paragraphs (41-45). There are two extra subheadings which you do not need to use. Mark your answers on the ANSWER SHEET. (10 points)","passage":"As adults, it seems that we are constantly pursuing happiness, often with mixed results. Yet children appear to have it down to an art – and for the most part they don't need self-help books or therapy. Instead, they look after their wellbeing instinctively, and usually more effectively than we do as grownups. Perhaps it's time to learn a few lessons from them.\n\n{{41}}\n\nWhat does a child do when he's sad? He cries. When he's angry? He shouts. Scared? Probably a bit of both. As we grow up, we learn to control our emotions so they are manageable and don't dictate our behaviours, which is in many ways a good thing. But too often we take this process too far and end up suppressing emotions, especially negative ones. That's about as effective as brushing dirt under a carpet and can even make us ill. What we need to do is find a way to acknowledge and express what we feel appropriately, and then – again, like children – move on.\n\n{{42}}\n\nA couple of Christmases ago, my youngest stepdaughter, who was nine years old at the time, got a Superman T-shirt for Christmas. It cost less than a fiver but she was overjoyed, and couldn't stop talking about it. Too often we believe that a new job, bigger house or better car will be the magic silver bullet that will allow us to finally be content, but the reality is these things have very little lasting impact on our happiness levels. Instead, being grateful for small things every day is a much better way to improve wellbeing.\n\n{{43}}\n\nHave you ever noticed how much children laugh? If we adults could indulge in a bit of silliness and giggling, we would reduce the stress hormones in our bodies, increase good hormones like endorphins, improve blood flow to our hearts and even have a greater chance of fighting off infection. All of which would, of course, have a positive effect on our happiness levels.\n\n{{44}}\n\nThe problem with being a grownup is that there's an awful lot of serious stuff to deal with – work, mortgage payments, figuring out what to cook for dinner. But as adults we also have the luxury of being able to control our own diaries and it's important that we schedule in time to enjoy the things we love. Those things might be social, sporting, creative or completely random (dancing around the living room, anyone?) – it doesn't matter, so long as they're enjoyable, and not likely to have negative side effects, such as drinking too much alcohol or going on a wild spending spree if you're on a tight budget.\n\n{{45}}\n\nHaving said all of the above, it's important to add that we shouldn't try too hard to be happy. Scientists tell us this can backfire and actually have a negative impact on our wellbeing. As the Chinese philosopher Chuang Tzu is reported to have said: \"Happiness is the absence of striving for happiness.\" And in that, once more, we need to look to the example of our children, to whom happiness is not a goal but a natural byproduct of the way they live.","options":{"A":"Be silly","B":"Have fun","C":"Ask for help","D":"Express your emotions","E":"Don't overthink it","F":"Be easily pleased","G":"Notice things"},"items":[{"no":41,"answer":"D"},{"no":42,"answer":"F"},{"no":43,"answer":"A"},{"no":44,"answer":"B"},{"no":45,"answer":"E"}],"questions":null},"translation":{"instruction":"Translate the following text into Chinese. Write your translation on the ANSWER SHEET. (15 points)","passage":"The supermarket is designed to lure customers into spending as much time as possible within its doors. The reason for this is simple: The longer you stay in the store, the more stuff you'll see, and the more stuff you see, the more you'll buy. And supermarkets contain a lot of stuff. The average supermarket, according to the Food Marketing Institute, carries some 44,000 different items, and many carry tens of thousands more. The sheer volume of available choice is enough to send shoppers into a state of information overload. According to brain-scan experiments, the demands of so much decision-making quickly become too much for us. After about 40 minutes of shopping, most people stop struggling to be rationally selective, and instead begin shopping emotionally – which is the point at which we accumulate the 50 percent of stuff in our cart that we never intended buying."},"writing":[{"part":"A","type":"应用文","instruction":"47. Directions:","prompt":"Suppose you won a translation contest and your friend, Jack, wrote an email to congratulate you and ask for advice on translation. Write him a reply to\n1)thank him, and\n2)give your advice.\nYou should write about 100 words on the ANSWER SHEET.\nDo not use your own name. Use \"Li Ming\" instead.\nDo not write your address. (10 points)"},{"part":"B","type":"图表作文","instruction":"48. Directions:","prompt":"Write an essay based on the chart below. In your writing, you should\n1)interpret the chart, and\n2)give your comments.\nYou should write about 150 words on the ANSWER SHEET. (15 points)","chart_desc":"饼图，标题为\"某高校学生旅游目的调查\"。共五个分项及占比：欣赏风景37.0%（占比最高）、缓解压力33.0%、其他15.0%、广交朋友9.0%、培养独立能力6.0%。"}]},{"year":2017,"sources":["https://english-exam.lazynote.cn/kaoyan/paper/2017-english-two/"],"notes":"正文来自懒笔记整卷页；答案字母来自该页答案速查表。Part B为多项对应matching形式，主题为美国制造业用工短缺。大作文图表端点数据经中国教育在线（eol.cn）范文交叉核对；中间年份各机构口径略有出入，已在chart_desc注明。","missing":[],"cloze":{"instruction":"Read the following text. Choose the best word(s) for each numbered blank and mark A, B, C or D on the ANSWER SHEET. (10 points)","passage":"People have speculated for centuries about a future without work. Today is no different, with academics, writers, and activists once again {{1}} that technology is replacing human workers. Some imagine that the coming work-free world will be defined by {{2}} : A few wealthy people will own all the capital, and the masses will struggle in an impoverished wasteland.\n\nA different and not mutually exclusive {{3}} holds that the future will be a wasteland of a different sort, one {{4}} by purposelessness: Without jobs to give their lives {{5}} , people will simply become lazy and depressed. {{6}} , today's unemployed don't seem to be having a great time. One Gallup poll found that 20 percent of Americans who have been unemployed for at least a year report having depression, double the rate for {{7}} Americans. Also, some research suggests that the {{8}} for rising rates of mortality, mental-health problems, and addiction {{9}} poorly-educated, middle-aged people is a shortage of well-paid jobs. Perhaps this is why many {{10}} the agonizing dullness of a jobless future.\n\nBut it doesn't {{11}} follow from findings like these that a world without work would be filled with unease. Such visions are based on the {{12}} of being unemployed in a society built on the concept of employment. In the {{13}} of work, a society designed with other ends in mind could {{14}} strikingly different circumstances for the future of labor and leisure. Today, the {{15}} of work may be a bit overblown. \"Many jobs are boring, degrading, unhealthy, and a waste of human potential,\" says John Danaher, a lecturer at the National University of Ireland in Galway.\n\nThese days, because leisure time is relatively {{16}} for most workers, people use their free time to counterbalance the intellectual and emotional {{17}} of their jobs. \"When I come home from a hard day's work, I often feel {{18}} ,\" Danaher says, adding, \"In a world in which I don't have to work, I might feel rather different\" – perhaps different enough to throw himself {{19}} a hobby or a passion project with the intensity usually reserved for {{20}} matters.","questions":[{"no":1,"A":"boasting","B":"denying","C":"warning","D":"ensuring","answer":"C"},{"no":2,"A":"inequality","B":"instability","C":"unreliability","D":"uncertainty","answer":"A"},{"no":3,"A":"policy","B":"guideline","C":"resolution","D":"prediction","answer":"D"},{"no":4,"A":"characterized","B":"divided","C":"balanced","D":"measured","answer":"A"},{"no":5,"A":"wisdom","B":"meaning","C":"glory","D":"freedom","answer":"B"},{"no":6,"A":"Instead","B":"Indeed","C":"Thus","D":"Nevertheless","answer":"B"},{"no":7,"A":"rich","B":"urban","C":"working","D":"educated","answer":"C"},{"no":8,"A":"explanation","B":"requirement","C":"compensation","D":"substitute","answer":"A"},{"no":9,"A":"under","B":"beyond","C":"alongside","D":"among","answer":"D"},{"no":10,"A":"leave behind","B":"make up","C":"worry about","D":"set aside","answer":"C"},{"no":11,"A":"statistically","B":"occasionally","C":"necessarily","D":"economically","answer":"C"},{"no":12,"A":"chances","B":"downsides","C":"benefits","D":"principles","answer":"B"},{"no":13,"A":"absence","B":"height","C":"face","D":"course","answer":"A"},{"no":14,"A":"disturb","B":"restore","C":"exclude","D":"yield","answer":"D"},{"no":15,"A":"model","B":"practice","C":"virtue","D":"hardship","answer":"C"},{"no":16,"A":"tricky","B":"lengthy","C":"mysterious","D":"scarce","answer":"D"},{"no":17,"A":"demands","B":"standards","C":"qualities","D":"threats","answer":"A"},{"no":18,"A":"ignored","B":"tired","C":"confused","D":"starved","answer":"B"},{"no":19,"A":"off","B":"against","C":"behind","D":"into","answer":"D"},{"no":20,"A":"technological","B":"professional","C":"educational","D":"interpersonal","answer":"B"}],"fills":{"1":"warning","2":"inequality","3":"prediction","4":"characterized","5":"meaning","6":"Indeed","7":"working","8":"explanation","9":"among","10":"worry about","11":"necessarily","12":"downsides","13":"absence","14":"yield","15":"virtue","16":"scarce","17":"demands","18":"tired","19":"into","20":"professional"}},"reading":[{"name":"Text 1","instruction":"Read the following four texts. Answer the questions after each text by choosing A, B, C or D. Mark your answers on the ANSWER SHEET. (40 points)","passage":"Every Saturday morning, at 9 am, more than 50,000 runners set off to run 5km around their local park. The Parkrun phenomenon began with a dozen friends and has inspired 400 events in the UK and more abroad. Events are free, staffed by thousands of volunteers. Runners range from four years old to grandparents; their times range from Andrew Baddeley's world record 13 minutes 48 seconds up to an hour.\n\nParkrun is succeeding where London's Olympic \"legacy\" is failing. Ten years ago on Monday, it was announced that the Games of the 30th Olympiad would be in London. Planning documents pledged that the great legacy of the Games would be to lever a nation of sport lovers away from their couches. The population would be fitter, healthier and produce more winners. It has not happened. The number of adults doing weekly sport did rise, by nearly 2 million in the run-up to 2012 – but the general population was growing faster. Worse, the numbers are now falling at an accelerating rate. The opposition claims primary school pupils doing at least two hours of sport a week have nearly halved. Obesity has risen among adults and children. Official retrospections continue as to why London 2012 failed to \"inspire a generation.\" The success of Parkrun offers answers.\n\nParkun is not a race but a time trial: Your only competitor is the clock. The ethos welcomes anybody. There is as much joy over a puffed-out first-timer being clapped over the line as there is about top talent shining. The Olympic bidders, by contrast, wanted to get more people doing sport and to produce more elite athletes. The dual aim was mixed up: The stress on success over taking part was intimidating for newcomers.\n\nIndeed, there is something a little absurd in the state getting involved in the planning of such a fundamentally \"grassroots\" concept as community sports associations. If there is a role for government, it should really be getting involved in providing common goods – making sure there is space for playing fields and the money to pave tennis and netball courts, and encouraging the provision of all these activities in schools. But successive governments have presided over selling green spaces, squeezing money from local authorities and declining attention on sport in education. Instead of wordy, worthy strategies, future governments need to do more to provide the conditions for sport to thrive. Or at least not make them worse.","questions":[{"no":21,"stem":"According to Paragraph 1, Parkrun has____.","A":"gained great popularity","B":"created many jobs","C":"strengthened community ties","D":"become an official festival","answer":"A"},{"no":22,"stem":"The author believes that London's Olympic \"legacy\" has failed to____.","A":"boost population growth","B":"promote sport participation","C":"improve the city's image","D":"increase sport hours in schools","answer":"B"},{"no":23,"stem":"Parkrun is different from Olympic games in that it____.","A":"aims at discovering talents","B":"focuses on mass competition","C":"does not emphasize elitism","D":"does not attract first-timers","answer":"C"},{"no":24,"stem":"With regard to mass sports, the author holds that governments should____.","A":"organize \"grassroots\" sports events","B":"supervise local sports associations","C":"increase funds for sports clubs","D":"invest in public sports facilities","answer":"D"},{"no":25,"stem":"The author's attitude to what UK governments have done for sports is____.","A":"tolerant","B":"critical","C":"uncertain","D":"sympathetic","answer":"B"}]},{"name":"Text 2","instruction":"","passage":"With so much focus on children's use of screens, it's easy for parents to forget about their own screen use. \"Tech is designed to really suck you in,\" says Jenny Radesky in her study of digital play, \"and digital products are there to promote maximal engagement. It makes it hard to disengage, and leads to a lot of bleed-over into the family routine.\"\n\nRadesky has studied the use of mobile phones and tablets at mealtimes by giving mother-child pairs a food-testing exercise. She found that mothers who used devices during the exercise started 20 per cent fewer verbal and 39 per cent fewer nonverbal interactions with their children. During a separate observation, she saw that phones became a source of tension in the family. Parents would be looking at their emails while the children would be making excited bids for their attention.\n\nInfants are wired to look at parents' faces to try to understand their world, and if those faces are blank and unresponsive – as they often are when absorbed in a device – it can be extremely disconcerting for the children. Radesky cites the \"still face experiment\" devised by developmental psychologist Ed Tronick in the 1970s. In it, a mother is asked to interact with her child in a normal way before putting on a blank expression and not giving them any visual social feedback: The child becomes increasingly distressed as she tries to capture her mother's attention. \"Parents don't have to be exquisitely present at all times, but there needs to be a balance and parents need to be responsive and sensitive to a child's verbal or nonverbal expressions of an emotional need,\" says Radesky.\n\nOn the other hand, Tronick himself is concerned that the worries about kids' use of screens are born out of an \"oppressive ideology that demands that parents should always be interacting\" with their children: \"It's based on a somewhat fantasised, very white, very upper-middle-class ideology that says if you're failing to expose your child to 30,000 words you are neglecting them.\" Tronick believes that just because a child isn't learning from the screen doesn't mean there's no value to it – particularly if it gives parents time to have a shower, do housework or simply have a break from their child. Parents, he says, can get a lot out of using their devices to speak to a friend or get some work out of the way. This can make them feel happier, which lets them be more available to their child the rest of the time.","questions":[{"no":26,"stem":"According to Jenny Radesky, digital products are designed to____.","A":"simplify routine matters","B":"absorb user attention","C":"better interpersonal relations","D":"increase work efficiency","answer":"B"},{"no":27,"stem":"Radesky's food-testing exercise shows that mothers' use of devices____.","A":"takes away babies' appetite","B":"distracts children's attention","C":"slows down babies' verbal development","D":"reduces mother-child communication","answer":"D"},{"no":28,"stem":"Radesky cites the \"still face experiment\" to show that____.","A":"it is easy for children to get used to blank expressions","B":"verbal expressions are unnecessary for emotional exchange","C":"children are insensitive to changes in their parents' mood","D":"parents need to respond to children's emotional needs","answer":"D"},{"no":29,"stem":"The oppressive ideology mentioned by Tronick requires parents to____.","A":"protect kids from exposure to wild fantasies","B":"teach their kids at least 30,000 words a year","C":"ensure constant interaction with their children","D":"remain concerned about kids' use of screens","answer":"C"},{"no":30,"stem":"According to Tronick, kids' use of screens may____.","A":"give their parents some free time","B":"make their parents more creative","C":"help them with their homework","D":"help them become more attentive","answer":"A"}]},{"name":"Text 3","instruction":"","passage":"Today, widespread social pressure to immediately go to college in conjunction with increasingly high expectations in a fast-moving world often causes students to completely overlook the possibility of taking a gap year. After all, if everyone you know is going to college in the fall, it seems silly to stay back a year, doesn't it? And after going to school for 12 years, it doesn't feel natural to spend a year doing something that isn't academic.\n\nBut while this may be true, it's not a good enough reason to condemn gap years. There's always a constant fear of falling behind everyone else on the socially perpetuated \"race to the finish line,\" whether that be toward graduate school, medical school or a lucrative career. But despite common misconceptions, a gap year does not hinder the success of academic pursuits – in fact, it probably enhances it.\n\nStudies from the United States and Australia show that students who take a gap year are generally better prepared for and perform better in college than those who do not. Rather than pulling students back, a gap year pushes them ahead by preparing them for independence, new responsibilities and environmental changes – all things that first-year students often struggle with the most. Gap year experiences can lessen the blow when it comes to adjusting to college and being thrown into a brand new environment, making it easier to focus on academics and activities rather than acclimation blunders.\n\nIf you're not convinced of the inherent value in taking a year off to explore interests, then consider its financial impact on future academic choices. According to the National Center for Education Statistics, nearly 80 percent of college students end up changing their majors at least once. This isn't surprising, considering the basic mandatory high school curriculum leaves students with a poor understanding of the vast academic possibilities that await them in college. Many students find themselves listing one major on their college applications, but switching to another after taking college classes. It's not necessarily a bad thing, but depending on the school, it can be costly to make up credits after switching too late in the game. At Boston College, for example, you would have to complete an extra year were you to switch to the nursing school from another department. Taking a gap year to figure things out initially can help prevent stress and save money later on.","questions":[{"no":31,"stem":"One of the reasons for high-school graduates not taking a gap year is that____.","A":"they think it academically misleading","B":"they have a lot of fun to expect in college","C":"it feels strange to do differently from others","D":"it seems worthless to take off-campus courses","answer":"C"},{"no":32,"stem":"Studies from the US and Australia imply that taking a gap year helps____.","A":"keep students from being unrealistic","B":"lower risks in choosing careers","C":"ease freshmen's financial burdens","D":"relieve freshmen of pressures","answer":"D"},{"no":33,"stem":"The word \"acclimation\" (Para. 3) is closest in meaning to____.","A":"adaptation","B":"application","C":"motivation","D":"competition","answe
