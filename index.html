less dependent on advertising","D":"are less affected by readership","answer":"C"},{"no":29,"stem":"What can be inferred from the last paragraph about the current newspaper business?","A":"Distinctiveness is an essential feature of newspapers.","B":"Completeness is to blame for the failure of newspapers.","C":"Foreign bureaus play a crucial role in the newspaper business.","D":"Readers have lost their interest in car and film reviews.","answer":"A"},{"no":30,"stem":"The most appropriate title for this text would be","A":"American Newspapers: Struggling for Survival","B":"American Newspapers: Gone with the Wind","C":"American Newspapers: A Thriving Business","D":"American Newspapers: A Hopeless Story","answer":"A"}]},{"name":"Text 3","instruction":"Read the following four texts. Answer the questions after each text by choosing A, B, C or D. Mark your answers on ANSWER SHEET 1. (40 points)","passage":"We tend to think of the decades immediately following World War II as a time of prosperity and growth, with soldiers returning home by the millions, going off to college on the G. I. Bill and lining up at the marriage bureaus.\n\nBut when it came to their houses, it was a time of common sense and a belief that less could truly be more. During the Depression and the war, Americans had learned to live with less, and that restraint, in combination with the postwar confidence in the future, made small, efficient housing positively stylish.\n\nEconomic condition was only a stimulus for the trend toward efficient living. The phrase \"less is more\" was actually first popularized by a German, the architect Ludwig Mies van der Rohe, who like other people associated with the Bauhaus, a school of design, emigrated to the United States before World War II and took up posts at American architecture schools. These designers came to exert enormous influence on the course of American architecture, but none more so than Mies.\n\nMies's signature phrase means that less decoration, properly organized, has more impact than a lot. Elegance, he believed, did not derive from abundance. Like other modern architects, he employed metal, glass and laminated wood — materials that we take for granted today but that in the 1940s symbolized the future. Mies's sophisticated presentation masked the fact that the spaces he designed were small and efficient, rather than big and often empty.\n\nThe apartments in the elegant towers Mies built on Chicago's Lake Shore Drive, for example, were small — two-bedroom units under 1,000 square feet — compared with those in their older neighbors along the city's Gold Coast. But they were popular because of their airy glass walls, the views they afforded and the elegance of the buildings' details and proportions, the architectural equivalent of the abstract art so popular at the time.\n\nThe trend toward \"less\" was not entirely foreign. In the 1930s Frank Lloyd Wright started building more modest and efficient houses — usually around 1,200 square feet — than the spreading two-story ones he had designed in the 1890s and the early 20th century.\n\nThe \"Case Study Houses\" commissioned from talented modern architects by California Arts & Architecture magazine between 1945 and 1962 were yet another homegrown influence on the \"less is more\" trend. Aesthetic effect came from the landscape, new materials and forthright detailing. In his Case Study House, Ralph Rapson may have mispredicted just how the mechanical revolution would impact everyday life — few American families acquired helicopters, though most eventually got clothes dryers — but his belief that self-sufficiency was both desirable and inevitable was widely shared.","questions":[{"no":31,"stem":"The postwar American housing style largely reflected the Americans'","A":"prosperity and growth","B":"efficiency and practicality","C":"restraint and confidence","D":"pride and faithfulness","answer":"C"},{"no":32,"stem":"Which of the following can be inferred from Paragraph 3 about the Bauhaus?","A":"It was founded by Ludwig Mies van der Rohe.","B":"Its designing concept was affected by World War II.","C":"Most American architects used to be associated with it.","D":"It had a great influence upon American architecture.","answer":"D"},{"no":33,"stem":"Mies held that elegance of architectural design","A":"was related to large space","B":"was identified with emptiness","C":"was not reliant on abundant decoration","D":"was not associated with efficiency","answer":"C"},{"no":34,"stem":"What is true about the apartments Mies built on Chicago's Lake Shore Drive?","A":"They ignored details and proportions.","B":"They were built with materials popular at that time.","C":"They were more spacious than neighboring buildings.","D":"They shared some characteristics of abstract art.","answer":"D"},{"no":35,"stem":"What can we learn about the design of the \"Case Study Houses\"?","A":"Mechanical devices were widely used.","B":"Natural scenes were taken into consideration.","C":"Details were sacrificed for the overall effect.","D":"Eco-friendly materials were employed.","answer":"B"}]},{"name":"Text 4","instruction":"Read the following four texts. Answer the questions after each text by choosing A, B, C or D. Mark your answers on ANSWER SHEET 1. (40 points)","passage":"Will the European Union make it? The question would have sounded strange not long ago. Now even the project's greatest cheerleaders talk of a continent facing a \"Bermuda triangle\" of debt, population decline and lower growth. As well as those chronic problems, the EU faces an acute crisis in its economic core, the 16 countries that use the single currency. Markets have lost faith that the euro zone's economies, weaker or stronger, will one day converge thanks to the discipline of sharing a single currency, which denies uncompetitive members the quick fix of devaluation.\n\nYet the debate about how to save Europe's single currency from disintegration is stuck. It is stuck because the euro zone's dominant powers, France and Germany, agree on the need for greater harmonization within the euro zone, but disagree about what to harmonise.\n\nGermany thinks the euro must be saved by stricter rules on borrowing, spending and competitiveness, backed by quasi-automatic sanctions for governments that do not obey. These might include threats to freeze EU funds for poorer regions and EU mega-projects, and even the suspension of a country's voting rights in EU ministerial councils. It insists that economic co-ordination should involve all 27 members of the EU club, among whom there is a small majority for free-market liberalism and economic rigour; in the inner core alone, Germany fears, a small majority favour French interference.\n\nA \"southern\" camp headed by France wants something different: \"European economic government\" within an inner core of euro-zone members. Translated, that means politicians intervening in monetary policy and a system of redistribution from richer to poorer members, via cheaper borrowing for governments through common Eurobonds or complete fiscal transfers. Finally, figures close to the French government have murmured, euro-zone members should agree to some fiscal and social harmonization: e.g., curbing competition in corporate-tax rates or labour costs.\n\nIt is too soon to write off the EU. It remains the world's largest trading block. At its best, the European project is remarkably liberal: built around a single market of 27 rich and poor countries, its internal borders are far more open to goods, capital and labour than any comparable trading area. It is an ambitious attempt to blunt the sharpest edges of globalization, and make capitalism benign.","questions":[{"no":36,"stem":"The EU is faced with so many problems that","A":"it has more or less lost faith in markets","B":"even its supporters begin to feel concerned","C":"some of its member countries plan to abandon euro","D":"it intends to deny the possibility of devaluation","answer":"B"},{"no":37,"stem":"The debate over the EU's single currency is stuck because the dominant powers","A":"are competing for the leading position","B":"are busy handling their own crises","C":"fail to reach an agreement on harmonization","D":"disagree on the steps towards disintegration","answer":"C"},{"no":38,"stem":"To solve the euro problem, Germany proposed that","A":"EU funds for poor regions be increased","B":"stricter regulations be imposed","C":"only core members be involved in economic co-ordination","D":"voting rights of the EU members be guaranteed","answer":"B"},{"no":39,"stem":"The French proposal of handling the crisis implies that","A":"poor countries are more likely to get funds","B":"strict monetary policy will be applied to poor countries","C":"loans will be readily available to rich countries","D":"rich countries will basically control Eurobonds","answer":"A"},{"no":40,"stem":"Regarding the future of the EU, the author seems to feel","A":"pessimistic","B":"desperate","C":"conceited","D":"hopeful","answer":"D"}]}],"newtype":{"form":"matching","instruction":"Read the following text and answer the questions by finding information from the left column that corresponds to each of the marked details given in the right column. There are two extra choices in the right column. Mark your answers on ANSWER SHEET 1. (10 points)","passage":"Leading doctors today weigh in on the debate over the government's role in promoting public health by demanding that ministers impose \"fat taxes\" on unhealthy food and introduce cigarette-style warnings to children about the dangers of a poor diet. The demands follow comments made last week by the health secretary, Andrew Lansley, who insisted the government could not force people to make healthy choices and promised to free businesses from public health regulations.\n\nBut senior medical figures want to stop fast-food outlets opening near schools, restrict advertising of products high in fat, salt or sugar, and limit sponsorship of sports events by fast-food producers such as McDonald's.\n\nThey argue that government action is necessary to curb Britain's addiction to unhealthy food and help halt spiraling rates of obesity, diabetes and heart disease. Professor Terence Stephenson, president of the Royal College of Paediatrics and Child Health, said that the consumption of unhealthy food should be seen to be just as damaging as smoking or excessive drinking.\n\n\"Thirty years ago, it would have been inconceivable to have imagined a ban on smoking in the workplace or in pubs, and yet that is what we have now. Are we willing to be just as courageous in respect of obesity? I would suggest that we should be,\" said the leader of the UK's children's doctors.\n\nLansley has alarmed health campaigners by suggesting he wants industry rather than government to take the lead. He said that manufacturers of crisps and candies could play a central role in the Change4Life campaign, the centrepiece of government efforts to boost healthy eating and fitness. He has also criticized the celebrity chef Jamie Oliver's high-profile attempt to improve school lunches in England as an example of how \"lecturing\" people was not the best way to change their behavior.\n\nStephenson suggested potential restrictions could include banning TV advertisements for foods high in fat, salt or sugar before 9 pm and limiting them on billboards or in cinemas. \"If we were really bold, we might even begin to think of high-calorie fast food in the same way as cigarettes — by setting strict limits on advertising, product placement and sponsorship of sports events,\" he said.\n\nSuch a move could affect firms such as McDonald's, which sponsors the youth coaching scheme run by the Football Association. Fast-food chains should also stop offering \"inducements\" such as toys, cute animals and mobile phone credit to lure young customers, Stephenson said.\n\nProfessor Dinesh Bhugra, president of the Royal College of Psychiatrists, said: \"If children are taught about the impact that food has on their growth, and that some things can harm, at least information is available up front.\"\n\nHe also urged councils to impose \"fast-food-free zones\" around schools and hospitals — areas within which takeaways cannot open.\n\nA Department of Health spokesperson said: \"We need to create a new vision for public health where all of society works together to get healthy and live longer. This includes creating a new 'responsibility deal' with business, built on social responsibility, not state regulation. Later this year, we will publish a white paper setting out exactly how we will achieve this.\"\n\nThe food industry will be alarmed that such senior doctors back such radical moves, especially the call to use some of the tough tactics that have been deployed against smoking over the last decade.","options":{"A":"\"fat taxes\" should be imposed on fast-food producers such as McDonald's.","B":"the government should ban fast-food outlets in the neighborhood of schools.","C":"\"lecturing\" was an effective way to improve school lunches in England.","D":"cigarette-style warnings should be introduced to children about the dangers of a poor diet.","E":"the producers of crisps and candies could contribute significantly to the Change4Life campaign.","F":"parents should set good examples for their children by keeping a healthy diet at home.","G":"the government should strengthen the sense of responsibility among businesses."},"items":[{"no":41,"stem":"Andrew Lansley held that","answer":"E"},{"no":42,"stem":"Terence Stephenson agreed that","answer":"D"},{"no":43,"stem":"Jamie Oliver seemed to believe that","answer":"C"},{"no":44,"stem":"Dinesh Bhugra suggested that","answer":"B"},{"no":45,"stem":"A Department of Health spokesperson proposed that","answer":"G"}],"questions":null},"translation":{"instruction":"In this section there is a text in English. Translate it into Chinese. Write your translation on ANSWER SHEET 2. (15 points)","passage":"Who would have thought that, globally, the IT industry produces about the same volume of greenhouse gases as the world's airlines do — roughly 2 percent of all CO2 emissions?\n\nMany everyday tasks take a surprising toll on the environment. A Google search can leak between 0.2 and 7.0 grams of CO2 depending on how many attempts are needed to get the \"right\" answer. To deliver results to its users quickly, then, Google has to maintain vast data centres around the world, packed with powerful computers. While producing large quantities of CO2, these computers emit a great deal of heat, so the centres need to be well air-conditioned, which uses even more energy.\n\nHowever, Google and other big tech providers monitor their efficiency closely and make improvements. Monitoring is the first step on the road to reduction, but there is much more to be done, and not just by big companies."},"writing":[{"part":"A","type":"应用文","instruction":"47. Directions:","prompt":"Suppose your cousin Li Ming has just been admitted to a university. Write him/her a letter to\n1) congratulate him/her, and\n2) give him/her suggestions on how to get prepared for university life.\nYou should write about 100 words on ANSWER SHEET 2.\nDo not sign your own name at the end of the letter. Use \"Zhang Wei\" instead.\nDo not write the address. (10 points)"},{"part":"B","type":"图表作文","instruction":"48. Directions:","prompt":"Write an essay based on the following chart. In your writing, you should\n1) interpret the chart, and\n2) give your comments.\nYou should write at least 150 words.\nWrite your essay on ANSWER SHEET 2. (15 points)","chart_desc":"柱状图，标题为\"2008年、2009年国内轿车市场部分品牌市场份额示意图\"。横轴为年份 2008 与 2009，纵轴为市场份额百分比（0%—40%）。三组柱分别代表国产品牌（白）、日系品牌（黑）、美系品牌（灰）。2008 年：日系品牌份额最高，约 35%；国产品牌约 25%；美系品牌约 10%。2009 年：国产品牌大幅上升至约 32%，跃居第一；日系品牌明显下降至约 25%；美系品牌两年间基本保持稳定（约 10%）。"}]},{"year":2012,"sources":["https://kaoyan.eol.cn/fu_xi/yingyu/201201/t20120107_729053_1.shtml","https://kaoyan.eol.cn/fu_xi/yingyu/201201/t20120107_729053_3.shtml","https://mba.hdu.edu.cn/upload/%E8%80%83%E8%AF%95%E8%BE%85%E5%AF%BC/2012%E5%B9%B4MBA%E8%81%94%E8%80%83%E8%8B%B1%E8%AF%AD%E7%9C%9F%E9%A2%98.pdf","http://www.tup.tsinghua.edu.cn/upload/books/yz/080615-01.pdf"],"notes":"正文以中国教育在线复习备考系列(万学海文)为底本,并用杭电MBA(社科赛斯)PDF补全完形与Part B选项;两源 OCR 错字(pool/pool farm, appers, patants, parented, Decamping等)已按正确拼写归一。完形答案取与文本自洽的清华社 key(6=against/7=meaning/9=made/15=gained/18=fragments);杭电答案表在第6/7/9/15题与文本搭配相悖,疑为其印刷错误。阅读33/34题多源有分歧,取多数源(33=A establishing disease correlations;34=C gene patenting was a great concern)。翻译段落补入杭电版含 Cape Verdeans 与 2004 印度住户调查一句(eol 版删节)。","missing":[],"cloze":{"instruction":"Read the following text. Choose the best word(s) for each numbered blank and mark A, B, C or D on ANSWER SHEET 1. (10 points)","passage":"Millions of Americans and foreigners see G.I. Joe as a mindless war toy, the symbol of American military adventurism, but that's not how it used to be. To the men and women who {{1}} in World War II and the people they liberated, the G.I. was the {{2}} man grown into hero, the poor farm kid torn away from his home, the guy who {{3}} all the burdens of battle, who slept in cold foxholes, who went without the {{4}} of food and shelter, who stuck it out and drove back the Nazi reign of murder. This was not a volunteer soldier, not someone well paid, {{5}} an average guy, up {{6}} the best trained, best equipped, fiercest, most brutal enemies seen in centuries.\n\nHis name is not much. G.I. is just a military abbreviation {{7}} Government Issue, and it was on all of the articles {{8}} to soldiers. And Joe? A common name for a guy who never {{9}} it to the top. Joe Blow, Joe Magrac … a working class name. The United States has {{10}} had a president or vice-president or secretary of state Joe.\n\nG.I. Joe had a {{11}} career fighting German, Japanese, and Korean troops. He appears as a character, or a {{12}} of American personalities, in the 1945 movie The Story of G.I. Joe, based on the last days of war correspondent Ernie Pyle. Some of the soldiers Pyle {{13}} portrayed themselves in the film. Pyle was famous for covering the {{14}} side of the war, writing about the dirt-snow-and-mud soldiers, not how many miles were {{15}} or what towns were captured or liberated. His reports {{16}} the \"Willie\" cartoons of famed Stars and Stripes artist Bill Maulden. Both men {{17}} the dirt and exhaustion of war, the {{18}} of civilization that the soldiers shared with each other and the civilians: coffee, tobacco, whiskey, shelter, sleep. {{19}} Egypt, France, and a dozen more countries, G.I. Joe was any American soldier, {{20}} the most important person in their lives.","questions":[{"no":1,"A":"performed","B":"served","C":"rebelled","D":"betrayed","answer":"B"},{"no":2,"A":"actual","B":"common","C":"special","D":"normal","answer":"B"},{"no":3,"A":"bore","B":"cased","C":"removed","D":"loaded","answer":"A"},{"no":4,"A":"necessities","B":"facilities","C":"commodities","D":"properties","answer":"A"},{"no":5,"A":"and","B":"nor","C":"but","D":"hence","answer":"C"},{"no":6,"A":"for","B":"into","C":"form","D":"against","answer":"D"},{"no":7,"A":"meaning","B":"implying","C":"symbolizing","D":"claiming","answer":"A"},{"no":8,"A":"handed out","B":"turned over","C":"brought back","D":"passed down","answer":"A"},{"no":9,"A":"pushed","B":"got","C":"made","D":"managed","answer":"C"},{"no":10,"A":"ever","B":"never","C":"either","D":"neither","answer":"B"},{"no":11,"A":"disguised","B":"disturbed","C":"disputed","D":"distinguished","answer":"D"},{"no":12,"A":"company","B":"collection","C":"community","D":"colony","answer":"B"},{"no":13,"A":"employed","B":"appointed","C":"interviewed","D":"questioned","answer":"C"},{"no":14,"A":"ethical","B":"military","C":"political","D":"human","answer":"D"},{"no":15,"A":"ruined","B":"commuted","C":"patrolled","D":"gained","answer":"D"},{"no":16,"A":"paralleled","B":"counteracted","C":"duplicated","D":"contradicted","answer":"A"},{"no":17,"A":"neglected","B":"avoided","C":"emphasized","D":"admired","answer":"C"},{"no":18,"A":"stages","B":"illusions","C":"fragments","D":"advances","answer":"C"},{"no":19,"A":"With","B":"To","C":"Among","D":"Beyond","answer":"B"},{"no":20,"A":"on the contrary","B":"by this means","C":"from the outset","D":"at that point","answer":"D"}],"fills":{"1":"served","2":"common","3":"bore","4":"necessities","5":"but","6":"against","7":"meaning","8":"handed out","9":"made","10":"never","11":"distinguished","12":"collection","13":"interviewed","14":"human","15":"gained","16":"paralleled","17":"emphasized","18":"fragments","19":"To","20":"at that point"}},"reading":[{"name":"Text 1","instruction":"Read the following four texts. Answer the questions after each text by choosing A, B, C or D. Mark your answers on ANSWER SHEET 1. (40 points)","passage":"Homework has never been terribly popular with students and even many parents, but in recent years it has been particularly scorned. School districts across the country, most recently Los Angeles Unified, are revising their thinking on this educational ritual. Unfortunately, L.A. Unified has produced an inflexible policy which mandates that with the exception of some advanced courses, homework may no longer count for more than 10% of a student's academic grade.\n\nThis rule is meant to address the difficulty that students from impoverished or chaotic homes might have in completing their homework. But the policy is unclear and contradictory. Certainly, no homework should be assigned that students cannot complete on their own or that they cannot do without expensive equipment. But if the district is essentially giving a pass to students who do not do their homework because of complicated family lives, it is going riskily close to the implication that standards need to be lowered for poor children.\n\nDistrict administrators say that homework will still be a part of schooling; teachers are allowed to assign as much of it as they want. But with homework counting for no more than 10% of their grades, students can easily skip half their homework and see very little difference on their report cards. Some students might do well on state tests without completing their homework, but what about the students who performed well on the tests and did their homework? It is quite possible that the homework helped. Yet rather than empowering teachers to find what works best for their students, the policy imposes a flat, across-the-board rule.\n\nAt the same time, the policy addresses none of the truly thorny questions about homework. If the district finds homework to be unimportant to its students' academic achievement, it should move to reduce or eliminate the assignments, not make them count for almost nothing. Conversely, if homework matters, it should account for a significant portion of the grade. Meanwhile, this policy does nothing to ensure that the homework students receive is meaningful or appropriate to their age and the subject, or that teachers are not assigning more than they are willing to review and correct.\n\nThe homework rules should be put on hold while the school board, which is responsible for setting educational policy, looks into the matter and conducts public hearings. It is not too late for L.A. Unified to do homework right.","questions":[{"no":21,"stem":"It is implied in paragraph 1 that nowadays homework","A":"is receiving more criticism","B":"is no longer an educational ritual","C":"is not required for advanced courses","D":"is gaining more preferences","answer":"A"},{"no":22,"stem":"L.A. Unified has made the rule about homework mainly because poor students","A":"tend to have moderate expectations for their education","B":"have asked for a different educational standard","C":"may have problems finishing their homework","D":"have voiced their complaints about homework","answer":"C"},{"no":23,"stem":"According to Paragraph 3, one problem with the policy is that it may","A":"discourage students from doing homework","B":"result in students' indifference to their report cards","C":"undermine the authority of state tests","D":"restrict teachers' power in education","answer":"A"},{"no":24,"stem":"As mentioned in Paragraph 4, a key question unanswered about homework is whether","A":"it should be eliminated","B":"it counts much in schooling","C":"it places extra burdens on teachers","D":"it is important for grades","answer":"B"},{"no":25,"stem":"A suitable title for this text could be","A":"Wrong Interpretation of an Educational Policy","B":"A Welcomed Policy for Poor Students","C":"Thorny Questions about Homework","D":"A Faulty Approach to Homework","answer":"D"}]},{"name":"Text 2","instruction":"Read the following four texts. Answer the questions after each text by choosing A, B, C or D. Mark your answers on ANSWER SHEET 1. (40 points)","passage":"Pretty in pink: adult women do not remember being so obsessed with the colour, yet it is pervasive in our young girls' lives. It is not that pink is intrinsically bad, but it is such a tiny slice of the rainbow and, though it may celebrate girlhood in one way, it also repeatedly and firmly fuses girls' identity to appearance. Then it presents that connection, even among two-year-olds, between girls as not only innocent but as evidence of innocence. Looking around, I despaired at the singular lack of imagination about girls' lives and interests.\n\nGirls' attraction to pink may seem unavoidable, somehow encoded in their DNA, but according to Jo Paoletti, an associate professor of American Studies, it is not. Children were not colour-coded at all until the early 20th century: in the era before domestic washing machines all babies wore white as a practical matter, since the only way of getting clothes clean was to boil them. What's more, both boys and girls wore what were thought of as gender-neutral dresses. When nursery colours were introduced, pink was actually considered the more masculine colour, a pastel version of red, which was associated with strength. Blue, with its intimations of the Virgin Mary, constancy and faithfulness, symbolized femininity. It was not until the mid-1980s, when amplifying age and sex differences became a dominant children's marketing strategy, that pink fully came into its own, when it began to seem inherently attractive to girls, part of what defined them as female, at least for the first few critical years.\n\nI had not realized how profoundly marketing trends dictated our perception of what is natural to kids, including our core beliefs about their psychological development. Take the toddler. I assumed that phase was something experts developed after years of research into children's behavior: wrong. Turns out, according to Daniel Cook, a historian of childhood consumerism, it was popularized as a marketing trick by clothing manufacturers in the 1930s.\n\nTrade publications counselled department stores that, in order to increase sales, they should create a \"third stepping stone\" between infant wear and older kids' clothes. It was only after \"toddler\" became a common shoppers' term that it evolved into a broadly accepted developmental stage. Splitting kids, or adults, into ever-tinier categories has proved a sure-fire way to boost profits. And one of the easiest ways to segment a market is to magnify gender differences — or invent them where they did not previously exist.","questions":[{"no":26,"stem":"By saying \"it is … the rainbow\" (Line 3, Para.1), the author means pink","A":"should not be the sole representation of girlhood","B":"should not be associated with girls' innocence","C":"cannot explain girls' lack of imagination","D":"cannot influence girls' lives and interests","answer":"A"},{"no":27,"stem":"According to Paragraph 2, which of the following is true of colours?","A":"Colours are encoded in girls' DNA.","B":"Blue used to be regarded as the colour for girls.","C":"Pink used to be a neutral colour in symbolising genders.","D":"White is preferred by babies.","answer":"B"},{"no":28,"stem":"The author suggests that our perception of children's psychological development was much influenced by","A":"the marketing of products for children","B":"the observation of children's nature","C":"researches into children's behaviour","D":"studies of childhood consumption","answer":"A"},{"no":29,"stem":"We may learn from Paragraph 4 that department stores were advised to","A":"focus on infant wear and older kids' clothes","B":"attach equal importance to different genders","C":"classify consumers into smaller groups","D":"create some common shoppers' terms","answer":"C"},{"no":30,"stem":"It can be concluded that girls' attraction to pink seems to be","A":"clearly explained by their inborn tendency","B":"fully understood by clothing manufacturers","C":"mainly imposed by profit-driven businessmen","D":"well interpreted by psychological experts","answer":"C"}]},{"name":"Text 3","instruction":"Read the following four texts. Answer the questions after each text by choosing A, B, C or D. Mark your answers on ANSWER SHEET 1. (40 points)","passage":"In 2010, a federal judge shook America's biotech industry to its core. Companies had won patents for isolated DNA for decades — by 2005 some 20% of human genes were patented. But in March 2010 a judge ruled that genes were unpatentable. Executives were violently agitated. The Biotechnology Industry Organisation (BIO), a trade group, assured members that this was just a \"preliminary step\" in a longer battle.\n\nOn July 29th they were relieved, at least temporarily. A federal appeals court overturned the prior decision, ruling that Myriad Genetics could indeed hold patents to two genes that help forecast a woman's risk of breast cancer. The chief executive of Myriad, a company in Utah, said the ruling was a blessing to firms and patients alike.\n\nBut as companies continue their attempts at personalised medicine, the courts will remain rather busy. The Myriad case itself is probably not over. Critics make three main arguments against gene patents: a gene is a product of nature, so it may not be patented; gene patents suppress innovation rather than reward it; and patents' monopolies restrict access to genetic tests such as Myriad's. A growing number seem to agree. Last year a federal task-force urged reform for patents related to genetic tests. In October the Department of Justice filed a brief in the Myriad case, arguing that an isolated DNA molecule \"is no less a product of nature… than are cotton fibres that have been separated from cotton seeds.\"\n\nDespite the appeals court's decision, big questions remain unanswered. For example, it is unclear whether the sequencing of a whole genome violates the patents of individual genes within it. The case may yet reach the Supreme Court.\n\nAs the industry advances, however, other suits may have an even greater impact. Companies are unlikely to file many more patents for human DNA molecules — most are already patented or in the public domain. Firms are now studying how genes interact, looking for correlations that might be used to determine the causes of disease or predict a drug's efficacy. Companies are eager to win patents for \"connecting the dots,\" explains Hans Sauer, a lawyer for the BIO.\n\nTheir success may be determined by a suit related to this issue, brought by the Mayo Clinic, which the Supreme Court will hear in its next term. The BIO recently held a convention which included sessions to coach lawyers on the shifting landscape for patents. Each meeting was packed.","questions":[{"no":31,"stem":"It can be learned from Paragraph 1 that the biotech companies would like","A":"their executives to be active","B":"judges to rule out gene patenting","C":"genes to be patentable","D":"the BIO to issue a warning","answer":"C"},{"no":32,"stem":"Those who are against gene patents believe that","A":"genetic tests are not reliable","B":"only man-made products are patentable","C":"patents on genes depend much on innovation","D":"courts should restrict access to genetic tests","answer":"B"},{"no":33,"stem":"According to Hans Sauer, companies are eager to win patents for","A":"establishing disease correlations","B":"discovering gene interactions","C":"drawing pictures of genes","D":"identifying human DNA","answer":"A"},{"no":34,"stem":"By saying \"Each meeting was packed\" (Line 4, Para.6), the author means that","A":"the supreme court was authoritative","B":"the BIO was a powerful organisation","C":"gene patenting was a great concern","D":"lawyers were keen to attend conventions","answer":"C"},{"no":35,"stem":"Generally speaking, the author's attitude toward gene patenting is","A":"critical","B":"supportive","C":"scornful","D":"objective","answer":"D"}]},{"name":"Text 4","instruction":"Read the following four texts. Answer the questions after each text by choosing A, B, C or D. Mark your answers on ANSWER SHEET 1. (40 points)","passage":"The great recession may be over, but this era of high joblessness is probably beginning. Before it ends, it will likely change the life course and character of a generation of young adults. And ultimately, it is likely to reshape our politics, our culture, and the character of our society for years.\n\nNo one tries harder than the jobless to find silver linings in this national economic disaster. Many said that unemployment, while extremely painful, had improved them in some ways: they had become less materialistic and more financially prudent; they were more aware of the struggles of others. In limited respects, perhaps the recession will leave society better off. At the very least, it has awoken us from our national fever dream of easy riches and bigger houses, and put a necessary end to an era of reckless personal spending.\n\nBut for the most part, these benefits seem thin, uncertain, and far off. In The Moral Consequences of Economic Growth, the economic historian Benjamin Friedman argues that both inside and outside the U.S., lengthy periods of economic stagnation or decline have almost always left society more mean-spirited and less inclusive, and have usually stopped or reversed the advance of rights and freedoms. Anti-immigrant sentiment typically increases, as does conflict between races and classes.\n\nIncome inequality usually falls during a recession, but it has not shrunk in this one. Indeed, this period of economic weakness may reinforce class divides, and decrease opportunities to cross them — especially for young people. The research of Till Von Wachter, the economist at Columbia University, suggests that not all people graduating into a recession see their life chances dimmed: those with degrees from elite universities catch up fairly quickly to where they otherwise would have been if they had graduated in better times; it is the masses beneath them that are left behind.\n\nIn the Internet age, it is particularly easy to see the resentment that has always been hidden within American society. More difficult, in the moment, is discerning precisely how these lean times are affecting society's character. In many respects, the U.S. was more socially tolerant entering this recession than at any time in its history, and a variety of national polls on social conflict since then have shown mixed results. We will have to wait and see exactly how these hard times will reshape our social fabric. But they certainly will reshape it, and all the more so the longer they extend.","questions":[{"no":36,"stem":"By saying \"to find silver linings\" (Line 1, Para.2) the author suggests that the jobless try to","A":"seek subsidies from the government","B":"explore reasons for the unemployment","C":"make profits from the troubled economy","D":"look on the bright side of the recession","answer":"D"},{"no":37,"stem":"According to Paragraph 2, the recession has made people","A":"realize the national dream","B":"struggle against each other","C":"challenge their prudence","D":"reconsider their lifestyle","answer":"D"},{"no":38,"stem":"Benjamin Friedman believes that economic recessions may","A":"impose a heavier burden on immigrants","B":"bring out more evils of human nature","C":"promote the advance of rights and freedoms","D":"ease conflicts between races and classes","answer":"B"},{"no":39,"stem":"The research of Till Von Wachter suggests that in the recession graduates from elite universities tend to","A":"lag behind the others due to decreased opportunities","B":"catch up quickly with experienced employees","C":"see their life chances as dimmed as the others","D":"recover more quickly than the others","answer":"D"},{"no":40,"stem":"The author thinks that the influence of hard times on society is","A":"certain","B":"positive","C":"trivial","D":"destructive","answer":"A"}]}],"newtype":{"form":"matching","instruction":"Read the following text and answer the questions by finding information from the right column that corresponds to each of the marked details given in the left column. There are two extra choices in the right column. Mark your answer on ANSWER SHEET 1. (10 points)","passage":"\"Universal history, the history of what man has accomplished in this world, is at bottom the History of the Great Men who have worked here,\" wrote the Victorian sage Thomas Carlyle. Well, not any more it is not.\n\nSuddenly, Britain looks to have fallen out with its favourite historical form. This could be no more than a passing literary craze, but it also points to a broader truth about how we now approach the past: less concerned with learning from our forefathers and more interested in feeling their pain. Today, we want empathy, not inspiration.\n\nFrom the earliest days of the Renaissance, the writing of history meant recounting the exemplary lives of great men. In 1337, Petrarch began work on his rambling writing De Viris Illustribus — On Famous Men, highlighting the virtues (or virtue) of classical heroes. Petrarch celebrated their greatness in conquering fortune and rising to the top. This was the biographical tradition which Niccolò Machiavelli turned on its head. In The Prince, he championed cunning, ruthlessness, and boldness, rather than virtue, mercy and justice, as the skills of successful leaders.\n\nOver time, the attributes of greatness shifted. The Romantics commemorated the leading painters and authors of their day, stressing the uniqueness of the artist's personal experience rather than public glory. By contrast, the Victorian author Samuel Smiles wrote Self-Help as a catalogue of the worthy lives of engineers, industrialists and explorers. \"The valuable examples which they furnish of the power of self-help, of patient purpose, resolute working and steadfast integrity, issuing in the formation of truly noble and manly character, exhibit,\" wrote Smiles, \"what it is in the power of each to accomplish for himself.\" His biographies of James Watt, Richard Arkwright and Josiah Wedgwood were held up as beacons to guide the working man through his difficult life.\n\nThis was all a bit bourgeois for Thomas Carlyle, who focused his biographies on the truly heroic lives of Martin Luther, Oliver Cromwell and Napoleon Bonaparte. These epochal figures represented lives hard to imitate, but to be acknowledged as possessing higher authority than mere mortals.\n\nNot everyone was convinced by such bombast. \"The history of all hitherto existing society is the history of class struggles,\" wrote Marx and Engels in The Communist Manifesto. For them, history did nothing, it possessed no immense wealth nor waged battles: \"It is man, real, living man who does all that.\" And history should be the story of the masses and their record of struggle. As such, it needed to appreciate the economic realities, the social contexts and power relations in which each epoch stood. For: \"Men make their own history, but they do not make it just as they please; they do not make it under circumstances chosen by themselves, but under circumstances directly found, given and transmitted from the past.\"\n\nThis was the tradition which revolutionized our appreciation of the past. In place of Thomas Carlyle, Britain nurtured Christopher Hill, E.P. Thompson and Eric Hobsbawm. History from below stood alongside biographies of great men. Whole new realms of understanding — from gender to race to cultural studies — were opened up as scholars unpicked the multiplicity of lost societies. And it transformed public history too: downstairs became just as fascinating as upstairs.","options":{"A":"emphasized the virtue of classical heroes.","B":"highlighted the public glory of the leading artists.","C":"focused on epochal figures whose lives were hard to imitate.","D":"opened up new realms of understanding the great men in history.","E":"held that history should be the story of the masses and their record of struggle.","F":"dismissed virtue as unnecessary for successful leaders.","G":"depicted the worthy lives of engineers, industrialists and explorers."},"items":[{"no":41,"stem":"Petrarch","answer":"A"},{"no":42,"stem":"Niccolò Machiavelli","answer":"F"},{"no":43,"stem":"Samuel Smiles","answer":"G"},{"no":44,"stem":"Thomas Carlyle","answer":"C"},{"no":45,"stem":"Marx and Engels","answer":"E"}],"questions":null},"translation":{"instruction":"Translate the following text from English into Chinese. Write your translation on ANSWER SHEET 2. (15 points)","passage":"When people in developing countries worry about migration, they are usually concerned at the prospect of their best and brightest decamping to Silicon Valley or to hospitals and universities in the developed world. These are the kind of workers that countries like Britain, Canada and Australia try to attract by using immigration rules that privilege college graduates.\n\nLots of studies have found that well-educated people from developing countries are particularly likely to emigrate. By some estimates, two-thirds of highly educated Cape Verdeans live outside the country. A big survey of Indian households carried out in 2004 asked about family members who had moved abroad. It found that nearly 40% of emigrants had more than a high-school education, compared with around 3.3% of all Indians over the age of 25. This \"brain drain\" has long bothered policymakers in poor countries. They fear that it hurts their economies, depriving them of much-needed skilled workers who could have taught at their universities, worked in their hospitals and come up with clever new products for their factories to make."},"writing":[{"part":"A","type":"应用文","instruction":"47. Directions:","prompt":"Suppose you have found something wrong with the electronic dictionary that you bought from an online store the other day. Write an email to the customer service center to\n1) make a complaint, and\n2) demand a prompt solution.\nYou should write about 100 words on ANSWER SHEET 2.\nDo not sign your own name at the end of the letter. Use \"Zhang Wei\" instead.\nDo not write the address. (10 points)"},{"part":"B","type":"图表作文","instruction":"48. Directions:","prompt":"Write an essay based on the following table. In your writing, you should\n1) describe the table, and\n2) give your comments.\nYou should write at least 150 words.\nWrite your essay on ANSWER SHEET 2. (15 points)","chart_desc":"表格，标题\"某公司员工工作满意度调查\"。行：年龄段（≤40岁、41—50岁、>50岁）；列：满意、不清楚、不满意（均为百分比）。≤40岁：满意16.7%、不清楚50.0%、不满意33.3%。41—50岁：满意0.0%、不清楚36.0%、不满意64.0%。>50岁：满意40.0%、不清楚50.0%、不满意10.0%。整体看：41—50岁员工满意度最低（无一人满意、64%不满意）；50岁以上员工满意度最高（40%满意）；年龄越大满意度越高。"}]},{"year":2013,"sources":["http://m.cnedu.cn/upload/html/2017/10/26/wx309d202d5ae9458ba5b11fc2be93d0a7.pdf","http://edu.people.com.cn/n/2013/0106/c1006-20106875-2.html","https://kaoyan.eol.cn/shiti/yingyu/201605/t20160513_1397504.shtml"],"notes":"正文据正保考研教育网《2013年英语(二)试题》PDF;该 PDF 含逐题答案解析,答案据此并对照人民网解析与原文语境核定。注意:清华社《真题套卷》书末答案速查表在 2013 年完形(第1/4/7/9/12/13/19/20题)及 Part B 小标题(42/44/45)上与正保逐题解析不一致,经按原文核对(如42段=只买所需、44段=与店主友善、45段=款待自己),取正保解析为正确答案。PDF 扫描 OCR 错字(socicty, recentty, alo, cashed, heaith, bt, smal, thin dittle 等)已按正确拼写归一。Part B 为小标题 heading 形式。","missing":[],"cloze":{"instruction":"Read the following text. Choose the best word(s) for each numbered blank and mark A, B, C or D on the ANSWER SHEET 1. (10 points)","passage":"Given the advantages of electronic money, you might think that we would move quickly to the cashless society in which all payments are made electronically. {{1}} a true cashless society is probably not around the corner. Indeed, predictions have been {{2}} for two decades but have not yet come to fruition. For example, Business Week predicted in 1975 that electronic means of payment would soon \"revolutionize the very {{3}} of money itself,\" only to {{4}} itself several years later. Why has the movement to a cashless society been so {{5}} in coming?\n\nAlthough electronic means of payment may be more efficient than a payments system based on paper, several factors work {{6}} the disappearance of the paper system. First, it is very {{7}} to set up the computer, card reader, and telecommunications networks necessary to make electronic money the {{8}} form of payment. Second, paper checks have the advantage that they {{9}} receipts, something that many consumers are unwilling to {{10}}. Third, the use of paper checks gives consumers several days of \"float\" — it takes several days {{11}} a check is cashed and funds are {{12}} from the issuer's account, which means that the writer of the check can earn interest on the funds in the meantime. {{13}} electronic payments are immediate, they eliminate the float for the consumer.\n\nFourth, electronic means of payment may {{14}} security and privacy concerns. We often hear media reports that an unauthorized hacker has been able to access a computer database and to alter information {{15}} there. The fact that this is not an {{16}} occurrence means that dishonest persons might be able to access bank accounts in electronic payments systems and {{17}} from someone else's accounts. The {{18}} of this type of fraud is no easy task, and a new field of computer science is developing to {{19}} security issues. A further concern is that the use of electronic means of payment leaves an electronic {{20}} that contains a large amount of personal data. There are concerns that government, employers, and marketers might be able to access these data, thereby violating our privacy.","questions":[{"no":1,"A":"Moreover","B":"However","C":"Therefore","D":"Otherwise","answer":"B"},{"no":2,"A":"off","B":"back","C":"over","D":"around","answer":"D"},{"no":3,"A":"power","B":"concept","C":"history","D":"role","answer":"B"},{"no":4,"A":"reverse","B":"resist","C":"resume","D":"reward","answer":"A"},{"no":5,"A":"silent","B":"sudden","C":"slow","D":"steady","answer":"C"},{"no":6,"A":"for","B":"against","C":"with","D":"on","answer":"B"},{"no":7,"A":"expensive","B":"imaginative","C":"sensitive","D":"productive","answer":"A"},{"no":8,"A":"similar","B":"original","C":"temporary","D":"dominant","answer":"D"},{"no":9,"A":"collect","B":"copy","C":"provide","D":"print","answer":"C"},{"no":10,"A":"give up","B":"take over","C":"bring back","D":"pass down","answer":"A"},{"no":11,"A":"before","B":"after","C":"since","D":"when","answer":"A"},{"no":12,"A":"kept","B":"borrowed","C":"withdrawn","D":"released","answer":"C"},{"no":13,"A":"Unless","B":"Because","C":"Until","D":"Though","answer":"B"},{"no":14,"A":"hide","B":"express","C":"ease","D":"raise","answer":"D"},{"no":15,"A":"analyzed","B":"shared","C":"stored","D":"displayed","answer":"C"},{"no":16,"A":"unsafe","B":"unnatural","C":"unclear","D":"uncommon","answer":"D"},{"no":17,"A":"steal","B":"choose","C":"benefit","D":"return","answer":"A"},{"no":18,"A":"consideration","B":"prevention","C":"manipulation","D":"justification","answer":"B"},{"no":19,"A":"call for","B":"fight against","C":"adapt to","D":"cope with","answer":"D"},{"no":20,"A":"chunk","B":"chip","C":"trail","D":"path","answer":"C"}],"fills":{"1":"However","2":"around","3":"concept","4":"reverse","5":"slow","6":"against","7":"expensive","8":"dominant","9":"provide","10":"give up","11":"before","12":"withdrawn","13":"Because","14":"raise","15":"stored","16":"uncommon","17":"steal","18":"prevention","19":"cope with","20":"trail"}},"reading":[{"name":"Text 1","instruction":"Read the following four texts. Answer the questions after each text by choosing A, B, C or D. Mark your answers on the ANSWER SHEET 1. (40 points)","passage":"In an essay entitled \"Making It in America,\" the author Adam Davidson relates a joke from cotton country about just how much a modern textile mill has been automated: The average mill has only two employees today, \"a man and a dog. The man is there to feed the dog, and the dog is there to keep the man away from the machines.\"\n\nDavidson's article is one of a number of pieces that have recently appeared making the point that the reason we have such stubbornly high unemployment and declining middle-class incomes today is largely because of the big drop in demand because of the Great Recession, but it is also because of the advances in both globalization and the information technology revolution, which are more rapidly than ever replacing labor with machines or foreign workers.\n\nIn the past, workers with average skills, doing an average job, could earn an average lifestyle. But, today, average is officially over. Being average just won't earn you what it used to. It can't when so many more employers have so much more access to so much more above average cheap foreign labor, cheap robotics, cheap software, cheap automation and cheap genius. Therefore, everyone needs to find their extra — their unique value contribution that makes them stand out in whatever is their field of employment.\n\nYes, new technology has been eating jobs forever, and always will. But there's been an acceleration. As Davidson notes, \"In the 10 years ending in 2009, U.S. factories shed workers so fast that they erased almost all the gains of the previous 70 years; roughly one out of every three manufacturing jobs — about 6 million in total — disappeared.\"\n\nThere will always be change — new jobs, new products, new services. But the one thing we know for sure is that with each advance in globalization and the I.T. revolution, the best jobs will require workers to have more and better education to make themselves above average.\n\nIn a world where average is officially over, there are many things we need to do to support employment, but nothing would be more important than passing some kind of G.I. Bill for the 21st century that ensures that every American has access to post-high school education.","questions":[{"no":21,"stem":"The joke in Paragraph 1 is used to illustrate","A":"the impact of technological advances","B":"the alleviation of job pressure","C":"the shrinkage of textile mills","D":"the decline of middle-class incomes","answer":"A"},{"no":22,"stem":"According to Paragraph 3, to be a successful employee, one has to","A":"adopt an average lifestyle","B":"work on cheap software","C":"ask for a moderate salary","D":"contribute something unique","answer":"D"},{"no":23,"stem":"The quotation in Paragraph 4 explains that","A":"gains of technology have been erased","B":"job opportunities are disappearing at a high speed","C":"factories are making much less money than before","D":"new jobs and services have been offered","answer":"B"},{"no":24,"stem":"According to the author, to reduce unemployment, the most important is","A":"to accelerate the I.T. revolution","B":"to advance economic globalization","C":"to ensure more education for people","D":"to pass more bills in the 21st century","answer":"C"},{"no":25,"stem":"Which of the following would be the most appropriate title for the text?","A":"Technology Goes Cheap.","B":"New Law Takes Effect.","C":"Recession Is Bad.","D":"Average Is Over.","answer":"D"}]},{"name":"Text 2","instruction":"Read the following four texts. Answer the questions after each text by choosing A, B, C or D. Mark your answers on the ANSWER SHEET 1. (40 points)","passage":"A century ago, the immigrants from across the Atlantic included settlers and sojourners. Along with the many folks looking to make a permanent home in the United States came those who had no intention to stay, and who would make some money and then go home. Between 1908 and 1915, about 7 million people arrived while about 2 million departed. About a quarter of all Italian immigrants, for example, eventually returned to Italy for good. They even had an affectionate nickname, \"uccelli di passaggio,\" birds of passage.\n\nToday, we are much more rigid about immigrants. We divide newcomers into two categories: legal or illegal, good or bad. We hail them as Americans in the making, or brand them as aliens to be kicked out. That framework has contributed mightily to our broken immigration system and the long political paralysis over how to fix it. We don't need more categories, but we need to change the way we think about categories. We need to look beyond strict definitions of legal and illegal. To start, we can recognize the new birds of passage, those living and thriving in the gray areas. We might then begin to solve our immigration challenges.\n\nCrop pickers, violinists, construction workers, entrepreneurs, engineers, home health-care aides and physicists are among today's birds of passage. They are energetic participants in a global economy driven by the flow of work, money and ideas. They prefer to come and go as opportunity calls them. They can manage to have a job in one place and a family in another.\n\nWith or without permission, they straddle laws, jurisdictions and identities with ease. We need them to imagine the United States as a place where they can be productive for a while without committing themselves to staying forever. We need them to feel that home can be both here and there and that they can belong to two nations honorably.\n\nAccommodating this new world of people in motion will require new attitudes on both sides of the immigration battle. Looking beyond the culture war logic of right or wrong means opening up the middle ground and understanding that managing immigration today requires multiple paths and multiple outcomes, including some that are not easy to accomplish legally in the existing system.","questions":[{"no":26,"stem":"\"Birds of passage\" refers to those who","A":"stay in a foreign country temporarily","B":"leave their home countries for good","C":"immigrate across the Atlantic","D":"find permanent jobs overseas","answer":"A"},{"no":27,"stem":"It is implied in Paragraph 2 that the current immigration system in the US","A":"needs new immigrant categories","B":"has loosened control over immigrants","C":"should be adapted to meet challenges","D":"has been fixed via political means","answer":"C"},{"no":28,"stem":"According to the author, today's birds of passage want","A":"financial incentives","B":"a global recognition","C":"the freedom to stay and leave","D":"opportunities to get regular jobs","answer":"C"},{"no":29,"stem":"The author suggests that the birds of passage today should be treated","A":"as faithful partners","B":"with legal tolerance","C":"with economic favors","D":"as mighty rivals","answer":"B"},{"no":30,"stem":"The most appropriate title for this text would be","A":"Come and Go: Big Mistake","B":"Living and Thriving: Great Risk","C":"With or Without: Great Risk","D":"Legal or Illegal: Big Mistake","answer":"D"}]},{"name":"Text 3","instruction":"Read the following four texts. Answer the questions after each text by choosing A, B, C or D. Mark your answers on the ANSWER SHEET 1. (40 points)","passage":"Scientists have found that although we are prone to snap overreactions, if we take a moment and think about how we are likely to react, we can reduce or even eliminate the negative effects of our quick, hard-wired responses.\n\nSnap decisions can be important defense mechanisms; if we are judging whether someone is dangerous, our brains and bodies are hard-wired to react very quickly, within milliseconds. But we need more time to assess other factors. To accurately tell whether someone is sociable, studies show, we need at least a minute, preferably five. It takes a while to judge complex aspects of personality, like neuroticism or open-mindedness.\n\nBut snap decisions in reaction to rapid stimuli aren't exclusive to the interpersonal realm. Psychologists at the University of Toronto found that viewing a fast-food logo for just a few milliseconds primes us to read 20 percent faster, even though reading has little to do with eating. We unconsciously associate fast food with speed and impatience and carry those impulses into whatever else we're doing. Subjects exposed to fast-food flashes also tend to think a musical piece lasts too long.\n\nYet we can reverse such influences. If we know we will overreact to consumer products or housing options when we see a happy face (one reason good sales representatives and real estate agents are always smiling), we can take a moment before buying. If we know female job screeners are more likely to reject attractive female applicants, we can help screeners understand their biases — or hire outside screeners.\n\nJohn Gottman, the marriage expert, explains that we quickly \"thin slice\" information reliably only after we ground such snap reactions in \"thick sliced\" long-term study. When Dr. Gottman really wants to assess whether a couple will stay together, he invites them to his island retreat for a much longer evaluation: two days, not two seconds.\n\nOur ability to mute our hard-wired reactions by pausing is what differentiates us from animals: dogs can think about the future only intermittently or for a few minutes. But historically we have spent about 12 percent of our days contemplating the longer term. Although technology might change the way we react, it hasn't changed our nature. We still have the imaginative capacity to rise above temptation and reverse the high-speed trend.","questions":[{"no":31,"stem":"The time needed in making decisions may","A":"predetermine the accuracy of our judgment","B":"prove the complexity of our brain reaction","C":"depend on the importance of the assessment","D":"vary according to the urgency of the situation","answer":"D"},{"no":32,"stem":"Our reaction to a fast-food logo shows that snap decisions","A":"can be associative","B":"are not unconscious","C":"can be dangerous","D":"are not impulsive","answer":"A"},{"no":33,"stem":"To reverse the negative influences of snap decisions, we should","A":"trust our first impression","B":"think before we act","C":"do as people usually do","D":"ask for expert advice","answer":"B"},{"no":34,"stem":"John Gottman says that reliable snap reactions are based on","A":"critical assessment","B":"\"thin sliced\" study","C":"adequate information","D":"sensible explanation","answer":"C"},{"no":35,"stem":"The author's attitude toward reversing the high-speed trend is","A":"tolerant","B":"optimistic","C":"uncertain","D":"doubtful","answer":"B"}]},{"name":"Text 4","instruction":"Read the following four texts. Answer the questions after each text by choosing A, B, C or D. Mark your answers on the ANSWER SHEET 1. (40 points)","passage":"Europe is not a gender-equality heaven. In particular, the corporate workplace will never be completely family-friendly until women are part of senior management decisions, and Europe's top corporate-governance positions remain overwhelmingly male. Indeed, women hold only 14 percent of positions on European corporate boards.\n\nThe European Union is now considering legislation to compel corporate boards to maintain a certain proportion of women — up to 60 percent. This proposed mandate was born of frustration. Last year, European Commission Vice President Viviane Reding issued a call to voluntary action. Reding invited corporations to sign up for gender balance goals of 40 percent female board membership. But her appeal was considered a failure: only 24 companies took it up.\n\nDo we need quotas to ensure that women can continue to climb the corporate ladder fairly as they balance work and family? \"Personally, I don't like quotas,\" Reding said recently. \"But I like what the quotas do.\" Quotas get action: they \"open the way to equality and they break through the glass ceiling,\" according to Reding, a result seen in France and other countries with legally binding provisions on placing women in top business positions.\n\nI understand Reding's reluctance — and her frustration. I don't like quotas either; they run counter to my belief in meritocracy, governance by the capable. But, when one considers the obstacles to achieving the meritocratic ideal, it does look as if a fairer world must be temporarily ordered.\n\nAfter all, four decades of evidence has now shown that corporations in Europe as well as the US are evading the meritocratic hiring and promotion of women to top positions — no matter how much \"soft pressure\" is put upon them. When women do break through to the summit of corporate power — as, for example, Sheryl Sandberg recently did at Facebook — they attract massive attention precisely because they remain the exception to the rule.\n\nIf appropriate public policies were in place to help all women — whether CEOs or their children's caregivers — and all families, Sandberg would be no more newsworthy than any other highly capable person living in a more just society.","questions":[{"no":36,"stem":"In the European corporate workplace, generally","A":"women take the lead","B":"men have the final say","C":"corporate governance is overwhelmed","D":"senior management is family-friendly","answer":"B"},{"no":37,"stem":"The European Union's intended legislation is","A":"a reflection of gender balance","B":"a response to Reding's call","C":"a reluctant choice","D":"a voluntary action","answer":"C"},{"no":38,"stem":"According to Reding, quotas may help women","A":"get top business positions","B":"see through the glass ceiling","C":"balance work and family","D":"anticipate legal results","answer":"A"},{"no":39,"stem":"The author's attitude toward Reding's appeal is one of","A":"skepticism","B":"objectiveness","C":"indifference","D":"approval","answer":"D"},{"no":40,"stem":"Women entering top management become headlines due to the lack of","A":"more social justice","B":"massive media attention","C":"suitable public policies","D":"greater \"soft pressure\"","answer":"C"}]}],"newtype":{"form":"heading","instruction":"Read the following text and answer the questions by choosing the most suitable subtitle from the list A-G for each numbered paragraph (41-45). There are two extra subtitles which you do not need to use. Mark your answers on the ANSWER SHEET. (10 points)","passage":"The hugely popular blog the Skint Foodie chronicles how Tony balances his love of good food with living on benefits. After bills, Tony has £60 a week to spend, £40 of which goes on food, but 10 years ago he was earning £130,000 a year working in corporate communications and eating at London's best restaurants at least twice a week. Then his marriage failed, his career burned out and his drinking became serious. \"The community mental health team saved my life. And I felt like that again, to a certain degree, when people responded to the blog so well. It gave me the validation and confidence that I'd lost. But it's still a day-by-day thing.\" Now he's living in a council flat and fielding offers from literary agents. He's feeling positive, but he'll carry on blogging — not about eating as cheaply as you can — \"there are so many people in a much worse state, with barely any money to spend on food\" — but eating well on a budget. Here's his advice for economical foodies.\n\n{{41}} Impulsive spending isn't an option, so plan your week's menu in advance, making shopping lists for your ingredients in their exact quantities. I have an Excel template for a week of breakfast, lunch and dinner. Stop laughing: it's not just cost effective but helps you balance your diet. It's also a good idea to shop daily instead of weekly, because, being human, you'll sometimes change your mind about what you fancy.\n\n{{42}} This is where supermarkets and their anonymity come in handy. With them, there's not the same embarrassment as when buying one carrot in a little greengrocer. And if you plan properly, you'll know that you only need, say, 350g of shin of beef and six rashers of bacon, not whatever weight is pre-packed in the supermarket chiller.\n\n{{43}} You may proudly claim to only have frozen peas in the freezer — that's not good enough. Mine is filled with leftovers, bread, stock, meat and fish. Planning ahead should eliminate wastage, but if you have surplus vegetables you'll do a vegetable soup, and all fruits threatening to \"go off\" will be cooked or juiced.\n\n{{44}} Everyone says this, but it really is a top tip for frugal eaters. Shop at butchers, delis and fish-sellers regularly, even for small things, and be super friendly. Soon you'll feel comfortable asking if they've any knuckles of ham for soups and stews, or beef bones, chicken carcasses and fish heads for stock which, more often than not, they'll let you have for free.\n\n{{45}} You won't be eating out a lot, but save your pennies and once every few months treat yourself to a set lunch at a good restaurant — £1.75 a week for three months gives you £21 — more than enough for a three-course lunch at Michelin-starred Arbutus. It's £16.95 there — or £12.99 for a large pizza from Domino's: I know which I'd rather eat.","options":{"A":"Shopkeepers are your friends.","B":"Remember to treat yourself.","C":"Stick to what you need.","D":"Live like a peasant.","E":"Balance your diet.","F":"Planning is everything.","G":"Waste not, want not."},"items":[{"no":41,"answer":"F"},{"no":42,"answer":"C"},{"no":43,"answer":"G"},{"no":44,"answer":"A"},{"no":45,"answer":"B"}],"questions":null},"translation":{"instruction":"Translate the following text into Chinese. Write your translation on the ANSWER SHEET 2. (15 points)","passage":"I can pick a date from the past 53 years and know instantly where I was, what happened in the news and even the day of the week. I've been able to do this since I was four.\n\nI never feel overwhelmed with the amount of information my brain absorbs. My mind seems to be able to cope and the information is stored away neatly. When I think of a sad memory, I do what everybody does — try to put it to one side. I don't think it's harder for me just because my memory is clearer. Powerful memory doesn't make my emotions any more acute or vivid. I can recall the day my grandfather died and the sadness I felt when we went to the hospital the day before. I also remember that the musical play Hair opened on Broadway on the same day — they both just pop into my mind in the same way."},"writing":[{"part":"A","type":"应用文","instruction":"47. Directions:","prompt":"Suppose your class is to hold a charity sale for kids in need of help. Write your classmates an e-mail to\n1) inform them about the details, and\n2) encourage them to participate.\nYou should write about 100 words on the ANSWER SHEET 2.\nDo not use your own name. Use \"Li Ming\" instead.\nDo not write your address. (10 points)"},{"part":"B","type":"图表作文","instruction":"48. Directions:","prompt":"Write an essay based on the following chart. In your writing, you should\n1) interpret the chart, and\n2) give your comments.\nYou should write about 150 words on the ANSWER SHEET 2. (15 points)","chart_desc":"柱状图，标题\"某高校学生兼职情况\"。横轴为大学四个年级（大一、大二、大三、大四），纵轴为做兼职的学生人数百分比（0%—100%）。数据：大一 67.77%，大二约 71.13%，大三 71.93%，大四 88.24%。趋势：大一至大三平缓上升（约 68% 升至约 72%），大四大幅跃升至约 88%，显示高年级学生更倾向于参加社会实践/兼职。"}]},{"year":2014,"sources":["https://english-exam.lazynote.cn/kaoyan/paper/2014-english-two/","https://kaoyan.koolearn.com/20181015/1023408.html","http://m.cnedu.cn/upload/html/2017/10/26/wxd4cd202f9e8a42958b242b517b549bff.pdf"],"notes":"正文以懒笔记整卷页为准，与正保考研官方PDF、新东方在线三方交叉核对；koolearn页Part B多出的Spiral Jetty/A Line Made By Walking两段属外刊原文扩展，官方试卷未收录，故未采用。答案字母来自懒笔记答案速查表（与新东方在线答案一致）。","missing":[],"cloze":{"instruction":"Read the following text. Choose the best word(s) for each numbered blank and mark A, B, C or D on the ANSWER SHEET. (10 points)","passage":"Thinner isn't always better. A number of studies have {{1}} that normal-weight people are in fact at higher risk of some diseases compared to those who are overweight. And there are health conditions for which being overweight is actually {{2}} . For example, heavier women are less likely to develop calcium deficiency than thin women. {{3}} , among the elderly, being somewhat overweight is often an {{4}} of good health.\n\nOf even greater {{5}} is the fact that obesity turns out to be very difficult to define. It is often defined {{6}} body mass index, or BMI. BMI {{7}} body mass divided by the square of height. An adult with a BMI of 18 to 25 is often considered to be normal weight. Between 25 and 30 is overweight. And over 30 is considered obese. Obesity, {{8}} , can be divided into moderately obese, severely obese, and very severely obese.\n\nWhile such numerical standards seem {{9}} , they are not. Obesity is probably less a matter of weight than body fat. Some people with a high BMI are in fact extremely fit, {{10}} others with a low BMI may be in poor {{11}} . For example, many collegiate and professional football players {{12}} as obese, though their percentage body fat is low. Conversely, someone with a small frame may have high body fat but a {{13}} BMI.\n\nToday we have a(n) {{14}} to label obesity as a disgrace. The overweight are sometimes {{15}} in the media with their faces covered. Stereotypes {{16}} with obesity include laziness, lack of will power, and lower prospects for success. Teachers, employers, and health professionals have been shown to harbor biases against the obese. {{17}} very young children tend to look down on the overweight, and teasing about body build has long been a problem in schools.\n\nNegative attitudes toward obesity, {{18}} in health concerns, have stimulated a number of anti-obesity {{19}} . My own hospital system has banned sugary drinks from its facilities. Many employers have instituted weight loss and fitness initiatives. Michelle Obama has launched a high-visibility campaign {{20}} childhood obesity, even claiming that it represents our greatest national security threat.","questions":[{"no":1,"A":"denied","B":"concluded","C":"doubted","D":"ensured","answer":"B"},{"no":2,"A":"protective","B":"dangerous","C":"sufficient","D":"troublesome","answer":"A"},{"no":3,"A":"Instead","B":"However","C":"Likewise","D":"Therefore","answer":"C"},{"no":4,"A":"indicator","B":"objective","C":"origin","D":"example","answer":"A"},{"no":5,"A":"impact","B":"relevance","C":"assistance","D":"concern","answer":"D"},{"no":6,"A":"in terms of","B":"in case of","C":"in favor of","D":"in respects of","answer":"A"},{"no":7,"A":"measures","B":"determines","C":"equals","D":"modifies","answer":"C"},{"no":8,"A":"in essence","B":"in contrast","C":"in turn","D":"in part","answer":"C"},{"no":9,"A":"complicated","B":"conservative","C":"variable","D":"straightforward","answer":"D"},{"no":10,"A":"so","B":"while","C":"since","D":"unless","answer":"B"},{"no":11,"A":"shape","B":"spirit","C":"balance","D":"taste","answer":"A"},{"no":12,"A":"start","B":"qualify","C":"retire","D":"stay","answer":"B"},{"no":13,"A":"strange","B":"changeable","C":"normal","D":"constant","answer":"C"},{"no":14,"A":"option","B":"reason","C":"opportunity","D":"tendency","answer":"D"},{"no":15,"A":"employed","B":"pictured","C":"imitated","D":"monitored","answer":"B"},{"no":16,"A":"compared","B":"combined","C":"settled","D":"associated","answer":"D"},{"no":17,"A":"Even","B":"Still","C":"Yet","D":"Only","answer":"A"},{"no":18,"A":"despised","B":"corrected","C":"ignored","D":"grounded","answer":"D"},{"no":19,"A":"discussions","B":"businesses","C":"policies","D":"studies","answer":"C"},{"no":20,"A":"for","B":"against","C":"with","D":"without","answer":"B"}],"fills":{"1":"concluded","2":"protective","3":"Likewise","4":"indicator","5":"concern","6":"in terms of","7":"equals","8":"in turn","9":"straightforward","10":"while","11":"shape","12":"qualify","13":"normal","14":"tendency","15":"pictured","16":"associated","17":"Even","18":"grounded","19":"policies","20":"against"}},"reading":[{"name":"Text 1","instruction":"Read the following four texts. Answer the questions after each text by choosing A, B, C or D. Mark your answers on the ANSWER SHEET. (40 points)","passage":"What would you do with $590m? This is now a question for Gloria MacKenzie, an 84-year-old widow who recently emerged from her small, tin-roofed house in Florida to collect the biggest undivided lottery jackpot in history. If she hopes her new-found fortune will yield lasting feelings of fulfillment, she could do worse than read Happy Money by Elizabeth Dunn and Michael Norton.\n\nThese two academics use an array of behavioral research to show that the most rewarding ways to spend money can be counterintuitive. Fantasies of great wealth often involve visions of fancy cars and extravagant homes. Yet satisfaction with these material purchases wears off fairly quickly. What was once exciting and new becomes old-hat; regret creeps in. It is far better to spend money on experiences, say Ms Dunn and Mr Norton, like interesting trips, unique meals or even going to the cinema. These purchases often become more valuable with time – as stories or memories – particularly if they involve feeling more connected to others.\n\nThis slim volume is packed with tips to help wage slaves as well as lottery winners get the most \"happiness bang for your buck.\" It seems most people would be better off if they could shorten their commutes to work, spend more time with friends and family and less of it watching television (something the average American spends a whopping two months a year doing, and is hardly jollier for it). Buying gifts or giving to charity is often more pleasurable than purchasing things for oneself, and luxuries are most enjoyable when they are consumed sparingly. This is apparently the reason McDonald's restricts the availability of its popular McRib – a marketing trick that has turned the pork sandwich into an object of obsession.\n\nReaders of Happy Money are clearly a privileged lot, anxious about fulfilment, not hunger. Money may not quite buy happiness, but people in wealthier countries are generally happier than those in poor ones. Yet the link between feeling good and spending money on others can be seen among rich and poor people around the world, and scarcity enhances the pleasure of most things for most people. Not everyone will agree with the authors' policy ideas, which range from mandating more holiday time to reducing tax incentives for American homebuyers. But most people will come away from this book believing it was money well spent.","questions":[{"no":21,"stem":"According to Dunn and Norton, which of the following is the most rewarding purchase?","A":"A big house.","B":"A special tour.","C":"A stylish car.","D":"A rich meal.","answer":"B"},{"no":22,"stem":"The author's attitude toward Americans' watching TV is____.","A":"critical","B":"supportive","C":"sympathetic","D":"ambiguous","answer":"A"},{"no":23,"stem":"McRib is mentioned in Paragraph 3 to show that____.","A":"consumers are sometimes irrational","B":"popularity usually comes after quality","C":"marketing tricks are often effective","D":"rarity generally increases pleasure","answer":"D"},{"no":24,"stem":"According to the last paragraph, Happy Money____.","A":"has left much room for readers' criticism","B":"may prove to be a worthwhile purchase","C":"has predicted a wider income gap in the US","D":"may give its readers a sense of achievement","answer":"B"},{"no":25,"stem":"This text mainly discusses how to____.","A":"balance feeling good and spending money","B":"spend large sums of money won in lotteries","C":"obtain lasting satisfaction from money spent","D":"become more reasonable in spending on luxuries","answer":"C"}]},{"name":"Text 2","instruction":"","passage":"An article in Scientific American has pointed out that empirical research says that, actually, you think you're more beautiful than you are. We have a deep-seated need to feel good about ourselves and we naturally employ a number of self-enhancing strategies to achieve this. Social psychologists have amassed oceans of research into what they call the \"above average effect\", or \"illusory superiority\", and shown that, for example, 70% of us rate ourselves as above average in leadership, 93% in driving and 85% at getting on well with others – all obviously statistical impossibilities.\n\nWe rose-tint our memories and put ourselves into self-affirming situations. We become defensive when criticised, and apply negative stereotypes to others to boost our own esteem. We stalk around thinking we're hot stuff.\n\nPsychologist and behavioural scientist Nicholas Epley oversaw a key study into self-enhancement and attractiveness. Rather than have people simply rate their beauty compared with others, he asked them to identify an original photograph of themselves from a lineup including versions that had been altered to appear more and less attractive. Visual recognition, reads the study, is \"an automatic psychological process, occurring rapidly and intuitively with little or no apparent conscious deliberation\". If the subjects quickly chose a falsely flattering image – which most did – they genuinely believed it was really how they looked.\n\nEpley found no significant gender difference in responses. Nor was there any evidence that those who self-enhanced the most (that is, the participants who thought the most positively doctored pictures were real) were doing so to make up for profound insecurities. In fact, those who thought that the images higher up the attractiveness scale were real directly corresponded with those who showed other markers for having higher self-esteem. \"I don't think the findings that we have are any evidence of personal delusion,\" says Epley. \"It's a reflection simply of people generally thinking well of themselves.\" If you are depressed, you won't be self-enhancing.\n\nKnowing the results of Epley's study, it makes sense that many people hate photographs of themselves viscerally – on one level, they don't even recognise the person in the picture as themselves. Facebook, therefore, is a self-enhancer's paradise, where people can share only the most flattering photos, the cream of their wit, style, beauty, intellect and lifestyles. It's not that people's profiles are dishonest, says Catalina Toma of Wisconsin-Madison University, \"but they portray an idealised version of themselves.\"","questions":[{"no":26,"stem":"According to the first paragraph, social psychologists have found that____.","A":"our self-ratings are unrealistically high","B":"illusory superiority is a baseless effect","C":"our need for leadership is unnatural","D":"self-enhancing strategies are ineffective","answer":"A"},{"no":27,"stem":"Visual recognition is believed to be people's____.","A":"rapid matching","B":"conscious choice","C":"intuitive response","D":"automatic self-defence","answer":"C"},{"no":28,"stem":"Epley found that people with higher self-esteem tended to____.","A":"underestimate their insecurities","B":"believe in their attractiveness","C":"cover up their depressions","D":"oversimplify their illusions","answer":"B"},{"no":29,"stem":"The word \"viscerally\" (Line 2, Para. 5) is closest in meaning to____.","A":"instinctively","B":"occasionally","C":"particularly","D":"aggressively","answer":"A"},{"no":30,"stem":"It can be inferred that
