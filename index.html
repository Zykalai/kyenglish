es .","A":"will raise low-emission car production","B":"should be forced to follow regulations","C":"will upgrade the design of their vehicles","D":"should be put under public supervision"}]},{"name":"Text 4","instruction":"","passage":"Now that members of Generation Z are graduating college this spring—the most commonly-accepted definition says this generation was born after 1995, give or take a year—the attention has been rising steadily in recent weeks. Gen Zs are about to hit the streets looking for work in a labor market that's tighter than it's been in decades. And employers are planning on hiring about 17 percent more new graduates for jobs in the U.S. this year than last, according to a survey conducted by the National Association of Colleges and Employers. Everybody wants to know how the people who will soon inhabit those empty office cubicles will differ from those who came before them.\n\nIf \"entitled\" is the most common adjective, fairly or not, applied to millennials (those born between 1981 and 1995), the catchwords for Generation Z are practical and cautious. According to the career counselors and experts who study them, Generation Zs are clear-eyed, economic pragmatists. Despite graduating into the best economy in the past 50 years, Gen Zs know what an economic train wreck looks like. They were impressionable kids during the crash of 2008, when many of their parents lost their jobs or their life savings or both. They aren't interested in taking any chances. The booming economy seems to have done little to assuage this underlying generational sense of anxious urgency, especially for those who have college debt. College loan balances in the U.S. now stand at a record $1.5 trillion, according to the Federal Reserve.\n\nOne survey from Accenture found that 88 percent of graduating seniors this year chose their major with a job in mind. In a 2019 survey of University of Georgia students, meanwhile, the career office found the most desirable trait in a future employer was the ability to offer secure employment (followed by professional development and training, and then inspiring purpose). Job security or stability was the second most important career goal (work-life balance was number one), followed by a sense of being dedicated to a cause or to feel good about serving the greater good.","questions":[{"no":36,"stem":"Generation Zs graduating college this spring________.","A":"are recognized for their abilities","B":"are in favor of job offers","C":"are optimistic about the labor market","D":"are drawing growing public attention"},{"no":37,"stem":"Generation Zs are keenly aware________.","A":"what a tough economic situation is like","B":"what their parents expect of them","C":"how they differ from past generations","D":"how valuable a counselor's advice is"},{"no":38,"stem":"The word \"assuage\" (line 9, para 2) is closest in meaning to________.","A":"define","B":"relieve","C":"maintain","D":"deepen"},{"no":39,"stem":"It can be learned from Paragraph 3 that Generation Zs________.","A":"care little about their job performance","B":"give top priority to professional training","C":"think it hard to achieve work-life balance","D":"have a clear idea about their future job"},{"no":40,"stem":"Michelsen thinks that compared with millennials, Generation Zs are________.","A":"less realistic","B":"less adventurous","C":"more diligent","D":"more generous"}]}],"newtype":{"form":"heading","instruction":"Read the following text and answer the questions by choosing the most suitable subheading from the list A-G for each numbered paragraph (41-45). There are two extra subheadings which you do not need to use. Mark your answers on the ANSWER SHEET. (10 points)","passage":"Five Ways to Win Over Everyone in the Office\n\nIs it possible to like everyone in your office? Think about how tough it is to get together 15 people, much less 50, who all get along perfectly. But unlike in friendships, you need coworkers. You work with them every day and you depend on them just as they depend on you. Here are some ways that you can get the whole office on your side.\n\n{{41}}\n\nIf you have a bone to pick with someone in your workplace, you may try stay tight-lipped around them. But you won't be helping either one of you. A Harvard Business School study found that observers consistently rated those who were frank about themselves more highly, while those who hid lost trustworthiness. The lesson is not that you should make your personal life an open book, but rather, when given the option to offer up details about yourself or painstakingly conceal them, you should just be honest.\n\n{{42}}\n\nJust as important as being honest about yourself is being receptive to others. We often feel the need to tell others how we feel, whether it's a concern about a project, a stray thought, or a compliment. Those are all valid, but you need to take time to hear out your coworkers, too. In fact, rushing to get your own ideas out there can cause colleagues to feel you don't value their opinions. Do your best to engage coworkers in a genuine, back-and-forth conversation, rather than prioritizing your own thoughts.\n\n{{43}}\n\nIt's common to have a \"cubicle mate\" or special confidant in a work setting. But in addition to those trusted coworkers, you should expand your horizons and find out about all the people around you. Use your lunch and coffee breaks to meet up with colleagues you don't always see. Find out about their lives and interests beyond the job. It requires minimal effort and goes a long way. This will help to grow your internal network, in addition to being a nice break in the work day.\n\n{{44}}\n\nPositive feedback is important for anyone to hear. And you don't have to be someone's boss to tell them they did an exceptional job on a particular project. This will help engender goodwill in others. But don't overdo it or be fake about it. One study found that people responded best to comments that shifted from negative to positive, possibly because it suggested they had won somebody over.\n\n{{45}}\n\nThis one may be a bit more difficult to pull off, but it can go a long way to achieving results. Remember in dealing with any coworker what they appreciate from an interaction. Watch out for how they verbalize with others. Some people like small talk in a meeting before digging into important matters, while others are more straightforward. Jokes that work one person won't necessarily land with another. So, adapt your style accordingly to type. Consider the person that you're dealing with in advance and what will get you to your desired outcome.","options":{"A":"Give compliments, just not too many.","B":"Put on a good face, always.","C":"Tailor your interactions.","D":"Spend time with everyone.","E":"Reveal, don't hide information.","F":"Slow down and listen.","G":"Put yourselves in others' shoes."},"items":[{"no":41,"answer":"E"},{"no":42,"answer":"F"},{"no":43,"answer":"D"},{"no":44,"answer":"A"},{"no":45,"answer":"C"}],"questions":null},"translation":{"instruction":"Translate the following text into Chinese. Write your translation neatly on the ANSWER SHEET. (15 points)","passage":"It's almost impossible to go through life without experiencing some kind of failure. People who do so probably live so cautiously that they go nowhere. Put simply, they're not really living at all. But, the wonderful thing about failure is that it's entirely up to us to decide how to look at it.\n\nWe can choose to see failure as \"the end of the world,\" or as proof of just how inadequate we are. Or, we can look at failure as the incredible learning experience that it often is. Every time we fail at something, we can choose to look for the lesson we're meant to learn. These lessons are very important; they're how we grow, and how we keep from making that same mistake again.\n\nFailures stop us only if we let them.\n\nFailure can also teach us things about ourselves that we would never have learned otherwise. For instance, failure can help you discover how strong a person you are. Failing at something can help you discover your truest friends, or help you find unexpected motivation to succeed."},"writing":[{"part":"A","type":"应用文","instruction":"46. Directions:","prompt":"Suppose you are planning a tour of a historical site for a group of international students. Write an email to 1) tell them about the site, and 2) give them some tips for the tour. Please write your answer on the ANSWER SHEET. Do not use your own name, use \"Li Ming\" instead. (10 points)"},{"part":"B","type":"图表作文","instruction":"47. Directions:","prompt":"Write an essay based on the chart below. In your writing, you should 1) interpret the chart, and 2) give your comments. You should write about 150 words on the ANSWER SHEET. (15 points)","chart_desc":"饼图，标题为\"某高校学生手机阅读目的调查\"，共四个扇区：学习知识占59.5%(最大)，消磨时间占21.3%，获取信息占17.0%，其他占2.2%。"}]},{"year":2021,"sources":["https://www.ztbu.edu.cn/uploadfile/files/2023/05/20/20230520090930179.pdf","https://downloads.lazynote.cn/kaoyan/2021-english-two/","https://kaoyan.eol.cn/shiti/yingyu/202012/t20201229_2064067.shtml"],"notes":"主来源：郑州工商学院官网公布的2021年全国硕士研究生招生考试英语(二)试题PDF(官方卷面)；完形答案字母取自该卷所附答案(1-5 DCBAC 6-10 CAABD 11-15 ADBDB 16-20 ABACB)。阅读Text1-4题干与选项逐字录自官方PDF。新题型为heading(小标题7选5)，答案按各段内容匹配推断。大作文图表据懒笔记PDF配图确认数据。翻译段落中usmg为OCR误写，订正为using。","missing":[],"cloze":{"instruction":"Read the following text. Choose the best word(s) for each numbered blank and mark A, B, C or D on the ANSWER SHEET. (10 points)","passage":"It's not difficult to set targets for staff. It is much harder, {{1}}, to understand their negative consequences. Most work-related behaviors have multiple components. {{2}} one and the others become distorted.\n\nTravel on a London bus and you'll {{3}} see how this works with drivers. Watch people get on and show their tickets. Are they carefully inspected? Never. Do people get on without paying? Of course! Are there inspectors to {{4}} that people have paid? Possibly, but very few. And people who run for the bus? They are {{5}}. How about jumping lights? Buses do so almost as frequently as cyclists.\n\nWhy? Because the target is {{6}}. People complained that buses were late and infrequent. {{7}}, the number of buses and bus lanes were increased, and drivers were {{8}} or punished according to the time they took. And drivers hit these targets. But they {{9}} hit cyclists. If the target was changed to {{10}}, you would have more inspectors and more sensitive pricing. If the criterion changed to safety, you would get more {{11}} drivers who obeyed traffic laws. But both these criteria would be at the expense of time.\n\nThere is another {{12}}: people became immensely inventive in hitting targets. Have you {{13}} that you can leave on a flight an hour late but still arrive on time? Tailwinds? Of course not! Airlines have simply changed the time a {{14}} is meant to take. A one-hour flight is now billed as a two-hour flight.\n\nThe {{15}} of the story is simple. Most jobs are multidimensional, with multiple criteria. Choose one criterion and you may well {{16}} others. Everything can be done faster and made cheaper, but there is a {{17}}. Setting targets can and does have unforeseen negative consequences.\n\nThis is not an argument against target-setting. But it is an argument for exploring consequences first. All good targets should have multiple criteria {{18}} critical factors such as time, money, quality and customer feedback. The trick is not only to {{19}} just one or even two dimensions of the objective, but also to understand how to help people better {{20}} the objective.","questions":[{"no":1,"A":"therefore","B":"again","C":"moreover","D":"however","answer":"D"},{"no":2,"A":"identify","B":"assess","C":"emphasize","D":"explain","answer":"C"},{"no":3,"A":"curiously","B":"quickly","C":"eagerly","D":"nearly","answer":"B"},{"no":4,"A":"check","B":"prove","C":"recall","D":"claim","answer":"A"},{"no":5,"A":"threatened","B":"mocked","C":"ignored","D":"blamed","answer":"C"},{"no":6,"A":"hospitality","B":"competition","C":"punctuality","D":"innovation","answer":"C"},{"no":7,"A":"Yet","B":"Besides","C":"Still","D":"So","answer":"A"},{"no":8,"A":"rewarded","B":"trained","C":"grouped","D":"hired","answer":"A"},{"no":9,"A":"rather","B":"also","C":"once","D":"only","answer":"B"},{"no":10,"A":"comfort","B":"efficiency","C":"security","D":"revenue","answer":"D"},{"no":11,"A":"cautious","B":"quiet","C":"diligent","D":"friendly","answer":"A"},{"no":12,"A":"purpose","B":"prejudice","C":"policy","D":"problem","answer":"D"},{"no":13,"A":"revealed","B":"noticed","C":"admitted","D":"reported","answer":"B"},{"no":14,"A":"break","B":"departure","C":"transfer","D":"trip","answer":"D"},{"no":15,"A":"background","B":"moral","C":"style","D":"form","answer":"B"},{"no":16,"A":"sacrifice","B":"criticize","C":"tolerate","D":"interpret","answer":"A"},{"no":17,"A":"secret","B":"cost","C":"product","D":"task","answer":"B"},{"no":18,"A":"relating to","B":"calling for","C":"accounting for","D":"leading to","answer":"A"},{"no":19,"A":"predict","B":"restore","C":"specify","D":"create","answer":"C"},{"no":20,"A":"review","B":"achieve","C":"present","D":"modify","answer":"B"}],"fills":{"1":"however","2":"emphasize","3":"quickly","4":"check","5":"ignored","6":"punctuality","7":"Yet","8":"rewarded","9":"also","10":"revenue","11":"cautious","12":"problem","13":"noticed","14":"trip","15":"moral","16":"sacrifice","17":"cost","18":"relating to","19":"specify","20":"achieve"}},"reading":[{"name":"Text 1","instruction":"Read the following four texts. Answer the questions below each text by choosing [A], [B], [C] or [D]. Mark your answers on the ANSWER SHEET. (40 points)","passage":"\"Reskilling\" is something that sounds like a buzzword but is actually a requirement if we plan to have a future where a lot of would-be workers do not get left behind. We know we are moving into a period where the jobs in demand will change rapidly, as will the requirements of the jobs that remain. Research by the World Economic Forum finds that on average 42 per cent of the \"core skills\" within job roles will change by 2022. That is a very short timeline, so we can only imagine what the changes will be further in the future.\n\nThe question of who should pay for reskilling is a thorny one. For individual companies, the temptation is always to let go of workers whose skills are no longer in demand and replace them with those whose skills are. That does not always happen. AT&T is often given as the gold standard of a company who decided to do a massive reskilling program rather than go with a fire-and-hire strategy, ultimately retraining 18,000 employees. Prepandemic, other companies including Amazon and Disney had also pledged to create their own plans. When the skills mismatch is in the broader economy though, the focus usually turns to government to handle. Efforts in Canada and elsewhere have been arguably languid at best, and have given us a situation where we frequently hear of employers begging for workers, even at times and in regions where unemployment is high.\n\nWith the pandemic, unemployment is very high indeed. In February, at 3.5 per cent and 5.5 per cent respectively, unemployment rates in Canada and the United States were at generational lows and worker shortages were everywhere. As of May, those rates had spiked up to 13.3 per cent and 13.7 per cent, and although many worker shortages had disappeared, not all had done so. In the medical field, to take an obvious example, the pandemic meant that there were still clear shortages of doctors, nurses and other medical personnel.\n\nOf course, it is not like you can take an unemployed waiter and train him to be a doctor in a few weeks, no matter who pays for it. But even if you cannot close that gap, maybe you can close others, and doing so would be to the benefit of all concerned. That seems to be the case in Sweden: When forced to furlough 90 per cent of their cabin staff, Scandinavian Airlines decided to start up a short retraining program that reskilled the laid-off workers to support hospital staff. The effort was a collective one and involved other companies as well as a Swedish university.","questions":[{"no":21,"stem":"Research by the World Economic Forum suggests____.","A":"an increase in full-time employment","B":"an urgent demand for new job skills","C":"a steady growth of job opportunities","D":"a controversy about the \"core skills\""},{"no":22,"stem":"AT&T is cited to show____.","A":"an alternative to the fire-and-hire strategy","B":"an immediate need for government support","C":"the importance of staff appraisal standards","D":"the characteristics of reskilling programs"},{"no":23,"stem":"Efforts to resolve the skills mismatch in Canada____.","A":"have driven up labour costs","B":"have proved to be inconsistent","C":"have met with fierce opposition","D":"have appeared to be insufficient"},{"no":24,"stem":"We can learn from Paragraph 3 that there was____.","A":"a call for policy adjustment","B":"a change in hiring practices","C":"a lack of medical workers","D":"a sign of economic recovery"},{"no":25,"stem":"Scandinavian Airlines decided to____.","A":"create job vacancies for the unemployed","B":"prepare their laid-off workers for other jobs","C":"retrain their cabin staff for better services","D":"finance their staff's college education"}]},{"name":"Text 2","instruction":"","passage":"With the global population predicted to hit close to 10 billion by 2050, and forecasts that agricultural production in some regions will need to nearly double to keep pace, food security is increasingly making headlines. In the UK, it has become a big talking point recently too, for a rather particular reason: Brexit.\n\nBrexit is seen by some as an opportunity to reverse a recent trend towards the UK importing food. The country produces only about 60 per cent of the food it eats, down from almost three-quarters in the late 1980s. A move back to self-sufficiency, the argument goes, would boost the farming industry, political sovereignty and even the nation's health. Sounds great—but how feasible is this vision?\n\nAccording to a report on UK food production from the University of Leeds, UK, 85 per cent of the country's total land area is associated with meat and dairy production. That supplies 80 per cent of what is consumed, so even covering the whole country in livestock farms wouldn't allow us to cover all our meat and dairy needs.\n\nThere are many caveats to those figures, but they are still grave. To become much more self-sufficient, the UK would need to drastically reduce its consumption of animal foods, and probably also farm more intensively—meaning fewer green fields and more factory-style production.\n\nBut switching to a mainly plant-based diet wouldn't help. There is a good reason why the UK is dominated by animal husbandry: most of its terrain doesn't have the right soil or climate to grow crops on a commercial basis. Just 25 per cent of the country's land is suitable for crop-growing, most of which is already occupied by arable fields. Even if we converted all the suitable land to fields of fruit and veg—which would involve taking out all the nature reserves and removing thousands of people from their homes—we would achieve only a 30 per cent boost in crop production.\n\nJust 23 per cent of the fruit and vegetables consumed in the UK are currently home-grown, so even with the most extreme measures we could meet only 30 per cent of our fresh produce needs. That is before we look for the space to grow the grains, sugars, seeds and oils that provide us with the vast bulk of our current calorie intake.","questions":[{"no":26,"stem":"Some people argue that food self-sufficiency in the UK would","A":"be hindered by its population growth","B":"contribute to the nation's well-being","C":"become a priority of the government","D":"pose a challenge to its farming industry"},{"no":27,"stem":"The report by the University of Leeds shows that in the UK","A":"farmland has been inefficiently utilized","B":"factory-style production needs reforming","C":"most land is used for meat and dairy production","D":"more green fields will be converted for farming"},{"no":28,"stem":"Crop-growing in the UK is restricted due to","A":"its farming technology","B":"its dietary tradition","C":"its natural conditions","D":"its commercial interests"},{"no":29,"stem":"It can be learned from the last paragraph that British people","A":"rely largely on imports for fresh produce","B":"enjoy a steady rise in fruit consumption","C":"are seeking effective ways to cut calorie intake","D":"are trying to grow new varieties of grains"},{"no":30,"stem":"The author's attitude to food self-sufficiency in the UK is","A":"defensive","B":"doubtful","C":"tolerant","D":"optimistic"}]},{"name":"Text 3","instruction":"","passage":"When Microsoft bought task management app Wunderlist and mobile calendar Sunrise in 2015, it picked two newcomers that were attracting considerable buzz in Silicon Valley. Microsoft's own Office dominates the market for \"productivity\" software, but the start-ups represented a new wave of technology designed from the ground up for the smartphone world.\n\nBoth apps, however, were later scrapped, after Microsoft said it had used their best features in its own products. Their teams of engineers stayed on, making them two of the many \"acqui-hires\" that the biggest companies have used to feed their great hunger for tech talent.\n\nTo Microsoft's critics, the fates of Wunderlist and Sunrise are examples of a remorseless drive by Big Tech to chew up any innovative companies that lie in their path. \"They bought the seedlings and closed them down,\" complained Paul Arnold, a partner at San Francisco-based Switch Ventures, putting an end to businesses that might one day turn into competitors. Microsoft declined to comment.\n\nLike other start-up investors, Mr. Arnold's own business often depends on selling start-ups to larger tech companies, though he admits to mixed feelings about the result: \"I think these things are good for me, if I put my selfish hat on. But are they good for the American economy? I don't know.\"\n\nThe US Federal Trade Commission says it wants to find the answer to that question. This week, it asked the five most valuable US tech companies for information about their many small acquisitions over the past decade. Although only a research project at this stage, the request has raised the prospect of regulators wading into early-stage tech markets that until now have been beyond their reach.\n\nGiven their combined market value of more than $5.5 trillion, rifling through such small deals—many of them much less prominent than Wunderlist and Sunrise—might seem beside the point. Between them, the five biggest tech companies have spent an average of only $3.4 billion a year on sub-$1 billion acquisitions over the past five years—a drop in the ocean compared with their massive financial reserves, and the more than $130 billion of venture capital that was invested in the US last year.\n\nHowever, critics say the big companies use such deals to buy their most threatening potential competitors before their businesses have a chance to gain momentum, in some cases as part of a \"buy and kill\" tactic to simply close them down.","questions":[{"no":31,"stem":"What is true about Wunderlist and Sunrise after their acquisitions?","A":"Their engineers were retained.","B":"Their market values declined.","C":"Their tech features improved.","D":"Their products were re-priced."},{"no":32,"stem":"Microsoft's critics believe that the big tech companies tend to","A":"exaggerate their product quality","B":"eliminate their potential competitors","C":"treat new tech talent unfairly","D":"ignore public opinions"},{"no":33,"stem":"Paul Arnold is concerned that small acquisitions might","A":"weaken big tech companies","B":"worsen market competition","C":"harm the national economy","D":"discourage start-up investors"},{"no":34,"stem":"The US Federal Trade Commission intends to","A":"limit Big Tech's expansion","B":"encourage research collaboration","C":"examine small acquisitions","D":"supervise start-ups' operation"},{"no":35,"stem":"For the five biggest tech companies, their small acquisitions have","A":"brought little financial pressure","B":"raised few management challenges","C":"set an example for future deals","D":"generated considerable profits"}]},{"name":"Text 4","instruction":"","passage":"We're fairly good at judging people based on first impressions, thin slices of experience ranging from a glimpse of a photo to five-minute interaction, and deliberation can be not only extraneous but intrusive. In one study of the ability she called \"thin slicing,\" the late psychologist Nalini Ambady asked participants to watch silent 10-second video clips of professors and to rate the instructor's overall effectiveness. Their ratings correlated strongly with students' end-of-semester ratings. Another set of participants had to count backward from 1,000 by nines as they watched the clips, occupying their conscious working memory. Their ratings were just as accurate, demonstrating the intuitive nature of the social processing.\n\nCritically, another group was asked to spend a minute writing down reasons for their judgment, before giving the rating. Accuracy dropped dramatically. Ambady suspected that deliberation focused them on vivid but misleading cues, such as certain gestures or utterances, rather than letting the complex interplay of subtle signals form a holistic impression. She found similar interference when participants watched 15-second clips of pairs of people and judged whether they were strangers, friends, or dating partners.\n\nOther research shows we're better at detecting deception from thin slices when we rely on intuition instead of reflection. \"It's as if you're driving a stick shift,\" says Judith Hall, a psychologist at Northeastern University, \"and if you start thinking about it too much, you can't remember what you're doing. But if you go on automatic pilot, you're fine. Much of our social life is like that.\"\n\nThinking too much can also harm our ability to form preferences. College students' ratings of strawberry jams and college courses aligned better with experts' opinions when the students weren't asked to analyze their rationale. And people made car-buying decisions that were both objectively better and more personally satisfying when asked to focus on their feelings rather than on details, but only if the decision was complex—when they had a lot of information to process.\n\nIntuition's special powers are unleashed only in certain circumstances. In one study, participants completed a battery of eight tasks, including four that tapped reflective thinking (discerning rules, comprehending vocabulary) and four that tapped intuition and creativity (generating new products or figures of speech). Then they rated the degree to which they had used intuition (\"gut feelings,\" \"hunches,\" \"my heart\"). Use of their gut hurt their performance on the first four tasks, as expected, and helped them on the rest. Sometimes the heart is smarter than the head.","questions":[{"no":36,"stem":"Nalini Ambady's study deals with","A":"the power of people's memory","B":"the reliability of first impressions","C":"instructor-student interaction","D":"people's ability to influence others"},{"no":37,"stem":"In Ambady's study, rating accuracy dropped when participants","A":"focused on specific details","B":"gave the rating in limited time","C":"watched shorter video clips","D":"discussed with one another"},{"no":38,"stem":"Judith Hall mentions driving to show that","A":"reflection can be distracting","B":"memory may be selective","C":"social skills must be cultivated","D":"deception is difficult to detect"},{"no":39,"stem":"When you are making complex decisions, it is advisable to","A":"collect enough data","B":"list your preferences","C":"seek expert advice","D":"follow your feelings"},{"no":40,"stem":"What can we learn from the last paragraph?","A":"Generating new products takes time.","B":"Intuition may affect reflective tasks.","C":"Vocabulary comprehension needs creativity.","D":"Objective thinking may boost intuitiveness."}]}],"newtype":{"form":"heading","instruction":"Read the following text and answer the questions by choosing the most suitable subheading from the list A-G for each numbered paragraph (41-45). There are two extra subheadings which you do not need to use. Mark your answers on the ANSWER SHEET. (10 points)","passage":"How to disagree with someone more powerful than you\n\nYour boss proposes a new initiative you think won't work. Your senior colleague outlines a project timeline you believe is unrealistic. What do you say when you disagree with someone who has more power than you do? How do you decide whether it's worth speaking up? And if you do, what exactly should you say? Here's how to disagree with someone more powerful than you.\n\n{{41}}\n\nYou may decide it's best to hold off on voicing your opinion. Maybe you haven't finished thinking the problem through, or you want to get a clearer sense of what the group thinks. If you think other people are going to disagree, too, you might want to gather your army first. People can contribute experience or information to your thinking—all the things that would make the disagreement stronger or more valid. It's also a good idea to delay the conversation if you are in a meeting or other public space. Discussing the issue in private will make the powerful person feel less threatened.\n\n{{42}}\n\nBefore you share your thoughts, think about what the powerful person cares about—it may be the credibility of their team or getting a project done on time. You're more likely to be heard if you can connect your disagreement to a higher purpose. When you do speak up, don't assume the link will be clear. You'll want to state it overtly, contextualizing your statements so that you're seen not as a disagreeable subordinate but as a colleague who's trying to advance a common objective. The discussion will then become more like a chess game than a boxing match.\n\n{{43}}\n\nThis step may sound overly deferential, but it's a smart way to give the powerful person psychological safety and control. You can say something like, \"I know we seem to be moving toward a first-quarter commitment here. I have reasons to think that won't work. I'd like to lay out my reasoning. Would that be OK?\" This gives the person a choice, allowing him to verbally opt in. And, assuming he says yes, it will make you feel more confident about voicing your disagreement.\n\n{{44}}\n\nYou might feel your heart racing or your face turning red, but do whatever you can to remain neutral in both your words and actions. When your body language communicates reluctance or anxiety, it undercuts the message. It sends a mixed message, and your counterpart gets to choose what signals to read. Deep breaths can help, as can speaking more slowly and deliberately. When we feel panicky, we tend to talk louder and faster. Simply slowing the pace and talking in an even tone helps the other person cool down and does the same for you. It also makes you seem confident, even if you aren't.\n\n{{45}}\n\nEmphasize that you're only offering your opinion, not gospel truth. It may be a well-informed, well-researched opinion, but it's still an opinion, so talk tentatively and slightly understate your confidence. Instead of saying: \"If we set an end-of-quarter deadline, we will never make it,\" say, \"This is just my opinion, but I don't see how we will make that deadline.\" Having asserted your opinion (as a position, not as a fact), demonstrate equal curiosity about other views. Remind the person that this is your point of view, and then invite critique. Be open to hearing other opinions.","options":{"A":"Stay calm.","B":"Stay humble.","C":"Decide whether to wait.","D":"Be realistic about the risks.","E":"Don't make judgements.","F":"Identify a shared goal.","G":"Ask permission to disagree."},"items":[{"no":41,"answer":"C"},{"no":42,"answer":"F"},{"no":43,"answer":"G"},{"no":44,"answer":"A"},{"no":45,"answer":"B"}],"questions":null},"translation":{"instruction":"Translate the following text into Chinese. Write your translation on the ANSWER SHEET. (15 points)","passage":"We tend to think that friends and family members are our biggest sources of connection, laughter, and warmth. While that may well be true, researchers have also recently found that interacting with strangers actually brings a boost in mood and feelings of belonging that we didn't expect.\n\nIn one series of studies, researchers instructed Chicago-area commuters using public transportation to strike up a conversation with someone near them. On average, participants who followed this instruction felt better than those who had been told to stand or sit in silence. The researchers also argued that when we shy away from casual interactions with strangers, it is often due to a misplaced anxiety that they might not want to talk to us. Much of the time, however, this belief is false. As it turns out, many people are actually perfectly willing to talk—and may even be flattered to receive your attention."},"writing":[{"part":"A","type":"应用文","instruction":"47. Directions:","prompt":"Suppose you are organizing an online meeting. Write an email to Jack, an international student, to 1) invite him to participate, and 2) tell him the details. You should write about 100 words on the ANSWER SHEET. Do not use your own name. Use \"Li Ming\" instead. (10 points)"},{"part":"B","type":"图表作文","instruction":"48. Directions:","prompt":"Write an essay based on the chart below. In your writing, you should 1) interpret the chart, and 2) give your comments. You should write about 150 words on the ANSWER SHEET. (15 points)","chart_desc":"柱状图，标题为\"某市居民体育锻炼方式调查\"，共四个分项(可多选，百分比之和超过100%)：独自锻炼占54.3%(最高)，和朋友一起锻炼占47.7%(次之)，和家人一起锻炼占23.9%，团体活动占15.8%(最低)。"}]},{"year":2022,"sources":["https://csgraduates.com/study_methods/english/english2/2022/","https://study.aseeker.bio/english/paper/2022_english2/","https://wap.kaoyan365.cn/yingyu/zhenti/303655.html"],"notes":"正文与答案经csgraduates、aseeker双源核对，并以中公考研版(kaoyan365)核对Text2人口数据句。分歧与修正记录：(1)Text1末段John Brunnquell引语，csgraduates OCR断句错乱，按aseeker补全为president of Egg Innovations；(2)Text1第三段our progresses按多数源/语法修正为our progress；(3)Text2第五段人口数据句(aseeker/奇速作up 32%/up 302% since 2010，数字不可信)按中公版取up 3.2% from the prior year / up 30.2% since 2010；(4)Text2第三段72%/59%受访者句按aseeker收录(csgraduates未收)；(5)完形第10题C项csgraduates作memorics，修正为memories；(6)Part B为小标题heading型，答案41C42E43A44F45B，干扰项D/Talk with your doctor与G/Round out your routine；(7)大作文为柱状图：2018-2020年我国快递业务量变动情况(单位：十亿件)，总体51/64/83，农村12/15/30。","missing":[],"cloze":{"instruction":"Read the following text. Choose the best word(s) for each numbered blank and mark A, B, C or D on the ANSWER SHEET. (10 points)","passage":"Harlan Coben believes that if you’re a writer, you’ll find the time; and that if you can’t find the time, then writing isn’t a priority and you’re not a writer. For him, writing is a {{1}} job, a job like any other. He has {{2}} it with plumbing, pointing out that a plumber doesn’t wake up and say that he can’t work with pipes today.\n\n{{3}}, like most writers these days, you’re holding down a job to pay the bills, it’s not {{4}} to find the time to write. But it’s not impossible. It requires determination and single-mindedness. {{5}} that most bestselling authors began writing when they were doing other things to earn a living. And today, even writers who are fairly {{6}} often have to do other work to {{7}} their writing income.\n\nAs Harlan Coben has suggested, it’s a {{8}} of priorities. To make writing a priority, you’ll have to {{9}} some of your day-to-day activities and some things you really enjoy. Depending on your {{10}} and your lifestyle, that might mean spending less time watching television or listening to music, though some people can write {{11}} they listen to music. You might have to {{12}} the amount of exercise or sport you do. You’ll have to make social media an {{13}} activity rather than a daily, time-consuming {{14}}. There’ll probably have to be less socializing with your friends and less time with your family. It’s a {{15}} learning curve, and it won’t always make you popular.\n\nThere’s just one thing you should try to keep at least some time for, {{16}} your writing—and that’s reading. Any writer needs to read as much and as widely as they can; it’s the one {{17}} supporter—something you can’t do without.\n\nTime is finite. The older you get, the {{18}} it seems to go. We need to use it as carefully and as {{19}} as we can; that means prioritizing our activities so that we spend most time on the things we really want to do. If you are a writer, that means—{{20}}—writing.","questions":[{"no":1,"A":"difficult","B":"normal","C":"steady","D":"pleasant","answer":"B"},{"no":2,"A":"combined","B":"compared","C":"confused","D":"confronted","answer":"B"},{"no":3,"A":"If","B":"Though","C":"Once","D":"Unless","answer":"A"},{"no":4,"A":"enough","B":"strange","C":"wrong","D":"easy","answer":"D"},{"no":5,"A":"Accept","B":"Explain","C":"Remember","D":"Suppose","answer":"C"},{"no":6,"A":"well-known","B":"well-advised","C":"well-informed","D":"well-chosen","answer":"A"},{"no":7,"A":"donate","B":"generate","C":"supplement","D":"calculate","answer":"C"},{"no":8,"A":"cause","B":"purpose","C":"question","D":"condition","answer":"C"},{"no":9,"A":"highlight","B":"sacrifice","C":"continue","D":"explore","answer":"B"},{"no":10,"A":"relations","B":"interests","C":"memories","D":"skills","answer":"B"},{"no":11,"A":"until","B":"because","C":"while","D":"before","answer":"C"},{"no":12,"A":"put up with","B":"make up for","C":"hang onto","D":"cut down on","answer":"D"},{"no":13,"A":"intelligent","B":"occasional","C":"intensive","D":"emotional","answer":"B"},{"no":14,"A":"habit","B":"test","C":"decision","D":"plan","answer":"A"},{"no":15,"A":"tough","B":"gentle","C":"rapid","D":"funny","answer":"A"},{"no":16,"A":"in place of","B":"in charge of","C":"in response to","D":"in addition to","answer":"D"},{"no":17,"A":"indispensable","B":"innovative","C":"invisible","D":"instant","answer":"A"},{"no":18,"A":"duller","B":"harder","C":"quieter","D":"quicker","answer":"D"},{"no":19,"A":"peacefully","B":"generously","C":"productively","D":"gratefully","answer":"C"},{"no":20,"A":"at most","B":"in turn","C":"on average","D":"above all","answer":"D"}],"fills":{"1":"normal","2":"compared","3":"If","4":"easy","5":"Remember","6":"well-known","7":"supplement","8":"question","9":"sacrifice","10":"interests","11":"while","12":"cut down on","13":"occasional","14":"habit","15":"tough","16":"in addition to","17":"indispensable","18":"quicker","19":"productively","20":"above all"}},"reading":[{"name":"Text 1","instruction":"Read the following four texts. Answer the questions below each text by choosing A, B, C or D. Mark your answers on the ANSWER SHEET. (40 points)","passage":"On a recent sunny day, 13,000 chickens roam over Larry Brown’s 40 windswept acres in Shiner, Texas. Some rest in the shade of a parked car, others drink water with the cows. This all seems random, but it’s by design, part of what the $6.1 billion U.S. egg industry bets will be its next big thing: climate-friendly eggs.\n\nThese eggs, which are making their debut now on shelves for as much as $8 a dozen, are still labeled organic and animal-friendly, but they’re also from birds that live on farms using regenerative agriculture—special techniques to cultivate rich soils that can trap greenhouse gases. Such eggs could be marketed as helping to fight climate change.\n\n“I’m excited about our progress,” says Brown, who is adding more cover crops that draw worms and crickets for the chickens to eat. The birds’ waste then fertilizes fields. Such improvements “allow our hens to forage for higher-quality natural feed that will be good for the land, the hens, and the eggs that we supply to our customers.”\n\nThe egg industry’s push is the first major test of whether animal products from regenerative farms can become the next premium offering. In barely more than a decade, organic eggs went from being dismissed as a niche product in natural foods stores to being sold at Walmart. More recently there were similar doubts about probiotics and plant-based meats, but both have exploded into major supermarket categories. If the sustainable-egg rollout is successful, it could open the floodgates for regenerative beef, broccoli and beyond.\n\nRegenerative products could be a hard sell, because the concept is tough to define quickly, says Julie Stanton, associate professor of agricultural economics at Pennsylvania State University Brandywine. Such farming also brings minimal, if any, improvement to the food products (though some producers say their eggs have more protein).\n\nThe industry is betting that the same consumers paying more for premium attributes such as free-range, non-GMO, and pasture-raised eggs will embrace sustainability. Surveys show that younger generations are more concerned about climate change, and some of the success of plant-based meat can be chalked up to shoppers wanting to signal their desire to protect the environment. Young adults “really care about the planet,” says John Brunnquell, president of Egg Innovations. “They are absolutely altering the food chain beyond what I think even they understand what they’re doing.”","questions":[{"no":21,"stem":"The climate-friendly eggs are produced","A":"at a considerably low cost.","B":"at the demand of regular shoppers.","C":"as a replacement for organic eggs.","D":"on specially designed farms.","answer":"D"},{"no":22,"stem":"Larry Brown is excited about his progress in","A":"reducing the damage of worms.","B":"accelerating the disposal of waste.","C":"creating a sustainable system.","D":"attracting customers to his products.","answer":"C"},{"no":23,"stem":"The example of organic eggs is used in Paragraph 4 to suggest","A":"the doubts over natural feeds.","B":"the setbacks in the egg industry.","C":"the potential of regenerative products.","D":"the promotional success of supermarkets.","answer":"C"},{"no":24,"stem":"It can be learned from the last paragraph that young people","A":"are reluctant to change their diet.","B":"are likely to buy climate-friendly eggs.","C":"are curious about new food.","D":"are amazed at agriculture advances.","answer":"B"},{"no":25,"stem":"John Brunnquell would disagree with Julie Stanton over regenerative products’","A":"market prospects.","B":"nutritional value.","C":"standard definition.","D":"moral implication.","answer":"A"}]},{"name":"Text 2","instruction":"Read the following four texts. Answer the questions below each text by choosing A, B, C or D. Mark your answers on the ANSWER SHEET. (40 points)","passage":"More Americans are opting to work well into retirement, a growing trend that threatens to upend the old workforce model.\n\nOne in three Americans who are at least 40 have or plan to have a job in retirement to prepare for a longer life, according to a survey conducted by Harris Poll for TD Ameritrade. Even more surprising is that more than half of “unretirees”—those who plan to work in retirement or went back to work after retiring—said they would be employed in their later years even if they had enough money to settle down, the survey showed.\n\nFinancial needs aren’t the only culprit for the “unretirement” trend. Other reasons, according to the study, include personal fulfillment such as staying mentally fit, preventing boredom or avoiding depression. About 72% of “unretiree” respondents said that they would return to work once retired to keep mentally fit, while 59% said it would be tied to making ends meet.\n\n“The concept of retirement is evolving,” said Christine Russell, senior manager of retirement at TD Ameritrade. “It’s not just about finances. The value of work is also driving folks to continue working past retirement.”\n\nOne reason for the change in retirement patterns: Americans are living longer. The share of the population 65 and older was 16% in 2018, up 3.2% from the prior year, according to the U.S. Census Bureau. That’s also up 30.2% since 2010. Older Americans are also the fastest-growing segment of the U.S. workforce, and boomers are expected to live longer than previous generations. The percentage of retirement-age people in the labor force has doubled over the past three decades. About 20% of people 65 and older were in the workforce in February, up from an all-time low of 10% in January 1985, according to money manager United Income.\n\nBecause of longer life spans, Americans are also boosting their savings to preserve their nest eggs, the TD Ameritrade study showed, which surveyed 2,000 adults between 40 to 79. Six in 10 “unretirees” are increasing their savings in anticipation of a longer life, according to the survey. Among the most popular ways they are doing this, the company said, is by reducing their overall expenses, securing life insurance or maximizing their contributions to retirement accounts.\n\nUnfortunately, many people who are opting to work in retirement are preparing to do so because they are worried about making ends meet in their later years, said Brent Weiss, a cofounder at Baltimore-based financial-planning firm Facet Wealth. He suggested that preretirees should speak with a financial adviser to set long-term financial goals. “The most challenging moments in life are getting married, starting a family and ultimately retiring,” Weiss told USA Today. “It’s not just a financial decision, but an emotional one. Many people believe they can’t retire.”","questions":[{"no":26,"stem":"The survey conducted by Harris Poll indicates that","A":"over half of the retirees are physically fit for work.","B":"the old workforce is as active as the younger one.","C":"one in three Americans enjoy earlier retirement.","D":"more Americans are willing to work in retirement.","answer":"D"},{"no":27,"stem":"It can be inferred from Paragraph 3 that Americans tend to think that","A":"retirement may cause problems for them.","B":"boredom can be relieved after retirement.","C":"the mental health of retirees is overlooked.","D":"“unretirement” contributes to the economy.","answer":"A"},{"no":28,"stem":"Retirement patterns are changing partly due to","A":"labor shortages.","B":"population growth.","C":"longer life expectancy.","D":"rising living costs.","answer":"C"},{"no":29,"stem":"Many “unretirees” are increasing their savings by","A":"investing more in stocks.","B":"taking up odd jobs.","C":"getting well-paid work.","D":"spending less.","answer":"D"},{"no":30,"stem":"With regard to retirement, Brent Weiss thinks that many people are","A":"unprepared.","B":"unafraid.","C":"disappointed.","D":"enthusiastic.","answer":"A"}]},{"name":"Text 3","instruction":"Read the following four texts. Answer the questions below each text by choosing A, B, C or D. Mark your answers on the ANSWER SHEET. (40 points)","passage":"We have all encountered them, in both our personal and professional lives. Think about the times you felt tricked or frustrated by a membership or subscription that had a seamless sign-up process but was later difficult to cancel. Something that should be simple and transparent can be complicated, intentionally or unintentionally, in ways that impair consumer choice. These are examples of dark patterns.\n\nFirst coined in 2010 by user experience expert Harry Brignull, “dark patterns” is a catch-all term for practices that manipulate user interfaces to influence the decision-making ability of users. Brignull identifies 12 types of common dark patterns, ranging from misdirection and hidden costs to “roach motel,” where a user experience seems easy and intuitive at the start, but turns difficult when the user tries to get out.\n\nIn a 2019 study of 53,000 product pages and 11,000 websites, researchers found that about one in 10 employs these design practices. Though widely prevalent, the concept of dark patterns is still not well understood. Business and nonprofit leaders should be aware of dark patterns and try to avoid the gray areas they engender.\n\nWhere is the line between ethical, persuasive design and dark patterns? Businesses should engage in conversations with IT, compliance, risk, and legal teams to review their privacy policy, and include in the discussion the customer/user experience designers and coders responsible for the company’s user interface, as well as the marketers and advertisers responsible for sign-ups, checkout baskets, pricing, and promotions. Any or all these teams can play a role in creating or avoiding “digital deception.”\n\nLawmakers and regulators are slowly starting to address the ambiguity around dark patterns, most recently at the state level. In March, the California Attorney General announced the approval of additional regulations under the California Consumer Privacy Act (CCPA) that ensure that consumers will not be confused or misled when seeking to exercise their data privacy rights. The regulations aim to ban dark patterns—this means prohibiting companies from using confusing language or unnecessary steps such as forcing them to click through multiple screens or listen to reasons why they shouldn’t opt out.\n\nAs more states consider promulgating additional regulations, there is a need for greater accountability from within the business community. Dark patterns can also be addressed on a self-regulatory basis, but only if organizations hold themselves accountable, not just to legal requirements, but also to industry best practices and standards.","questions":[{"no":31,"stem":"It can be learned from the first two paragraphs that dark patterns","A":"improve user experiences.","B":"leak user information for profit.","C":"undermine users’ decision-making.","D":"remind users of hidden costs.","answer":"C"},{"no":32,"stem":"The 2019 study on dark patterns is mentioned to show","A":"their major flaws.","B":"their complex designs.","C":"their severe damage.","D":"their strong presence.","answer":"D"},{"no":33,"stem":"To handle digital deception, businesses should","A":"listen to customer feedback.","B":"talk with relevant teams.","C":"turn to independent agencies.","D":"rely on professional training.","answer":"B"},{"no":34,"stem":"The additional regulations under the CCPA are intended to","A":"guide users through opt-out processes.","B":"protect consumers from being tricked.","C":"grant companies data privacy rights.","D":"restrict access to problematic content.","answer":"B"},{"no":35,"stem":"According to the last paragraph, a key to coping with dark patterns is","A":"new legal requirements.","B":"businesses’ self-discipline.","C":"strict regulatory standards.","D":"consumers’ safety awareness.","answer":"B"}]},{"name":"Text 4","instruction":"Read the following four texts. Answer the questions below each text by choosing A, B, C or D. Mark your answers on the ANSWER SHEET. (40 points)","passage":"Although ethics classes are common around the world, scientists are unsure if their lessons can actually change behavior; evidence either way is weak, relying on contrived laboratory tests or sometimes unreliable self-reports. But a new study published in Cognition found that, in at least one real-world situation, a single ethics lesson may have had lasting effects.\n\nThe researchers investigated one class session’s impact on eating meat. They chose this particular behavior for three reasons, according to study co-author Eric Schwitzgebel, a philosopher at the University of California, Riverside: students’ attitudes on the topic are variable and unstable, behavior is easily measurable, and ethics literature largely agrees that eating less meat is good because it reduces environmental harm and animal suffering. Half of the students in four large philosophy classes read an article on the ethics of factory-farmed meat, optionally watched an 11-minute video on the topic and joined a 50-minute discussion. The other half focused on charitable giving instead. Then, unknown to the students, the researchers studied their anonymized meal-card purchases for that semester—nearly 14,000 receipts for almost 500 students.\n\nSchwitzgebel predicted the intervention would have no effect; he had previously found that ethics professors do not differ from other professors on a range of behaviors, including voting rates, blood donation and returning library books. But among student subjects who discussed meat ethics, meal purchases containing meat decreased from 52 to 45 percent—and this effect held steady for the study’s duration of several weeks. Purchases from the other group remained at 52 percent.\n\n“That’s actually a pretty large effect for a pretty small intervention,” Schwitzgebel says.\n\nPsychologist Nina Strohminger at the University of Pennsylvania, who was not involved in the study, says she wants the effect to be real but cannot rule out some unknown confounding variable. And if real, she notes, it might be reversible by another nudge: “Easy come, easy go.”\n\nSchwitzgebel suspects the greatest impact came from social influence—classmates or teaching assistants leading the discussions may have shared their own vegetarianism, showing it as achievable or more common. Second, the video may have had an emotional impact. Least rousing, he thinks, was rational argument, although his co-authors say reason might play a bigger role. Now the researchers are probing the specific effects of teaching style, teaching assistants’ eating habits and students’ video exposure. Meanwhile, Schwitzgebel—who had predicted no effect—will be eating his words.","questions":[{"no":36,"stem":"Scientists generally believe that the effects of ethics classes are","A":"hard to determine.","B":"narrowly interpreted.","C":"difficult to ignore.","D":"poorly summarized.","answer":"A"},{"no":37,"stem":"Which of the following is a reason for the researchers to study meat-eating?","A":"It is common among students.","B":"It is a behavior easy to measure.","C":"It is important to students’ health.","D":"It is a hot topic in ethics classes.","answer":"B"},{"no":38,"stem":"Eric Schwitzgebel’s previous findings suggest that ethics professors","A":"are seldom critical of their students.","B":"are less sociable than other professors.","C":"are not sensitive to political issues.","D":"are not necessarily ethically better.","answer":"D"},{"no":39,"stem":"Nina Strohminger thinks that the effect of the intervention is","A":"permanent.","B":"predictable.","C":"uncertain.","D":"unrepeatable.","answer":"C"},{"no":40,"stem":"Eric Schwitzgebel suspects that the students’ change in behavior","A":"can bring psychological benefits.","B":"can be analyzed statistically.","C":"is a result of multiple factors.","D":"is a sign of self-development.","answer":"C"}]}],"newtype":{"form":"heading","instruction":"Read the following text and answer the questions by choosing the most suitable subtitle from the list A-G for each numbered paragraph (41-45). There are two extra subtitles which you do not need to use. Mark your answers on the ANSWER SHEET. (10 points)","passage":"How to Get Active Again\n\nGetting back into exercise after a break can be a challenge in the best of times, but with gyms and in-person exercise classes off-limits to many people these days, it can be tricky to know where to start. And it is important to get the right dose of activity. “Too much too soon either results in injury or burnout,” says Mary Yoke, PhD, a faculty member in the kinesiology department at Indiana University in Bloomington. The following simple strategies will help you return to exercise safely after a break.\n\n41. \n\nDon’t try to go back to what you were doing before your break. If you were walking 3 miles a day, playing 18 holes of golf three times a week, or lifting 10-pound dumbbells for three sets of 10 reps, reduce activity to half a mile every other day, or nine holes of golf once a week with short walks on other days, or use 5-pound dumbbells for one set of 10 reps. Increase time, distance, and intensity gradually. “This isn’t something you can do overnight,” says Keri L. Denay, MD, lead author of a recent American College of Sports Medicine advisory that encourages Americans to not overlook the benefits of activity during the pandemic. But you’ll reap benefits such as less anxiety and improved sleep right away.\n\n42.\n\nIf you’re breathing too hard to talk in complete sentences, back off. If you feel good, go a little longer or faster. Feeling wiped out after a session? Go easier next time. And stay alert to serious symptoms, such as chest pain or pressure, severe shortness of breath or dizziness, or faintness, and seek medical attention immediately.\n\n43.\n\nConsistency is the key to getting stronger and building endurance and stamina. Ten minutes of activity per day is a good start, says Marcus Jackovitz, DPT, a physical therapist at the University of Miami Hospital. All the experts we spoke with highly recommend walking because it’s the easiest, most accessible form of exercise. Although it can be a workout on its own, if your goal is to get back to Zumba classes, tennis, cycling or any other activity, walking is also a great first step.\n\n44.\n\nEven if you can’t yet do a favorite activity, you can practice the moves. With or without a club or racket, swing like you’re hitting the ball. Paddle like you’re in a kayak or canoe. Mimic your favorite swimming strokes. The action will remind you of the joy the activity brought you and prime your muscles for when you can get out there again.\n\n45.\n\nExercising with others “can keep you accountable and make it more fun, so you’re more likely to do it again,” Jackovitz says. You can do activities such as golf and tennis or take a walk with others and still be socially distant. But when you can’t connect in person, consider using technology. Chat on the phone with a friend while you walk around your neighborhood. FaceTime with a relative as you strength train or stretch at home. You can also join a livestream or on-demand exercise class.","options":{"A":"Make it a habit.","B":"Don’t go it alone.","C":"Start low, go slow.","D":"Talk with your doctor.","E":"Listen to your body.","F":"Go through the motions.","G":"Round out your routine."},"items":[{"no":41,"stem":"Paragraph 1","answer":"C"},{"no":42,"stem":"Paragraph 2","answer":"E"},{"no":43,"stem":"Paragraph 3","answer":"A"},{"no":44,"stem":"Paragraph 4","answer":"F"},{"no":45,"stem":"Paragraph 5","answer":"B"}],"questions":null},"translation":{"instruction":"In this section there is a text in English. Translate it into Chinese. Write your translation on the ANSWER SHEET. (15 points)","passage":"Although we try our best, sometimes our paintings rarely turn out as originally planned. Changes in the light, the limitations of your painting materials, and the lack of experience and technique mean that what you start out trying to achieve may not come to life the way that you expected.\n\nAlthough this can be frustrating and disappointing, it turns out that this can actually be good for you. Unexpected results have two benefits: you pretty quickly learn to deal with disappointment and realize that when one door closes, another opens. You also quickly learn to adapt and come up with creative solutions to the problems the painting presents, and thinking outside the box will become your second nature.\n\nIn fact, creative problem-solving skills are incredibly useful in daily life, with which you’re more likely to be able to find a solution when a problem arises."},"writing":[{"part":"A","type":"应用文","instruction":"47. Directions:","prompt":"Suppose you are planning a campus food festival. Write an e-mail to the international students in your university to\n1) introduce the food festival, and\n2) invite them to participate.\nYou should write about 100 words on the ANSWER SHEET.\nDo not use your own name. Use “Li Ming” instead. (10 points)"},{"part":"B","type":"图表作文","instruction":"48. Directions:","prompt":"Write an essay based on the chart below. In your writing, you should\n1) interpret the chart, and\n2) give your comments.\nYou should write about 150 words on the ANSWER SHEET. (15 points)","chart_desc":"柱状图，标题为“2018—2020年我国快递业务量变动情况”，单位：十亿件。横轴为年份(2018/2019/2020)，纵轴数值0—90。浅灰柱代表总体，深灰柱代表农村。数据：2018年总体51、农村12；2019年总体64、农村15；2020年总体83、农村30。三年间快递业务量整体快速增长，农村快递业务量增速尤为突出。"}]},{"year":2023,"sources":["https://study.aseeker.bio/english/paper/2023_english2/","https://csgraduates.com/study_methods/english/english2/2023/"],"notes":"正文与答案经aseeker与csgraduates双源核对。分歧记录：(1)Text1 RHS发言人，aseeker作Ed Horne，csgraduates作Ed Home，取Ed Horne；(2)Text2第五/六段补充句（We conducted a comprehensive survey...；including Ellis Island and Gettysburg；2009 as part of the Obama stimulus package）按csgraduates完整版保留；(3)Text4第36题D项，aseeker作attention，csgraduates作affection，取affection；(4)Part B为matching多项对应，左栏41 Brian Berry/42 Gareth Belsham/43 Marcus Jefford/44 John Kelly/45 Andrew Mellor，右栏Thomas Goodman(C)与Jonathan Rolande(E)为干扰项，答案41D42F43B44A45G；(5)大作文为折线图：2012-2021年我国居民健康素养水平(8.80%升至25.40%)。","missing":[],"cloze":{"instruction":"Read the following text. Choose the best word(s) for each numbered blank and mark A, B, C or D on the ANSWER SHEET. (10 points)","passage":"Here’s a common scenario that any number of entrepreneurs face today: you’re the CEO of a small business, and though you’re making a nice {{1}}, you need to find a way to take it to the next level. What you need to do is {{2}} growth by establishing a growth team. A growth team is made up of members from different departments within your company, and it harnesses the power of collaboration to focus {{3}} on finding ways to grow.\n\nLet’s look at a real-world {{4}}. Prior to forming a growth team, the software company BitTorrent had 50 employees working in the {{5}} departments of engineering, marketing and product development. This brought them good results until 2012, when their growth plateaued. The {{6}} was that too many customers were using the basic, free version of their product. And {{7}} improvements to the premium, paid version, few people were making the upgrade.\n\nThings changed, {{8}}, when an innovative project-marketing manager came aboard, {{9}} a growth team and sparked the kind of {{10}} perspective they needed. By looking at engineering issues from a marketing point of view, it became clear that the {{11}} of upgrades wasn’t due to a quality issue. Most customers were simply unaware of the premium version and what it offered.\n\nArmed with this {{12}}, the marketing and engineering teams joined forces to raise awareness by prominently {{13}} the premium version to users of the free version. {{14}}, upgrades skyrocketed, and revenue increased by 92 percent.\n\nBut in order for your growth team to succeed, it needs to have a strong leader. It needs someone who can {{15}} the interdisciplinary team and keep them on course for improvement. This leader will {{16}} the target area, set clear goals and establish a time frame for the {{17}} of these goals.\n\nThe growth leader is also {{18}} for keeping the team focused on moving forward and steering them clear of distractions. {{19}} attractive new ideas can be distracting, the team leader must recognize when these ideas don’t {{20}} the current goal and need to be put on the back burner.","questions":[{"no":1,"A":"purchase","B":"profit","C":"connection","D":"bet","answer":"B"},{"no":2,"A":"define","B":"predict","C":"prioritize","D":"appreciate","answer":"C"},{"no":3,"A":"exclusively","B":"temporarily","C":"potentially","D":"initially","answer":"A"},{"no":4,"A":"experiment","B":"proposal","C":"debate","D":"example","answer":"D"},{"no":5,"A":"identical","B":"marginal","C":"provisional","D":"traditional","answer":"D"},{"no":6,"A":"rumor","B":"secret","C":"myth","D":"problem","answer":"D"},{"no":7,"A":"despite","B":"unlike","C":"through","D":"besides","answer":"A"},{"no":8,"A":"moreover","B":"however","C":"therefore","D":"again","answer":"B"},{"no":9,"A":"inspected","B":"created","C":"expanded","D":"reformed","answer":"B"},{"no":10,"A":"cultural","B":"objective","C":"fresh","D":"personal","answer":"C"},{"no":11,"A":"end","B":"burden","C":"lack","D":"decrease","answer":"C"},{"no":12,"A":"policy","B":"suggestion","C":"purpose","D":"insight","answer":"D"},{"no":13,"A":"contributing","B":"allocating","C":"promoting","D":"transferring","answer":"C"},{"no":14,"A":"As a result","B":"At any rate","C":"By the way","D":"In a sense","answer":"A"},{"no":15,"A":"unite","B":"finance","C":"follow","D":"choose","answer":"A"},{"no":16,"A":"share","B":"identify","C":"divide","D":"broaden","answer":"B"},{"no":17,"A":"announcement","B":"assessment","C":"adjustment","D":"accomplishment","answer":"D"},{"no":18,"A":"famous","B":"responsible","C":"available","D":"respectable","answer":"B"},{"no":19,"A":"Before","B":"Once","C":"While","D":"Unless","answer":"C"},{"no":20,"A":"serve","B":"limit","C":"summarize","D":"alter","answer":"A"}],"fills":{"1":"profit","2":"prioritize","3":"exclusively","4":"example","5":"traditional","6":"problem","7":"despite","8":"however","9":"created","10":"fresh","11":"lack","12":"insight","13":"promoting","14":"As a result","15":"unite","16":"identify","17":"accomplishment","18":"responsible","19":"While","20":"serve"}},"reading":[{"name":"Text 1","instruction":"Read the following four texts. Answer the questions below each text by choosing A, B, C or D. Mark your answers on the ANSWER SHEET. (40 points)","passage":"In the quest for the perfect lawn, homeowners across the country are taking a shortcut—and it is the environment that is paying the price. About eight million square metres of plastic grass is sold each year but opposition has now spread to the highest gardening circles. The Chelsea Flower Show has banned fake grass from this year’s event, declaring it to be not part of its ethos. The Royal Horticultural Society (RHS), which runs the annual show in west London, says it has introduced the ban because of the damage plastic grass does to the environment and biodiversity.\n\nEd Horne, of the RHS, said: “We launched our sustainability strategy last year and fake grass is just not in line with our ethos and views on plastic. We recommend using real grass because of its environmental benefits, which include supporting wildlife, alleviating flooding and cooling the environment.”\n\nThe RHS’s decision comes as campaigners try to raise awareness of the problems fake grass causes. A Twitter account, which claims to “cut through the greenwash” of artificial grass, already has more than 20,000 followers. It is trying to encourage people to sign two petitions, one calling for a ban on the sale of plastic grass and another calling for an “ecological damage” tax on such lawns. They have gathered 7,276 and 11,282 signatures.\n\nHowever, supporters of fake grass point out that there is also an environmental impact with natural lawns, which need mowing and therefore usually consume electricity or petrol. The industry also points out that real grass requires considerable amounts of water, weed killer or other treatments and that people who lay fake grass tend to use their garden more. The industry also claims that people who lay fake grass spend an average of £500 on trees or shrubs for their garden, which provides habitat for insects.\n\nIn response to another petition last year about banning fake lawns, which gathered 30,000 signatures, the government responded that it has “no plans to ban the use of artificial grass.” It added: “We prefer to help people and organizations make the right choice rather than legislating on such matters. However, the use of artificial grass must comply with the legal and policy safeguards in place to protect biodiversity and ensure sustainable drainage, while measures such as the strengthened biodiversity duty should serve to encourage public authorities to consider sustainable alternatives.”","questions":[{"no":21,"stem":"The RHS thinks that plastic grass","A":"is harmful to the environment.","B":"is a hot topic in gardening circles.","C":"is overpraised in the annual show.","D":"is ruining the view of west London.","answer":"A"},{"no":22,"stem":"The petitions mentioned in Paragraph 3 reveal the campaigners’","A":"disappointment with the RHS.","B":"resistance to fake grass use.","C":"anger over the proposed tax.","D":"concern about real grass supply.","answer":"B"},{"no":23,"stem":"In Paragraph 4, supporters of fake grass point out","A":"the necessity to lower the costs of fake grass.","B":"the disadvantage of growing real grass.","C":"the way to take care of artificial lawns.","D":"the challenges of insect habitat protection.","answer":"B"},{"no":24,"stem":"What would the government do with regard to artificial grass?","A":"Urge legislation to restrict its use.","B":"Take measures to guarantee its quality.","C":"Remind its users to obey existing rules.","D":"Replace it with sustainable alternatives.","answer":"C"},{"no":25,"stem":"It can be learned from the text that fake grass","A":"is being improved continuously.","B":"has seen a market share decline.","C":"is becoming increasingly affordable.","D":"has been a controversial product.","answer":"D"}]},{"name":"Text 2","instruction":"Read the following four texts. Answer the questions below each text by choosing A, B, C or D. Mark your answers on the ANSWER SHEET. (40 points)","passage":"It’s easy to dismiss as absurd the federal government’s ideas for plugging the chronic funding gap of our national parks. Can anyone really think it’s a good idea to allow Amazon deliveries to your tent in Yosemite or food trucks to line up under the redwood trees at Sequoia National Park?\n\nBut the government is right about one thing: U.S. national parks are in crisis. Collectively, they have a maintenance backlog of more than $12 billion. Roads, trails, restrooms, visitor centers and other infrastructure are crumbling.\n\nBut privatizing and commercializing the campgrounds would not be a cure-all. Campgrounds are a tiny portion of the overall infrastructure backlog, and businesses in the parks hand over, on average, only about 5% of their revenues to the National Park Service.\n\nMoreover, increased privatization would certainly undercut one of the major reasons why 300 million visitors come to the parks each year: to enjoy nature and get a break from the commercial drumbeat that overwhelms daily life.\n\nThe real problem is that the parks have been chronically starved of funding. We conducted a comprehensive survey examining how U.S. residents view their national parks, and we found that Americans place a very high value on them—whether or not they actually visit them. The peer-reviewed economic survey of 700 U.S. taxpayers, conducted by mail and internet, also found that people would be willing to pay a significant amount of money to make sure the parks and their programs are kept intact. Some 81% of respondents said they would be willing to pay additional taxes for the next 10 years to avoid any cuts to the national parks.\n\nThe national parks provide great value to U.S. residents both as places to escape and as symbols of nature. On top of this, they produce value from their programs, their positive impact on the climate through carbon sequestration, their contribution to our cultural and artistic life, and of course through tourism. The parks also help keep America’s past alive, working with thousands of local jurisdictions around the country to protect historical sites—including Ellis Island and Gettysburg—and to bring the stories of these places to life.\n\nThe parks do all this on a shoestring. Congress allocates only $3 billion a year to the national park system—an amount that has been flat since 2001 (in inflation-adjusted dollars) with the exception of a one-time boost in 2009 as part of the Obama stimulus package. Meanwhile, the number of annual visitors has increased by more than 50% since 1980, and now stands at 330 million visitors per year.","questions":[{"no":26,"stem":"What problem are U.S. national parks faced with?","A":"Decline of business profits.","B":"Inadequate commercialization.","C":"Lack of transportation services.","D":"Poorly maintained infrastructure.","answer":"D"},{"no":27,"stem":"Increased privatization of the campgrounds may","A":"spoil visitor experience.","B":"help preserve nature.","C":"bring operational pressure.","D":"boost visits to parks.","answer":"A"},{"no":28,"stem":"According to Paragraph 5, most respondents in the survey would","A":"go to the national parks on a regular basis.","B":"advocate a bigger budget for the national parks.","C":"agree to pay extra for the national parks.","D":"support the national parks’ recent reforms.","answer":"C"},{"no":29,"stem":"The national parks are valuable in that they","A":"lead the way in tourism.","B":"have historical significance.","C":"sponsor research on climate.","D":"provide an income for the locals.","answer":"B"},{"no":30,"stem":"It can be concluded from the text that the national park system","A":"is able to cope with staff shortages.","B":"is able to meet visitors’ demands.","C":"is in need of a new pricing policy.","D":"is in need of a funding increase.","answer":"D"}]},{"name":"Text 3","instruction":"Read the following four texts. Answer the questions below each text by choosing A, B, C or D. Mark your answers on the ANSWER SHEET. (40 points)","passage":"The Internet may be changing merely what we remember, not our capacity to do so, suggests Columbia University psychology professor Betsy Sparrow. In 2011, Sparrow led a study in which participants were asked to record 40 factoids in a computer (“an ostrich’s eye is bigger than its brain,” for example). Half of the participants were told the information would be erased, while the other half were told it would be saved. Guess what? The latter group made no effort to recall the information when quizzed on it later, because they knew they could find it on their computers. In the same study, a group was asked to remember both the information and the folders it was stored in. They didn’t remember the information, but they remembered how to find the folders. In other words, human memory is not deteriorating but “adapting to new communications technology,” Sparrow says.\n\nIn a very practical way, the Internet is becoming an external hard drive for our memories, a process known as “cognitive offloading.” Traditionally, this role was fulfilled by data banks, libraries, and other humans. Your father may never remember birthdays because your mother does, for instance. Some worry that this is having a destructive effect on society, but Sparrow sees an upside. Perhaps, she suggests, the trend will change our approach to learning from a focus on individual facts and memorization to an emphasis on more conceptual thinking—something that is not available on the Internet. “I personally have never seen all that much intellectual value in memorizing things,” Sparrow says, adding that we haven’t lost our ability to do it.\n\nStill other experts say it’s too soon to understand how the Internet affects our brains. There is no experimental evidence showing that it interferes with our ability to focus, for instance, wrote psychologists Christopher Chabris and Daniel J. Simons. And surfing the web exercised the brain more than reading did among computer-savvy older adults in a 2008 study involving 24 participants at the Semel Institute for Neuroscience and Human Behavior at the University of California, Los Angeles. “There may be costs associated with our increased reliance on the Internet, but I’d have to imagine that overall the benefits are going to outweigh those costs,” observes psychology professor Benjamin Storm. “It seems pretty clear that memory is changing, but is it changing for the better? At this point, we don’t know.”","questions":[{"no":31,"stem":"Sparrow’s study shows that with the Internet, the human brain will","A":"analyze information in detail.","B":"collect information efficiently.","C":"switch its focus of memory.","D":"extend its memory duration.","answer":"C"},{"no":32,"stem":"The process of “cognitive offloading”","A":"helps us identify false information.","B":"keeps our memory from failing.","C":"enables us to classify trivial facts.","D":"lessens our memory burdens.","answer":"D"},{"no":33,"stem":"Which of the following would Sparrow support about the Internet?","A":"It may reform our learning approach.","B":"It may impact our society negatively.","C":"It may enhance our adaptability to technology.","D":"It may interfere with our conceptual thinking.","answer":"A"},{"no":34,"stem":"It is indicated in Paragraph 3 that how the Internet affects our brains","A":"requires further academic research.","B":"is most studied in older adults.","C":"is reflected in our reading speed.","D":"depends on our web-surfing habits.","answer":"A"},{"no":35,"stem":"Neither Sparrow nor Storm would agree that","A":"our reliance on the Internet will be costly.","B":"the Internet is weakening our memory.","C":"memory exercise is a must for our brain.","D":"our ability to focus declines with age.","answer":"B"}]},{"name":"Text 4","instruction":"Read the following four texts. Answer the questions below each text by choosing A, B, C or D. Mark your answers on the ANSWER SHEET. (40 points)","passage":"Teenagers are paradoxical. That’s a mild and detached way of saying something that parents often express with considerably stronger language. But the paradox is scientific as well as personal. In adolescence, helpless and dependent children who have relied on grown-ups for just about everything become independent people who can take care of themselves and help each other. At the same time, once cheerful and compliant children become rebellious teenage risk-takers.\n\nA new study published in the journal Child Development, by Eveline Crone of the University of Leiden and colleagues, suggests that the positive and negative sides of teenagers go hand in hand. The study is part of a new wave of thinking about adolescence. For a long time, scientists and policy makers concentrated on the idea that teenagers were a problem that needed to be solved. The new work emphasizes that adolescence is a time of opportunity as well as risk.\n\nThe researchers studied “prosocial” and rebellious traits in more than 200 children and young adults, ranging from 11 to 28 years old. The participants filled out questionnaires about how often they did things that were altruistic and positive, like sacrificing their own interests to help a friend, or rebellious and negative, like getting drunk or staying out late.\n\nOther studies have shown that rebellious behavior increases as you become a teenager and then fades away as you grow older. But the new study shows that, interestingly, the same pattern holds for prosocial behavior. Teenagers were more likely than younger children or adults to report that they did things like unselfishly help a friend.\n\nMost significantly, there was a positive correlation between prosociality and rebelliousness. The teenagers who were more rebellious were also more likely to help others. The good and bad sides of adolescence seem to develop together.\n\nIs there some common factor that underlies these apparently contradictory developments? One idea is that teenage behavior is related to what researchers call “reward sensitivity.” Decision-making always involves balancing rewards and risks, benefits and costs. “Reward sensitivity” measu
