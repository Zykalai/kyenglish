ighborhood gathering blossomed into a massive cultural event welcoming tens of thousands of people each year over nearly two decades before abruptly shutting down.\n\nWilliams pointed to rising production costs and declining attendee donations as primary reasons the Silver Room Block Party could not continue, highlighting a reality that all street festival organizers face right now. The cost of producing a street festival in Chicago has skyrocketed. Security, entertainment, portable restrooms, insurance and even basics such as fencing and staffing have all become significantly more expensive. At the same time, donations at festival gates have dropped dramatically.\n\nChicago’s summer festivals are about more than just entertainment; they are economic engines that directly benefit the neighborhoods they’re in and the city of Chicago as whole. Street festivals drive foot traffic to local businesses and foster the kind of cultural vibrancy that makes our city special.\n\nWe often hear people ask why we solicit donations at our entry points, especially when the city’s largest festivals like the Chicago Jazz Festival do not request donations. The fact is, unlike those large, city-produced music festivals, your neighborhood street festivals receive no city funding and rely on a combination of sponsorships, vendor fees and gate donations to cover their costs.\n\nWicker Park Fest has long been one of Chicago’s most anticipated summer festivals, drawing upward of 70,000 attendees for a full weekend of live indie music, local art, small business vendors and, most importantly, community connection. In 2024, Wicker Park Fest saw record-breaking attendance. Despite the turnout, gate donations reached their lowest point in our history. This year, we’ve been forced to scale back the footprint of the fest. We are eliminating a stage, booking fewer performers and making additional cuts to reduce our costs, all while striving to keep the festival as vibrant as ever, as supportive of local artists and businesses, and as true to Wicker Park’s unique spirit and reputation as festgoers have come to expect.\n\nThis summer, as you enjoy your favorite neighborhood street festival, I hope you’ll remember that they exist because of community support. A thriving summer festival season doesn’t happen by accident; It happens when we all chip in.","questions":[{"no":36,"stem":"It can be learned from Paragraph 1 that the Silver Room Block Party","A":"has been replaced by other festivals","B":"has gained great international fame","C":"was held in various neighborhoods","D":"was an appealing cultural gathering","answer":"D"},{"no":37,"stem":"One reality street festival organizers face is that","A":"they are unable to use the donations wisely","B":"they are unable to get sufficient facilities","C":"they have to tackle financial difficulties","D":"they have to step up security measures","answer":"C"},{"no":38,"stem":"According to Paragraphs 3 & 4, Chicago's street festivals","A":"reflect typical urban lifestyles","B":"are funded by the government","C":"contribute to the local economy","D":"are famous for their music shows","answer":"C"},{"no":39,"stem":"It is implied that the organizers of Wicker Park Fest have to","A":"count on amateur artists’ participation","B":"reduce the number of performances","C":"give up its most prominent feature","D":"collaborate with large businesses","answer":"B"},{"no":40,"stem":"The author holds that the future of street festivals depends on","A":"the variety of activities","B":"the generosity of attendees","C":"the reputation of neighborhoods","D":"the management of expenditures","answer":"B"}]}],"newtype":{"form":"matching","instruction":"Read the following text and match each of the numbered items in the left column to its corresponding information in the right column. There are two extra choices in the right column. Mark your answers on the ANSWER SHEET. (10 points)","passage":"In an effort to support restoration programmes, specialists are developing supplies of seeds and seedlings, maintaining gene banks and sequencing the genomes of indigenous trees and other crops. Their work deals with one of the problems that could block major restoration efforts in different parts of the world.\n\n“Where’s the planting material going to come from? That’s one big bottleneck,” says genetic-resources specialist Ramni Jannadass.\n\nAsia is arguably the region most neglected by global efforts to increase diversity in restoration and to study native species. Christopher Kettle, Bioversity International’s director for forest genetic resources and restoration in Rome, says that the need for infrastructure—things such as mechanisms for collecting and storing seeds, and nurseries to raise seedlings—is most desperate here because many trees are ‘masting’ species, which don’t produce seeds every year. People need to be ready. “Otherwise, you miss the boat, you lose all the seed and you’ve got to wait another seven years,” says Kettle. “This is a really critical issue for restoration in Southeast Asia, because many of the most important timber species and tree species—the ones that will lock up the most carbon—they’re all masting species.”\n\nClimate change is a driving factor in the push to restore forests, but it also raises questions, such as where trees can thrive in the future. Climate change is also expected to exacerbate relationships between trees, insects, diseases and other forest species. “Insects that today are a minor problem may become a major problem if they produce three or four generations in a year,” says forest ecologist John Stanturf. This remains a significant area to consider. “We know enough to think that this is a concern, but we don’t know enough about how to respond to it. That’s a great area to be doing research.” So is soil, says Cindy Prescott, a forest ecologist at the University of British Columbia in Vancouver. “If you don’t look at the soil at the start, you can spend a lot of money and time putting in species that aren’t going to survive there.”\n\nWith so much research left to do, leaders in the field have been doing some soul-searching, and acknowledging that restoration can be motivated—and designed to meet—different needs. “When you talk about conservation or restoration, the first question has to be by whom, for whom?” says Janzen.\n\nThe question can have more than one answer. Much of the global funding for restoration is dedicated to developing it as a tool to mitigate climate change, says Brancalion. “But if you ask a farmer in Brazil if he’s concerned about climate change, he would say, ‘No, I am concerned about water.’” Their interests as stewards of the land need to be better integrated with those who have the money to support restoration.\n\nThat has been the strongest lesson of all for Chazdon. Restoration is about more than what gets planted in the ground, she says. “Yes, it’s about forests, but it’s really about people. They are the agents of restoration.”","options":{"A":"People must pay attention to the fact that some kinds of trees do not produce seeds annually.","B":"Soil is an important element to be taken into account in forest restoration.","C":"The purpose of restoration efforts may be different from the real needs of the people involved.","D":"Human factors, as well as trees planted, should be emphasised in forest restoration.","E":"The supply of seeds is a tough problem that has to be dealt with.","F":"When it comes to restoration, we have to start with an awareness of whose interests to serve.","G":"Some creatures in the forest that multiply fast can become a great threat to forest restoration."},"items":[{"no":41,"stem":"Ramni Jannadass","answer":"E"},{"no":42,"stem":"Christopher Kettle","answer":"A"},{"no":43,"stem":"John Stanturf","answer":"G"},{"no":44,"stem":"Pedro Brancalion","answer":"C"},{"no":45,"stem":"Robin Chazdon","answer":"D"}],"questions":null},"translation":{"instruction":"Translate the following text into Chinese. Write your translation on the ANSWER SHEET. (15 points)","passage":"The influence of wearables on psychology refers to how the clothes we wear affect our thoughts, feelings, and behaviors. Clothing is not just about covering our bodies; it plays a significant role in shaping our self-perception and interactions with others.\n\nOne aspect of this influence is self-expression. The clothes we choose can reflect our personality, mood, and identity. Whether we opt for bold, colorful outfits or prefer more understated styles, our dress choices convey messages about who we are and how we want to be perceived.\n\nAdditionally, clothing can impact our confidence levels. When we wear clothes that make us feel comfortable and confident, it can positively affect our self-esteem and overall mood.\n\nMoreover, cultural and societal influences play a significant role in shaping our dress choices. Different cultures have their norms and expectations regarding dress, which can influence the types of clothing people wear and the meanings attributed to them."},"writing":[{"part":"A","type":"应用文","instruction":"47. Directions:","prompt":"Suppose your friend Jack has shared with you a video of his family’s travel in China. Write an email to tell him\n1) how you feel about the video, and\n2) your wish to learn more about their travel.\nWrite your answer in about 100 words on the ANSWER SHEET.\nDo not use your own name in your email; use “Li Ming” instead. (10 points)"},{"part":"B","type":"图表作文","instruction":"48. Directions:","prompt":"Write an essay based on the chart below. In your essay, you should\n1) describe and interpret the chart, and\n2) give your comments.\nWrite your answer in about 150 words on the ANSWER SHEET. (15 points)","chart_desc":"柱状图，标题为“某项关于儿童户外运动看法的调查”，纵轴为百分比（0%-60%），共四个分项：满足好奇心 54.60%、促进观察力 54.50%、强身健体 37.20%、增强亲子互动 33.20%。满足好奇心与促进观察力占比最高且接近（均约54.5%），强身健体次之，增强亲子互动最低。"}]}]};

const $ = (s, r) => (r || document).querySelector(s);
const $$ = (s, r) => Array.from((r || document).querySelectorAll(s));

function esc(s) {
  return String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}
function normSp(s) {

const POS_RE = /\s+(?=(?:n|v|a|adj|adv|ad|vt|vi|prep|conj|pron|num|int|art|aux|suf|pref|abbr|neg)\.\s)/g;

function splitMeanings(t) {
  if (!t) return [];
  // 词典释义按词性标签分行

function shortMean(t) {

/* 强制滚动到目标板块开头；reading 对应 sec-reading1。hash 是否变化都可调用，保证导航绝对准确 */
/* 程序触发的平滑滚动（点击题型）期间抑制 scroll spy，避免高亮在中间板块闪烁；
   滚动停止 150ms 后自动恢复，手动滚轮/拖动滑块不受影响 */
let navScrolling = false, spyTimer = null;
function endNavScroll() {
  navScrolling = false;
  clearTimeout(spyTimer);
  window.removeEventListener('scroll', onNavScroll);
}
function onNavScroll() {
  clearTimeout(spyTimer);
  spyTimer = setTimeout(endNavScroll, 150);
}
function beginNavScroll() {
  navScrolling = true;
  clearTimeout(spyTimer);
  window.removeEventListener('scroll', onNavScroll);
  window.addEventListener('scroll', onNavScroll, { passive: true });
  spyTimer = setTimeout(endNavScroll, 800); // 兜底：目标原地无需滚动时也能复位
}
function gotoSection(secKey) {
  const secId = 'sec-' + (secKey === 'reading' ? 'reading1' : secKey);
  const el = document.getElementById(secId);
  if (!el) return;
  // 立即把目标 tab 锁定为高亮，滚动期间 spy 被抑制，橙色始终停在目标
  const targetTab = document.querySelector('#secTabs a[data-sec="' + secKey + '"]');
  if (targetTab) {
    $$('#secTabs a').forEach(x => x.classList.remove('active'));
    targetTab.classList.add('active');
  }
  beginNavScroll();
  el.scrollIntoView({ behavior: 'smooth', block: 'start' });
}
function route() {
  const hash = location.hash.replace(/^#\//, '');
  const parts = hash.split('/');
  if (parts[0] && /^\d{4}$/.test(parts[0])) {
    const year = Number(parts[0]);
    if (state.year !== year || state.view !== 'paper') renderPaper(year);
    else {
      // 同年内切换板块（阅读1-4/完形/新题型等）：气泡、选区、工具条一切清零
      $('#homeView').style.display = 'none';
      $('#paperView').style.display = 'block';
      clearTransient();
    }
    if (parts[1]) setTimeout(() => gotoSection(parts[1]), 80);
  } else {
    state.view = 'home'; state.year = null;
    $('#paperView').style.display = 'none';
    $('#homeView').style.display = 'block';
    renderSidebar();
    clearTransient(); // 回到首页同样清零
    window.scrollTo(0, 0);
  }
}
window.addEventListener('hashchange', route);

/* 滚动监听：高亮板块 tab */
let scrollSpyObs = null;
function setupScrollSpy() {
  // 每次重渲染都会重建 #secTabs，先断开旧观察器，避免泄漏与重复回调
  if (scrollSpyObs) { scrollSpyObs.disconnect(); scrollSpyObs = null; }
  const tabs = $$('#secTabs a');
  if (!tabs.length) return;
  // data-sec → 实际元素 id（reading 对应 sec-reading1）
  const secElId = k => 'sec-' + (k === 'reading' ? 'reading1' : k);
  const map = SECTIONS.map(s => ({
    tab: document.querySelector(`#secTabs a[data-sec="${s[0]}"]`),
    el: document.getElementById(secElId(s[0]))
  }));
  scrollSpyObs = new IntersectionObserver(entries => {
    entries.forEach(en => {
      if (en.isIntersecting) {
        if (navScrolling) return; // 程序平滑滚动中，高亮已锁定目标，忽略中间板块
        tabs.forEach(a => a.classList.remove('active'));
        const match = map.find(m => m.el === en.target);
        if (match && match.tab) match.tab.classList.add('active');
      }
    });
  }, { rootMargin: '-20% 0px -70% 0px' });
  map.forEach(m => { if (m.el) scrollSpyObs.observe(m.el); });
}

/* 题型 tab 点击委托（#paperView 稳定，#secTabs 重建不影响）：
   已在该板块时 hash 不变、hashchange 不触发，这里强制滚动，保证每次点击都准确跳到板块开头 */
$('#paperView').addEventListener('click', ev => {
  const t = ev.target;
  const a = (t && t.closest) ? t.closest('#secTabs a') : null;
  if (!a) return;
  ev.preventDefault();
  const sec = a.getAttribute('data-sec');
  const targetHash = '#/' + state.year + '/' + sec;
  // gotoSection 统一负责立即高亮、抑制 spy、平滑滚动
  if (location.hash === targetHash) gotoSection(sec);
  else location.hash = targetHash;
});

/* 直接词典：按单词前两个字母懒加载 ECDICT 原词条。
   不预生成词形，不做 spaCy 还原；词形注释在卡片里再查原形。
   用 <script> 而不是 fetch：本地 file:// 打开也能加载，GitHub Pages 也能缓存。 */
const DICT_DIR = 'data/dict-parts/';
const dictParts = {};
const dictPromises = {};
function dictPartKey(raw) {
  const word = normalizeDictWord(raw);
  const two = word.slice(0, 2);
  if (/^[a-z]{2}$/.test(two)) return two;
  const one = word.slice(0, 1);
  return /^[a-z]$/.test(one) ? one : '_';
}
function loadDictPart(part) {
  if (dictParts[part]) return Promise.resolve(dictParts[part]);
  if (!dictPromises[part]) {
    dictPromises[part] = new Promise((resolve, reject) => {
      const script = document.createElement('script');
      script.src = DICT_DIR + part + '.js';
      script.onload = () => {
        const data = window.__DICT_PARTS__ && window.__DICT_PARTS__[part];
        if (data) {
          dictParts[part] = data;
          resolve(data);
        } else {
          reject(new Error('dictionary part missing'));
        }
      };
      script.onerror = () => reject(new Error('dictionary load failed'));
      document.head.appendChild(script);
    }).catch(err => { dictPromises[part] = null; throw err; });
  }
  return dictPromises[part];
}

const SPEAKER_ICON = '<svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor" aria-hidden="true">' +
  '<path d="M3 10v4h4l5 5V5L7 10H3z"/>' +
  '<path d="M16 8a5 5 0 0 1 0 8" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>' +
  '<path d="M18.5 5.5a9 9 0 0 1 0 13" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>';
let cachedVoices = [];
function loadVoices() {
  if (!('speechSynthesis' in window)) return [];
  cachedVoices = window.speechSynthesis.getVoices() || [];
  return cachedVoices;
}
if ('speechSynthesis' in window) {
  loadVoices();
  window.speechSynthesis.addEventListener('voiceschanged', loadVoices);
}
/* 英文女声优先：明确女声 > 非男声 > 兜底；其余参数全用浏览器默认 */
function pickVoice(voices) {
  const en = voices.filter(v => /^en/i.test(v.lang));
  if (!en.length) return null;
  const us = en.filter(v => /en-us/i.test(v.lang));
  // 明确女声（注意：不能用 natural 当线索，男声在线语音也带 (Natural)）
  const FEMALE = /female|zira|samantha|jenny|aria|susan|linda|victoria|emma|olivia|ava|ana|michelle|sarah|sara|hazel|coral|joanna|karen|nancy|rachel|emily|madison|chloe|grace|natasha|clara|sonia|libby|maisie|molly|rosa|woman|girl/i;
  // 明确男声（\bmale\b 不会误命中 female）
  const MALE = /\bmale\b|david|guy|mark|george|daniel|james|thomas|fred|ryan|brian|alex|richard|robert|william|henry|jack|kevin|steven|paul|john|michael|andrew|christopher|matthew|anthony|donald|eric|roger|steffan|liam|ryan|connor|prabhat|chilemba|abeo|mitchell/i;
  const isFemale = v => FEMALE.test(v.name) && !MALE.test(v.name);
  const isNotMale = v => !MALE.test(v.name);
  return (
    us.find(isFemale) ||   // 1. 美音女声优先
    en.find(isFemale) ||   // 2. 任意英文女声
    us.find(isNotMale) ||  // 3. 美音非男声
    en.find(isNotMale) ||  // 4. 任意非男声
    en[0]                  // 5. 兜底
  );
}
function speakText(text) {
  if (!('speechSynthesis' in window)) { toast('当前浏览器不支持朗读功能'); return; }
  const say = () => {
    window.speechSynthesis.cancel(); // 先停掉上一段
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'en-US';
    const v = pickVoice(loadVoices());
    try { if (v) { u.voice = v; u.lang = v.lang; } }
    catch (e) { /* 语音赋值异常时退回默认嗓音，不影响朗读 */ }
    window.speechSynthesis.speak(u);
  };
  if (!loadVoices().length) {
    let tries = 0;
    const t = setInterval(() => {
      if (loadVoices().length || ++tries > 20) { clearInterval(t); say(); }
    }, 100); // 语音列表未就绪时等待，确保选到女声
  } else say();
}

/* 兼容两种释义格式：考研词典用真实换行；ECDICT 有时是字面量 \n。
   同时去掉 [计]、[经]、[化] 这类附加领域释义。 */
function stripDomainSense(line) {
  let s = String(line || '').trim();
  if (!s) return '';
  if (/^\[[^\]]{1,10}\]/.test(s)) return '';
  s = s.replace(/\s*\[[^\]]{1,10}\][\s\S]*$/, '').trim();
  return s;
}

function meaningLines(t) {
  if (!t) return [];
  const normalized = String(t)
    .replace(/\\r/g, '\n')
    .replace(/\\n/g, '\n')
    .replace(/\r\n?/g, '\n');
  const raw = normalized.includes('\n')
    ? normalized.split('\n')
    : splitMeanings(normalized);
  const lines = raw.map(stripDomainSense).filter(Boolean);
  if (lines.length) return lines;
  const fallback = stripDomainSense(normalized);
  return fallback ? [fallback] : ['（无通用释义）'];
}

function entryBody(e) {
  if (!e) return `<div class="wb-loading">词典未收录该词。</div>`;
  return meaningLines(e[0]).map(ln => {
    const m = ln.match(/^([a-z]+)\.\s*(.*)$/);
    if (m) return `<div class="pos-line"><span class="pos">${m[1]}.</span>${esc(m[2])}</div>`;
    return `<div class="pos-line">${esc(ln)}</div>`;
  }).join('');
}

}

/* 点击位置取词：必须真正落在单词文字的实际包围盒内，行内空白/间隙不触发 */
function pointInWordRects(rects, x, y, tx, ty) {
  tx = tx == null ? 2 : tx; ty = ty == null ? 1 : ty;
  for (const rc of rects) {
    if (!rc || (rc.width === 0 && rc.height === 0)) continue;
    if (x >= rc.left - tx && x <= rc.right + tx &&
        y >= rc.top - ty && y <= rc.bottom + ty) return true;
  }
  return false;
}
function wordAtPoint(x, y) {
  let node, offset;
  if (document.caretRangeFromPoint) {
    const r = document.caretRangeFromPoint(x, y);
    if (!r) return null;
    node = r.startContainer; offset = r.startOffset;
  } else if (document.caretPositionFromPoint) {
    const p = document.caretPositionFromPoint(x, y);
    if (!p) return null;
    node = p.offsetNode; offset = p.offset;
  } else return null;
  if (node.nodeType !== 3) return null;
  // 卷面 .can-lookup 走静态词典；AI 对话/收藏等 .can-lookup-live 走预生成索引
  const hostEl = node.parentElement;
  if (!hostEl || !hostEl.closest) return null;
  const staticHost = hostEl.closest('.can-lookup');
  const liveHost = hostEl.closest('.can-lookup-live');
  if (!staticHost && !liveHost) return null;
  const text = node.textContent;
  const isWord = c => /[A-Za-zÀ-ÖØ-öø-ÿ0-9'’&.\-]/.test(c);
  let s = offset, e = offset;
  while (s > 0 && isWord(text[s - 1])) s--;
  while (e < text.length && isWord(text[e])) e++;
  // 去掉首尾标点，但保留词内连字符、撇号、& 和缩写点（H1N1 / R&D / U.S.）
  const raw = text.slice(s, e).replace(/^[.'’&\-]+|[.'’&\-]+$/g, '');
  if (!/[A-Za-zÀ-ÖØ-öø-ÿ]/.test(raw)) return null;
  const range = document.createRange();
  range.setStart(node, s);
  range.setEnd(node, e);
  const rects = range.getClientRects();
  const rect = range.getBoundingClientRect();
  if (!rect || (!rect.width && !rect.height)) return null;
  // 精确判定：坐标必须落在文字实际宽度/高度内（caret API 会吸附到邻近字符，
  // 点在词旁空白、行间距一律不触发），兼容跨换行的多矩形单词
  if (!pointInWordRects(rects, x, y)) return null;
  const secEl = hostEl.closest('.sec');
  const sec = secEl ? secEl.id.replace(/^sec-/, '') : 'head';
  const blkEl = hostEl.closest('[data-blk]');
  const blk = blkEl ? blkEl.getAttribute('data-blk') : null;
  return { raw, rect, sec, blk, live: !staticHost };
}

function wordFromInput(el) {
  const pos = el.selectionStart;
  const text = String(el.value || '');
  if (pos == null) return null;
  const isWord = c => /[A-Za-zÀ-ÖØ-öø-ÿ0-9'’&.\-]/.test(c);
  let s = pos, e = pos;
  while (s > 0 && isWord(text[s - 1])) s--;
  while (e < text.length && isWord(text[e])) e++;
  const raw = text.slice(s, e).replace(/^[.'’&\-]+|[.'’&\-]+$/g, '');
  if (!/[A-Za-zÀ-ÖØ-öø-ÿ]/.test(raw)) return null;
  const r = el.getBoundingClientRect();
  return {
    raw,
    live: true,
    rect: { left: r.left + 10, right: r.right - 10, top: r.top, bottom: r.bottom,
      width: Math.max(80, Math.min(240, r.width - 20)), height: r.height }
  };
}

function normalizeDictWord(raw) {
  return String(raw).toLowerCase()
    .replace(/[’‘]/g, "'")
    .replace(/^[^a-z]+|[^a-z']+$/g, '');
}

function dictEntryFor(dict, surface) {
  if (dict[surface]) return dict[surface];
  if (surface.endsWith("'s") && dict[surface.slice(0, -2)]) return dict[surface.slice(0, -2)];
  const noDots = surface.replace(/\./g, '');
  if (noDots !== surface && dict[noDots]) return dict[noDots];
  return null;
}

function formBasesFromEntry(entry, surface) {
  if (!entry) return [];
  const out = [];
  for (const line of meaningLines(entry[0])) {
    const m = line.match(/^([A-Za-z][A-Za-z'-]*)\s*的\s*(?:过去式|过去分词|现在分词|现在式|现在式第三人称单数?|复数|第三人称单数|比较级|最高级|缩写|变形|形式)(?:\s*和\s*(?:过去式|过去分词))?\s*[。.]?$/);
    const base = m ? m[1].toLowerCase() : '';
    if (base && base !== surface && !out.includes(base)) out.push(base);
  }
  return out;
}

function showDictBubble(hit) {
  const surface = normalizeDictWord(hit.raw);
  const key = surface || String(hit.raw).toLowerCase();
  bubbleWord = key;
  const rect = hit.rect;
  bubble.style.display = 'block';
  bubble.innerHTML = '<div class="wb-loading">词典加载中…</div>';
  positionPop(bubble, rect);
  loadDictPart(dictPartKey(surface)).then(dict => {
    if (bubbleWord !== key) return;
    const entry = dictEntryFor(dict, surface);
    if (!entry) {
      showBubbleAt({ key, lemma: key, entry: null, baseSections: [] }, rect);
      return;
    }
    // The dictionary entry owns the form note; resolve its base entries too.
    const bases = formBasesFromEntry(entry, surface);
    return Promise.all(bases.map(base =>
      loadDictPart(dictPartKey(base)).then(part => {
        const baseEntry = dictEntryFor(part, base);
        return baseEntry ? { key: base, entry: baseEntry } : null;
      }).catch(() => null)
    )).then(sections => {
      if (bubbleWord !== key) return;
      showBubbleAt({ key, lemma: key, entry, baseSections: sections.filter(Boolean) }, rect);
    });
  }).catch(() => {
    if (bubbleWord !== key) return;
    bubble.innerHTML = '<div class="wb-loading">词典加载失败，请稍后重试</div>';
    positionPop(bubble, rect);
  });
}

/* ---------------- 浮层定位 ---------------- */
function positionPop(el, rect) {
  el.style.display = 'block';
  const rw = el.offsetWidth, rh = el.offsetHeight;
  let left = rect.left + window.scrollX + (rect.width / 2) - rw / 2;
  let top = rect.bottom + window.scrollY + 10;
  left = Math.max(10, Math.min(left, window.scrollX + document.documentElement.clientWidth - rw - 10));
  if (top + rh > window.scrollY + document.documentElement.clientHeight - 20) {
    top = rect.top + window.scrollY - rh - 10;
  }
  el.style.left = left + 'px';
  el.style.top = Math.max(60, top) + 'px';
}

/* ---------------- 收藏：生词 + 句子 ---------------- */
function nowHHMM() {
  const d = new Date();
  return `${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`;
}
function saveFavorites() { lsSet('e2_favorites', state.favorites); }
function isWordFav(lemma) {
  return state.favorites.some(f => f.type === 'word' && f.lemma === lemma);
}
function toggleWordFav(lk) {
  const i = state.favorites.findIndex(f => f.type === 'word' && f.lemma === lk.lemma);
  if (i >= 0) {
    state.favorites.splice(i, 1);
    saveFavorites();
    toast('已取消收藏');
    return false;
  }
  const e = lk.entry;
  state.favorites.unshift({
    type: 'word',
    lemma: lk.lemma,
    key: lk.key,
    phonetic: e && e[1] ? e[1] : '',
    meaning: e ? e[0] : '',
    time: nowHHMM()
  });
  saveFavorites();
  toast('已收藏「' + lk.lemma + '」');
  return true;
}
function addSentFav(text, label) {
  const norm = text.replace(/\s+/g, ' ').trim();
  if (state.favorites.some(f => f.type === 'sent' && f.text === norm)) {
    toast('该句子已收藏过');
    return false;
  }
  state.favorites.unshift({ type: 'sent', text: norm, label: label || '', time: nowHHMM() });
  saveFavorites();
  toast('已收藏本句');
  return true;
}

/* 自定义确认弹层（页面内实现，不使用浏览器原生确认框） */
function askConfirm(msg, title) {
  return new Promise(resolve => {
    const m = $('#confirmModal');
    $('#cmTitle').textContent = title || '确认操作';
    $('#cmMsg').textContent = msg;
    const ok = $('#cmOk'), cancel = $('#cmCancel');
    const done = val => {
      m.classList.remove('show');
      ok.onclick = null; cancel.onclick = null; m.onclick = null;
      resolve(val);
    };
    ok.onclick = () => done(true);
    cancel.onclick = () => done(false);
    m.onclick = ev => { if (ev.target === m) done(false); };
    m.classList.add('show');
  });
}

function renderFavorites() {
  const body = $('#wpBody');
  const words = state.favorites.filter(f => f.type === 'word');
  const sents = state.favorites.filter(f => f.type === 'sent');
  $('#wpCount').textContent = state.favorites.length ? `（共 ${state.favorites.length}）` : '';
  $('#ftWn').textContent = words.length;
  $('#ftSn').textContent = sents.length;
  $$('.wp-tab').forEach(t => t.classList.toggle('active', t.getAttribute('data-favtab') === state.favTab));
  $('#wpClear').disabled = state.favorites.length === 0;
  $('#wpClear').style.opacity = state.favorites.length === 0 ? '.5' : '';
  const tab = state.favTab;
  const list = tab === 'word' ? words : sents;
  if (!list.length) {
    const hint = state.favorites.length === 0
      ? '点击单词后在释义气泡里点「收藏」；<br>按住鼠标划选句子或段落，点「收藏本句」。<br>收藏内容保存在本机，离线可用。'
      : (tab === 'word' ? '还没有收藏单词。<br>点击正文中的单词，在释义气泡里点「收藏」即可。'
                        : '还没有收藏句子。<br>按住鼠标划选句子或段落，点「收藏本句」即可。');
    body.innerHTML = `<div class="wp-empty">${hint}</div>`;
    return;
  }
  body.innerHTML = list.map(f => {
    if (f.type === 'word') {
      return `<div class="wp-word" tabindex="0" data-key="${esc(f.lemma)}">
        <div class="w-top">
          <span class="w-lemma">${esc(f.lemma)}</span>
          ${f.phonetic ? `<span class="w-phon">/${esc(f.phonetic)}/</span>` : ''}
          <button class="w-del" data-del="word" data-key="${esc(f.lemma)}">删除</button>
        </div>
        <div class="w-mean">${esc(shortMean(f.meaning || ''))}</div>
      </div>`;
    }
    const key = f.text.replace(/\s+/g, ' ').trim();
    return `<div class="wp-sent">
      <div class="s-text can-select can-lookup-live">${esc(f.text)}</div>
      <div class="s-meta">
        <span>句子${f.label ? ' · ' + esc(f.label) : ''}</span>
        <span>${f.time || ''}</span>
        <button class="s-del" data-del="sent" data-key="${esc(key)}">删除</button>

    </div>`;
  }).join('');
}

  // 下方放不下改正上方，上下都紧张再放右/左，最后视口内兜底。卷面与 AI 窗共用。
  const w = favBar.offsetWidth, h = favBar.offsetHeight;
  const vw = document.documentElement.clientWidth, vh = document.documentElement.clientHeight;
  const sx = window.scrollX, sy = window.scrollY;
  const gap = 8, M = 10;
  const clamp = (v, min, max) => Math.max(min, Math.min(v, max));
  const rc = sel.rect; // 选区视口包围盒
  let lv, tv;

    lv = rc.right + gap; tv = clamp(rc.top, M, vh - h - M);
  } else if (rc.left - gap - w >= M) {

    lv = rc.left - gap - w; tv = clamp(rc.top, M, vh - h - M);

const transPop = $('#transPop');

function hideTransPop() { transPop.style.display = 'none'; }

  transPop.addEventListener(type, ev => ev.stopPropagation()));

function positionTransPop() {
  const rect = currentSel ? currentSel.rect : null;
  const vw = document.documentElement.clientWidth;
  const vh = document.documentElement.clientHeight;
  const sx = window.scrollX, sy = window.scrollY;
  const gap = 8;
  const w = Math.max(180, Math.min(rect ? rect.width : 320, 520, vw - 20));
  transPop.style.width = w + 'px';
  const h = transPop.offsetHeight;
  const left = Math.max(10, Math.min(rect ? rect.left : 10, vw - w - 10));
  // 划句工具条也在选区下方，翻译框必须避开它，不能两层叠在一起。
  const bar = favBar && favBar.style.display !== 'none'
    ? favBar.getBoundingClientRect() : null;
  const overlapsBar = top => !!bar &&
    left < bar.right - 2 && left + w > bar.left + 2 &&
    top < bar.bottom - 2 && top + h > bar.top + 2;
  const candidates = [];
  if (rect) candidates.push(rect.bottom + gap);
  if (bar) candidates.push(bar.bottom + gap);
  if (rect) candidates.push(rect.top - h - gap);
  if (bar) candidates.push(bar.top - h - gap);
  candidates.push(10);
  let top = candidates.find(t => t >= 10 && t + h <= vh - 10 && !overlapsBar(t));
  if (top == null) {
    top = Math.max(10, Math.min(vh - h - 10, rect ? rect.bottom + gap : 10));
  }
  transPop.style.left = (left + sx) + 'px';
  transPop.style.top = (top + sy) + 'px';
}

function translateSentence(text) {
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), 30000);
  return fetch(TRANSLATE_BASE_URL + '/translate', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ text }),
    signal: ctrl.signal,
    cache: 'no-store'
  }).then(async resp => {
    const raw = await resp.text();
    let data;
    try { data = JSON.parse(raw); } catch { throw new Error('bad translation response'); }
    if (!resp.ok) throw new Error(data.error || ('HTTP ' + resp.status));
    if (!data.translation) throw new Error('empty translation');
    return String(data.translation).trim();
  }).finally(() => clearTimeout(timer));
}

function runTranslate() {
  if (!currentSel) return;
  const captured = currentSel;
  transPop.style.display = 'block';
  transBody.innerHTML = '<span class="tp-loading">翻译中…</span>';
  positionTransPop();
  translateSentence(captured.text).then(zh => {
    if (currentSel !== captured) return;
    transBody.textContent = zh;
    positionTransPop();
  }).catch(() => {
    if (currentSel !== captured) return;
    transBody.innerHTML = '<span class="tp-error">翻译服务连接不通，请稍后重试</span>';
    positionTransPop();
  });
}

/* 行内 Markdown：行内代码 → 加粗 → 斜体（顺序避免 ** 被当成两个 *） */
function inlineMd(t) {
  return t
    .replace(/`([^`]+)`/g, (m, c) => '<code>' + c + '</code>')
    .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
    .replace(/__([^_]+)__/g, '<strong>$1</strong>')
    .replace(/\*([^*]+)\*/g, '<em>$1</em>')
    .replace(/(^|[^A-Za-z0-9_])_([^_]+)_(?![A-Za-z0-9_])/g, '$1<em>$2</em>');
}

/* 表格行：去掉首尾管道后按 | 拆成单元格 */
function splitTableRow(row) {
  let s = row.trim();
  if (s.startsWith('|')) s = s.slice(1);
  if (s.endsWith('|')) s = s.slice(0, -1);
  return s.split('|').map(c => c.trim());
}
/* 表格分隔行：仅由 | - : 空格组成且含 -（如 |---|:---:|） */
function isTableSep(s) {
  return /^\s*\|?[\s:|-]+\|?\s*$/.test(s) && /-/.test(s) && /\|/.test(s);
}

/* 受控 Markdown 渲染：先转义杜绝 XSS，再按行处理块级（表格/标题/引用/分隔线/列表/段落），
   块内文本走 inlineMd，覆盖标题、斜体、加粗等常见语法 */
function renderMarkdown(src) {
  const lines = esc(src).split(/\r?\n/);
  let html = '', inUl = false, inOl = false, inQuote = false;
  const closeAll = () => {
    if (inUl) { html += '</ul>'; inUl = false; }
    if (inOl) { html += '</ol>'; inOl = false; }
    if (inQuote) { html += '</blockquote>'; inQuote = false; }
  };
  for (let i = 0; i < lines.length; i++) {
    const t = lines[i].trim();
    // 围栏代码块（``` 或 ~~~）：原样保留空白与换行，不解析内部 markdown；
    // 未闭合（流式输出中）也能正常显示已生成部分
    const fenceM = t.match(/^(`{3,}|~{3,})(.*)$/);
    if (fenceM) {
      closeAll();
      const mark = fenceM[1][0];
      const lang = (fenceM[2].match(/[A-Za-z0-9_+-]+/) || [''])[0];
      const buf = [];
      i++;
      while (i < lines.length) {
        const cm = lines[i].trim().match(/^(`{3,}|~{3,})\s*$/);
        if (cm && cm[1][0] === mark) break;
        buf.push(lines[i]); i++;
      }
      const langAttr = lang ? ' data-lang="' + lang + '"' : '';
      html += '<pre class="aic-pre"' + langAttr + '><code>' + buf.join('\n') + '</code></pre>';
      continue;
    }
    // 表格：当前行含管道，且下一行为分隔行；连续收集后续数据行
    if (t.indexOf('|') >= 0 && i + 1 < lines.length && isTableSep(lines[i + 1])) {
      closeAll();
      const header = splitTableRow(t);
      i += 2; // 跳过表头与分隔行
      const bodyRows = [];
      while (i < lines.length && lines[i].indexOf('|') >= 0 && lines[i].trim() !== '') {
        bodyRows.push(splitTableRow(lines[i]));
        i++;
      }
      i--; // 抵消外层 for 的自增
      let tbl = '<table><thead><tr>';
      header.forEach(h => { tbl += '<th>' + inlineMd(h) + '</th>'; });
      tbl += '</tr></thead><tbody>';
      bodyRows.forEach(r => {
        tbl += '<tr>';
        r.forEach(c => { tbl += '<td>' + inlineMd(c) + '</td>'; });
        tbl += '</tr>';
      });
      tbl += '</tbody></table>';
      html += tbl;
      continue;
    }
    const hm = t.match(/^(#{1,6})\s+(.*)$/);
    const ulm = t.match(/^[-*]\s+(.*)$/);
    const olm = t.match(/^\d+[.、]\s+(.*)$/);
    const qm = t.match(/^(?:>|&gt;)\s?(.*)$/); // esc 后 > 变成 &gt;，两种都要匹配
    if (hm) {
      closeAll();
      const lv = hm[1].length;
      html += '<h' + lv + '>' + inlineMd(hm[2]) + '</h' + lv + '>';
    } else if (/^(-{3,}|\*{3,}|_{3,})\s*$/.test(t)) {
      closeAll();
      html += '<hr>';
    } else if (qm) {
      if (inUl) { html += '</ul>'; inUl = false; }
      if (inOl) { html += '</ol>'; inOl = false; }
      if (!inQuote) { html += '<blockquote>'; inQuote = true; }
      html += inlineMd(qm[1]);
    } else if (ulm) {
      if (inQuote) { html += '</blockquote>'; inQuote = false; }
      if (inOl) { html += '</ol>'; inOl = false; }
      if (!inUl) { html += '<ul>'; inUl = true; }
      html += '<li>' + inlineMd(ulm[1]) + '</li>';
    } else if (olm) {
      if (inQuote) { html += '</blockquote>'; inQuote = false; }
      if (inUl) { html += '</ul>'; inUl = false; }
      if (!inOl) { html += '<ol>'; inOl = true; }
      html += '<li>' + inlineMd(olm[1]) + '</li>';
    } else if (t === '') {
      closeAll();
    } else {
      closeAll();
      html += '<p>' + inlineMd(t) + '</p>';
    }
  }
  closeAll();
  return html;
}

function aiErrorText(e) {
  if (/未配置/.test(e.message)) return e.message;
  if (e.name === 'TypeError' || /Failed to fetch|NetworkError|Load failed/i.test(e.message)) {
    return 'AI 服务连接不通：当前网络可能访问不了默认的 pages.dev 代理。可设置 e2_aiBaseUrl 指向其他代理后重试。';
  }
  return '调用失败，请检查网络或配置后重试（' + e.message + '）';
}

/* 流式调用：POST Worker 代理 /chat/completions，逐行解析 SSE，onDelta 回传累计文本 */
function streamChat(messages, onDelta) {
  if (!DOUBAO_CONFIG.endpointId) {
    return Promise.reject(new Error('未配置接入点 ID，请在文件顶部 DOUBAO_CONFIG 填写'));
  }
  aiAbort = new AbortController();
  // 人设只在调用层注入：system 消息不进入 aiHistory，清空记忆/切换模型都不影响
  const payloadMessages = [{ role: 'system', content: AI_SYSTEM_PROMPT }, ...messages];
  return fetch(DOUBAO_CONFIG.baseUrl + '/chat/completions', {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json'
    },
    body: JSON.stringify({
      model: DOUBAO_CONFIG.endpointId,
      messages: payloadMessages,
      stream: true,
      thinking: { type: 'disabled' } // 关闭深度思考：讲解类任务直接作答，大幅降低首字等待（非人设/格式约束）
    }),
    signal: aiAbort.signal
  }).then(async resp => {
    if (!resp.ok) {
      const t = await resp.text().catch(() => '');
      throw new Error('HTTP ' + resp.status + ' ' + t.slice(0, 120));
    }
    const reader = resp.body.getReader();
    const dec = new TextDecoder();
    let buffer = '', full = '';
    try {
      for (;;) {
        const r = await reader.read();
        if (r.done) break;
        buffer += dec.decode(r.value, { stream: true });
        let idx;
        while ((idx = buffer.indexOf('\n')) >= 0) {
          const line = buffer.slice(0, idx).trim();
          buffer = buffer.slice(idx + 1);
          if (!line.startsWith('data:')) continue;
          const payload = line.slice(5).trim();
          if (!payload || payload === '[DONE]') continue;
          try {
            const json = JSON.parse(payload);
            const delta = json.choices && json.choices[0] && json.choices[0].delta;
            const piece = delta && delta.content;
            if (piece) { full += piece; onDelta(full); }
          } catch (e) { /* 分片偶发解析异常忽略，不影响后续 */ }
        }
      }
      return full;
    } finally {
      // 正常结束或 abort/异常都释放底层连接，避免流挂起
      reader.cancel().catch(() => {});
    }
  });
}

function appendMsg(role, text) {
  const div = document.createElement('div');
  // AI 对话不属于卷面，走后加载的预生成词形索引
  div.className = 'aic-msg aic-' + role + ' can-select can-lookup-live';
  if (role === 'ai') div.innerHTML = renderMarkdown(text);
  else div.textContent = text;
  aiMessages.appendChild(div);
  followBottom();
  return div;
}

/* 输出中：输入框与发送按钮始终可用（可打字、可发新问题）；仅切换打断按钮显隐 */
function setStreamingUI(on) {
  aiStopBtn.classList.toggle('visible', on);
}

/* 发送一条用户消息并驱动 AI 流式回复；isPreset 为入口自动提问 */
async function sendUserMessage(text, isPreset) {
  // 正在输出：先打断旧流并等其复位，再发新问题（不并发）
  if (aiStreaming) { stopStreaming(); await waitStreamingEnd(); }
  const content = isPreset ? text : text.trim();
  if (!content) return;
  stickBottom = true; // 用户主动发起，强制贴底跟随本次回复
  appendMsg('user', content);
  aiHistory.push({ role: 'user', content: content });
  const aiDiv = document.createElement('div');
  aiDiv.className = 'aic-msg aic-ai can-select can-lookup-live streaming'; // AI 回答支持点词/划句，但不走卷面静态词典
  aiMessages.appendChild(aiDiv);
  followBottom();
  aiStreaming = true;
  setStreamingUI(true);
  let lastPartial = '';
  try {
    const reqMessages = aiHistory.slice(); // 不注入任何系统提示，体验原生 DeepSeek
    const full = await streamChat(reqMessages, partial => {
      lastPartial = partial;
      aiDiv.innerHTML = renderMarkdown(partial);
      followBottom(); // 流式逐字：仅在贴底时跟随，用户上滑不打断
    });
    aiDiv.classList.remove('streaming');
    aiDiv.innerHTML = renderMarkdown(full);
    aiHistory.push({ role: 'assistant', content: full });
  } catch (e) {
    if (e.name === 'AbortError') {
      // 用户主动打断：保留已生成内容（若有），历史对齐，不弹错误
      aiDiv.classList.remove('streaming');
      if (lastPartial && lastPartial.trim()) {
        aiDiv.innerHTML = renderMarkdown(lastPartial);
        const tag = document.createElement('div');
        tag.className = 'aic-stop-tag';
        tag.textContent = '已打断';
        aiDiv.appendChild(tag);
        aiHistory.push({ role: 'assistant', content: lastPartial });
      } else {
        aiDiv.remove();
        aiHistory.pop(); // 还没输出就打断：回滚用户消息
      }
    } else {
      aiDiv.remove();
      aiHistory.pop(); // 回滚失败的用户消息，保持历史对齐
      const errDiv = document.createElement('div');
      errDiv.className = 'aic-msg aic-error';
      errDiv.textContent = aiErrorText(e);
      aiMessages.appendChild(errDiv);
    }
  } finally {
    aiStreaming = false;
    setStreamingUI(false);
    followBottom();
    if (streamingEndedResolve) {
      const r = streamingEndedResolve; streamingEndedResolve = null; r();
    }
  }
}

/* ===== AI 聊天窗：头部拖动移动 + 四条边调整大小 + 记忆形态（localStorage） ===== */
const AI_RECT_KEY = 'aiWindowRectV1';
const AI_MIN_W = 300, AI_MIN_H = 320;

function defaultAiRect() {
  const w = 384;
  const h = Math.min(580, window.innerHeight - 48);
  return { width: w, height: h, left: window.innerWidth - w - 24, top: window.innerHeight - h - 24 };
}
function clampAiRect(r) {
  const vw = window.innerWidth, vh = window.innerHeight;
  const minW = Math.min(AI_MIN_W, vw), minH = Math.min(AI_MIN_H, vh);
  const width = Math.max(minW, Math.min(r.width, vw));
  const height = Math.max(minH, Math.min(r.height, vh));
  const left = Math.min(Math.max(r.left, 0), vw - width);
  const top = Math.min(Math.max(r.top, 0), vh - height);
  return { left, top, width, height };
}
function loadAiRect() {
  try {
    const raw = localStorage.getItem(AI_RECT_KEY);
    if (raw) {
      const r = JSON.parse(raw);
      if (r && [r.left, r.top, r.width, r.height].every(n => typeof n === 'number' && !isNaN(n)))
        return clampAiRect(r);
    }
  } catch (e) { /* 数据损坏则回退默认 */ }
  return defaultAiRect();
}
let aiRect = loadAiRect();
function saveAiRect() {
  try { localStorage.setItem(AI_RECT_KEY, JSON.stringify(aiRect)); } catch (e) {}
}
function smallScreen() { return window.matchMedia('(max-width:560px)').matches; }
function applyAiRect() {
  if (smallScreen()) {
    // 小屏交给 CSS 全屏样式，移除 inline 几何
    aiChat.style.left = aiChat.style.top = '';
    aiChat.style.width = aiChat.style.height = '';
    aiChat.style.right = aiChat.style.bottom = '';
    return;
  }
  aiRect = clampAiRect(aiRect);
  const s = aiChat.style;
  s.left = aiRect.left + 'px';
  s.top = aiRect.top + 'px';
  s.width = aiRect.width + 'px';
  s.height = aiRect.height + 'px';
  s.right = 'auto';
  s.bottom = 'auto';
}
function beginAiDrag(kind, e) {
  e.preventDefault();
  e.stopPropagation();
  const sx = e.clientX, sy = e.clientY;
  const start = clampAiRect(aiRect);
  const bodyClass = kind === 'move' ? 'aic-dragging-move' : 'aic-dragging-rz-' + kind;
  document.body.classList.add('aic-dragging', bodyClass);
  function onMove(ev) {
    const dx = ev.clientX - sx, dy = ev.clientY - sy;
    let { left, top, width, height } = start;
    if (kind === 'move') { left = start.left + dx; top = start.top + dy; }
    else if (kind === 'r') { width = start.width + dx; }
    else if (kind === 'l') { left = start.left + dx; width = start.width - dx; }
    else if (kind === 'b') { height = start.height + dy; }
    else if (kind === 't') { top = start.top + dy; height = start.height - dy; }
    // 四个角：同时改变宽高
    else if (kind === 'br') { width = start.width + dx; height = start.height + dy; }
    else if (kind === 'tl') {
      left = start.left + dx; width = start.width - dx;
      top = start.top + dy; height = start.height - dy;
    }
    else if (kind === 'tr') {
      top = start.top + dy; height = start.height - dy; width = start.width + dx;
    }
    else if (kind === 'bl') {
      left = start.left + dx; width = start.width - dx; height = start.height + dy;
    }
    aiRect = clampAiRect({ left, top, width, height });
    applyAiRect();
  }
  function onUp() {
    window.removeEventListener('pointermove', onMove);
    window.removeEventListener('pointerup', onUp);
    document.body.classList.remove('aic-dragging', bodyClass);
    saveAiRect();
  }
  window.addEventListener('pointermove', onMove);
  window.addEventListener('pointerup', onUp);
}

/* AI 窗内按钮统一按下触发：软键盘聚焦时，鼠标/触摸的首按常被浏览器先用于收起输入法、
   随后布局重排取消 click，导致要按两次。pointerdown 在按下瞬间抢先处理，去重拦截合成 click。
   仅作用于传入的按钮，正文的触摸/鼠标区分（手指划句、蓝牙鼠标划句）保持不变。 */
function bindAiPress(el, handler) {
  let lastFireAt = 0;
  const fire = e => {
    const now = Date.now();
    if (now - lastFireAt < 400) return; // pointerdown 后还会合成 click，去重避免一次操作触发两遍
    lastFireAt = now;
    handler(e);
  };
  el.addEventListener('pointerdown', fire);
  el.addEventListener('click', fire);
}

function currentSecLabel(range) {
  if (!range) return state.year ? state.year + ' ' : '';
  const anchor = range.commonAncestorContainer;
  if (!anchor) return state.year ? state.year + ' ' : '';
  const host = anchor.nodeType === 1 ? anchor : anchor.parentElement;
  let secName = '';
  const sec = host && host.closest ? host.closest('.sec') : null;
  if (sec) {
    const t = sec.querySelector('.sec-title');
    if (t) {
      const zh = t.querySelector('.zh');
      secName = zh ? zh.textContent.trim() : t.textContent.replace(/\s+/g, ' ').trim();
    }
  }
  return (state.year ? state.year + ' ' : '') + secName;
}

/* ---------------- 鼠标交互绑定 ---------------- */
/* 卷面 .can-lookup 走静态词典；AI/收藏等 .can-lookup-live 走预生成索引 */
const LOOKUP_ZONE = '.can-lookup, .can-lookup-live';
function isInside(el, target) {
  return el && el.contains(target);
}

document.addEventListener('mouseup', ev => {
  // 收藏面板内：句子正文允许划句；单词卡不再参与卷面点词
  if (isInside($('#wordPanel'), ev.target) && !ev.target.closest('.s-text')) return;
  // 点击/划选发生在气泡、收藏条、弹层、工具条、侧栏内则不响应
  if (isInside(bubble, ev.target) || isInside(favBar, ev.target) ||
      isInside(transPop, ev.target) ||
      isInside(aiFab, ev.target) ||
      // AI 窗内仅头部/输入区拦截；消息区放行划句（点词由 .can-lookup 门控）
      (isInside(aiChat, ev.target) &&
        (ev.target.closest('.aic-head') || ev.target.closest('.aic-input-row'))) ||
      isInside($('#timerPanel'), ev.target) ||
      isInside($('#timerModal'), ev.target) || isInside($('#confirmModal'), ev.target) ||
      isInside($('#topbar'), ev.target) ||
      isInside($('#sidebar'), ev.target)) return;
  setTimeout(() => {
    // 导航跳转导致的点击穿透：跳过本次查词
    if (suppressNextLookup) { suppressNextLookup = false; hideFavBar(); return; }
    // 软键盘发送后的合成点击穿透：屏蔽窗口内不查词、不弹收藏条
    if (Date.now() < blockLookupUntil) { hideFavBar(); hideTransPop(); return; }
    const sel = getEnglishSelection();
    if (sel) {
      // 拖拽划选：弹收藏条（不做单词查词），并收起旧气泡
      downHit = null;
      currentSel = sel;
      bubbleWord = null;
      bubble.style.display = 'none';
      hideTransPop();
      showFavBar(sel, { x: ev.clientX, y: ev.clientY });
      return;
    }
    hideFavBar();
    hideTransPop();
    // 无选区 → 点击查词；优先用 mousedown 锁定的词（移动端点击后可能滚动）
    const hit = (ev.target.closest(LOOKUP_ZONE) ? downHit : null) || wordAtPoint(ev.clientX, ev.clientY);
    if (hit && hit === downHit) {
      const dx = window.scrollX - downScroll.x;
      const dy = window.scrollY - downScroll.y;
      if (dx || dy) {
        const r = hit.rect;
        hit.rect = { left: r.left - dx, right: r.right - dx, top: r.top - dy,
          bottom: r.bottom - dy, width: r.width, height: r.height };
      }
    }
    downHit = null;
    if (hit) {
      const key = hit.raw.toLowerCase();
      // 再点同一个单词：关闭气泡（mousedown 已先把它隐藏）
      if (bubbleWord === key) {
        bubbleWord = null;
        bubble.style.display = 'none';
        return;
      }
      showDictBubble(hit);
    } else {
      // 点在空白处：关闭气泡
      bubbleWord = null;
      bubble.style.display = 'none';
    }
  }, 10);
});

document.addEventListener('mousedown', ev => {
  // 首页年份卡片 / 试卷板块标签：这次点击会触发视图跳转，置位抑制，防止穿透到新视图单词
  if (ev.target.closest('.year-card,.sec-tabs a')) suppressNextLookup = true;

const EDIT_ZONE = 'input, textarea, [contenteditable], [contenteditable="true"]';

/* ---------------- 倒计时 ---------------- */
const Timer = {
  endAt: 0, remain: 0, intervalId: null, running: false,
  overMode: false,  // 倒计时归零后进入"超时正计时"（只能由归零自动触发）
  overAt: 0,
  paused: false,    // 暂停态（倒计时/超时正计时通用）
  overElapsed: 0    // 超时正计时暂停时冻结的累计秒数
};
const tH = $('#tH'), tM = $('#tM'), tS = $('#tS'), tTime = $('#timerTime'), tTag = $('#timerTag');

function fmtTime(sec) {
  sec = Math.max(0, Math.floor(sec));
  const h = Math.floor(sec / 3600);
  const m = Math.floor((sec % 3600) / 60);
  const s = sec % 60;
  return `${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
}
function clampNum(v, min, max) {
  v = Math.floor(Number(v) || 0);
  if (isNaN(v)) v = 0;
  return Math.max(min, Math.min(max, v));
}
function readInputs() {
  const h = clampNum(tH.value, 0, 99);
  const m = clampNum(tM.value, 0, 59);
  const s = clampNum(tS.value, 0, 59);
  tH.value = h; tM.value = m; tS.value = s;
  return h * 3600 + m * 60 + s;
}
function renderTimerTime() {
  const box = tTime.parentElement;
  if (Timer.overMode) {
    const over = Timer.paused
      ? Timer.overElapsed
      : Math.floor((Date.now() - Timer.overAt) / 1000);
    tTime.textContent = '+' + fmtTime(over);
    tTag.style.display = 'inline-block';
    box.classList.add('over');
  } else {
    tTime.textContent = fmtTime(Timer.remain);
    tTag.style.display = 'none';
    box.classList.remove('over');
  }
}
/* 小面板视图：未开始显示"时/分/秒 + 开始"；进行中/超时显示"大号时间 + 重置" */
function applyTimerView() {
  const active = Timer.running || Timer.overMode || Timer.paused;
  // 暂停态不绿，运行/超时走时才绿
  $('#timerBtn').classList.toggle('running', (Timer.running || Timer.overMode) && !Timer.paused);
  $('#tpInputs').hidden = active;
  $('#tpTime').style.display = active ? 'flex' : 'none';
  $('#tStart').hidden = active;
  $('#tPause').hidden = !active;
  $('#tPause').textContent = Timer.paused ? '继续' : '暂停';
  $('#tReset').hidden = !active;
}
function positionTimerPanel() {
  const panel = $('#timerPanel');
  const b = $('#timerBtn').getBoundingClientRect();
  const pw = panel.offsetWidth, ph = panel.offsetHeight;
  const vw = document.documentElement.clientWidth, vh = window.innerHeight;
  const m = 8;
  // 默认右对齐按钮右缘，靠近视口边缘时向内收
  let left = Math.max(m, Math.min(b.right - pw, vw - pw - m));
  let top = b.bottom + 8;
  let flipped = false;
  if (top + ph > vh - m) { top = b.top - ph - 8; flipped = true; }
  panel.style.left = left + 'px';
  panel.style.top = top + 'px';
  const caret = $('#tpCaret');
  if (caret) {
    const cx = b.left + b.width / 2 - left;
    caret.style.left = Math.max(16, Math.min(cx - 6, pw - 28)) + 'px';
    caret.style.display = flipped ? 'none' : 'block';
  }
}
function openTimerPanel() {
  if (!Timer.running && Timer.remain === 0 && !Timer.overMode) tTime.textContent = fmtTime(readInputs());
  if (Timer.overMode || Timer.paused) renderTimerTime(); // 重开面板显示最新/冻结读数
  $('#swPanel').classList.remove('show'); // 打开倒计时时收起秒表
  applyTimerView();
  $('#timerPanel').classList.add('show');
  positionTimerPanel();
}
function closeTimerPanel() { $('#timerPanel').classList.remove('show'); }
function timerTick() {
  if (Timer.paused) return; // 暂停期间不计时
  // 超时正计时：自动累加，直到用户重新设置并开始新一轮
  if (Timer.overMode) { renderTimerTime(); return; }
  Timer.remain = Math.max(0, Math.round((Timer.endAt - Date.now()) / 1000));
  renderTimerTime();
  if (Timer.remain <= 0) finishTimer();
}
function startTimer() {
  if (Timer.running) return;
  const secs = (!Timer.overMode && Timer.remain > 0) ? Timer.remain : readInputs();
  if (!secs) { toast('请先设置倒计时时长'); return; }
  // 在用户点击手势内预创建 AudioContext 并预解码电铃，保证归零时立即响铃
  preloadAlarm();
  // 新一轮倒计时：清掉上一次的超时正计时与暂停态
  Timer.overMode = false;
  Timer.overAt = 0;
  Timer.paused = false;
  Timer.overElapsed = 0;
  Timer.remain = secs;
  Timer.endAt = Date.now() + secs * 1000;
  Timer.running = true;
  renderTimerTime();
  applyTimerView();
  positionTimerPanel();
  if (Timer.intervalId) clearInterval(Timer.intervalId);
  Timer.intervalId = setInterval(timerTick, 250);
}
function resetTimer() {
  if (Timer.intervalId) clearInterval(Timer.intervalId);
  stopAlarm();
  Timer.running = false;
  Timer.remain = 0;
  Timer.overMode = false;
  Timer.overAt = 0;
  Timer.paused = false;
  Timer.overElapsed = 0;
  tTime.textContent = fmtTime(readInputs());
  renderTimerTime();
  applyTimerView();
  positionTimerPanel();
}
function finishTimer() {
  // 幂等：已进入超时正计时后，任何 tick 重复进入都直接返回
  if (Timer.overMode) return;
  if (Timer.intervalId) clearInterval(Timer.intervalId);
  Timer.running = false;
  Timer.remain = 0;
  Timer.paused = false;
  Timer.overElapsed = 0;
  // 归零瞬间自动启动"超时正计时"（唯一触发方式：倒计时归零；关闭弹窗、关闭面板也在后台继续）
  Timer.overMode = true;
  Timer.overAt = Date.now();
  renderTimerTime();
  applyTimerView();
  positionTimerPanel();
  Timer.intervalId = setInterval(timerTick, 250);
  // 弹窗居中 + 持续循环提示音（关弹窗即停）
  $('#timerModal').classList.add('show');
  startAlarm();
}
/* 暂停：倒计时冻结剩余秒数，超时正计时冻结累计秒数，停掉定时器 */
function pauseTimer() {
  if (Timer.paused) return;
  if (Timer.intervalId) { clearInterval(Timer.intervalId); Timer.intervalId = null; }
  if (Timer.overMode) {
    Timer.overElapsed = Math.floor((Date.now() - Timer.overAt) / 1000);
  } else if (Timer.running) {
    Timer.remain = Math.max(0, Math.round((Timer.endAt - Date.now()) / 1000));
    Timer.running = false;
  }
  Timer.paused = true;
  renderTimerTime();
  applyTimerView();
  positionTimerPanel();
}
/* 继续：超时正计时前移基准保持累计连续，倒计时按剩余秒重设截止，重启定时器 */
function resumeTimer() {
  if (!Timer.paused) return;
  if (Timer.overMode) {
    Timer.overAt = Date.now() - Timer.overElapsed * 1000;
  } else {
    Timer.endAt = Date.now() + Timer.remain * 1000;
    Timer.running = true;
  }
  Timer.paused = false;
  if (Timer.intervalId) clearInterval(Timer.intervalId);
  Timer.intervalId = setInterval(timerTick, 250);
  renderTimerTime();
  applyTimerView();
  positionTimerPanel();
}

/* ---- 超时提示音：内联"考试电铃"样本（Web Audio 无缝循环），仅超时弹窗期间响，关弹窗即停 ---- */
let alarmCtx = null, alarmBuffer = null, alarmSrc = null, alarmGain = null;
window.__alarmOn = false;
function ensureAlarmCtx() {
  if (!alarmCtx) {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return null;
    try { alarmCtx = new AC(); } catch (e) { return null; }
  }
  if (alarmCtx && alarmCtx.state === 'suspended') { alarmCtx.resume().catch(() => {}); }
  return alarmCtx;
}
function b64ToArrayBuffer(b64) {
  const bin = atob(b64);
  const buf = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) buf[i] = bin.charCodeAt(i);
  return buf.buffer;
}
// 用户点"开始"时预解码，保证归零瞬间立即响铃
function preloadAlarm() {
  const ctx = ensureAlarmCtx();
  if (!ctx || alarmBuffer || typeof ALARM_BELL_B64 === 'undefined') return;
  try {
    ctx.decodeAudioData(b64ToArrayBuffer(ALARM_BELL_B64),
      b => { alarmBuffer = b; },
      () => { alarmBuffer = null; });
  } catch (e) { alarmBuffer = null; }
}
function startAlarm() {
  const ctx = ensureAlarmCtx();
  if (!ctx) return;
  const go = () => {
    // 弹窗已被关闭则不再启动（处理异步回调晚于关闭的情况）
    if (!$('#timerModal').classList.contains('show')) return;
    stopAlarm();
    if (alarmBuffer) {
      const src = ctx.createBufferSource();
      src.buffer = alarmBuffer;
      src.loop = true;                 // 样本首尾交叉淡化，循环无缝
      const g = ctx.createGain();
      g.gain.value = 0.9;
      src.connect(g); g.connect(ctx.destination);
      src.start(0);
      alarmSrc = src; alarmGain = g;
      window.__alarmLoop = src.loop;
      window.__alarmDur = src.buffer ? src.buffer.duration : 0;
    }
    window.__alarmOn = true;
  };
  if (alarmBuffer) {
    if (ctx.state === 'suspended') ctx.resume().then(go).catch(() => {});
    else go();
  } else if (typeof ALARM_BELL_B64 !== 'undefined') {
    try {
      ctx.decodeAudioData(b64ToArrayBuffer(ALARM_BELL_B64),
        b => { alarmBuffer = b; go(); },
        () => { window.__alarmOn = false; });
    } catch (e) { /* 无音频环境时静默 */ }
  }
}
function stopAlarm() {
  if (alarmSrc) {
    try { alarmSrc.stop(0); } catch (e) {}
    try { alarmSrc.disconnect(); } catch (e) {}
    alarmSrc = null;
  }
  if (alarmGain) { try { alarmGain.disconnect(); } catch (e) {} alarmGain = null; }
  window.__alarmOn = false;
  window.__alarmLoop = false;
}

/* ---------------- 工具条 / 设置 ---------------- */
function setFontSize(v) {
  state.fontSize = Math.max(15, Math.min(24, v));
  document.documentElement.style.setProperty('--body-size', state.fontSize + 'px');
  $('#fontVal').textContent = state.fontSize;
  lsSet('e2_fontSize', state.fontSize);
}
function setShowAns(v) {
  state.showAns = v;
  document.body.classList.toggle('show-answers', v);
  $('#ansToggle').classList.toggle('active', v);
  $('#ansToggle').textContent = v ? '隐藏答案' : '显示答案';
  lsSet('e2_showAns', v);
  if (v && state.year && !hasAnswers(PAPER_MAP[state.year]))
    toast('本套真题未取得官方答案，仅完形/阅读题干可正常显示');
}
function syncPanelCollapsed() {
  // 收藏面板隐藏时同步隐藏右侧分界线，避免鼠标移到边缘仍出现橙色热区
  document.body.classList.toggle('wp-collapsed', !state.panelOpen);
}
function togglePanel(force) {
  state.panelOpen = force != null ? force : !state.panelOpen;
  $('#wordPanel').classList.toggle('hidden', !state.panelOpen);
  $('#main').classList.toggle('withPanel', state.panelOpen);
  $('#panelToggle').classList.toggle('active', state.panelOpen);
  syncPanelCollapsed();
  lsSet('e2_panelOpen', state.panelOpen);
}
/* ===== 三栏宽度：拖动分界线调整，记忆到本地 ===== */
const SB_W_KEY = 'e2_sbWidth', WP_W_KEY = 'e2_wpWidth';
const SB_MIN = 180, SB_MAX = 440, WP_MIN = 280, WP_MAX = 560;
function isDesktop() { return window.matchMedia('(min-width:901px)').matches; }
function loadColWidth(key, def) {
  const v = parseInt(lsGet(key, def), 10);
  return isNaN(v) ? def : v;
}
let sbW = loadColWidth(SB_W_KEY, 236);
let wpW = loadColWidth(WP_W_KEY, 360);
function applyColWidths() {
  const root = document.documentElement.style;
  root.setProperty('--sb-w', sbW + 'px');
  root.setProperty('--wp-w', wpW + 'px');
}
function saveColWidths() { lsSet(SB_W_KEY, sbW); lsSet(WP_W_KEY, wpW); }
applyColWidths();

function syncSidebarCollapsed() {
  document.body.classList.toggle('sb-collapsed', !state.sidebarOpen);
}
function beginColDrag(kind, e) {
  e.preventDefault(); e.stopPropagation();
  const sx = e.clientX;
  const startW = kind === 'L' ? sbW : wpW;
  const divider = kind === 'L' ? $('#divL') : $('#divR');
  divider.classList.add('active');
  document.body.classList.add('col-resizing');
  function onMove(ev) {
    const dx = ev.clientX - sx;
    if (kind === 'L') sbW = Math.max(SB_MIN, Math.min(SB_MAX, startW + dx));
    else wpW = Math.max(WP_MIN, Math.min(WP_MAX, startW - dx)); // 鼠标往左拖，右栏变宽
    applyColWidths();
  }
  function onUp() {
    window.removeEventListener('pointermove', onMove);
    window.removeEventListener('pointerup', onUp);
    divider.classList.remove('active');
    document.body.classList.remove('col-resizing');
    saveColWidths();
  }
  window.addEventListener('pointermove', onMove);
  window.addEventListener('pointerup', onUp);
}
$('#divL').addEventListener('pointerdown', e => { if (isDesktop()) beginColDrag('L', e); });
$('#divR').addEventListener('pointerdown', e => { if (isDesktop()) beginColDrag('R', e); });
// 断点切换：桌面按状态恢复折叠，抽屉模式移除该类避免冲突
window.matchMedia('(max-width:900px)').addEventListener('change', () => {
  if (isDesktop()) syncSidebarCollapsed();
  else document.body.classList.remove('sb-collapsed');
});
syncSidebarCollapsed();

function toggleSidebar(force) {
  if (isDesktop()) {
    state.sidebarOpen = force != null ? force : !state.sidebarOpen;
    syncSidebarCollapsed();
    lsSet('e2_sidebarOpen', state.sidebarOpen);
    return;
  }
  // 移动端：抽屉逻辑
  const sb = $('#sidebar');
  const open = force != null ? force : !sb.classList.contains('open');
  sb.classList.toggle('open', open);
  $('#scrim').classList.toggle('show', open);
}

$('#fontDec').onclick = () => setFontSize(state.fontSize - 1);
$('#fontInc').onclick = () => setFontSize(state.fontSize + 1);
$('#ansToggle').onclick = () => setShowAns(!state.showAns);
$('#panelToggle').onclick = () => togglePanel();
$('#darkToggle').onclick = () => setDark(!state.darkMode);
$('#menuBtn').onclick = () => toggleSidebar();
$('#scrim').onclick = () => toggleSidebar(false);
$('#wpClear').onclick = async () => {
  if (!state.favorites.length) return;
  const ok = await askConfirm(`确定清空全部收藏吗？（共 ${state.favorites.length} 条，单词与句子都会被删除）`, '清空收藏');
  if (!ok) return;
  state.favorites = [];
  saveFavorites();
  renderFavorites();
  toast('收藏已清空');
};
// 收藏面板：单词 / 句子 Tab 切换
$$('.wp-tab').forEach(t => {
  t.onclick = () => {
    state.favTab = t.getAttribute('data-favtab') === 'sent' ? 'sent' : 'word';
    renderFavorites();
  };
});
// 收藏面板条目：仅删除（二次确认）；单词卡只在卷面点词
$('#wpBody').onclick = async ev => {
  const del = ev.target.closest('[data-del]');
  if (del) {
    ev.stopPropagation();
    const type = del.getAttribute('data-del');
    const key = del.getAttribute('data-key');
    const label = type === 'sent' ? '这条句子' : '「' + key + '」';
    const ok = await askConfirm(`确定删除${label}吗？`, '删除收藏');
    if (!ok) return;
    const i = findFavIndex(type, key);
    if (i >= 0) {
      state.favorites.splice(i, 1);
      saveFavorites();
      renderFavorites();
    }
    return;
  }
};

/* 倒计时控件：小面板以"倒计时"按钮为锚点展开/收起 */
$('#timerBtn').onclick = ev => {
  ev.stopPropagation();
  if ($('#timerPanel').classList.contains('show')) closeTimerPanel();
  else openTimerPanel();
};
$('#timerClose').onclick = () => closeTimerPanel();
$('#tStart').onclick = startTimer;
$('#tReset').onclick = resetTimer;
$('#tPause').onclick = () => (Timer.paused ? resumeTimer() : pauseTimer());
// 视口变化时重新定位（面板打开时）
window.addEventListener('resize', () => { if ($('#timerPanel').classList.contains('show')) positionTimerPanel(); });
window.addEventListener('scroll', () => { if ($('#timerPanel').classList.contains('show')) positionTimerPanel(); }, true);
// 点小面板与按钮之外的区域：收起小面板（结束弹窗显示期间、点击弹窗本身时不关）
document.addEventListener('mousedown', ev => {
  if (!$('#timerPanel').classList.contains('show')) return;
  if ($('#timerModal').classList.contains('show')) return;
  if (isInside($('#timerPanel'), ev.target) || isInside($('#timerBtn'), ev.target)) return;
  if (isInside($('#timerModal'), ev.target)) return;
  closeTimerPanel();
}, true);
$('#tmClose').onclick = () => {
  $('#timerModal').classList.remove('show');
  stopAlarm(); // 关闭弹窗瞬间停止提示音
};
[tH, tM, tS].forEach(i => i.addEventListener('input', () => {
  if (!Timer.running && Timer.remain === 0 && !Timer.overMode) tTime.textContent = fmtTime(readInputs());
}));

/* ---------------- 纯计时秒表（与倒计时完全独立，互不影响） ---------------- */
const SW = { elapsed: 0, running: false, startAt: 0, intervalId: null };
const swBtn = $('#swBtn'), swPanel = $('#swPanel'), swTime = $('#swTime');

function swRender() {
  const ms = SW.running ? SW.elapsed + (Date.now() - SW.startAt) : SW.elapsed;
  swTime.textContent = fmtTime(ms / 1000);
}
function positionSwPanel() {
  const b = swBtn.getBoundingClientRect();
  const pw = swPanel.offsetWidth, ph = swPanel.offsetHeight;
  const vw = document.documentElement.clientWidth, vh = window.innerHeight;
  const m = 8;
  let left = Math.max(m, Math.min(b.right - pw, vw - pw - m));
  let top = b.bottom + 8;
  let flipped = false;
  if (top + ph > vh - m) { top = b.top - ph - 8; flipped = true; }
  swPanel.style.left = left + 'px';
  swPanel.style.top = top + 'px';
  const caret = $('#swCaret');
  if (caret) {
    const cx = b.left + b.width / 2 - left;
    caret.style.left = Math.max(16, Math.min(cx - 6, pw - 28)) + 'px';
    caret.style.display = flipped ? 'none' : 'block';
  }
}
function openSwPanel() {
  $('#timerPanel').classList.remove('show'); // 打开秒表时收起倒计时
  swRender();
  swPanel.classList.add('show');
  positionSwPanel();
}
function closeSwPanel() { swPanel.classList.remove('show'); }
function swSetRunning(run) {
  if (run && !SW.running) { SW.startAt = Date.now(); SW.running = true; }
  else if (!run && SW.running) { SW.elapsed += Date.now() - SW.startAt; SW.running = false; }
  swBtn.classList.toggle('running', SW.running);
  $('#swToggle').textContent = SW.running ? '暂停' : '开始';
  if (SW.intervalId) clearInterval(SW.intervalId);
  if (SW.running) SW.intervalId = setInterval(swRender, 250);
  swRender();
}
swBtn.onclick = ev => {
  ev.stopPropagation();
  if (swPanel.classList.contains('show')) closeSwPanel();
  else openSwPanel();
};
$('#swClose').onclick = () => closeSwPanel();
$('#swToggle').onclick = () => swSetRunning(!SW.running);
$('#swReset').onclick = () => {
  // 重置即停止：清掉定时器与运行状态，读数归零
  if (SW.intervalId) { clearInterval(SW.intervalId); SW.intervalId = null; }
  SW.running = false;
  SW.elapsed = 0;
  SW.startAt = 0;
  swBtn.classList.remove('running');
  $('#swToggle').textContent = '开始';
  swRender();
};
window.addEventListener('resize', () => { if (swPanel.classList.contains('show')) positionSwPanel(); });
window.addEventListener('scroll', () => { if (swPanel.classList.contains('show')) positionSwPanel(); }, true);
// 点面板与按钮之外：收起秒表小面板（不影响运行状态）
document.addEventListener('mousedown', ev => {
  if (!swPanel.classList.contains('show')) return;
  if (isInside(swPanel, ev.target) || isInside(swBtn, ev.target)) return;
  closeSwPanel();
}, true);

/* 侧栏委托：点年份按钮展开/进入 */
$('#yearNav').addEventListener('click', ev => {
  const btn = ev.target.closest('.side-year');
  if (!btn) return;
  location.hash = '#/' + btn.getAttribute('data-year'); // 直接进入该年份，小题型在主界面切换
  if (window.innerWidth <= 900) toggleSidebar(false);
});

/* ---------------- 初始化 ---------------- */
function detectTV() {
  const ua = navigator.userAgent || '';
  const marked = /smart\s?tv|googletv|android\s?tv|AFT[A-Z]|web0s|webos|netcast|bravia|hbbttv|\bTV\b/i.test(ua);
  const androidTv = /android/i.test(ua) && !/mobile/i.test(ua) &&
    window.matchMedia('(hover:none) and (min-width:1000px)').matches;
  if (marked || androidTv) document.body.classList.add('tv');
}
function init() {
  detectTV();
  renderHome();
  renderSidebar();
  setFontSize(state.fontSize);
  setShowAns(state.showAns);
  setDark(state.darkMode);
  // 窄屏默认收起收藏面板，避免遮挡试卷（需要时点"我的收藏"滑出）
  if (window.innerWidth <= 900) state.panelOpen = false;
  togglePanel(state.panelOpen);
  renderFavorites();
  tTime.textContent = fmtTime(readInputs());
  applyTimerView();
  route();
}
document.addEventListener('DOMContentLoaded', init);
