name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      PLAYWRIGHT_CHANNEL: chromium
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Assemble single-file page
        run: python tools/assemble.py

      - name: Check index.html is in sync
        run: git diff --exit-code -- index.html

      - name: Install Playwright
        run: |
          python -m pip install --upgrade pip
          python -m pip install playwright==1.64.1
          python -m playwright install --with-deps chromium

      - name: Run end-to-end checks
        run: python tools/lexicon/verify.py
