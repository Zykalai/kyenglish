/* ============ 基础与色板 ============ */
:root{
  --desk:#e9e2d0;
  --paper:#fbf8f0;
  --paper-edge:#efe8d6;
  --ink:#2a2722;
  --ink-soft:#57524a;
  --ink-faint:#8a8374;
  --rule:#ddd4bf;
  --accent:#a3402d;
  --accent-soft:#f3e3dd;
  --pine:#466154;
  --pine-soft:#e3eae4;
  --gold:#9a7b34;
  --warn-bg:#f6e3d0; --warn-ink:#a85f1e;
  --key-bg:#efe6c8;
  --sidebar:#e5ddc8;
  --sidebar-edge:#d2c8ad;
  --side-hover:#ddd3b8;
  --tabs-bg:#f5efdf;
  --topbar-bg:#2f2c26;
  --topbar-line:#1f1d18;
  --topbar-btn:#5a5346;
  --topbar-btn-hover:#443f35;
  --bubble-bg:#fffdf8;
  --bubble-edge:#c9bda0;
  --bubble-line:#ece3cd;
  --bubble-act:#faf5e8;
  --chip-bg:#f3ede0;
  --chip-edge:#ddd2b4;
  --writing-bg:#fdfaf2;
  --chart-bg:#f1ebe0;
  --trans-line:#e7dfc9;
  --shadow:rgba(60,50,20,.22);
  --body-size:19px;
  --lh:1.95;
  /* 三栏宽度（桌面可拖动分界线调整，抽屉模式由媒体查询覆盖） */
  --sb-w:236px;   /* 左侧年份试卷栏 */
  --wp-w:360px;   /* 右侧收藏面板 */
  /* 全卷英文统一排版：字体、字号、字重、行高 */
  --en-font:Georgia,"Times New Roman",serif;
  --en-size:var(--body-size);
  --en-weight:400;
  --en-lh:1.95;
}
/* 黑夜模式（护眼深色） */
body.dark{
  --desk:#161511;
  --paper:#24221d;
  --paper-edge:#37342c;
  --ink:#e9e2d2;
  --ink-soft:#c4bdab;
  --ink-faint:#948c7a;
  --rule:#3d3a31;
  --accent:#e08a6c;
  --accent-soft:#3d2c26;
  --pine:#a4c2ad;
  --pine-soft:#2f3a33;
  --gold:#cba65e;
  --warn-bg:#3c2c1c; --warn-ink:#d59a5a;
  --key-bg:#38301e;
  --sidebar:#201e19;
  --sidebar-edge:#37342c;
  --side-hover:#33302a;
  --tabs-bg:#23211c;
  --topbar-bg:#171613;
  --topbar-line:#000000;
  --topbar-btn:#4a463c;
  --topbar-btn-hover:#33302a;
  --bubble-bg:#28261f;
  --bubble-edge:#454136;
  --bubble-line:#3d3a31;
  --bubble-act:#322f27;
  --chip-bg:#2f2c25;
  --chip-edge:#47433a;
  --writing-bg:#26241e;
  --chart-bg:#2e2b22;
  --trans-line:#3b372d;
  --shadow:rgba(0,0,0,.55);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--desk);
  color:var(--ink);
  font-family:"Microsoft YaHei","PingFang SC","Hiragino Sans GB","Segoe UI",sans-serif;
  font-size:15px;
  -webkit-font-smoothing:antialiased;
}
::selection{background:#e8c88f;}
body.dark ::selection{background:#7a5a3a;}
button{font-family:inherit;cursor:pointer;}
.mono{font-family:ui-monospace,Consolas,"Courier New",monospace;}

/* ============ 顶栏 ============ */
#topbar{
  position:fixed;top:0;left:0;right:0;height:52px;z-index:60;
  display:flex;align-items:center;gap:10px;padding:0 14px;
  background:var(--topbar-bg);color:#f3eee2;
  border-bottom:2px solid var(--topbar-line);
}
#topbar .brand{font-family:Georgia,"Times New Roman",serif;font-size:17px;letter-spacing:.5px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;}
#topbar .brand .brand-short{display:none;}
#topbar .tb-btn .lbl-s{display:none;}
#topbar .brand small{color:#b9b09c;font-size:11px;letter-spacing:2px;margin-left:8px;font-family:inherit;}
#topbar .spacer{flex:1;}
#menuBtn{display:inline-flex;} /* 桌面用于收起/唤出年份栏，移动端用于打开抽屉 */
.tb-btn{
  background:transparent;border:1px solid var(--topbar-btn);color:#e8e1cf;border-radius:5px;
  font-size:13px;padding:6px 10px;line-height:1;white-space:nowrap;
}
.tb-btn:hover{background:var(--topbar-btn-hover);}
.tb-btn.active{background:var(--accent);border-color:var(--accent);color:#fff;}
#fontControls{display:flex;align-items:center;gap:2px;}
#fontControls button{width:30px;height:30px;border-radius:5px;font-size:14px;}
#fontControls .fa{font-size:17px;}
#fontVal{font-size:11px;color:#b9b09c;width:34px;text-align:center;}

/* ============ 布局 ============ */
#layout{display:flex;padding-top:52px;min-height:100vh;}
#sidebar{
  width:var(--sb-w);flex:0 0 var(--sb-w);position:fixed;top:52px;bottom:0;left:0;
  overflow-y:auto;overscroll-behavior:contain;background:var(--sidebar);border-right:1px solid var(--sidebar-edge);
  padding:14px 0 40px;z-index:40;transition:transform .22s ease;
}
#main{flex:1;min-width:0;margin-left:var(--sb-w);margin-right:0;
  padding:26px 30px 80px;transition:margin-right .2s,margin-left .22s ease;}
#main.withPanel{margin-right:var(--wp-w);}
#wordPanel{
  width:var(--wp-w);flex:0 0 var(--wp-w);position:fixed;top:52px;bottom:0;right:0;
  background:var(--paper);border-left:1px solid var(--sidebar-edge);z-index:45;
  display:flex;flex-direction:column;
}
#wordPanel.hidden{display:none;}
#scrim{display:none;}

/* ---- 三栏分界线：透明热区，悬停/拖动显示一条高亮竖线 ---- */
.col-divider{position:fixed;top:52px;bottom:0;width:9px;z-index:46;
  cursor:ew-resize;touch-action:none;background:transparent;}
#divL{left:var(--sb-w);margin-left:-4px;}
#divR{right:var(--wp-w);margin-right:-4px;}
.col-divider::after{content:"";position:absolute;top:0;bottom:0;width:2px;
  background:transparent;transition:background .15s;}
#divL::after{left:3px;}
#divR::after{right:3px;}
.col-divider:hover::after,.col-divider.active::after{background:var(--accent);}
body.col-resizing,body.col-resizing *{user-select:none !important;cursor:ew-resize !important;}

/* ---- 桌面端收起左侧年份栏 ---- */
body.sb-collapsed #sidebar{transform:translateX(-100%);}
body.sb-collapsed #main{margin-left:0;}
body.sb-collapsed #divL{display:none;}
/* 收藏面板收起时，右侧分界线一并隐藏，不显示也不响应 */
body.wp-collapsed #divR{display:none;}

/* ============ 侧栏目录 ============ */
.side-h{padding:8px 18px 6px;font-size:12px;color:var(--ink-faint);letter-spacing:2px;}
.side-year{display:block;width:100%;text-align:left;border:0;background:transparent;
  padding:8px 18px;font-size:14px;color:var(--ink);display:flex;align-items:baseline;gap:8px;}
.side-year:hover{background:var(--side-hover);}
.side-year.active{background:var(--accent-soft);color:var(--accent);font-weight:700;}
.side-year .y{font-family:Georgia,serif;font-size:17px;}
.side-year .tag{font-size:10px;color:var(--accent);border:1px solid currentColor;border-radius:3px;padding:0 4px;}
.side-sections{padding:2px 0 8px 26px;display:none;}
.side-year.open + .side-sections{display:block;}
.side-sections a{display:block;padding:4px 14px 4px 8px;font-size:13px;color:var(--ink-soft);text-decoration:none;border-left:2px solid transparent;}
.side-sections a:hover{color:var(--accent);}
.side-sections a.active{color:var(--accent);border-left-color:var(--accent);font-weight:700;}
.side-note{margin:16px 18px 0;font-size:11px;color:var(--ink-faint);line-height:1.7;}

/* ============ 首页 ============ */
#homeView{max-width:940px;margin:0 auto;}
.home-hero{padding:30px 6px 18px;}
.home-hero h1{font-family:Georgia,"Times New Roman",serif;font-size:34px;margin:0 0 6px;letter-spacing:1px;}
.home-hero h1 .zh{font-family:inherit;letter-spacing:4px;color:var(--accent);}
.home-hero p{color:var(--ink-soft);line-height:1.9;margin:6px 0;font-size:14px;}
.usage{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin:18px 0 8px;}
.usage .card{background:var(--paper);border:1px solid var(--rule);border-radius:8px;padding:14px 16px;box-shadow:0 1px 3px rgba(90,80,50,.08);}
.usage .card h3{margin:0 0 6px;font-size:14px;color:var(--accent);}
.usage .card p{margin:0;font-size:13px;line-height:1.75;color:var(--ink-soft);}
.year-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:14px;}
.year-card{background:var(--paper);border:1px solid var(--rule);border-radius:8px;padding:14px 16px;text-align:left;
  text-decoration:none;color:var(--ink);box-shadow:0 1px 3px rgba(90,80,50,.08);position:relative;}
.year-card:hover{border-color:var(--accent);transform:translateY(-2px);box-shadow:0 5px 14px rgba(90,80,50,.15);}
.year-card .yc-year{font-family:Georgia,serif;font-size:26px;font-weight:700;}
.year-card .yc-sub{font-size:12px;color:var(--ink-faint);margin-top:3px;}
.year-card .yc-badges{margin-top:8px;display:flex;gap:6px;flex-wrap:wrap;}
.yc-badges b{font-weight:400;font-size:10px;border-radius:3px;padding:1px 5px;}
.badge-ok{background:var(--pine-soft);color:var(--pine);}
.badge-miss{background:var(--warn-bg);color:var(--warn-ink);}
.badge-key{background:var(--key-bg);color:var(--gold);}

/* ============ 试卷纸 ============ */
.sheet{
  background:var(--paper);border:1px solid var(--paper-edge);border-radius:4px;
  box-shadow:0 2px 6px rgba(80,70,40,.12), 0 12px 40px rgba(80,70,40,.10);
  max-width:860px;margin:0 auto;padding:44px 56px 60px;
}
.paper-head{text-align:center;border-bottom:2px solid var(--ink);padding-bottom:14px;margin-bottom:8px;}
.paper-head h2{font-family:Georgia,"Times New Roman",serif;font-size:25px;margin:0 0 4px;letter-spacing:1px;}
.paper-head .sub{font-size:13px;color:var(--ink-faint);letter-spacing:3px;}
.paper-head .meta{font-size:12px;color:var(--ink-faint);margin-top:6px;}
.sec-tabs{position:sticky;top:52px;z-index:20;background:var(--tabs-bg);border-bottom:1px solid var(--rule);
  display:flex;flex-wrap:wrap;gap:2px;margin:14px -56px 0;padding:8px 44px 8px;}
.sec-tabs a{font-size:12.5px;color:var(--ink-soft);text-decoration:none;padding:5px 9px;border-radius:5px;white-space:nowrap;}
.sec-tabs a:hover{background:var(--accent-soft);color:var(--accent);}
.sec-tabs a.active{background:var(--accent);color:#fff;}
.sec-miss{background:var(--warn-bg);color:var(--warn-ink);border-radius:5px;padding:20px 24px;text-align:center;margin:20px 0;font-size:14px;}

.sec{margin-top:34px;scroll-margin-top:110px;}
.sec-title{font-family:Georgia,"Times New Roman",serif;font-size:20px;margin:0 0 2px;}
.sec-title .zh{font-family:inherit;color:var(--accent);font-size:15px;margin-left:10px;letter-spacing:1px;}
.sec-instr{font-size:12.5px;color:var(--ink-faint);font-style:italic;margin:4px 0 14px;line-height:1.7;}
.passage{font-family:var(--en-font);font-size:var(--en-size);font-weight:var(--en-weight);line-height:var(--en-lh);
  color:var(--ink);text-align:left;}
.passage p{margin:0 0 13px;text-indent:2em;}
.passage .no-indent{text-indent:0;}

/* 完形空 */
.blank{display:inline-flex;align-items:center;justify-content:center;min-width:2.1em;height:1.35em;
  border-bottom:1.5px solid var(--ink);margin:0 2px;font-family:Georgia,serif;vertical-align:baseline;
  font-size:.72em;color:var(--ink-faint);position:relative;top:-2px;}
body.show-answers .blank{border-bottom-color:var(--accent);color:var(--accent);font-weight:700;}
body.show-answers .blank .bn{display:none;}
.blank .filled{display:none;font-style:italic;}
body.show-answers .blank .filled{display:inline;}

/* 题目（题干、选项统一英文字体/字号/行高） */
.q{margin:14px 0 16px;font-family:var(--en-font);font-size:var(--en-size);font-weight:var(--en-weight);
  line-height:var(--en-lh);}
.q .stem{font-family:inherit;}
.q .stem .qno{font-weight:700;margin-right:6px;}
.opts{list-style:none;margin:6px 0 0;padding:0;display:grid;grid-template-columns:repeat(2,1fr);gap:2px 22px;}
.opts.single{grid-template-columns:1fr;}
.cloze-block .opts{grid-template-columns:repeat(2,1fr);}
.opts li{font-family:inherit;line-height:inherit;}
.opts li .ol{display:inline-block;min-width:1.6em;color:var(--pine);font-weight:700;}
body.show-answers .opts li.correct{color:var(--accent);font-weight:700;}
body.show-answers .opts li.correct .ol{color:var(--accent);}
.ans-letter{display:none;color:var(--accent);font-weight:700;margin-left:6px;}
body.show-answers .ans-letter{display:inline;}

/* 新题型 */
.nt-box{display:grid;grid-template-columns:1fr;gap:14px;margin-top:14px;}
.nt-cols{display:grid;grid-template-columns:1fr 1fr;gap:26px;}
.nt-list{list-style:none;margin:0;padding:0;}
.nt-list li{font-family:var(--en-font);font-size:var(--en-size);font-weight:var(--en-weight);
  line-height:var(--en-lh);margin-bottom:10px;padding-left:4px;}
.nt-list .nno{font-weight:700;color:var(--pine);margin-right:6px;}
.nt-opts{list-style:none;margin:0;padding:0;}
.nt-opts li{font-family:var(--en-font);font-size:var(--en-size);font-weight:var(--en-weight);
  line-height:var(--en-lh);margin-bottom:10px;}
.nt-opts .ol{font-weight:700;color:var(--accent);margin-right:8px;}
.heading-slot{display:block;margin:16px 0 2px;font-family:var(--en-font);font-size:var(--en-size);
  font-weight:700;color:var(--accent);border-top:1px dashed var(--rule);padding-top:10px;}

/* 翻译/作文（英文统一排版） */
.trans-passage{font-family:var(--en-font);font-size:var(--en-size);font-weight:var(--en-weight);
  line-height:var(--en-lh);background:
   repeating-linear-gradient(transparent,transparent calc(var(--en-lh) * 1em - 1.5px),
    var(--trans-line) calc(var(--en-lh) * 1em - 1.5px),var(--trans-line) calc(var(--en-lh) * 1em));
  padding:4px 6px 10px;}
.writing-block{border:1px solid var(--rule);border-radius:6px;padding:14px 18px;margin-bottom:18px;background:var(--writing-bg);}
.writing-block h4{margin:0 0 8px;font-size:15px;color:var(--pine);}
.writing-block .prompt{font-family:var(--en-font);font-size:var(--en-size);font-weight:var(--en-weight);
  line-height:var(--en-lh);}
.chart-desc{margin-top:12px;background:var(--chart-bg);border-left:3px solid var(--gold);border-radius:0 5px 5px 0;
  padding:10px 14px;font-size:13.5px;line-height:1.8;color:var(--ink-soft);}
.chart-desc b{color:var(--gold);}

/* ============ 单词气泡 ============ */
#wordBubble{position:absolute;z-index:93;display:none;max-width:380px;min-width:240px;
  background:var(--bubble-bg);border:1px solid var(--bubble-edge);border-radius:10px;
  box-shadow:0 10px 34px var(--shadow);overflow:hidden;}
#wordBubble .wb-head{padding:11px 14px 7px;border-bottom:1px solid var(--bubble-line);}
#wordBubble .wb-word{font-family:Georgia,serif;font-size:21px;font-weight:700;color:var(--ink);}
#wordBubble .wb-word .lemma{font-size:12px;color:var(--ink-faint);font-weight:400;margin-left:8px;font-family:inherit;}
#wordBubble .wb-phon{color:var(--pine);font-size:13.5px;margin-top:2px;font-family:Georgia,serif;}
#wordBubble .wb-base{border-top:1px solid var(--bubble-line);padding:8px 14px;font-size:13.5px;line-height:1.8;}
#wordBubble .wb-base-title{color:var(--pine);font-size:12px;font-weight:700;margin-bottom:3px;}
#wordBubble .wb-base-body .pos-line{margin:2px 0;}
#wordBubble .wb-base-body .pos{color:var(--accent);font-weight:700;margin-right:4px;}
#wordBubble .wb-lemmas{display:flex;gap:5px;flex-wrap:wrap;padding:7px 14px 0;}
#wordBubble .wb-lemma{border:1px solid var(--bubble-edge);background:var(--bubble-act);color:var(--pine);
  border-radius:5px;padding:3px 8px;font-size:12px;cursor:pointer;}
#wordBubble .wb-lemma.active{background:var(--accent);border-color:var(--accent);color:#fff;}
#wordBubble .wb-lemma:hover{border-color:var(--accent);}
#wordBubble .wb-body{padding:9px 14px 12px;font-size:14px;line-height:1.85;max-height:280px;overflow-y:auto;overscroll-behavior:contain;}
#wordBubble .pos-line{margin:2px 0;}
#wordBubble .pos-line .pos{color:var(--accent);font-weight:700;margin-right:4px;}
#wordBubble .wb-loading{color:var(--ink-faint);font-size:13px;}
#wordBubble .wb-src{font-size:11px;color:var(--ink-faint);margin-top:4px;}
#wordBubble .wb-actions{display:flex;border-top:1px solid var(--bubble-line);}
#wordBubble .wb-actions button{flex:1;border:0;background:var(--bubble-act);padding:9px 0;font-size:13px;color:var(--pine);}
#wordBubble .wb-actions button + button{border-left:1px solid var(--bubble-line);}
#wordBubble .wb-actions button:hover{background:var(--pine-soft);}
#wordBubble .wb-actions button.faved{color:var(--accent);font-weight:700;}
/* 小喇叭图标按钮：不占满、居中，气泡与划句工具条共用 */
.icon-btn{display:inline-flex;align-items:center;justify-content:center;cursor:pointer;}
#wordBubble .wb-actions .icon-btn{flex:0 0 auto;padding:9px 14px;color:var(--pine);}
#wordBubble .wb-actions .icon-btn:hover{background:var(--pine-soft);}
#favBar .icon-btn{color:#f3eee2;}
#favBar .icon-btn:hover{background:var(--topbar-btn-hover);}

/* ============ 右侧：我收藏的单词 ============ */
.wp-head{padding:12px 16px 0;border-bottom:1px solid var(--sidebar-edge);}
.wp-head .wp-title{font-size:15px;font-weight:700;display:flex;align-items:center;gap:8px;}
.wp-head .wp-count{font-size:11px;color:var(--ink-faint);font-weight:400;}
.wp-tabs{display:flex;gap:6px;margin-top:10px;}
.wp-tab{flex:1;border:1px solid var(--bubble-edge);background:var(--bubble-act);color:var(--ink-soft);
  border-radius:7px 7px 0 0;border-bottom:0;padding:7px 0;font-size:13px;font-weight:700;}
.wp-tab .ft-n{font-size:11px;font-weight:400;color:var(--ink-faint);margin-left:2px;}
.wp-tab.active{background:var(--paper);color:var(--accent);border-color:var(--sidebar-edge);
  position:relative;box-shadow:0 2px 0 var(--paper);}
.wp-tab.active .ft-n{color:var(--accent);}
.wp-body{flex:1;overflow-y:auto;overscroll-behavior:contain;padding:12px 12px 30px;}

.wp-word{background:var(--paper);border:1px solid var(--rule);border-radius:8px;margin-bottom:10px;padding:9px 12px;

.wp-word .w-lemma{font-family:var(--en-font);font-size:var(--en-size);font-weight:var(--en-weight);

/* ============ 倒计时：紧贴按钮的紧凑下拉小面板 ============ */
#timerPanel{position:fixed;z-index:90;display:none;top:56px;right:10px;width:218px;max-width:calc(100vw - 16px);
  background:var(--bubble-bg);color:var(--ink);

  padding:10px 12px 12px;}
#timerPanel.show{display:block;}
#timerPanel .tp2-caret{position:absolute;top:-7px;width:12px;height:12px;background:var(--bubble-bg);
  border-left:1px solid var(--bubble-edge);border-top:1px solid var(--bubble-edge);
  transform:rotate(45deg);border-radius:2px;}
.tp2-title{font-size:13.5px;font-weight:700;margin:0 0 8px;display:flex;align-items:center;}
.tp2-x{margin-left:auto;border:0;background:transparent;color:var(--ink-faint);font-size:18px;line-height:1;padding:0 4px;}
.tp2-x:hover{color:var(--accent);}
.tp2-inputs{display:flex;gap:6px;}
.tp2-inputs label{flex:1;text-align:center;font-size:11px;color:var(--ink-faint);}
.tp2-inputs input{width:100%;font-size:18px;text-align:center;border:1px solid var(--rule);border-radius:7px;
  background:var(--paper);color:var(--ink);padding:6px 0;font-family:Georgia,serif;margin-top:3px;}
.tp2-inputs input:focus{outline:2px solid var(--accent);outline-offset:-1px;}
.tp2-time{display:none;flex-direction:column;align-items:center;gap:6px;
  font-family:Georgia,serif;font-size:24px;font-weight:700;margin:4px 0 10px;
  color:var(--accent);font-variant-numeric:tabular-nums;letter-spacing:0;white-space:nowrap;}
#timerTime{display:block;}
.tp2-tag{display:none;font-size:12px;font-weight:700;letter-spacing:1px;
  color:#fff;background:var(--accent);border-radius:4px;padding:2px 8px;}
.tp2-time.over #timerTime{color:#c0392b;}
body.dark .tp2-time.over #timerTime{color:#e07a5f;}
.tp2-btns{display:flex;gap:8px;}
.tp2-btns button{flex:1;border:1px solid var(--bubble-edge);background:var(--bubble-act);color:var(--ink);
  border-radius:7px;padding:7px 0;font-size:13px;}
.tp2-btns button:hover{border-color:var(--accent);}
.tp2-btns button.primary{background:var(--accent);border-color:var(--accent);color:#fff;}
.tp2-btns button:disabled{opacity:.45;cursor:default;}
.tp2-btns button[hidden]{display:none;}
.tp2-inputs[hidden]{display:none;}

/* ============ 纯计时秒表：复用倒计时面板视觉 ============ */
#swPanel{position:fixed;z-index:90;display:none;top:56px;right:10px;width:218px;max-width:calc(100vw - 16px);
  background:var(--bubble-bg);color:var(--ink);

  padding:10px 12px 12px;}
#swPanel.show{display:block;}
#swPanel .tp2-caret{position:absolute;top:-7px;width:12px;height:12px;background:var(--bubble-bg);
  border-left:1px solid var(--bubble-edge);border-top:1px solid var(--bubble-edge);

.sw-time{display:flex;justify-content:center;align-items:center;

/* 运行中：秒表 / 倒计时按钮仅变绿色，不改变尺寸 */
#swBtn.running,#timerBtn.running{background:var(--pine);border-color:var(--pine);color:#fff;}

/* 倒计时结束弹窗 */
#timerModal{position:fixed;inset:0;z-index:95;display:none;align-items:center;justify-content:center;
  background:rgba(20,18,12,.55);}
#timerModal.show{display:flex;}
.tm-card{background:var(--bubble-bg);color:var(--ink);border:1px solid var(--bubble-edge);

.tm-card button{border:0;background:var(--accent);color:#fff;border-radius:8px;padding:10px 30px;font-size:15px;}
.tm-card button:hover{opacity:.9;}

/* ============ 通用确认弹层 ============ */
#confirmModal{position:fixed;inset:0;z-index:96;display:none;align-items:center;justify-content:center;

#confirmModal.show{display:flex;}
.cm-card{background:var(--bubble-bg);color:var(--ink);border:1px solid var(--bubble-edge);

.cm-title{font-size:17px;font-weight:700;margin-bottom:10px;color:var(--ink);}

.cm-btns{display:flex;gap:10px;justify-content:flex-end;}
.cm-btns button{border:1px solid var(--bubble-edge);background:var(--bubble-act);color:var(--ink);

/* ============ 提示 toast ============ */
#toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:#2f2c26;color:#f3eee2;

/* ============ 响应式 ============ */
/* ============ 划选收藏条 ============ */

/* ============================================================
   豆包 AI 迷你聊天窗（本地自用，右下角；多轮/流式/收起）
   ============================================================ */
#aiChat{position:fixed;right:24px;bottom:24px;z-index:90;width:384px;max-width:calc(100vw - 24px);
  height:min(580px,calc(100vh - 48px));display:flex;flex-direction:column;
  --aic-size:14px; /* AI 窗内独立字号基准，与卷面 --body-size 互不影响 */
  background:var(--paper);border:1px solid var(--bubble-edge);border-radius:12px;
  box-shadow:0 18px 48px rgba(0,0,0,.28);overflow:hidden;}
#aiChat[hidden]{display:none;}
#aiFab{position:fixed;right:24px;bottom:24px;z-index:89;width:56px;height:56px;border-radius:50%;
  border:0;cursor:pointer;display:flex;align-items:center;justify-content:center;color:#fbf8f0;
  background:linear-gradient(135deg,var(--accent),var(--pine));
  box-shadow:0 10px 26px rgba(120,60,40,.38);
  transition:transform .18s ease,box-shadow .18s ease;animation:aic-float 3.2s ease-in-out infinite;}
#aiFab:hover{transform:translateY(-2px) scale(1.06);box-shadow:0 14px 32px rgba(120,60,40,.46);}
#aiFab:active{transform:scale(.95);}
#aiFab[hidden]{display:none;}
@keyframes aic-float{0%,100%{box-shadow:0 10px 26px rgba(120,60,40,.36)}
  50%{box-shadow:0 10px 32px rgba(120,60,40,.6)}}
@media (prefers-reduced-motion:reduce){#aiFab{animation:none;}}
@media (max-width:560px){#aiFab{right:16px;bottom:16px;width:52px;height:52px;}}
.aic-head{display:flex;align-items:center;justify-content:space-between;
  padding:10px 12px;background:var(--topbar-bg);color:#f3eee2;flex:0 0 auto;
  cursor:move;touch-action:none;user-select:none;}
.aic-head-btns{cursor:default;}
.aic-title{font-size:13.5px;font-weight:700;letter-spacing:.3px;}
/* 四条边拖拽手柄：透明热区，鼠标移到边缘显示对应方向光标 */
.aic-rz{position:absolute;z-index:3;background:transparent;}
.aic-rz-t{top:0;left:10px;right:10px;height:9px;cursor:ns-resize;touch-action:none;}
.aic-rz-b{bottom:0;left:10px;right:10px;height:9px;cursor:ns-resize;touch-action:none;}
.aic-rz-l{left:0;top:10px;bottom:10px;width:9px;cursor:ew-resize;touch-action:none;}
.aic-rz-r{right:0;top:10px;bottom:10px;width:9px;cursor:ew-resize;touch-action:none;}
/* 四个角：对角方向，同时改变宽高；热区略大方便抓取 */
.aic-rz-tl{top:0;left:0;width:14px;height:14px;cursor:nwse-resize;touch-action:none;z-index:4;}
.aic-rz-br{bottom:0;right:0;width:14px;height:14px;cursor:nwse-resize;touch-action:none;z-index:4;}
.aic-rz-tr{top:0;right:0;width:14px;height:14px;cursor:nesw-resize;touch-action:none;z-index:4;}
.aic-rz-bl{bottom:0;left:0;width:14px;height:14px;cursor:nesw-resize;touch-action:none;z-index:4;}
body.aic-dragging,body.aic-dragging *{user-select:none !important;}
body.aic-dragging-rz-t,body.aic-dragging-rz-t *{cursor:ns-resize !important;}
body.aic-dragging-rz-b,body.aic-dragging-rz-b *{cursor:ns-resize !important;}
body.aic-dragging-rz-l,body.aic-dragging-rz-l *{cursor:ew-resize !important;}
body.aic-dragging-rz-r,body.aic-dragging-rz-r *{cursor:ew-resize !important;}
body.aic-dragging-rz-tl,body.aic-dragging-rz-tl *{cursor:nwse-resize !important;}
body.aic-dragging-rz-br,body.aic-dragging-rz-br *{cursor:nwse-resize !important;}
body.aic-dragging-rz-tr,body.aic-dragging-rz-tr *{cursor:nesw-resize !important;}
body.aic-dragging-rz-bl,body.aic-dragging-rz-bl *{cursor:nesw-resize !important;}
body.aic-dragging-move,body.aic-dragging-move *{cursor:move !important;}
.aic-head-btns{display:flex;gap:4px;}
.aic-head-btns button{border:0;background:transparent;color:#cfc7b6;font-size:12px;
  padding:4px 8px;border-radius:5px;cursor:pointer;}
.aic-head-btns button:hover{background:var(--topbar-btn-hover);color:#fff;}
.aic-head-btns .aic-font-btn{font-weight:800;letter-spacing:-.3px;padding:4px 7px;}
.aic-messages{flex:1 1 auto;min-height:0;overflow-y:auto;overscroll-behavior:contain;
  padding:14px 14px 8px;display:flex;flex-direction:column;gap:12px;}
.aic-msg{max-width:88%;padding:9px 12px;border-radius:10px;font-size:var(--aic-size);line-height:1.75;word-break:break-word;}
.aic-msg.aic-user{align-self:flex-end;background:var(--accent);color:#fbf8f0;border-bottom-right-radius:3px;}
.aic-msg.aic-ai{align-self:flex-start;background:var(--bubble-act);color:var(--ink);
  border:1px solid var(--bubble-line);border-bottom-left-radius:3px;}
.aic-msg.aic-ai.streaming::after{content:"▍";margin-left:2px;color:var(--pine);
  animation:aic-blink 1s steps(2) infinite;}
@keyframes aic-blink{0%,100%{opacity:1}50%{opacity:0}}
.aic-msg.aic-error{align-self:center;background:var(--warn-bg);color:var(--warn-ink);
  font-size:12.5px;padding:7px 12px;max-width:94%;}
.aic-ai p{margin:0 0 8px;}
.aic-ai p:last-child{margin-bottom:0;}
.aic-ai ul,.aic-ai ol{margin:6px 0;padding-left:20px;}
.aic-ai li{margin:3px 0;}
.aic-ai strong{color:var(--accent);}
.aic-ai code{background:var(--key-bg);padding:1px 5px;border-radius:4px;font-size:0.89em;}
.aic-ai .aic-pre{margin:9px 0;padding:11px 13px;background:var(--key-bg);border:1px solid var(--bubble-line);
  border-radius:8px;overflow-x:auto;overscroll-behavior-x:contain;overscroll-behavior-y:auto;
  line-height:1.65;white-space:pre;tab-size:2;
  font-family:Consolas,"Cascadia Code","Courier New","Microsoft YaHei",monospace;font-size:0.92em;}
.aic-ai .aic-pre code{background:none;padding:0;border-radius:0;font-size:inherit;white-space:pre;}
.aic-pre[data-lang]::before{content:attr(data-lang);display:block;margin-bottom:6px;font-family:inherit;
  font-size:0.82em;letter-spacing:1px;color:var(--ink-faint);text-transform:uppercase;}
.aic-ai h1,.aic-ai h2,.aic-ai h3,.aic-ai h4,.aic-ai h5,.aic-ai h6{margin:12px 0 7px;line-height:1.45;color:var(--ink);}
.aic-ai h1{font-size:1.36em;}
.aic-ai h2{font-size:1.25em;}
.aic-ai h3{font-size:1.14em;}
.aic-ai h4,.aic-ai h5,.aic-ai h6{font-size:1.07em;}
.aic-ai em{font-style:italic;color:var(--ink-soft);}
.aic-ai blockquote{margin:7px 0;padding:6px 12px;border-left:3px solid var(--pine);
  background:var(--pine-soft);color:var(--ink-soft);border-radius:0 6px 6px 0;}
.aic-ai hr{border:0;border-top:1px solid var(--rule);margin:10px 0;}
.aic-ai table{border-collapse:collapse;width:100%;max-width:100%;margin:10px 0;font-size:0.93em;
  display:block;overflow-x:auto;overscroll-behavior-x:contain;overscroll-behavior-y:auto;}
.aic-ai th,.aic-ai td{border:1px solid var(--bubble-line);padding:6px 9px;text-align:left;line-height:1.5;white-space:nowrap;}
.aic-ai th{background:var(--key-bg);font-weight:700;}
.aic-ai tbody tr:nth-child(even){background:var(--bubble-act);}
.aic-input-row{flex:0 0 auto;display:flex;gap:8px;padding:10px 12px;border-top:1px solid var(--rule);
  background:var(--paper);align-items:flex-end;}
#aicInput{flex:1;resize:none;max-height:120px;border:1px solid var(--bubble-edge);border-radius:8px;
  padding:8px 10px;font-family:inherit;font-size:16px;line-height:1.5;color:var(--ink);background:var(--writing-bg);}
#aicInput:focus{outline:2px solid var(--pine);outline-offset:0;}
#aicSend{flex:0 0 auto;border:0;background:var(--accent);color:#fbf8f0;font-weight:700;
  border-radius:8px;padding:9px 16px;cursor:pointer;}
#aicSend:disabled{opacity:.55;cursor:not-allowed;}
.aic-tool{flex:0 0 auto;display:flex;align-items:center;justify-content:center;min-width:40px;height:38px;
  border:1px solid var(--bubble-edge);border-radius:8px;background:var(--writing-bg);color:var(--ink);

.aic-tool:hover{border-color:var(--pine);color:var(--pine);}

#selFavBtn.faved{color:var(--accent);border-color:var(--accent);font-weight:700;}
/* 打断按钮：默认隐藏，仅流式输出中显示 */
#aicStop{display:none;}
#aicStop.visible{display:flex;color:#fbf8f0;background:var(--ink);border-color:var(--ink);}
#aicStop.visible:hover{background:var(--accent);border-color:var(--accent);}

@media (max-width:560px){

.wp-sent{background:var(--paper);border:1px solid var(--rule);border-radius:8px;margin-bottom:10px;padding:9px 12px;}
.wp-sent .s-text{font-family:var(--en-font);font-size:var(--en-size);font-weight:var(--en-weight);

/* ============================================================
   响应式：手机 / 平板（横竖屏）/ 矮横屏 / 电视（10 英尺大屏）
   断点：1280 小桌面·平板横屏 ｜ 1024 平板竖屏 ｜ 900 抽屉模式
         600 手机单列 ｜ 480 矮横屏 ｜ 1500+hover:none 电视
   ============================================================ */

/* ---- 1280：小桌面 / 平板横屏，收藏面板改为覆盖式，不再挤占正文 ---- */
@media (max-width:1280px){
  #main.withPanel{margin-right:0;}
  #wordPanel{width:var(--wp-w);box-shadow:-8px 0 30px rgba(0,0,0,.22);}
}

/* ---- 1024：平板竖屏，侧栏收窄到 200 ---- */
@media (max-width:1024px){
  #sidebar{width:200px;flex-basis:200px;}
  #main{margin-left:200px;}
  #divL{display:none;} /* 此区间侧栏固定宽度，不提供拖拽 */
  .year-grid{grid-template-columns:repeat(3,1fr);}
}

/* ---- 900：进入抽屉模式（手机 + 小平板竖屏），侧栏与收藏面板都侧滑 ---- */
@media (max-width:900px){
  #menuBtn{display:inline-flex;}
  .col-divider{display:none;} /* 抽屉模式不显示拖拽分界线 */
  #sidebar{width:264px;flex-basis:264px;transform:translateX(-100%);
    transition:transform .22s ease;box-shadow:6px 0 24px rgba(0,0,0,.18);}
  #sidebar.open{transform:none;}
  #main{margin-left:0;padding:18px 14px 60px;}
  #scrim.show{display:block;position:fixed;inset:52px 0 0 0;
    background:rgba(40,35,20,.38);z-index:35;}
  #wordPanel{width:88vw;max-width:380px;transform:translateX(100%);
    transition:transform .22s ease;z-index:50;}
  #wordPanel:not(.hidden){transform:none;}
  .sheet{padding:30px 22px 44px;}
  .sec-tabs{margin-left:-22px;margin-right:-22px;padding:8px 16px;}
  .opts,.cloze-block .opts{grid-template-columns:repeat(2,1fr);}
}

/* ---- 600：手机，单列 + 顶栏紧凑且可横向滑动 ---- */
@media (max-width:600px){
  #wordBubble{max-width:calc(100vw - 20px);}
  #wordBubble .wb-word .lemma{display:block;margin-left:0;margin-top:2px;}
  #topbar{gap:6px;padding:0 8px;overflow-x:auto;overflow-y:hidden;
    overscroll-behavior-x:contain;scrollbar-width:none;}
  #topbar::-webkit-scrollbar{display:none;}
  #topbar > *{flex-shrink:0;}
  #topbar .spacer{display:none;}
  #topbar .brand{flex-shrink:0;min-width:0;max-width:36vw;overflow:hidden;text-overflow:ellipsis;}
  #fontControls{flex-shrink:0;}
  #topbar .brand small,#fontVal{display:none;}
  #topbar .brand .brand-long{display:none;}
  #topbar .brand .brand-short{display:inline;}
  #topbar .tb-btn .lbl-l{display:none;}
  #topbar .tb-btn .lbl-s{display:inline;}
  .tb-btn{font-size:12px;padding:6px 8px;}
  #topbar .brand{font-size:14px;}
  #main{padding:14px 10px 50px;}
  .sheet{padding:24px 16px 40px;}
  .sec-tabs{margin-left:-16px;margin-right:-16px;padding:8px 12px;}
  .usage,.year-grid{grid-template-columns:1fr;}
  .opts,.cloze-block .opts{grid-template-columns:1fr;}
  .nt-cols{grid-template-columns:1fr;}
}

/* ---- 480 矮横屏：手机 / 小平板横屏，压缩顶栏与上下留白 ---- */
@media (max-height:480px) and (orientation:landscape){
  #topbar{height:44px;}
  #layout{padding-top:44px;}
  #sidebar{top:44px;}
  #wordPanel{top:44px;}
  .sec-tabs{top:44px;}
  #main{padding-top:12px;padding-bottom:30px;}
}

/* ============================================================
   电视端（10 英尺 UI）：大屏 + 无悬停（遥控器 D-pad）
   远距观看 → 放大字号、限宽居中、强焦点框、加大可点区域
   ============================================================ */
@media (min-width:1500px) and (hover:none){
  #topbar{height:64px;}
  #layout{padding-top:64px;}
  #sidebar{top:64px;width:284px;flex-basis:284px;}
  #main{margin-left:284px;padding:40px 48px 110px;}
  #wordPanel{top:64px;}
  .sheet{max-width:1500px;padding:60px 72px 84px;}
  #homeView{max-width:1500px;}
  /* 英文正文在用户字号基础上整体放大，行高用无单位值会自动跟随 */
  .passage,.q,.nt-list li,.nt-opts li,.heading-slot,.trans-passage,
  .writing-block .prompt,.wp-word .w-lemma,.wp-sent .s-text{
    font-size:calc(var(--en-size) * 1.28);}
  /* 中文界面字号同步放大 */
  body{font-size:18px;}
  .tb-btn{font-size:16px;padding:9px 16px;min-height:44px;}
  .wp-word{padding:16px 20px;}
  .wp-foot button,#wordPanel button{font-size:16px;}
  /* 遥控器焦点：粗描边 + 偏移，当前落在哪一目了然 */
  :focus-visible{outline:3px solid var(--accent);outline-offset:3px;border-radius:6px;}
}

/* UA 命中电视但 hover 特性异常时的关键兜底（JS 会加 body.tv） */
@media (min-width:1500px){
  body.tv .passage,body.tv .q,body.tv .nt-list li,body.tv .nt-opts li,
  body.tv .heading-slot,body.tv .trans-passage,body.tv .writing-block .prompt,
  body.tv .wp-word .w-lemma,body.tv .wp-sent .s-text{font-size:calc(var(--en-size) * 1.28);}
  body.tv :focus-visible{outline:3px solid var(--accent);outline-offset:3px;}
}
</style>
</head>
<body>

<div id="topbar">
  <button class="tb-btn" id="menuBtn" aria-label="目录">目录</button>
  <div class="brand"><span class="brand-long">考研英语二 · 真题划词精读</span><span class="brand-short">英语二真题</span><small>ENGLISH II 2010–2026</small></div>
  <div class="spacer"></div>
  <div id="fontControls">
    <button class="tb-btn" id="fontDec" title="减小字号">A−</button>
    <span id="fontVal">19</span>
    <button class="tb-btn" id="fontInc" title="增大字号">A+</button>
  </div>
  <button class="tb-btn" id="ansToggle" title="完形填空显示完整文章/题目标注答案">显示答案</button>
  <button class="tb-btn active" id="panelToggle" title="我收藏的单词和句子"><span class="lbl-l">我的收藏</span><span class="lbl-s">收藏</span></button>
  <button class="tb-btn" id="timerBtn" title="打开倒计时"><span class="lbl-l">倒计时</span><span class="lbl-s">倒计</span></button>
  <button class="tb-btn" id="swBtn" title="打开纯计时秒表"><span class="lbl-l">秒表</span><span class="lbl-s">秒表</span></button>
  <button class="tb-btn" id="darkToggle" title="切换黑夜 / 白天模式"><span class="lbl-l">黑夜模式</span><span class="lbl-s">深色</span></button>
</div>

<div id="layout">
  <nav id="sidebar">
    <div class="side-h">全部套题</div>
    <div id="yearNav"></div>
    <div class="side-note">点击卷面任意单词查词（音标、词性、释义），可在气泡里「收藏」；按住鼠标划选句子或段落，点「收藏本句」整句保存。收藏内容都在右侧「我的收藏」，本机离线保存。</div>
  </nav>

  <main id="main">
    <div id="homeView"></div>
    <div id="paperView" style="display:none;"></div>
  </main>

  <aside id="wordPanel" class="hidden">
    <div class="wp-head">
      <div class="wp-title">我的收藏 <span class="wp-count" id="wpCount"></span></div>
      <div class="wp-tabs">
        <button type="button" class="wp-tab active" data-favtab="word">单词 <span class="ft-n" id="ftWn">0</span></button>
        <button type="button" class="wp-tab" data-favtab="sent">句子 <span class="ft-n" id="ftSn">0</span></button>
      </div>
    </div>
    <div class="wp-body" id="wpBody">
      <div class="wp-empty"></div>
    </div>
    <div class="wp-foot">
      <button id="wpClear">清空全部收藏</button>
    </div>
  </aside>
</div>
<div class="col-divider" id="divL" title="拖动调整左侧栏宽度"></div>
<div class="col-divider" id="divR" title="拖动调整收藏面板宽度"></div>
<div id="scrim"></div>

<div id="wordBubble"></div>
<div id="favBar"></div>
<div id="transPop">
  <div class="tp-pop-head"><span id="transSrc">译文</span><button id="transClose" aria-label="关闭">×</button></div>
  <div class="tp-pop-body" id="transBody"></div>
</div>

<!-- 豆包 AI 迷你聊天窗（本地自用版，右下角，支持多轮/流式/收起） -->
<div id="aiChat" hidden>
  <div class="aic-head">
    <span class="aic-title">问AI</span>
    <div class="aic-head-btns">
      <button id="aicFontDec" class="aic-font-btn" title="窗内文字变小" aria-label="缩小文字">A-</button>
      <button id="aicFontInc" class="aic-font-btn" title="窗内文字变大" aria-label="放大文字">A+</button>
      <button id="aicClear" title="清空上下文记忆">清空记忆</button>
      <button id="aicMin" title="召回到右下角" aria-label="收起">—</button>
    </div>
  </div>
  <div class="aic-rz aic-rz-t" data-rz="t" title="拖动调整高度"></div>
  <div class="aic-rz aic-rz-r" data-rz="r" title="拖动调整宽度"></div>
  <div class="aic-rz aic-rz-b" data-rz="b" title="拖动调整高度"></div>
  <div class="aic-rz aic-rz-l" data-rz="l" title="拖动调整宽度"></div>
  <div class="aic-rz aic-rz-tl" data-rz="tl" title="拖动同时调整宽高"></div>
  <div class="aic-rz aic-rz-tr" data-rz="tr" title="拖动同时调整宽高"></div>
  <div class="aic-rz aic-rz-bl" data-rz="bl" title="拖动同时调整宽高"></div>
  <div class="aic-rz aic-rz-br" data-rz="br" title="拖动同时调整宽高"></div>
  <div class="aic-messages" id="aicMessages"></div>
  <div class="aic-input-row">
    <textarea id="aicInput" rows="1" placeholder="继续追问… Enter 发送 / Shift+Enter 换行"></textarea>
    <button id="aicStop" class="aic-tool" aria-label="打断回答" title="打断当前回答">
      <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
        <rect x="6" y="6" width="12" height="12" rx="2" fill="currentColor"/>
      </svg>
    </button>
    <button id="aicSend" class="primary">发送</button>
  </div>
</div>

<!-- AI 常驻悬浮球：窗口召回后显示，点击唤出聊天窗 -->
<button id="aiFab" aria-label="打开问AI" title="问AI">
  <svg viewBox="0 0 24 24" width="26" height="26" aria-hidden="true">
    <path d="M12 3l1.7 4.8L18.5 9.5 13.7 11.2 12 16l-1.7-4.8L5.5 9.5l4.8-1.7z" fill="currentColor"/>
    <path d="M18.5 15l.8 2.2 2.2.8-2.2.8-.8 2.2-.8-2.2-2.2-.8 2.2-.8z" fill="currentColor"/>
  </svg>
</button>
<div id="toast"></div>

<!-- 倒计时：紧贴按钮的紧凑下拉小面板 -->
<div id="timerPanel">
  <span class="tp2-caret" id="tpCaret"></span>
  <div class="tp2-title">倒计时 <button id="timerClose" class="tp2-x" aria-label="关闭">×</button></div>
  <div class="tp2-inputs" id="tpInputs">
    <label>时<input id="tH" type="number" min="0" max="99" value="0" inputmode="numeric"></label>
    <label>分<input id="tM" type="number" min="0" max="59" value="20" inputmode="numeric"></label>
    <label>秒<input id="tS" type="number" min="0" max="59" value="0" inputmode="numeric"></label>
  </div>
  <div class="tp2-time" id="tpTime">
    <span class="tp2-tag" id="timerTag">已超时</span>
    <span id="timerTime">00:20:00</span>
  </div>
  <div class="tp2-btns">
    <button class="primary" id="tStart">开始</button>
    <button id="tPause" hidden>暂停</button>
    <button id="tReset" hidden>重置</button>
  </div>
</div>

<!-- 纯计时秒表：紧贴"秒表"按钮的紧凑下拉小面板 -->
<div id="swPanel">
  <span class="tp2-caret" id="swCaret"></span>
  <div class="tp2-title">秒表 <button id="swClose" class="tp2-x" aria-label="关闭">×</button></div>
  <div class="sw-time" id="swTime">00:00:00</div>
  <div class="tp2-btns">
    <button class="primary" id="swToggle">开始</button>
    <button id="swReset">重置</button>
  </div>
</div>

    <div class="cm-msg" id="cmMsg"></div>
    <div class="cm-btns">

const EXAM_DATA = {"papers":[{"year":2010,"sources":["https://yz.chsi.com.cn/kyzx/en/201001/20100113/61655286-1.html","https://yz.chsi.com.cn/kyzx/en/201001/20100113/61655286-2.html","https://kaoyan.eol.cn/fu_xi/yingyu/201209/t20120912_843013_1.shtml","https://kaoyan.eol.cn/fu_xi/yingyu/201209/t20120912_843013_5.shtml","https://m.koolearn.com/kaoyan/20181015/1023400.html","http://www.tup.tsinghua.edu.cn/upload/books/yz/080615-01.pdf"],"notes":"正文以清华社《考研英语(二)真题套卷》(社科赛斯,2018) 排版为底本,并用学信网/中国教育在线/新东方在线网页版交叉核对;网页版为同一份 OCR 扫描,存在大量错字(deteccted/wotldwide/victoryies/Shsring 等),已按正确拼写归一化。少量用词各源不一致处取网页多数源:Text1 用 vertiginously(书作 bewilderingly)、Text2 用 concurred(书作 nodded in agreement)、Text3 用 canny/relentless(书作 shrewd/ruthless);Text4 第二段年份用书版 1968(网页误作 1986),与第四段 1968 法案叙述一致。答案字母与完形填词据书末答案速查表(1-20 DCBAA BDCBA CDDAC BDCAB;21-45 DABCC ACBDB AADCB DACBD FTFTF)。","missing":[],"cloze":{"instruction":"Read the following text. Choose the best word(s) for each numbered blank and mark A, B, C or D on ANSWER SHEET 1. (10 points)","passage":"The outbreak of swine flu that was first detected in Mexico was declared a global epidemic on June 11, 2009. It is the first worldwide epidemic {{1}} by the World Health Organization in 41 years.\n\nThe heightened alert {{2}} an emergency meeting with flu experts in Geneva that assembled after a sharp rise in cases in Australia, and rising {{3}} in Britain, Japan, Chile and elsewhere.\n\nBut the epidemic is \"{{4}}\" in severity, according to Margaret Chan, the organization's director general, {{5}} the overwhelming majority of patients experiencing only mild symptoms and a full recovery, often in the {{6}} of any medical treatment.\n\nThe outbreak came to global {{7}} in late April 2009, when Mexican authorities noted an unusually large number of hospitalizations and deaths {{8}} healthy adults. As much of Mexico City shut down at the height of a panic, cases began to {{9}} in New York City, the southwestern United States and around the world.\n\nIn the United States, new cases seemed to fade {{10}} warmer weather arrived. But in late September 2009, officials reported there was {{11}} flu activity in almost every state and that virtually all the {{12}} tested are the new swine flu, also known as (A) H1N1, not seasonal flu. In the U.S., it has {{13}} more than one million people, and caused more than 600 deaths and more than 6,000 hospitalizations.\n\nFederal health officials {{14}} Tamiflu for children from the national stockpile and began {{15}} orders from the states for the new swine flu vaccine. The new vaccine, which is different from the annual flu vaccine, is {{16}} ahead of expectations. More than three million doses were to be made available in early October 2009, though most of those {{17}} doses were of the FluMist nasal spray type, which is not {{18}} for pregnant women, people over 50 or those with breathing difficulties, heart disease or several other {{19}}. But it was still possible to vaccinate people in other high-risk groups: health care workers, people {{20}} infants and healthy young people.","questions":[{"no":1,"A":"criticized","B":"appointed","C":"commented","D":"designated","answer":"D"},{"no":2,"A":"proceeded","B":"activated","C":"followed","D":"prompted","answer":"C"},{"no":3,"A":"digits","B":"numbers","C":"amounts","D":"sums","answer":"B"},{"no":4,"A":"moderate","B":"normal","C":"unusual","D":"extreme","answer":"A"},{"no":5,"A":"with","B":"in","C":"from","D":"by","answer":"A"},{"no":6,"A":"progress","B":"absence","C":"presence","D":"favor","answer":"B"},{"no":7,"A":"reality","B":"phenomenon","C":"concept","D":"notice","answer":"D"},{"no":8,"A":"over","B":"for","C":"among","D":"to","answer":"C"},{"no":9,"A":"stay up","B":"crop up","C":"fill up","D":"cover up","answer":"B"},{"no":10,"A":"as","B":"if","C":"unless","D":"until","answer":"A"},{"no":11,"A":"excessive","B":"enormous","C":"significant","D":"magnificent","answer":"C"},{"no":12,"A":"categories","B":"examples","C":"patterns","D":"samples","answer":"D"},{"no":13,"A":"imparted","B":"immersed","C":"injected","D":"infected","answer":"D"},{"no":14,"A":"released","B":"relayed","C":"relieved","D":"remained","answer":"A"},{"no":15,"A":"placing","B":"delivering","C":"taking","D":"giving","answer":"C"},{"no":16,"A":"feasible","B":"available","C":"reliable","D":"applicable","answer":"B"},{"no":17,"A":"prevalent","B":"principal","C":"innovative","D":"initial","answer":"D"},{"no":18,"A":"presented","B":"restricted","C":"recommended","D":"introduced","answer":"C"},{"no":19,"A":"problems","B":"issues","C":"agonies","D":"sufferings","answer":"A"},{"no":20,"A":"involved in","B":"caring for","C":"concerned with","D":"warding off","answer":"B"}],"fills":{"1":"designated","2":"followed","3":"numbers","4":"moderate","5":"with","6":"absence","7":"notice","8":"among","9":"crop up","10":"as","11":"significant","12":"samples","13":"infected","14":"released","15":"taking","16":"available","17":"initial","18":"recommended","19":"problems","20":"caring for"}},"reading":[{"name":"Text 1","instruction":"Read the following four texts. Answer the questions after each text by choosing A, B, C or D. Mark your answers on ANSWER SHEET 1. (40 points)","passage":"The longest bull run in a century of art-market history ended on a dramatic note with a sale of 56 works by Damien Hirst, \"Beautiful Inside My Head Forever\", at Sotheby's in London on September 15th 2008. All but two pieces sold, fetching more than £70m, a record for a sale by a single artist. It was a last victory. As the auctioneer called out bids, in New York one of the oldest banks on Wall Street, Lehman Brothers, filed for bankruptcy.\n\nThe world art market had already been losing momentum for a while after rising vertiginously since 2003. At its peak in 2007 it was worth some $65 billion, reckons Clare McAndrew, founder of Arts Economics, a research firm — double the figure five years earlier. Since then it may have come down to $50 billion. But the market generates interest far beyond its size because it brings together great wealth, enormous egos, greed, passion and controversy in a way matched by few other industries.\n\nIn the weeks and months that followed Mr. Hirst's sale, spending of any sort became deeply unfashionable, especially in New York, where the bail-out of the banks coincided with the loss of thousands of jobs and the financial demise of many art-buying investors. In the art world that meant collectors stayed away from galleries and salerooms. Sales of contemporary art fell by two-thirds, and in the most overheated sector — for Chinese contemporary art — they were down by nearly 90% in the year to November 2008. Within weeks the world's two biggest auction houses, Sotheby's and Christie's, had to pay out nearly $200m in guarantees to clients who had placed works for sale with them.\n\nThe current downturn in the art market is the worst since the Japanese stopped buying Impressionists at the end of 1989, a move that started the most serious contraction in the market since the Second World War. This time experts reckon that prices are about 40% down on their peak on average, though some have been far more volatile. But Edward Dolman, Christie's chief executive, says: \"I'm pretty confident we're at the bottom.\"\n\nWhat makes this slump different from the last, he says, is that there are still buyers in the market, whereas in the early 1990s, when interest rates were high, there was no demand even though many collectors wanted to sell. Christie's revenues in the first half of 2009 were still higher than in the first half of 2006. Almost everyone who was interviewed for this special report said that the biggest problem at the moment is not a lack of demand but a lack of good work to sell. The three Ds — death, debt and divorce — still deliver works of art to the market. But anyone who does not have to sell is keeping away, waiting for confidence to return.","questions":[{"no":21,"stem":"In the first paragraph, Damien Hirst's sale was referred to as \"a last victory\" because ________.","A":"the art market had witnessed a succession of victories","B":"the auctioneer finally got the two pieces at the highest bids","C":"Beautiful Inside My Head Forever won over all masterpieces","D":"it was successfully made just before the world financial crisis","answer":"D"},{"no":22,"stem":"By saying \"spending of any sort became deeply unfashionable\" (Line 1–2, Para.3), the author suggests that ________.","A":"collectors were no longer actively involved in art-market auctions","B":"people stopped every kind of spending and stayed away from galleries","C":"art collection as a fashion had lost its appeal to a great extent","D":"works of art in general had gone out of fashion so they were not worth buying","answer":"A"},{"no":23,"stem":"Which of the following statements is NOT true?","A":"Sales of contemporary art fell dramatically from 2007 to 2008.","B":"The art market surpassed many other industries in momentum.","C":"The market generally went downward in various ways.","D":"Some art dealers were awaiting better chances to come.","answer":"B"},{"no":24,"stem":"The three Ds mentioned in the last paragraph are ________.","A":"auction houses' favorites","B":"contemporary trends","C":"factors promoting artwork circulation","D":"styles representing Impressionists.","answer":"C"},{"no":25,"stem":"The most appropriate title for this text could be ________.","A":"Fluctuation of Art Prices","B":"Up-to-date Art Auctions","C":"Art Market in Decline","D":"Shifted Interest in Arts.","answer":"C"}]},{"name":"Text 2","instruction":"Read the following four texts. Answer the questions after each text by choosing A, B, C or D. Mark your answers on ANSWER SHEET 1. (40 points)","passage":"I was addressing a small gathering in a suburban Virginia living room — a women's group that had invited men to join them. Throughout the evening, one man had been particularly talkative, frequently offering ideas and anecdotes, while his wife sat silently beside him on the couch. Toward the end of the evening, I commented that women frequently complain that their husbands don't talk to them. This man quickly concurred. He gestured toward his wife and said, \"She's the talker in our family.\" The room burst into laughter; the man looked puzzled and hurt. \"It's true,\" he explained. \"When I come home from work I have nothing to say. If she didn't keep the conversation going, we'd spend the whole evening in silence.\"\n\nThis episode crystallizes the irony that although American men tend to talk more than women in public situations, they often talk less at home. And this pattern is wreaking havoc with marriage.\n\nThe pattern was observed by political scientist Andrew Hacker in the late 1970s. Sociologist Catherine Kohler Riessman reports in her new book Divorce Talk that most of the women she interviewed — but only a few of the men — gave lack of communication as the reason for their divorces. Given the current divorce rate of nearly 50 percent, that amounts to millions of cases in the United States every year — a virtual epidemic of failed conversation.\n\nIn my own research, complaints from women about their husbands most often focused not on tangible inequities such as having given up the chance for a career to accompany a husband to his, or doing far more than their share of daily life-support work like cleaning, cooking, social arrangements and errands. Instead, they focused on communication: \"He doesn't listen to me.\" \"He doesn't talk to me.\" I found, as Hacker observed years before, that most wives want their husbands to be, first and foremost, conversational partners, but few husbands share this expectation of their wives.\n\nIn short, the image that best represents the current crisis is the stereotypical cartoon scene of a man sitting at the breakfast table with a newspaper held up in front of his face, while a woman glares at the back of it, wanting to talk.","questions":[{"no":26,"stem":"What is most wives' main expectation of their husbands?","A":"Talking to them.","B":"Trusting them.","C":"Supporting their careers.","D":"Sharing housework.","answer":"A"},{"no":27,"stem":"Judging from the context, the phrase \"wreaking havoc\" (Line 2, Para.2) most probably means ________.","A":"generating motivation","B":"exerting influence","C":"causing damage","D":"creating pressure","answer":"C"},{"no":28,"stem":"All of the following are true EXCEPT ________.","A":"men tend to talk more in public than women","B":"nearly 50 percent of recent divorces are caused by failed conversation","C":"women attach much importance to communication between couples","D":"a female tends to be more talkative at home than her spouse","answer":"B"},{"no":29,"stem":"Which of the following can best summarize the main idea of this text?","A":"The moral decaying deserves more research by sociologists.","B":"Marriage break-up stems from sex inequalities.","C":"Husband and wife have different expectations from their marriage.","D":"Conversational patterns between man and wife are different.","answer":"D"},{"no":30,"stem":"In the following part immediately after this text, the author will most probably focus on ________.","A":"a vivid account of the new book Divorce Talk","B":"a detailed description of the stereotypical cartoon","C":"other possible reasons for a high divorce rate in the US","D":"a brief introduction to the political scientist Andrew Hacker","answer":"B"}]},{"name":"Text 3","instruction":"Read the following four texts. Answer the questions after each text by choosing A, B, C or D. Mark your answers on ANSWER SHEET 1. (40 points)","passage":"Over the past decade, many companies had perfected the art of creating automatic behaviors — habits — among consumers. These habits have helped companies earn billions of dollars when customers eat snacks, apply lotions and wipe counters almost without thinking, often in response to a carefully designed set of daily cues.\n\n\"There are fundamental public health problems, like hand washing with soap, that remain killers only because we can't figure out how to change people's habits,\" Dr. Curtis said. \"We wanted to learn from private industry how to create new behaviors that happen automatically.\"\n\nThe companies that Dr. Curtis turned to — Procter & Gamble, Colgate-Palmolive and Unilever — had invested hundreds of millions of dollars finding the subtle cues in consumers' lives that corporations could use to introduce new routines.\n\nIf you look hard enough, you'll find that many of the products we use every day — chewing gums, skin moisturizers, disinfecting wipes, air fresheners, water purifiers, health snacks, antiperspirants, colognes, teeth whiteners, fabric softeners, vitamins — are results of manufactured habits. A century ago, few people regularly brushed their teeth multiple times a day. Today, because of canny advertising and public health campaigns, many Americans habitually give their pearly whites a cavity-preventing scrub twice a day, often with Colgate, Crest or one of the other brands.\n\nA few decades ago, many people didn't drink water outside of a meal. Then beverage companies started bottling the production of far-off springs, and now office workers unthinkingly sip bottled water all day long. Chewing gum, once bought primarily by adolescent boys, is now featured in commercials as a breath freshener and teeth cleanser for use after a meal. Skin moisturizers are advertised as part of morning beauty rituals, slipped in between hair brushing and putting on makeup.\n\n\"Our products succeed when they become part of daily or weekly patterns,\" said Carol Berning, a consumer psychologist who recently retired from Procter & Gamble, the company that sold $76 billion of Tide, Crest and other products last year. \"Creating positive habits is a huge part of improving our consumers' lives, and it's essential to making new products commercially viable.\"\n\nThrough experiments and observation, social scientists like Dr. Berning have learned that there is power in tying certain behaviors to habitual cues through relentless advertising. As this new science of habit has emerged, controversies have erupted when the tactics have been used to sell questionable beauty creams or unhealthy foods.","questions":[{"no":31,"stem":"According to Dr. Curtis, habits like hand washing with soap ________.","A":"should be further cultivated","B":"should be changed gradually","C":"are deeply rooted in history","D":"are basically private concerns","answer":"A"},{"no":32,"stem":"Bottled water, chewing gum and skin moisturizers are mentioned in Paragraph 5 so as to ________.","A":"reveal their impact on people's habits","B":"show the urgent need of daily necessities","C":"indicate their effect on people's buying power","D":"manifest the significant role of good habits","answer":"A"},{"no":33,"stem":"Which of the following does NOT belong to products that help create people's habits?","A":"Tide","B":"Crest","C":"Colgate","D":"Unilever","answer":"D"},{"no":34,"stem":"From the text we know that some of consumers' habits are developed due to ________.","A":"perfected art of products","B":"automatic behavior creation","C":"commercial promotions","D":"scientific experiments","answer":"C"},{"no":35,"stem":"The author's attitude toward the influence of advertisement on people's habits is ________.","A":"indifferent","B":"negative","C":"positive","D":"biased","answer":"B"}]},{"name":"Text 4","instruction":"Read the following four texts. Answer the questions after each text by choosing A, B, C or D. Mark your answers on ANSWER SHEET 1. (40 points)","passage":"Many Americans regard the jury system as a concrete expression of crucial democratic values, including the principles that all citizens who meet minimal qualifications of age and literacy are equally competent to serve on juries; that jurors should be selected randomly from a representative cross section of the community; that no citizen should be denied the right to serve on a jury on account of race, religion, sex, or national origin; that defendants are entitled to trial by their peers; and that verdicts should represent the conscience of the community and not just the letter of the law. The jury is also said to be the best surviving example of direct rather than representative democracy. In a direct democracy, citizens take turns governing themselves, rather than electing representatives to govern for them.\n\nBut as recently as in 1968, jury selection procedures conflicted with these democratic ideals. In some states, for example, jury duty was limited to persons of supposedly superior intelligence, education, and moral character. Although the Supreme Court of the United States had prohibited intentional racial discrimination in jury selection as early as the 1880 case of Strauder v. West Virginia, the practice of selecting so-called elite or blue-ribbon juries provided a convenient way around this and other antidiscrimination laws.\n\nThe system also failed to regularly include women on juries until the mid-20th century. Although women first served on state juries in Utah in 1898, it was not until the 1940s that a majority of states made women eligible for jury duty. Even then several states automatically exempted women from jury duty unless they personally asked to have their names included on the jury list. This practice was justified by the claim that women were needed at home, and it kept juries unrepresentative of women through the 1960s.\n\nIn 1968, the Congress of the United States passed the Jury Selection and Service Act, ushering in a new era of democratic reforms for the jury. This law abolished special educational requirements for federal jurors and required them to be selected at random from a cross section of the entire community. In the landmark 1975 decision Taylor v. Louisiana, the Supreme Court extended the requirement that juries be representative of all parts of the community to the state level. The Taylor decision also declared sex discrimination in jury selection to be unconstitutional and ordered states to use the same procedures for selecting male and female jurors.","questions":[{"no":36,"stem":"From the principles of the US jury system, we learn that ________.","A":"both literate and illiterate people can serve on juries","B":"defendants are immune from trial by their peers","C":"no age limit should be imposed for jury service","D":"judgment should consider the opinion of the public","answer":"A"},{"no":37,"stem":"The practice of selecting so-called elite jurors prior to 1968 showed ________.","A":"the inadequacy of antidiscrimination laws","B":"the prevalent discrimination against certain races","C":"the conflicting ideals in jury selection procedures","D":"the arrogance common among the Supreme Court judges","answer":"C"},{"no":38,"stem":"Even in the 1960s, women were seldom on the jury list in some states because ________.","A":"they were automatically banned by state laws","B":"they fell far short of the required qualifications","C":"they were supposed to perform domestic duties","D":"they tended to evade public engagement","answer":"C"},{"no":39,"stem":"After the Jury Selection and Service Act was passed ________.","A":"sex discrimination in jury selection was unconstitutional and had to be abolished","B":"educational requirements became less rigid in the selection of federal jurors","C":"jurors at the state level ought to be representative of the entire community","D":"states ought to conform to the federal court in reforming the jury system","answer":"C"},{"no":40,"stem":"In discussing the US jury system, the text centers on ________.","A":"its nature and problems","B":"its characteristics and tradition","C":"its problems and their solutions","D":"its tradition and development","answer":"D"}]}],"newtype":{"form":"tf","instruction":"Read the following text and decide whether each of the statements is true or false. Choose T if the statement is true or F if the statement is not true. Mark your answers on ANSWER SHEET 1. (10 points)","passage":"Copying Birds May Save Aircraft Fuel\n\nBoth Boeing and Airbus have trumpeted the efficiency of their newest aircraft, the 787 and A350 respectively. Their clever designs and lightweight composites certainly make a difference. But a group of researchers at Stanford University, led by Ilan Kroo, has suggested that airlines could take a more naturalistic approach to cutting jet-fuel use, and it would not require them to buy new aircraft.\n\nThe answer, says Dr. Kroo, lies with birds. Since 1914, scientists have known that birds flying in formation — a V-shape — expend less energy. The air flowing over a bird's wings curls upwards behind the wingtips, a phenomenon known as upwash. Other birds flying in the upwash experience reduced drag, and spend less energy propelling themselves. Peter Lissaman, an aeronautics expert who was formerly at Caltech and the University of Southern California, has suggested that a formation of 25 birds might enjoy a range increase of 71%.\n\nWhen applied to aircraft, the principles are not substantially different. Dr. Kroo and his team modeled what would happen if three passenger jets departing from Los Angeles, San Francisco and Las Vegas were to assemble over Utah, assume an inverted V-formation, occasionally change places so all could have a turn in the most favorable positions, and proceed to London. They found that the aircraft consumed as much as 15% less fuel (coupled with a reduction in carbon-dioxide output). Nitrogen-oxide emissions during the cruising portions of the flight fell by around a quarter.\n\nThere are, of course, knots to be worked out. One consideration is safety, or at least the perception of it. Would passengers feel comfortable travelling in companion? Dr. Kroo points out that the aircraft could be separated by several nautical miles, and would not be in the intimate groupings favored by display teams like the Red Arrows. A passenger peering out of the window might not even see the other planes. Whether the separation distances involved would satisfy air-traffic-control regulations is another matter, although a working group at the International Civil Aviation Organization has included the possibility of formation flying in a blueprint for new operational guidelines.\n\nIt remains to be seen how weather conditions affect the air flows that make formation flight more efficient. In zones of increased turbulence, the planes' wakes will decay more quickly and the effect will diminish. Dr. Kroo says this is one of the areas his team will investigate further. It might also be hard for airlines to co-ordinate the departure times and destinations of passenger aircraft in a way that would allow them to gain from formation flight. Cargo aircraft, in contrast, might be easier to reschedule, as might routine military flight.\n\nAs it happens, America's armed forces are on the case already. Earlier this year the country's Defence Advanced Research Projects Agency announced plans to pay Boeing to investigate formation flight, though the programme has yet to begin. There are reports that some military aircraft flew in formation when they were low on fuel during the Second World War, but Dr. Lissaman says they are unsubstantiated. \"My father was an RAF pilot and my cousin the skipper of a Lancaster lost over Berlin,\" he adds. So he should know.","options":null,"items":[{"no":41,"stem":"Findings of the Stanford University researchers will promote the sales of new Boeing and Airbus aircraft.","answer":"F"},{"no":42,"stem":"The upwash experience may save propelling energy as well as reducing resistance.","answer":"T"},{"no":43,"stem":"Formation flight is more comfortable because passengers can not see the other planes.","answer":"T"},{"no":44,"stem":"The role that weather plays in formation flight has not yet been clearly defined.","answer":"T"},{"no":45,"stem":"It has been documented that during World War II, America's armed forces once tried formation flight to save fuel.","answer":"F"}],"questions":null},"translation":{"instruction":"In this section there is a text in English. Translate it into Chinese. Write your translation on ANSWER SHEET 2. (15 points)","passage":"\"Sustainability\" has become a popular word these days, but to Ted Ning, the concept will always have personal meaning. Having endured a painful period of unsustainability in his own life made it clear to him that sustainability-oriented values must be expressed through everyday action and choice.\n\nNing recalls spending a confusing year in the late 1990s selling insurance. He'd been through the dot-com boom and bust and, desperate for a job, signed on with a Boulder agency.\n\nIt didn't go well. \"It was a really bad move because that's not my passion,\" says Ning, whose dilemma about the job translated, predictably, into a lack of sales. \"I was miserable. I had so much anxiety that I would wake up in the middle of the night and stare at the ceiling. I had no money and needed the job.\" Everyone said, \"Just wait, you'll turn the corner, give it some time.\""},"writing":[{"part":"A","type":"应用文","instruction":"47. Directions:","prompt":"You have just come back from the U.S. as a member of a Sino-American cultural exchange program. Write a letter to your American colleague to\n1) express your thanks for his/her warm reception;\n2) welcome him/her to visit China in due course.\nYou should write about 100 words on ANSWER SHEET 2.\nDo not sign your own name at the end of the letter. Use \"Zhang Wei\" instead.\nDo not write your address. (10 points)"},{"part":"B","type":"图表作文","instruction":"48. Directions:","prompt":"In this section, you are asked to write an essay based on the following chart. In your writing, you should\n1) interpret the chart and\n2) give your comments.\nYou should write at least 150 words.\nWrite your essay on ANSWER SHEET 2. (15 points)","chart_desc":"柱状图，标题 Mobile-phone subscriptions (2000—2008)。横轴为年份 2000—2008，纵轴为手机用户订阅数 subscription number（单位：十亿 billion，刻度 0—4.5）。白色柱代表发展中国家 Developing countries，黑色柱代表发达国家 Developed countries。发达国家手机用户量增长平缓：2000 年约 0.5 十亿，此后缓慢上升，整体稳定在约 1 十亿。发展中国家用户量：2000 年约 0.5 十亿，2000—2004 年缓慢增长，2004 年后快速攀升，2005—2006 年增幅最大，到 2008 年达到约 4 十亿，反超并远超发达国家。"}]},{"year":2011,"sources":["http://m.cnedu.cn/upload/html/2017/10/26/wxd17bf70d567748aba37e096c9d9c1a95.pdf","https://kaoyan.eol.cn/shiti/yingyu/201605/t20160513_1397699_3.shtml","http://www.tup.tsinghua.edu.cn/upload/books/yz/080615-01.pdf"],"notes":"正文据正保考研教育网《2011年英语(二)试题及参考范文》PDF 并参照清华社答案速查表校对；该 PDF 为扫描版 OCR，存在错字(safcty/Intemmet/cammings/Gemmany 等)，已按正确拼写归一。答案字母据 PDF 答案速查与清华社答案表双源一致(1-20 ACBDD BACCB ADACD；21-40 BDCAB DBCAA CDCDB BCBAD；Part B EDCBG)。","missing":[],"cloze":{"instruction":"Read the following text. Choose the best word(s) for each numbered blank and mark A, B, C or D on ANSWER SHEET 1. (10 points)","passage":"The Internet affords anonymity to its users, a blessing to privacy and freedom of speech. But that very anonymity is also behind the explosion of cyber-crime that has {{1}} across the Web.\n\nCan privacy be preserved {{2}} bringing safety and security to a world that seems increasingly {{3}}?\n\nLast month, Howard Schmidt, the nation's cyber-czar, offered the federal government a {{4}} to make the Web a safer place — a \"voluntary trusted identity\" system that would be the high-tech {{5}} of a physical key, a fingerprint and a photo ID card, all rolled {{6}} one. The system might use a smart identity card, or a digital credential {{7}} to a specific computer, and would authenticate users at a range of online services.\n\nThe idea is to {{8}} a federation of private online identity systems. Users could {{9}} which system to join, and only registered users whose identities have been authenticated could navigate those systems. The approach contrasts with one that would require an Internet driver's license {{10}} by the government.\n\nGoogle and Microsoft are among companies that already have these \"single sign-on\" systems that make it possible for users to {{11}} just once but use many different services.\n\n{{12}}, the approach would create a \"walled garden\" in cyberspace, with safe \"neighborhoods\" and bright \"streetlights\" to establish a sense of a {{13}} community.\n\nMr. Schmidt described it as a \"voluntary ecosystem\" in which \"individuals and organizations can complete online transactions with {{14}}, trusting the identities of each other and the identities of the infrastructure {{15}} which the transaction runs.\"\n\nStill, the administration's plan has {{16}} privacy rights activists. Some applaud the approach; others are concerned. It seems clear that such a scheme is an initiative push toward what would {{17}} be a compulsory Internet \"driver's license\" mentality.\n\nThe plan has also been greeted with {{18}} by some computer security experts, who worry that the \"voluntary ecosystem\" envisioned by Mr. Schmidt would still leave much of the Internet {{19}}. They argue that all Internet users should be {{20}} to register and identify themselves, in the same way that drivers must be licensed to drive on public roads.","questions":[{"no":1,"A":"swept","B":"skipped","C":"walked","D":"ridden","answer":"A"},{"no":2,"A":"for","B":"within","C":"while","D":"though","answer":"C"},{"no":3,"A":"careless","B":"lawless","C":"pointless","D":"helpless","answer":"B"},{"no":4,"A":"reason","B":"reminder","C":"compromise","D":"proposal","answer":"D"},{"no":5,"A":"information","B":"interference","C":"entertainment","D":"equivalent","answer":"D"},{"no":6,"A":"by","B":"into","C":"from","D":"over","answer":"B"},{"no":7,"A":"linked","B":"directed","C":"chained","D":"compared","answer":"A"},{"no":8,"A":"dismiss","B":"discover","C":"create","D":"improve","answer":"C"},{"no":9,"A":"recall","B":"suggest","C":"select","D":"realize","answer":"C"},{"no":10,"A":"released","B":"issued","C":"distributed","D":"delivered","answer":"B"},{"no":11,"A":"carry on","B":"linger on","C":"set in","D":"log in","answer":"D"},{"no":12,"A":"In vain","B":"In effect","C":"In return","D":"In contrast","answer":"B"},{"no":13,"A":"trusted","B":"modernized","C":"thriving","D":"competing","answer":"A"},{"no":14,"A":"caution","B":"delight","C":"confidence","D":"patience","answer":"C"},{"no":15,"A":"on","B":"after","C":"beyond","D":"across","answer":"A"},{"no":16,"A":"divided","B":"disappointed","C":"protected","D":"united","answer":"A"},{"no":17,"A":"frequently","B":"incidentally","C":"occasionally","D":"eventually","answer":"D"},{"no":18,"A":"skepticism","B":"tolerance","C":"indifference","D":"enthusiasm","answer":"A"},{"no":19,"A":"manageable","B":"defendable","C":"vulnerable","D":"invisible","answer":"C"},{"no":20,"A":"invited","B":"appointed","C":"allowed","D":"forced","answer":"D"}],"fills":{"1":"swept","2":"while","3":"lawless","4":"proposal","5":"equivalent","6":"into","7":"linked","8":"create","9":"select","10":"issued","11":"log in","12":"In effect","13":"trusted","14":"confidence","15":"on","16":"divided","17":"eventually","18":"skepticism","19":"vulnerable","20":"forced"}},"reading":[{"name":"Text 1","instruction":"Read the following four texts. Answer the questions after each text by choosing A, B, C or D. Mark your answers on ANSWER SHEET 1. (40 points)","passage":"Ruth Simmons joined Goldman Sachs's board as an outside director in January 2000; a year later she became president of Brown University. For the rest of the decade she apparently managed both roles without attracting much criticism. But by the end of 2009 Ms. Simmons was under fire for having sat on Goldman's compensation committee; how could she have let those enormous bonus payouts pass unremarked? By February the next year Ms. Simmons had left the board. The position was just taking up too much time, she said.\n\nOutside directors are supposed to serve as helpful, yet less biased, advisers on a firm's board. Having made their wealth and their reputations elsewhere, they presumably have enough independence to disagree with the chief executive's proposals. If the sky, and the share price, is falling, outside directors should be able to give advice based on having weathered their own crises.\n\nThe researchers from Ohio University used a database that covered more than 10,000 firms and more than 64,000 different directors between 1989 and 2004. Then they simply checked which directors stayed from one proxy statement to the next. The most likely reason for departing a board was age, so the researchers concentrated on those \"surprise\" disappearances by directors under the age of 70. They found that after a surprise departure, the probability that the company will subsequently have to restate earnings increased by nearly 20%. The likelihood of being named in a federal class-action lawsuit also increases, and the stock is likely to perform worse. The effect tended to be larger for larger firms. Although a correlation between them leaving and subsequent bad performance at the firm is suggestive, it does not mean that such directors are always jumping off a sinking ship. Often they \"trade up,\" leaving riskier, smaller firms for larger and more stable firms.\n\nBut the researchers believe that outside directors have an easier time of avoiding a blow to their reputations if they leave a firm before bad news breaks, even if a review of history shows they were on the board at the time any wrongdoing occurred. Firms who want to keep their outside directors through tough times may have to create incentives. Otherwise outside directors will follow the example of Ms. Simmons, once again very popular on campus.","questions":[{"no":21,"stem":"According to Paragraph 1, Ms. Simmons was criticized for","A":"gaining excessive profits","B":"failing to fulfill her duty","C":"refusing to make compromises","D":"leaving the board in tough times","answer":"B"},{"no":22,"stem":"We learn from Paragraph 2 that outside directors are supposed to be","A":"generous investors","B":"unbiased executives","C":"share price forecasters","D":"independent advisers","answer":"D"},{"no":23,"stem":"According to the researchers from Ohio University, after an outside director's surprise departure, the firm is likely to","A":"become more stable","B":"report increased earnings","C":"do less well in the stock market","D":"perform worse in lawsuits","answer":"C"},{"no":24,"stem":"It can be inferred from the last paragraph that outside directors","A":"may stay for the attractive offers from the firm","B":"have often had records of wrongdoings in the firm","C":"are accustomed to stress-free work in the firm","D":"will decline incentives from the firm","answer":"A"},{"no":25,"stem":"The author's attitude toward the role of outside directors is","A":"permissive","B":"positive","C":"scornful","D":"critical","answer":"B"}]},{"name":"Text 2","instruction":"Read the following four texts. Answer the questions after each text by choosing A, B, C or D. Mark your answers on ANSWER SHEET 1. (40 points)","passage":"Whatever happened to the death of newspapers? A year ago the end seemed near. The recession threatened to remove the advertising and readers that had not already fled to the Internet. Newspapers like the San Francisco Chronicle were chronicling their own doom. America's Federal Trade Commission launched a round of talks about how to save newspapers. Should they become charitable corporations? Should the state subsidize them? It will hold another meeting soon. But the discussions now seem out of date.\n\nIn much of the world there is little sign of crisis. German and Brazilian papers have shrugged off the recession. Even American newspapers, which inhabit the most troubled corner of the global industry, have not only survived but often returned to profit. Not the 20% profit margins that were routine a few years ago, but profit all the same.\n\nIt has not been much fun. Many papers stayed afloat by pushing journalists overboard. The American Society of News Editors reckons that 13,500 newsroom jobs have gone since 2007. Readers are paying more for slimmer products. Some papers even had the nerve to refuse delivery to distant suburbs. Yet these desperate measures have proved the right ones and, sadly for many journalists, they can be pushed further.\n\nNewspapers are becoming more balanced businesses, with a healthier mix of revenues from readers and advertisers. American papers have long been highly unusual in their reliance on ads. Fully 87% of their revenues came from advertising in 2008, according to the Organization for Economic Cooperation & Development (OECD). In Japan the proportion is 35%. Not surprisingly, Japanese newspapers are much more stable.\n\nThe whirlwind that swept through newsrooms harmed everybody, but much of the damage has been concentrated in areas where newspapers are least distinctive. Car and film reviewers have gone. So have science and general business reporters. Foreign bureaus have been savagely cut off. Newspapers are less complete as a result. But completeness is no longer a virtue in the newspaper business.","questions":[{"no":26,"stem":"By saying \"Newspapers like ... their own doom\" (Para. 1), the author indicates that newspapers","A":"neglected the sign of crisis","B":"failed to get state subsidies","C":"were not charitable corporations","D":"were in a desperate situation","answer":"D"},{"no":27,"stem":"Some newspapers refused delivery to distant suburbs probably because","A":"readers threatened to pay less","B":"newspapers wanted to reduce costs","C":"journalists reported little about these areas","D":"subscribers complained about slimmer products","answer":"B"},{"no":28,"stem":"Compared with their American counterparts, Japanese newspapers are much more stable because they","A":"have more sources of revenue","B":"have more balanced newsrooms","C":"are
