res how much reward it takes to outweigh risk.\n\nTeenagers are particularly sensitive to social rewards—winning the game, impressing a new friend, getting that boy to notice you. Reward sensitivity, like prosocial behavior and risk-taking, seems to go up in adolescence and then down again as we age. Somehow, when you hit 30, the chance that something exciting and new will happen at that party just doesn’t seem to outweigh the effort of getting up off the couch.","questions":[{"no":36,"stem":"According to Paragraph 1, children growing into adolescence tend to","A":"develop opposite personality traits.","B":"see the world in an unreasonable way.","C":"have fond memories of their past.","D":"show affection for their parents.","answer":"A"},{"no":37,"stem":"It can be learned from Paragraph 2 that Crone’s study","A":"explores teenagers’ social responsibilities.","B":"examines teenagers’ emotional problems.","C":"provides a new insight into adolescence.","D":"highlights negative adolescent behavior.","answer":"C"},{"no":38,"stem":"What does Crone’s study find about prosocial behavior?","A":"It results from the wish to cooperate.","B":"It is cultivated through education.","C":"It is subject to family influence.","D":"It tends to peak in adolescence.","answer":"D"},{"no":39,"stem":"It can be learned from the last two paragraphs that teenagers","A":"overstress their influence on others.","B":"care a lot about social recognition.","C":"become anxious about their future.","D":"endeavor to live a joyful life.","answer":"B"},{"no":40,"stem":"What is the text mainly about?","A":"Why teenagers are self-contradictory.","B":"Why teenagers are risk-sensitive.","C":"How teenagers develop prosociality.","D":"How teenagers become independent.","answer":"A"}]}],"newtype":{"form":"matching","instruction":"Read the following text and match each of the numbered items in the left column to its corresponding information in the right column. There are two extra choices in the right column. Mark your answers on the ANSWER SHEET. (10 points)","passage":"Net-zero rules set to send cost of new homes and extensions soaring\n\nNew building regulations aimed at improving energy efficiency are set to increase the price of new homes, as well as those of extensions and loft conversions on existing ones. The rules, which came into effect on Wednesday in England, are part of government plans to reduce the UK’s carbon emissions to net zero by 2050. They set new standards for ventilation, energy efficiency and heating, and state that new residential buildings must have charging points for electric vehicles. The moves are the most significant change to building regulations in years, and industry experts say they will inevitably lead to higher prices at a time when a shortage of materials and high labour costs are already driving up bills.\n\nBrian Berry, chief executive of the Federation of Master Builders, says the measures will require new materials, testing methods, products and systems to be installed. “All this comes at an increased cost during a time when prices are already sky high. Inevitably, consumers will have to pay more,” he says.\n\nGareth Belsham, of surveyors Naismiths, says people who are upgrading, or extending their home, will be directly affected. “The biggest changes relate to heating and insulation,” he explains. “There are new rules concerning the amount of glazing used in extensions, and any new windows or doors must be highly insulated.” Windows and doors will have to adhere to higher standards, while there are new limits on the amount of glazing you can have to reduce unwanted heat from the sun.\n\nThomas Goodman, of MyJobQuote, says this will bring in new restrictions for extensions. “Glazing on windows, doors and roof lights must cover no more than 25% of the floor area to prevent heat loss,” he says.\n\nAs the rules came into effect last Wednesday, property developers were rushing to file plans just before the deadline. Any plans submitted before that date are considered to be under the previous rules, and can go ahead as long as work starts before 15 June next year. Builders which have costed projects, but have not filed the paperwork, may need to go back and submit fresh estimates, says Marcus Jefford of Build Aviator.\n\nMaterials prices are already up 25% in the last two years. How much overall prices will increase as a result of the rule changes is not clear. “Whilst admirable in their intentions, they will add to the cost of housebuilding at a time when many already feel that they are priced out of homeownership,” says Jonathan Rolande of the National Association of Property Buyers. “An average extension will probably see around £3,000 additional cost thanks to the new regs.”\n\nJohn Kelly, a construction lawyer at Freeths law firm, believes prices will eventually come down. But not in the immediate future. “As the marketplace adapts to the new requirements, and the technologies that support them, the scaling up of these technologies will eventually bring costs down, but in the short term, we will all have to pay the price of the necessary transition,” he says.\n\nHowever, the long-term effects of the changes will be more comfortable and energy-efficient homes, adds Andrew Mellor, of PRP architects. “Homeowners will probably recoup that cost over time in energy bill savings. It will obviously be very volatile at the moment, but they will have that benefit over time.”","options":{"A":"The rise of home prices is a temporary matter.","B":"Builders possibly need to submit new estimates of their projects.","C":"There will be specific limits on home extensions to prevent heat loss.","D":"The new rules will take home prices to an even higher level.","E":"Many people feel that home prices are already beyond what they can afford.","F":"The new rules will affect people whose home extensions include new windows or doors.","G":"The rule changes will benefit homeowners eventually."},"items":[{"no":41,"stem":"Brian Berry","answer":"D"},{"no":42,"stem":"Gareth Belsham","answer":"F"},{"no":43,"stem":"Marcus Jefford","answer":"B"},{"no":44,"stem":"John Kelly","answer":"A"},{"no":45,"stem":"Andrew Mellor","answer":"G"}],"questions":null},"translation":{"instruction":"Translate the following text into Chinese. Write your translation on the ANSWER SHEET. (15 points)","passage":"In the late 18th century, William Wordsworth became famous for his poems about nature. And he was one of the founders of a movement called Romanticism, which celebrated the wonders of the natural world.\n\nPoetry is powerful. Its energy and rhythm can capture a reader, transport them to another world and make them see things differently. Through carefully selected words and phrases, poems can be dramatic, funny, beautiful, moving and inspiring.\n\nNo one knows for sure when poetry began but it has been around for thousands of years, even before people could write. It was a way to tell stories and pass down history. It is closely related to song and even when written it is usually created to be performed out loud. Poems really come to life when they are recited. This can also help with understanding them too, because the rhythm and sounds of the words become clearer."},"writing":[{"part":"A","type":"应用文","instruction":"47. Directions:","prompt":"An art exhibition and a robot show are to be held on Sunday, and your friend David asks you which one he should go to. Write him an email to\n1) make a suggestion, and\n2) give your reason(s).\nWrite your answer in about 100 words on the ANSWER SHEET.\nDo not use your own name. Use “Li Ming” instead. (10 points)"},{"part":"B","type":"图表作文","instruction":"48. Directions:","prompt":"Write an essay based on the chart below. In your writing, you should\n1) interpret the chart, and\n2) give your comments.\nWrite your answer in about 150 words on the ANSWER SHEET. (15 points)","chart_desc":"折线图，标题为“2012—2021年我国居民健康素养水平”。纵轴为百分比，横轴为年份。数据：2012年8.80%、2013年9.48%、2014年9.79%、2015年10.25%、2016年11.58%、2017年14.18%、2018年17.06%、2019年19.17%、2020年23.15%、2021年25.40%。整体呈持续上升趋势，2016年后增速加快。图表下方注明健康素养(health literacy)的定义：个人获取和理解基本健康信息和服务并据此作出正确决策、维护和促进自身健康的能力；健康素养水平指具备基本健康素养者在15—69岁城乡居民总人群中所占比例。"}]},{"year":2024,"sources":["https://study.aseeker.bio/english/paper/2024_english2/","https://csgraduates.com/study_methods/english/english2/2024/"],"notes":"正文与答案经aseeker与csgraduates双源核对。分歧记录：(1)完形第7题D项，aseeker作looking out，csgraduates作looking down，按短语搭配取looking down；第15题A项aseeker作visit，csgraduates作list，取csgraduates；(2)Text2'rewinding and planting of native woodland'两源均误，按语境应为rewilding；(3)Text3末段'require to many algorithms'按csgraduates后文一致写法作too many；(4)Text1首句'Anger over AI's role in exacerbating inequality could endanger the technology's future.'及两段补充句（旧金山/圣何塞占四分之一、Muro建议区域创新中心）按aseeker保留；(5)Part B为matching多项对应，左栏人名41 Sue Rexford/42 Sara Harberson/43 Katie Kelley/44 Mayghin Levine/45 Erica Gwyn，右栏含Olivia Valdes(D)与Joseph Adegboyega-Edun(F)两个干扰项，答案41C42E43A44G45B。","missing":[],"cloze":{"instruction":"Read the following text. Choose the best word(s) for each numbered blank and mark A, B, C or D on the ANSWER SHEET. (10 points)","passage":"Your social life is defined as “the activities you do with other people, for pleasure, when you are not working.” It’s important to have a social life, but what’s right for one person won’t be right for another. Some of us feel energised by spending lots of time with others, {{1}} some of us may feel drained, even if it’s doing something we enjoy. This is why finding a {{2}} in your social life is key. Spending too much time on your own, not {{3}} others, can make you feel lonely and {{4}}. Loneliness is known to impact on your mental health and {{5}} a low mood. Anyone can feel lonely at any time. This might be especially true if, {{6}} you are working from home and you are {{7}} on the usual social conversations that happen in an office. Other life changes can {{8}} periods of loneliness too, such as retirement, changing jobs or becoming a parent. It’s important to recognise these feelings of loneliness. There are ways to {{9}} a social life, but it can feel overwhelming {{10}}. It’s a great idea to start by thinking about hobbies you enjoy. You can then find groups and activities related to those where you will be able to meet {{11}} people. There are groups aimed at new parents, at those who want to {{12}} a new sport for the first time, or networking events for those in the same profession to meet up and {{13}} ideas. On the other hand, it’s {{14}} possible to have too much of a social life. If you feel like you’re always doing something and there is never any {{15}} in your calendar for downtime, you could suffer social burnout or social {{16}}. We all have our own social limit and it’s important to recognise when you’re feeling like it’s all too much. Low mood, low energy, irritability and trouble sleeping could all be {{17}} of poor social health. Make sure you {{18}} some time in your diary when you’re {{19}} for socialising and use this time to relax, {{20}} and recover.","questions":[{"no":1,"A":"because","B":"unless","C":"whereas","D":"until","answer":"C"},{"no":2,"A":"contrast","B":"balance","C":"link","D":"gap","answer":"B"},{"no":3,"A":"seeing","B":"pleasing","C":"judging","D":"teaching","answer":"A"},{"no":4,"A":"misguided","B":"surprised","C":"spoiled","D":"disconnected","answer":"D"},{"no":5,"A":"contribute to","B":"rely on","C":"interfere with","D":"go against","answer":"A"},{"no":6,"A":"in fact","B":"of course","C":"for example","D":"on average","answer":"C"},{"no":7,"A":"cutting back","B":"missing out","C":"breaking in","D":"looking down","answer":"B"},{"no":8,"A":"shorten","B":"trigger","C":"follow","D":"interrupt","answer":"B"},{"no":9,"A":"assess","B":"interpret","C":"provide","D":"regain","answer":"D"},{"no":10,"A":"at first","B":"in turn","C":"on time","D":"by chance","answer":"A"},{"no":11,"A":"far-sighted","B":"strong-willed","C":"kind-hearted","D":"like-minded","answer":"D"},{"no":12,"A":"try","B":"promote","C":"watch","D":"describe","answer":"A"},{"no":13,"A":"test","B":"share","C":"accept","D":"revise","answer":"B"},{"no":14,"A":"already","B":"thus","C":"also","D":"only","answer":"C"},{"no":15,"A":"list","B":"order","C":"space","D":"boundary","answer":"C"},{"no":16,"A":"fatigue","B":"criticism","C":"injustice","D":"dilemma","answer":"A"},{"no":17,"A":"sources","B":"standards","C":"signs","D":"scores","answer":"C"},{"no":18,"A":"take over","B":"wipe off","C":"add up","D":"mark out","answer":"D"},{"no":19,"A":"ungrateful","B":"unavailable","C":"responsible","D":"regretful","answer":"B"},{"no":20,"A":"react","B":"repeat","C":"return","D":"rest","answer":"D"}],"fills":{"1":"whereas","2":"balance","3":"seeing","4":"disconnected","5":"contribute to","6":"for example","7":"missing out","8":"trigger","9":"regain","10":"at first","11":"like-minded","12":"try","13":"share","14":"also","15":"space","16":"fatigue","17":"signs","18":"mark out","19":"unavailable","20":"rest"}},"reading":[{"name":"Text 1","instruction":"Read the following four texts. Answer the questions below each text by choosing A, B, C or D. Mark your answers on the ANSWER SHEET. (40 points)","passage":"Anger over AI’s role in exacerbating inequality could endanger the technology’s future.\n\nIn her new book Cogs and Monsters: What Economics Is, and What It Should Be, Diane Coyle, an economist at Cambridge University, argues that the digital economy requires new ways of thinking about progress. “Whatever we mean by the economy growing, by things getting better, the gains will have to be more evenly shared than in the recent past,” she writes. “An economy of tech millionaires or billionaires and gig workers, with middle-income jobs undercut by automation, will not be politically sustainable.”\n\nImproving living standards and increasing prosperity for more people will require greater use of digital technologies to boost productivity in various sectors, including health care and construction, says Coyle. But people can’t be expected to embrace the changes if they’re not seeing the benefits—if they’re just seeing good jobs being destroyed.\n\nIn a recent interview with MIT Technology Review, Coyle said she fears that tech’s inequality problem could be a roadblock to deploying AI. “We’re talking about disruption,” she says. “These are transformative technologies that change the ways we spend our time every day, that change business models that succeed.” To make such “tremendous changes,” she adds, you need social buy-in.\n\nInstead, says Coyle, resentment is simmering among many as the benefits are perceived to go to elites in a handful of prosperous cities.\n\nAccording to the Brookings Institution, a short list of eight American cities that included San Francisco, San Jose, Boston, and Seattle had roughly 38% of all tech jobs by 2019. New AI technologies are particularly concentrated: Brookings’s Mark Muro and Sifan Liu estimate that just 15 cities account for two-thirds of the AI assets and capabilities in the United States (San Francisco and San Jose alone account for about one-quarter).\n\nThe dominance of a few cities in the invention and commercialization of AI means that geographical disparities in wealth will continue to soar. Not only will this foster political and social unrest, but it could, as Coyle suggests, hold back the sorts of AI technologies needed for regional economies to grow.\n\nPart of the solution could lie in somehow loosening the stranglehold that Big Tech has on defining the AI agenda. That will likely take increased federal funding for research independent of the tech giants. Muro and others have suggested hefty federal funding to help create US regional innovation centers, for example.\n\nA more immediate response is to broaden our digital imaginations to conceive of AI technologies that don’t simply replace jobs but expand opportunities in the sectors that different parts of the country care most about, like health care, education, and manufacturing.","questions":[{"no":21,"stem":"Coyle argues in her new book that economic growth should","A":"give rise to innovation","B":"diversify career choices","C":"benefit people equally","D":"be promoted forcefully","answer":"C"},{"no":22,"stem":"According to Paragraph 2, digital technology should be used to","A":"bring about instant prosperity","B":"reduce people’s workload","C":"raise overall work efficiency","D":"enhance cross-sector cooperation","answer":"C"},{"no":23,"stem":"What does Coyle fear about transformative technology?","A":"They may affect work-life balance.","B":"They may be impractical to deploy.","C":"They may incur huge expenditure.","D":"They may be unwelcome to the public.","answer":"D"},{"no":24,"stem":"Several American cities are mentioned to show","A":"the uneven distribution of AI technologies in the US","B":"the disappointing prospect of tech jobs in the US","C":"the fast progress of US regional economies","D":"the increasing significance of US AI assets","answer":"A"},{"no":25,"stem":"With regard to Coyle’s concern, the author suggests","A":"raising funds to start new AI projects","B":"encouraging collaboration in AI research","C":"guarding against the side effects of AI","D":"redefining the role of AI technologies","answer":"D"}]},{"name":"Text 2","instruction":"Read the following four texts. Answer the questions below each text by choosing A, B, C or D. Mark your answers on the ANSWER SHEET. (40 points)","passage":"The UK is facing a future construction crisis because of a failure to plant trees to produce wood, Confor has warned. The forestry and wood trade body has called for urgent action to reduce the country’s reliance on timber imports and provide a stable supply of wood for future generations. Currently only 20 percent of the UK’s wood requirement is home-grown while it remains the second-largest net importer of timber in the world.\n\nComing at a time of fresh incentives from the UK government for landowners to grow more trees, the trade body says these don’t go far enough and fail to promote the benefits of planting them to boost timber supplies. “Not only are we facing a carbon crisis now, but we will also be facing a future construction crisis because of failure to plant trees to produce wood,” said Stuart Goodall, chief executive of Confor. “For decades we have not taken responsibility for investing in our domestic wood supply, leaving us exposed to fluctuating prices and fighting for future supplies of wood as global demand rises and our own supplies fall.”\n\nThe UK has ideal conditions for growing wood to build low-carbon homes and is a global leader in certifying that its forests are sustainably managed, Confor says. While around three quarters of Scottish homes are built from Scottish timber, the use of home-grown wood in England is only around 25 percent.\n\nWhile productive tree planting can deliver real financial benefits to rural economies and contribute to the UK’s net-zero strategy, the focus of government support continues to be on food production and the rewilding and planting of native woodland solely for biodiversity. Goodall added: “While food production and biodiversity are clearly of critical importance, we need our land to also provide secure supplies of wood for construction, manufacturing and contribute to net zero.”\n\n“While the UK government has stated its ambition for more tree planting, there has been little action on the ground.” Confor is now calling for much greater impetus behind those aspirations to ensure we have enough wood to meet increasing demand.","questions":[{"no":26,"stem":"It can be learned from Paragraph 1 that the UK needs to","A":"increase its domestic wood supply","B":"reduce its demand for timber","C":"lower its wood production costs","D":"lift its control on timber imports","answer":"A"},{"no":27,"stem":"According to Confor, the UK government’s fresh incentives","A":"can hardly address construction crisis","B":"are believed to come at the wrong time","C":"seem to be misleading for landowners","D":"will be costly to put into practice","answer":"A"},{"no":28,"stem":"The UK’s exposure to fluctuating wood prices is a result of","A":"government’s inaction on timber imports","B":"inadequate investment in growing wood","C":"competition of timber traders at home","D":"wood producers’ motive to maximise profits","answer":"B"},{"no":29,"stem":"Which of the following causes the shortage of wood supply in the UK?","A":"excessive timber consumption in construction","B":"unfavorable conditions for growing trees","C":"outdated technology for wood production","D":"farmers’ unwillingness to plant trees","answer":"D"},{"no":30,"stem":"What does Goodall think the UK government should do?","A":"Subsidise the building of low-carbon homes.","B":"Pay attention to the rural economy.","C":"Provide more support for tree planting.","D":"Give priority to pursuing the net-zero strategy.","answer":"C"}]},{"name":"Text 3","instruction":"Read the following four texts. Answer the questions below each text by choosing A, B, C or D. Mark your answers on the ANSWER SHEET. (40 points)","passage":"One big challenge in keeping unsafe aging drivers off the road is convincing them that it is time to turn over the key. It is a complete life-changer when someone stops—or is forced to stop—driving, said former risk manager Anne M. Menke.\n\nThe American Medical Association advises physicians that in situations where clear evidence of substantial driving impairment implies a strong threat to patient and public safety, and where the physician’s advice to discontinue driving privileges is ignored, it is desirable and ethical to notify the Department of Motor Vehicles, Menke wrote. “Some states require physicians to report, others allow but do not mandate reports, while a few consider a report breach of confidentiality. There could be liability and penalties if a physician does not act in accordance with state laws on reporting and confidentiality,” she counseled.\n\nPart of the problem in keeping older drivers safe is that the difficulties are addressed piecemeal by different professions with different focuses, including gerontologists, highway administration officials, automotive engineers and others, said gerontologist Elizabeth Dugan. “There’s not a National Institute of Older Driver Studies,” she said. “We need better evidence on what makes drivers unsafe” and what can help, said Dugan.\n\nOne thing that does seem to work is requiring drivers to report in person for license renewal. Mandatory in-person renewal was associated with a 31 percent reduction in fatal crashes involving drivers 85 or older, according to one study. Passing vision tests also produced a similar decline in fatal crashes for those drivers, although there appeared to be no benefit from combining the two.\n\nMany old drivers don’t see eye doctors or can’t afford to. Primary care providers have their hands full and may not be able to follow through with patients who have trouble driving because they can’t turn their heads or remember where they are going—or have gotten shorter and haven’t changed their seat settings sufficiently to reach car pedals easily.\n\nAs long as there are other cars on the roads, self-driving cars won’t solve the problems of crashes, said Dugan. Avoiding dangers posed by all those human drivers would require too many algorithms, she said. But we need to do more to improve safety, said Dugan. “If we’re going to have 100-year lives, we need cars that a 90-year-old can drive comfortably.”","questions":[{"no":31,"stem":"According to Paragraph 1, keeping unsafe aging drivers off the road","A":"is a new safety measure","B":"has become a disputed issue","C":"can be a tough task to complete","D":"will be beneficial to their health","answer":"C"},{"no":32,"stem":"The American Medical Association’s advice","A":"has won support from drivers","B":"is generally considered unrealistic","C":"is widely dismissed as unnecessary","D":"has met with different responses","answer":"D"},{"no":33,"stem":"According to Dugan, efforts to keep older drivers safe","A":"have brought about big changes","B":"need to be well coordinated","C":"have gained public concern","D":"call for relevant legal support","answer":"B"},{"no":34,"stem":"Some older drivers have trouble driving because they tend to","A":"stick with bad driving habits","B":"have a weakened memory","C":"suffer from chronic pains","D":"neglect car maintenance","answer":"B"},{"no":35,"stem":"Dugan thinks that the solution to the problems of crashes may lie in","A":"upgrading self-driving vehicles","B":"developing senior-friendly cars","C":"renovating transport facilities","D":"adjusting the age limit for drivers","answer":"B"}]},{"name":"Text 4","instruction":"Read the following four texts. Answer the questions below each text by choosing A, B, C or D. Mark your answers on the ANSWER SHEET. (40 points)","passage":"If you look at the apps on your phone, chances are you have at least one related to your health—and probably several. Whether it is a mental health app, a fitness tracker, a connected health device or something else, many of us are taking advantage of this technology to keep better track of our health in some shape or form. Recent research from the Organization for the Review of Care and Health Applications found that 350,000 health apps were available on the market, 90,000 of which launched in 2020 alone.\n\nWhile these apps have a great deal to offer, it is not always clear how the personal information we input is collected, safeguarded and shared online. Existing health privacy law, such as the Health Insurance Portability and Accountability Act, is primarily focused on the way hospitals, doctors’ offices, clinics and insurance companies store health records online. The health information these apps and health data tracking wearables are collecting typically does not receive the same legal protections.\n\nWithout additional protections in place, companies may share (and potentially monetize) personal health information in a way consumers may not have authorized or anticipated. In 2021, Flo Health faced a Federal Trade Commission (FTC) investigation. The FTC alleged in a complaint that “despite express privacy claims, the company took control of users’ sensitive fertility data and shared it with third parties.” Flo Health and the FTC settled the matter with a Consent Order requiring the company to get app users’ express affirmative consent before sharing their health information as well as to instruct the third parties to delete the data they had obtained.\n\nSection 5 of the FTC Act empowers the FTC to initiate enforcement action against unfair or deceptive acts, meaning the FTC can only act after the fact if a company’s privacy practices are misleading or cause unjustified consumer harm. While the FTC is doing what it can to ensure apps are keeping their promises to consumers around the handling of their sensitive health information, the rate at which these health apps are hitting the market demonstrates just how immense of a challenge this is.\n\nAs to the prospects for federal legislation, commentators suggest that comprehensive federal privacy legislation seems unlikely in the short term. States have begun implementing their own solutions to shore up protections for consumer-generated health data. California has been at the forefront of state privacy efforts with the California Consumer Privacy Act of 2018. Virginia, Colorado and Utah have also recently passed state consumer data privacy legislation.","questions":[{"no":36,"stem":"The research findings are cited in Paragraph 1 to show","A":"the prevalence of health apps","B":"the public concern over health","C":"the popularity of smartphones","D":"the advancement of technology","answer":"A"},{"no":37,"stem":"What does the author imply about existing health privacy law?","A":"Its coverage needs to be extended.","B":"Its enforcement needs strengthening.","C":"It has discouraged medical misconduct.","D":"It has disappointed insurance companies.","answer":"A"},{"no":38,"stem":"Before sharing its users’ health information, Flo Health is required to","A":"seek the approval of the FTC","B":"find qualified third parties","C":"remove irrelevant personal data","D":"obtain their explicit permission","answer":"D"},{"no":39,"stem":"What challenges is the FTC currently faced with?","A":"The complexity of health information.","B":"The rapid increase in new health apps.","C":"The subtle deceptiveness of health apps.","D":"The difficulty in assessing consumer harm.","answer":"B"},{"no":40,"stem":"It can be learned from the last paragraph that health data protection","A":"has been embraced by health app developers","B":"has been a focus of federal policy-making","C":"has encountered opposition in California","D":"has gained legislative support in some states","answer":"D"}]}],"newtype":{"form":"matching","instruction":"Read the following text and match each of the numbered items in the left column to its corresponding information in the right column. There are two extra choices in the right column. Mark your answers on the ANSWER SHEET. (10 points)","passage":"High school students eager to stand out in the college application process often participate in a litany of extracurricular activities hoping to bolster their chances of admission to a selective undergraduate institution. However, college admissions experts say that the quality of a college hopeful’s extracurricular activities matter more than the number of activities he or she participates in.\n\nSue Rexford, the director of college guidance at the Charles E. Smith Jewish Day School, says it is not necessary for a student filling out the Common Application to list 10 activities in the application. “No college will expect that a student has a huge laundry list of extracurriculars that they have been passionately involved in each for an extended period of time,” Rexford wrote in an email.\n\nExperts say it is tougher to distinguish oneself in a school-affiliated extracurricular activity that is common among high school students than it is to stand out while doing an uncommon activity. “The competition to stand out and make an impact is going to be much stiffer, and so if they’re going to do a popular activity, I’d say, be the best at it,” says Sara Harberson, a college admissions consultant.\n\nHigh school students who have an impressive personal project they are working on independently often impress colleges, experts say. “For example, a student with an interest in entrepreneurship could demonstrate skills and potential by starting a profitable small business,” Olivia Valdes, the founder of Zen Admissions consulting firm, wrote in an email. Joseph Adegboyega-Edun, a Maryland high school guidance counselor, says unconventional extracurricular activities can help students impress college admissions offices, assuming they demonstrate serious commitment. “Again, since one of the big questions high school seniors must consider is ‘What makes you unique?’ having an uncommon extracurricular activity, rather than a conventional one, is an advantage,” he wrote in an email.\n\nExperts say demonstrating talent in at least one extracurricular activity can help in the college admissions process, especially at top-tier undergraduate institutions. “Distinguishing yourself in one focused type of extracurricular activity can be a positive in the admissions process, especially for highly selective institutions, where having top grades and test scores is not enough,” Katie Kelley, admissions counselor at Ivy Wise admissions consultancy, wrote in an email. “Students need to have that quality or hook that will appeal to admissions officers and allow them to visualize how the student might come and enrich their campus community.”\n\nExtracurricular activities related to the college major declared on a college application are beneficial, experts suggest. “If you already know your major, having an extracurricular that fits into that major can be a big plus,” says Mayghin Levine, the manager of educational opportunities with The Cabbage Patch Settlement House, a Louisville, Kentucky, nonprofit community center.\n\nHigh school students who have had a strong positive influence on their community through an extracurricular activity may impress a college and win a scholarship, says Erica Gwyn, a former math and science magnet program assistant at a public high school who is now executive director of the Kaleidoscope Careers Academy in Atlanta, a nonprofit organization.","options":{"A":"Students who stand out in a specific extracurricular activity will be favored by top-tier institutions.","B":"Students whose extracurricular activity has benefited their community are likely to win a scholarship.","C":"Undertaking too many extracurricular activities will hardly be seen as a plus by colleges.","D":"A student who exhibits abilities in doing business can impress colleges.","E":"High school students participating in a popular activity should excel in it.","F":"Engaging in uncommon activities can demonstrate students’ determination and dedication.","G":"It is advisable for students to choose an extracurricular activity that is related to their future study at college."},"items":[{"no":41,"stem":"Sue Rexford","answer":"C"},{"no":42,"stem":"Sara Harberson","answer":"E"},{"no":43,"stem":"Katie Kelley","answer":"A"},{"no":44,"stem":"Mayghin Levine","answer":"G"},{"no":45,"stem":"Erica Gwyn","answer":"B"}],"questions":null},"translation":{"instruction":"Translate the following text into Chinese. Write your translation on the ANSWER SHEET. (15 points)","passage":"With the smell of coffee and fresh bread floating in the air, stalls bursting with colorful vegetables and tempting cheeses, and the buzz of friendly chats, farmers’ markets are a feast for the senses. They also provide an opportunity to talk to the people responsible for growing or raising your food, support your local economy and pick up fresh seasonal produce—all at the same time.\n\nFarmers’ markets are usually weekly or monthly events, most often with outdoor stalls, which allow farmers or producers to sell their food directly to customers. The size or regularity of markets can vary from season to season, depending on the area’s agricultural calendar, and you’re likely to find different produce on sale at different times of the year.\n\nBy cutting out the middlemen, the farmers secure more profit for their produce. Shoppers also benefit from seeing exactly where—and to who—their money is going."},"writing":[{"part":"A","type":"应用文","instruction":"47. Directions:","prompt":"Suppose you and Jack are going to do a survey on the protection of old houses in an ancient town. Write him an email to\n1) put forward your plan, and\n2) ask for his opinion.\nWrite your answer in about 100 words on the ANSWER SHEET.\nDo not use your own name in your email; use “Li Ming” instead. (10 points)"},{"part":"B","type":"图表作文","instruction":"48. Directions:","prompt":"Write an essay based on the chart below. In your writing, you should\n1) describe and interpret the chart, and\n2) give your comments.\nWrite your answer in about 150 words on the ANSWER SHEET. (15 points)","chart_desc":"横向柱状图，标题为“某高校劳动实践课学生主要收获调查”，共四个分项：学习了相关知识 91.3%、提升了动手能力 84.8%、感觉到心情舒畅 54.4%、增强了合作能力 32.6%。学习相关知识与提升动手能力占比最高（均超84%），心情舒畅次之，增强合作能力占比最低。"}]},{"year":2025,"sources":["https://m.koolearn.com/kaoyan/20250103/1795515.html","https://study.aseeker.bio/english/paper/2025_english2/","https://csgraduates.com/study_methods/english/english2/2025/"],"notes":"完形/阅读正文与答案经新东方在线、aseeker、csgraduates三源核对。分歧记录：(1)koolearn页首Text1答案串'DCADA'与csgraduates逐题答案表(21B22C23A24D25A)不一致，取csgraduates逐题答案；(2)完形16/17/18题选项，aseeker表与koolearn/csgraduates不一致（16A recall、17C willing、18C rewarding），取koolearn与csgraduates多数源；(3)Text1'default options often well above 20%'，koolearn与aseeker误作70%，按上下文(后文'20% or higher today')与csgraduates取20%；(4)Text1末段两句（雇主屈服于tip creep、顾客感到被强迫）csgraduates完整，koolearn/aseeker截断；'tipping primarily benefits some of these workers, such as waiters, but not others, such as cooks and dishwashers'按csgraduates；(5)Text2末段'...taxpayers are left with the heavy price tag of treating the illnesses, like diabetes, that result'原页OCR残缺，按语义补全；(6)Part B为小标题heading题型，答案41F42C43G44B45A。","missing":[],"cloze":{"instruction":"Read the following text. Choose the best word(s) for each numbered blank and mark A, B, C or D on the ANSWER SHEET. (10 points)","passage":"There are many understandable reasons why you might find it difficult to ask for help when you need it. Psychologists have been interested in this {{1}} for decades, not least because people’s widespread {{2}} to ask for help has led to some high-profile failures.\n\nAsking for help takes {{3}}. It involves communicating a need on your part—there’s something you can’t do. {{4}}, you’re broadcasting your own weaknesses, which can be {{5}}. You might worry about coming across as incompetent. You might have {{6}} about losing control of whatever it is you’re asking for help with. {{7}} someone starts to help, perhaps they’ll take over, or get credit for your earlier efforts. Yet another {{8}} that you might be worried about is being a nuisance or {{9}} the person you go to for help.\n\nIf you struggle with low self-esteem, you might find it especially difficult to {{10}} for help because you have the added worry of the other person {{11}} your request. You might see such refusals as implying something {{12}} about the status of your relationship with them.\n\nTo {{13}} these difficulties, try to remind yourself that everyone needs help sometimes. Nobody knows everything and can do everything all by themselves. And while you might {{14}} coming across as incompetent, there’s actually research that shows that advice-seekers are {{15}} as more competent, not less.\n\nPerhaps most encouraging of all is a paper from 2022 by researchers at Stanford University, in California, that involved a mix of contrived help-seeking interactions and asking people to {{16}} times they’d sought help in the past. The findings showed that help-seekers generally underestimate how {{17}} other people will be to help and how good it’ll make the help-giver feel (for most people, having the chance to help someone is highly {{18}}).\n\nSo, bear all this in mind the next time you need to ask for help. {{19}}, take care over who you ask and when you ask them. And if someone can’t help right now, avoid taking it personally. They might just be too {{20}}, or they might not feel confident about their ability to help.","questions":[{"no":1,"A":"illusion","B":"discussion","C":"tradition","D":"question","answer":"D"},{"no":2,"A":"reluctance","B":"ambition","C":"tendency","D":"enthusiasm","answer":"A"},{"no":3,"A":"attention","B":"talent","C":"courage","D":"patience","answer":"C"},{"no":4,"A":"At any time","B":"In other words","C":"By all means","D":"On the contrary","answer":"B"},{"no":5,"A":"unrealistic","B":"deceptive","C":"tiresome","D":"uncomfortable","answer":"D"},{"no":6,"A":"doubts","B":"concerns","C":"suggestions","D":"secrets","answer":"B"},{"no":7,"A":"Once","B":"Unless","C":"Although","D":"Before","answer":"A"},{"no":8,"A":"theory","B":"choice","C":"factor","D":"context","answer":"C"},{"no":9,"A":"overpraising","B":"outperforming","C":"reassessing","D":"inconveniencing","answer":"D"},{"no":10,"A":"reach out","B":"settle down","C":"turn over","D":"look back","answer":"A"},{"no":11,"A":"declining","B":"considering","C":"criticizing","D":"evaluating","answer":"A"},{"no":12,"A":"unnecessary","B":"negative","C":"strange","D":"impractical","answer":"B"},{"no":13,"A":"explain","B":"identify","C":"predict","D":"overcome","answer":"D"},{"no":14,"A":"deny","B":"forget","C":"miss","D":"fear","answer":"D"},{"no":15,"A":"disguised","B":"perceived","C":"followed","D":"introduced","answer":"B"},{"no":16,"A":"recall","B":"classify","C":"analyse","D":"compare","answer":"A"},{"no":17,"A":"brave","B":"disapproving","C":"willing","D":"hesitant","answer":"C"},{"no":18,"A":"relaxing","B":"surprising","C":"rewarding","D":"demanding","answer":"C"},{"no":19,"A":"Thus","B":"Also","C":"Finally","D":"Instead","answer":"B"},{"no":20,"A":"polite","B":"proud","C":"busy","D":"lazy","answer":"C"}],"fills":{"1":"question","2":"reluctance","3":"courage","4":"In other words","5":"uncomfortable","6":"concerns","7":"Once","8":"factor","9":"inconveniencing","10":"reach out","11":"declining","12":"negative","13":"overcome","14":"fear","15":"perceived","16":"recall","17":"willing","18":"rewarding","19":"Also","20":"busy"}},"reading":[{"name":"Text 1","instruction":"Read the following four texts. Answer the questions below each text by choosing A, B, C or D. Mark your answers on the ANSWER SHEET. (40 points)","passage":"U.S. customers historically tipped people they assumed were earning most of their income via tips, such as restaurant servers earning less than the minimum wage. In the early 2010s, a wide range of businesses started processing purchases with iPads and other digital payment systems. These systems often prompted customers to tip for services that were not previously tipped.\n\nToday’s tip requests are often not connected to the salary and service norms that used to determine when and how people tip. Customers in the past nearly always paid tips after receiving a service, such as at the conclusion of a restaurant meal, after getting a haircut or once a pizza was delivered. That timing could reward high-quality service and give workers an incentive to provide it.\n\nIt’s becoming more common for tips to be requested beforehand. And new tipping technology may even automatically add tips.\n\nThe prevalence of digital payment devices has made it easier to ask customers for a tip. That helps explain why tip requests are creeping into new kinds of services. Customers now routinely see menus of suggested default options often well above 20% of what they owe. The amounts have risen from 10% or less in the 1950s to 15% around the year 2000 to 20% or higher today. This increase is sometimes called tipflation—the expectation of ever-higher tip amounts.\n\nTipping has always been a vital source of income for workers in historically tipped services, like restaurants, where the tipped minimum wage can be as low as US$2.13 an hour. Tip creep and tipflation are now further supplementing the income of many low-wage service workers.\n\nNotably, tipping primarily benefits some of these workers, such as waiters, but not others, such as cooks and dishwashers. To ensure that all employees were paid fair wages, some restaurants banned tipping and increased prices, but this movement toward no-tipping services has largely fizzled out.\n\nSo, to increase employee wages without raising prices, more employers are succumbing to the temptations of tip creep and tipflation. However, many customers are frustrated because they feel they are being asked for too high of a tip, too often.\n\nAnd, as our research emphasizes, tipping now seems to be more coercive, less generous and often completely disassociated from service quality.","questions":[{"no":21,"stem":"According to Paragraph 1, the practice of tipping in the U.S.","A":"was regarded by many customers as a sign of generosity","B":"was considered essential for waiters","C":"was a way of rewarding diligence","D":"was optional in most businesses","answer":"B"},{"no":22,"stem":"Compared with tips in the past, today’s tips","A":"are paid much less frequently","B":"are less often requested in advance","C":"have less to do with service quality","D":"contribute less to workers’ income","answer":"C"},{"no":23,"stem":"Tip requests are creeping into new kinds of services as a result of","A":"the advancement of technology","B":"the desire for income increase","C":"the diversification of business","D":"the emergence of tipflation","answer":"A"},{"no":24,"stem":"The movement toward no-tipping services was intended to","A":"promote consumption","B":"enrich income sources","C":"maintain reasonable prices","D":"guarantee income fairness","answer":"D"},{"no":25,"stem":"It can be learned from the last paragraph that tipping","A":"is becoming a burden for customers","B":"helps encourage quality service","C":"is vital to business development","D":"reflects the need to reduce prices","answer":"A"}]},{"name":"Text 2","instruction":"Read the following four texts. Answer the questions below each text by choosing A, B, C or D. Mark your answers on the ANSWER SHEET. (40 points)","passage":"When it was established, the National Health Service (NHS) was visionary: offering high-quality, timely care to meet the dominant needs of the population it served. Nearly 75 years on, with the UK facing very different health challenges, it is clear that the model is out of date.\n\nFrom life expectancy to cancer and infant mortality rates, we are lagging behind many of our peers. With more than 6.8 million on waitlists, healthcare is becoming increasingly inaccessible for those who cannot opt to pay for private treatment; and the cost of providing healthcare is increasingly squeezing out investment in other public services. As demand for healthcare continues to grow, pressures on the workforce—which is already near breaking point—will only become more acute.\n\nMany of the answers to the crisis in health and care are well rehearsed. We need to be much better at reducing and diverting demand on health services, rather than simply managing it. Much more needs to be invested in communities and primary care to reduce our reliance on hospitals. And capacity in social care needs to be greater, to support the growing number of people living with long-term conditions.\n\nYet despite two decades of strategies and a number of major health reforms, we have failed to make meaningful progress on any of these aims. That is why the Reform think tank is launching a new programme of work entitled “Reimagining health”, supported by ten former health ministers. Together, we are calling for a much more open and honest conversation about the future of health in the UK, and an “urgent rethink” of the hospital-centric model we retain.\n\nThis must begin with the question of how we maximise the health of the nation, rather than “fix” the NHS. It is estimated, for example, that healthcare accounts for only about 20% of health outcomes. Much more important are the places we live, work and socialise—yet there is no clear cross-government strategy for improving these social determinants of health. Worse, when policies like the national obesity strategy are scrapped, taxpayers are left with the heavy price tag of treating the illnesses, like diabetes, that result.\n\nReform wants to ask how power and resources should be distributed in our health system. What health functions should remain at the centre, and what should be given to local leaders, often responsible for services that shape health, and with a much better understanding of the needs of their populations?","questions":[{"no":26,"stem":"According to the first two paragraphs, the NHS","A":"is troubled by funding deficiencies","B":"can hardly satisfy people’s needs","C":"can barely retain its current employees","D":"is rivalled by private medical services","answer":"B"},{"no":27,"stem":"One answer to the crisis in health and care is to","A":"boost the efficiency of hospitals","B":"lighten the burden on social care","C":"increase resources for primary care","D":"reduce the pressure on communities","answer":"C"},{"no":28,"stem":"“Reimagining health” is aimed to","A":"reinforce hospital management","B":"readjust healthcare regulations","C":"restructure the health system","D":"resume suspended health reforms","answer":"C"},{"no":29,"stem":"To maximise the nation’s health, the author suggests","A":"introducing relevant taxation policies","B":"paying due attention to social factors","C":"reevaluate major health outcomes","D":"enhancing the quality of healthcare","answer":"B"},{"no":30,"stem":"It can be inferred that local leaders should","A":"exercise their power more reasonably","B":"develop a stronger sense of responsibility","C":"play a bigger role in the health system","D":"understand people’s health needs better","answer":"C"}]},{"name":"Text 3","instruction":"Read the following four texts. Answer the questions below each text by choosing A, B, C or D. Mark your answers on the ANSWER SHEET. (40 points)","passage":"Heat action plans, or HAPs, have been proliferating in India in the past few years. In general, an HAP spells out when and how officials should issue heat warnings and alert hospitals and other institutions. Nagpur’s plan, for instance, calls for hospitals to set aside “cold wards” in the summer for treating heatstroke patients, and advises builders to give construction laborers a break from work on very hot days.\n\nBut implementation of existing HAPs has been uneven, according to a report from the Center for Policy Research. Many lack adequate funding, it found. And their triggering thresholds often are not customized to the local climate. In some areas, high daytime temperatures alone might serve as an adequate trigger for alerts. But in other places, nighttime temperatures or humidity might be as important a gauge of risk as daytime highs.\n\nMumbai’s April heatstroke deaths highlighted the need for more nuanced and localized warnings, researchers say. That day’s high temperature of roughly 36℃ was 1℃ shy of the heat wave alert threshold for coastal cities set by national meteorological authorities. But the effects of the heat were amplified by humidity—an often neglected factor in heat alert systems—and the lack of shade at the late-morning outdoor ceremony.\n\nTo help improve HAPs, urban planner Kotharkar’s team is working on a model plan that outlines best practices and could be adapted to local conditions. Among other things, she says, all cities should create a vulnerability map to help focus responses on the populations most at risk.\n\nSuch mapping doesn’t need to be complex, Kotharkar says. “A useful map can be created by looking at even a few key parameters.” For example, neighborhoods with a large elderly population or informal dwellings that cope poorly with heat could get special warnings or be bolstered with cooling centers. The Nagpur project has already created a risk and vulnerability map, which enabled Kotharkar to tell officials which neighborhoods to focus on in the event of a heat wave this summer.\n\nHAPs shouldn’t just include short-term emergency responses, researchers say, but also recommend medium- to long-term measures that could make communities cooler. In Nagpur, for example, Kotharkar’s team has been able to advise city officials about where to plant trees to provide shade. HAPs could also guide efforts to retrofit homes or modify building regulations. “Reducing deaths in an emergency is a good target to have, but it’s the lowest target,” says climate researcher Chandni Singh.","questions":[{"no":31,"stem":"According to Paragraph 1, Nagpur’s plan proposes measures to","A":"tackle extreme weather","B":"ensure construction quality","C":"monitor emergency warnings","D":"address excessive workloads","answer":"A"},{"no":32,"stem":"One problem with existing HAPs is that they","A":"prove too costly to be implemented","B":"lack localized alert-issuing criteria","C":"give delayed responses to heat waves","D":"keep hospitals under great pressure","answer":"B"},{"no":33,"stem":"Mumbai’s case shows that India’s heat alert systems need to","A":"include other factors besides temperature","B":"take subtle weather changes into account","C":"prioritize potentially disastrous heat waves","D":"draw further support from local authorities","answer":"A"},{"no":34,"stem":"Kotharkar holds that a vulnerability map can help","A":"prevent the harm of high humidity","B":"target areas needing special attention","C":"expand the Nagpur project’s coverage","D":"make relief plans for heat-stricken people","answer":"B"},{"no":35,"stem":"According to the last paragraph, researchers suggest that HAPs should","A":"focus more on heatstroke treatment","B":"invite wider public participation","C":"apply for more government grants","D":"serve a broader range of purposes","answer":"D"}]},{"name":"Text 4","instruction":"Read the following four texts. Answer the questions below each text by choosing A, B, C or D. Mark your answers on the ANSWER SHEET. (40 points)","passage":"Navigating beyond the organised pavements and parks of our urban spaces, desire paths are the unofficial footprints of a community, revealing the unspoken preferences, shared shortcuts and collective choices of humans. Often appearing as trodden dirt tracks through otherwise neat green spaces, these routes of collective disobedience cut corners, bisect lawns and cross hills, representing the natural capability of people and animals to go from point A to point B most effectively.\n\nUrban planners interpret desire paths as more than just convenient shortcuts; they offer valuable insights into the dynamics between planning and behaviour. Ohio State University allowed its students to navigate the Oval, a lawn in the centre of campus, freely, then proceeded to pave the desire paths, creating a web of effective routes students had established.\n\nYet, reluctance persists among other planners to integrate desire paths into formal plans, citing concerns about safety, environmental impact, or primarily, aesthetics. A Reddit webpage devoted to the phenomenon, boasting nearly 50,000 members, showcases images of local desire paths adorned with signs instructing pedestrians to adhere to designated walkways, underscoring the rebellious nature inherent in these human-made tracks. This clash highlights an ongoing struggle between the organic, user-driven evolution of public spaces and the desire for a visually curated and controlled urban environment.\n\nThe Wickquasgeck Trail is an example of a historical desire path, created by Native Americans to cross the forests of Manhattan and move between settlements quickly. This trail, when Dutch colonists arrived, was widened and made into one of the main trade roads across the island, known at the time as de Heere Straat, or Gentlemen’s Street. Following the British assumption of control in New York, the street was renamed Broadway. Notably, Broadway stands out as one of the few areas in NYC that defies the grid-based system applied to the rest of the city, cutting a diagonal across parts of the city. In online spaces, desire paths have sparked a fascination that can approach obsession, with the Reddit page serving as a hub. Contributors offer a wide array of stories, from little-known new shortcuts to long-established alternate routes.\n\nAnimal desire paths, such as ducks forging trails through frozen ponds or dogs carving direct routes in gardens, highlight the adaptability of these trails in both human and animal experiences. As desire paths criss-cross through both physical and virtual landscapes, they stand as a proof of the collective insistence on forging unconventional routes and embracing the spirit of communal choice.","questions":[{"no":36,"stem":"According to Paragraph 1, desire paths are a result of","A":"the curiosity to explore surrounding hills","B":"the necessity to preserve green spaces","C":"the tendency to pursue convenience","D":"the wish to find comfort in solitude","answer":"C"},{"no":37,"stem":"It can be inferred that Ohio State University","A":"intends to improve its desire paths","B":"leads in the research on desire paths","C":"guides the creation of its desire paths","D":"takes a positive view of desire paths","answer":"D"},{"no":38,"stem":"The images on the Reddit webpage reflect","A":"conflicting opinions on the use of desire paths","B":"the call to upgrade the designing of public spaces","C":"the demand for proper planning of desire paths","D":"growing concerns over the loss of public spaces","answer":"A"},{"no":39,"stem":"The example of the Wickquasgeck Trail illustrates","A":"the growth of New York City","B":"the Dutch origin of desire paths","C":"the importance of urban planning","D":"the recognition of desire paths","answer":"D"},{"no":40,"stem":"It can be learned from the last paragraph that desire paths","A":"reveal humans’ deep respect for nature","B":"are crucial to humans’ mental well-being","C":"are a human imitation of animal behaviour","D":"show a shared trait in humans and animals","answer":"D"}]}],"newtype":{"form":"heading","instruction":"Read the following text and answer the questions by choosing the most suitable subheading from the list A–G for each of the numbered paragraphs (41–45). There are two extra subheadings which you do not need to use. Mark your answers on the ANSWER SHEET. (10 points)","passage":"Five Steps to Suggesting a Change at Work That’ll Actually Get Taken Seriously\n\nEveryone wants to be that person—the one who looks at the same information as everyone else, but who sees a fresh, innovative solution. However, it takes more than simply having a good idea. How you share it is as important as the suggestion itself. Why? Because writing a new script—literally or figuratively—means that other team members will have to adapt to something new. So whether you’re suggesting a (seemingly) benign change like streamlining outdated protocol, or a bigger change like adding an hour to each workday so people can leave early on Fridays, you’re asking others to reimagine their workflow or schedule. Not to mention, if the process you’re scrapping is one someone else suggested, there’s the possibility of hurt feelings. To gain buy-in on an innovative, new idea, follow these steps:\n\n(41) __________\nGreat ideas don’t stand alone. In other words, you can’t mention your suggestion once and expect it to be adopted. To see a change, you’ll need to champion your plan and sell its merits. In addition, you need to be willing to stand up to scrutiny and criticism and be prepared to explain your innovation in different ways for various audiences.\n\n(42) __________\nSometimes it makes sense to go to your boss first. But other times, it’s useful to build a coalition among your co-workers or other stakeholders. When it works, it works great—because you’re ready for your stubborn supervisor’s pushback with answers like, “Actually, I connected with a few people in our tech department to discuss how much time these kinds of website updates would take, and they suggested they have the bandwidth.”\n\n(43) __________\nOne of the biggest barriers to gaining buy-in occurs when the owner of an idea is viewed as argumentative, defensive, or close-minded. Because, let’s be honest: No one likes a know-it-all. So, if people disagree with you, don’t be indignant. Instead, listen to their concerns fully, try to understand their perspective, and include their concerns (and possible remedies) in future discussions. So, instead of saying, “Martha, our current slogan is confusing and should be updated,” you could try, “Martha raises a great point that our current slogan has a long history for our stakeholders, but I wonder if we might be able to brainstorm a tagline that could build on that—and be clearer for new customers.”\n\n(44) __________\nNew ideas are the grandchildren of old ones. In other words, don’t throw old solutions under the bus to make your improvement stand out. Remember that in light of whatever the problem the old system solved—or, maybe, has failed to solve in recent memory—it was a great idea at the time. Appreciating the older contributions as you suggest future innovations helps bolster the credibility of your idea.\n\n(45) __________\nWhen pitching a new idea, it’s important to use the language of abundance instead of the language of deficit. Instead of saying what is wrong, broken, or suboptimal, talk about what is right, fixable, or ideal. For example, try, “I can see lots of applications for this new approach” rather than, “This innovation is the only way.” Be optimistic but realistic, and you will stand out.","options":{"A":"Stay positive","B":"Respect the past","C":"Use channels","D":"Give it time","E":"Invite resistance","F":"Be a salesman","G":"Be humble"},"items":[{"no":41,"stem":"","answer":"F"},{"no":42,"stem":"","answer":"C"},{"no":43,"stem":"","answer":"G"},{"no":44,"stem":"","answer":"B"},{"no":45,"stem":"","answer":"A"}],"questions":null},"translation":{"instruction":"Translate the following text into Chinese. Write your translation on the ANSWER SHEET. (15 points)","passage":"You know the moment—the conversation slows, then there’s a pause. It’s awkward, and so awkward that some people will panic and say anything. Do we all find such silences so stressful?\n\nResearchers analysed the frequency and impact of gaps greater than 2 seconds during conversations, including an overview of previous studies which indicate that the fear of awkward silences can be so extreme that people avoid talking to strangers, even though doing so is likely to be an enjoyable experience.\n\nDuring conversations with short gaps, people feel more connected to their conversation partners. But such feelings of connection markedly dip when entering a long gap. Long gaps between strangers are likely to be followed by a change in topic.\n\nBut the opposite seems to be true for conversations between friends. Long gaps there saw increased connection. Between friends, longer gaps seem to provide natural moments for reflection and expression."},"writing":[{"part":"A","type":"应用文","instruction":"47. Directions:","prompt":"Suppose you are planning a short play based on a classic Chinese novel. Write your friend John an email to\n1) introduce the play, and\n2) invite him to take part in it.\nWrite your answer in about 100 words on the ANSWER SHEET.\nDo not sign your own name in your email; use “Li Ming” instead. (10 points)"},{"part":"B","type":"图表作文","instruction":"48. Directions:","prompt":"Write an essay based on the chart below. In your essay, you should\n1) describe and interpret the chart, and\n2) give your comments.\nWrite your answer in about 150 words on the ANSWER SHEET. (15 points)","chart_desc":"柱状图，标题为“某社区老年人主要日常休闲活动调查”，纵轴为百分比，共五个分项：看电视 90.8%、散步 68.3%、养花 34.7%、阅读 31.8%、下棋 18.4%。看电视占比遥遥领先，散步次之，养花、阅读居中，下棋占比最低。"}]},{"year":2026,"sources":["https://noobdream.com/Practice/exam_solution/42565/","https://m.haiwenkaoyan.com/index.php/kydt/info_12300.html","http://mtoutiao.xdf.cn/kaoyan/202512/15055231.html","https://www.kaoyantexun.com/zhenti/6897.html","https://jixun.iqihang.com/kyzt/yingyu/yingyu2/2025704253.html","https://study.aseeker.bio/english/paper/2026_english2/","https://www.youlu.com/kaoyan/article/CA20251221010000000001","https://csgraduates.com/study_methods/english/english2/2026/"],"notes":"完形与Text1-4正文/选项/答案经noobdream、海文、新东方、aseeker、csgraduates多源交叉核对。分歧记录：(1)完形第4题A项，noobdream作collection，海文/aseeker/csgraduates作citation，取多数citation；(2)Text2首段confidential informational为noobdream误写，多数源作information；Text2第二段多数源含重复句'This means that any way it sees fit, it can even share it with third parties.'（疑原始PDF转写错误，照多数源保留）；(3)Text3第四段'huge improvements in Italy's obsolete infrastructure'为多数源写法（aseeker作investments）；(4)新题型Part B正文依据新东方/启航试卷图片OCR还原（noobdream/csgraduates的Part B正文为亚洲/非洲/拉丁美洲改写版，不含Stanturf/Brancalion/Chazdon段落，弃用），其中'exacerbate'后接词、Brancalion引语细节为图片识别不确定处；人名按启航图片作Ramni Jannadass；右栏G项multiply fast、D项emphasised按新东方/启航图片；(5)翻译段经aseeker与优路双源核对；(6)完形段'they both felt unwell'多源误作'the both'，按语法与csgraduates作they both。","missing":[],"cloze":{"instruction":"Read the following text. Choose the best word(s) for each numbered blank and mark A, B, C or D on the ANSWER SHEET. (10 points)","passage":"Most of us strive for self-respect—to see ourselves in a positive light, to be {{1}} of who we are. Any comments or experiences that undermine those feelings of self-worth can be uncomfortable and it’s only {{2}} to want to avoid them. But the thing is, {{3}} your self-worth really is being undermined is, to a large degree, subjective. Much of it comes down to your {{4}} of what someone said or did.\n\nWhen you take things personally, you’re interpreting these situations as saying something significant and negative about you as a person. Say your boss picks holes in your sales report, and you come away feeling like this means she thinks you’re a {{5}} member of staff. Or, two of your friends cancel your {{6}} get-together at the pub and you interpret this as meaning they’re bored of you. Psychologists have a {{7}} for this way of thinking: personalisation. But the {{8}} is that your boss might view you very highly. It’s just you made some {{9}} in the report and she wanted to point these out so that you do better next time. {{10}}, in the case of your friends cancelling, perhaps they both felt unwell that weekend or they just {{11}} their minds.\n\nIn both {{12}}—and others that we all experience—there’s another {{13}} at work that psychologists call mind reading. This is when you assume to know what other people are thinking about you, when you can’t really know without {{14}} them directly.\n\nOne simple way to avoid {{15}} personalisation and mind reading is to challenge your negative assumptions of what’s {{16}}. When you find yourself taking a situation personally, try to think of other interpretations that are less focused on you — especially in the sense of saying anything deep or {{17}} about you.\n\nWhen you do this, it might help to try to put yourself in other people’s shoes. The fact your boss took the time to give you {{18}} at all means they care enough to want to help you {{19}}. When it comes to your friends — maybe it’s because your friendship is so {{20}} that they felt able to cancel at late notice.","questions":[{"no":1,"A":"afraid","B":"critical","C":"proud","D":"tolerant","answer":"C"},{"no":2,"A":"risky","B":"natural","C":"admirable","D":"foolish","answer":"B"},{"no":3,"A":"whether","B":"where","C":"why","D":"how","answer":"A"},{"no":4,"A":"citation","B":"imitation","C":"perception","D":"introduction","answer":"C"},{"no":5,"A":"poor","B":"loyal","C":"creative","D":"shy","answer":"A"},{"no":6,"A":"sponsored","B":"crowded","C":"disputed","D":"planned","answer":"D"},{"no":7,"A":"method","B":"term","C":"design","D":"goal","answer":"B"},{"no":8,"A":"evidence","B":"theory","C":"condition","D":"reality","answer":"D"},{"no":9,"A":"complaints","B":"choices","C":"mistakes","D":"suggestions","answer":"C"},{"no":10,"A":"Similarly","B":"Relatively","C":"Accordingly","D":"Contrarily","answer":"A"},{"no":11,"A":"opened","B":"changed","C":"trained","D":"cleared","answer":"B"},{"no":12,"A":"quotations","B":"experiments","C":"questions","D":"examples","answer":"D"},{"no":13,"A":"process","B":"objective","C":"outcome","D":"background","answer":"A"},{"no":14,"A":"blaming","B":"warning","C":"teaching","D":"asking","answer":"D"},{"no":15,"A":"arguing about","B":"accounting for","C":"engaging in","D":"interfering with","answer":"C"},{"no":16,"A":"happened","B":"continued","C":"returned","D":"disappeared","answer":"A"},{"no":17,"A":"casual","B":"obvious","C":"familiar","D":"fundamental","answer":"D"},{"no":18,"A":"reward","B":"feedback","C":"trust","D":"proof","answer":"B"},{"no":19,"A":"innovate","B":"concentrate","C":"improve","D":"relax","answer":"C"},{"no":20,"A":"strange","B":"strong","C":"vulnerable","D":"valuable","answer":"B"}],"fills":{"1":"proud","2":"natural","3":"whether","4":"perception","5":"poor","6":"planned","7":"term","8":"reality","9":"mistakes","10":"Similarly","11":"changed","12":"examples","13":"process","14":"asking","15":"engaging in","16":"happened","17":"fundamental","18":"feedback","19":"improve","20":"strong"}},"reading":[{"name":"Text 1","instruction":"Read the following four texts. Answer the questions below each text by choosing A, B, C or D. Mark your answers on the ANSWER SHEET. (40 points)","passage":"Ask people about public libraries and a certain image springs to mind: dusty, old-fashioned, the sort of place you enjoyed as a child but, rather like a British seaside town, would you go there now? And anyway-aren’t they all closing?\n\nThe reality is startlingly different, as I discovered when the culture department commissioned me to conduct an independent review of English public libraries, published yesterday. As I visited libraries up and down the country, I was surprised to learn there are more than twice the number of libraries (2,892) as there are branches of McDonald’s.\n\nEnter any one of them and you will find a hive of activity, while books are, and should always be, at the heart of any library, a multitude of other services are offered: employment advice, language classes or digital access and support.\n\nThere are libraries with business and intellectual property centres, which can help business owners and entrepreneurs. Many have nurses on site to carry out basic health checks, with a link to the GP’s surgery, there are libraries where young people can borrow a Fifa-standard football free.\n\nIn return for all of this, you’ll be asked for precisely nothing. There will be no charge and you will never be asked to justify or explain yourself, you will simply be welcomed in, offered help if you need it, and left alone if you do not. There is no other institution, public or private, that can say the same. Yet still our libraries are often overlooked and underappreciated. There is an overall decline in visits and many are struggling as local authorities come under continued financial pressure.\n\nThe number of libraries that have closed since 2010 is disputed. An annual survey by the Chartered Institute of Public Finance and Accountancy puts it at nearly 800 across the UK; official statistics held by the Arts Council record 230 in England. It is, of course, 230 libraries too many. So if we are to protect our libraries for future generations, we must raise awareness of them and the work they do.\n\nThe review recommends a national branding campaign to give libraries a stronger physical presence, the reintroduction of a scheme to enable members to use their card in any library in the country, and automatic memberships for children. If we don’t use them, we will end up losing them. And for those who haven’t been to a library for some time, they may be surprised by what they find.","questions":[{"no":21,"stem":"What was the author commissioned to do about English public libraries?","A":"Document their valuable traditions.","B":"Make a plan for their expansions.","C":"Obtain reader opinions on them.","D":"Look into their current situation.","answer":"D"},{"no":22,"stem":"According to Paragraphs 3 & 4, the author finds that libraries","A":"boast desirable book collections","B":"keep detailed visitor records","C":"perform diversified functions","D":"attract mostly young readers","answer":"C"},{"no":23,"stem":"It is implied in Paragraph 5 that libraries should","A":"be given greater attention","B":"impose stricter visit limits","C":"work with private institutions","D":"get their equipment upgraded","answer":"A"},{"no":24,"stem":"The statistics mentioned in Paragraph 6 show","A":"the crisis faced by libraries","B":"the advancement of libraries","C":"the contributions of libraries","D":"the flaws existing in libraries","answer":"A"},{"no":25,"stem":"Which of the following is suggested for libraries in the last paragraph?","A":"Inviting public feedback.","B":"Seeking adequate funding.","C":"Improving user convenience.","D":"Offering lifetime memberships.","answer":"C"}]},{"name":"Text 2","instruction":"Read the following four texts. Answer the questions below each text by choosing A, B, C or D. Mark your answers on the ANSWER SHEET. (40 points)","passage":"According to our research, around one in five workers in the UK talk to AI like a friend, looking for guidance on personal and professional problems. Our data shows that engaging with AI like this can leave us feeling heard and less isolated. But, with this newfound connection, many of us share sensitive, sometimes highly confidential information, even though over a third of people don’t realise that AI platforms may not be very good at keeping our secrets.\n\nFor business, the implications are worrying. Consider Microsoft Copilot, for example. It gains Microsoft broad rights to the data inputted or outputted by any user—rights to use this data in any way it sees fit; it can even share it with third parties. This means that any way it sees fit, it can even share it with third parties. This means that any sensitive business information could potentially be exposed to the world. Employers are taking note and taking action. According to our research, 25% have decided to either outright ban AI or regulate its use within their organisations. But even with these policies in place, some employees choose to break the rules. They have their reasons—around 63% of them report that using AI increases their productivity, and some even feel AI offers more help than their human colleagues.\n\nThe situation presents a delicate balance between leveraging AI for its productivity gains and risking confidential data exposure. Employers need to manage AI tools with the same level of care as any other form of data sharing or storage. There’s also a knowledge gap that needs to be addressed—40% of individuals surveyed are unsure about who retains ownership over the content produced by AI. By instilling best practices in AI engagement and creating policies that evolve with the technology, business can positively shift the AI landscape.\n\nWith AI’s potential to simplify our professional lives, do the admin and enhance the work experience. It’s up to us to navigate its usage cautiously so it supports us without compromising our privacy. There’s no need to back away from progress, as long as we’re equipped with the knowledge and tools to make sure AI remains a friend. And this is where the challenge lies. There are so many products out there, being promoted with huge advertising and marketing budgets, that it’s easy to fall victim. But by building a culture of digital responsibility within our business, we can create a future where AI can help us without spilling the beans.","questions":[{"no":26,"stem":"According to Paragraph 1, workers’ engagement with AI can","A":"facilitate their career progress","B":"give them emotional support","C":"help maintain their motivation","D":"improve workplace communication","answer":"B"},{"no":27,"stem":"Microsoft Copilot is cited to show that the use of AI may","A":"pose a threat to businesses","B":"generate unnecessary data","C":"promote business cooperation","D":"encourage information sharing","answer":"A"},{"no":28,"stem":"Some employees choose to break the rules on AI due to","A":"easy access to AI products","B":"the desire to stay well-informed","C":"its significant role in their work","D":"the need to compete with others","answer":"C"},{"no":29,"stem":"To positively shift the AI landscape, businesses should","A":"increase the transparency of their data sources","B":"prioritise the quality of AI-produced content","C":"include employee perspectives in their rules","D":"adjust their management to AI development","answer":"D"},{"no":30,"stem":"According to the last paragraph, we may easily fall victim to AI as we","A":"have a limited understanding of it","B":"underestimate its economic costs","C":"tend to overemphasise its power","D":"are excessively exposed to it","answer":"A"}]},{"name":"Text 3","instruction":"Read the following four texts. Answer the questions below each text by choosing A, B, C or D. Mark your answers on the ANSWER SHEET. (40 points)","passage":"Since the 2008 launch of the high-speed rail network between Rome and Milan, trains have become the preferred means of travel across Italy for locals and tourists alike. Fast trains can cover the 500km between the two cities in three hours. The network also connects Naples, Bologna, Florence and Turin. In many cases, it is the best option—in terms of travel time and cost—for both leisure and business travellers.\n\nThis is why the recent severe delays caused by numerous maintenance works have thrown the rail industry into chaos at a time when most people head on holiday, which matters for business in a country where tourism accounts for 10 percent of GDP.\n\nDisruptions have become increasingly frequent with train delays now a fixture in Italian media coverage. Ferrovie dello Stato Italiane, the publicly controlled group that owns train operator Trenitalia and the national train network RFI, said 23 percent of all high-speed trains it operated were late in 2023.\n\nThe huge improvements in Italy’s obsolete infrastructure partly explained the disruption, said Ferrovie. RFI, the network operator, is the single largest European recovery fund beneficiary with planned investments of €24bn by 2026. Ferrovie will invest a total of €124bn in infrastructure over the next 10 years.\n\nBut lack of capacity is another problem. Transport economist Andrea Giuricin said the planned investments would bring improvements but disruptions in the meantime were inevitable. “We have a mixed system, there is no spare capacity and as soon as there’s a hiccup on the line, the situation becomes highly complex,” he said. A mixed system means that high-speed trains must travel on the regular tracks on certain routes or when passing through large cities. If there’s congestion or, for example, a local train breaks down, the entire high-speed network is affected.\n\nOne of the most important changes the upgrades will bring is the segregation of the high-speed line from the regular one in certain urban centres through the construction of underground rail links.\n\nImprovements will also come from the high-density technology and satellite signalling that RFI has been investing in for years, say experts. It will allow for a reduction of the distance between high-speed trains travelling on the same line at any given time, which should mean a significant increase in capacity and traffic fluidity, according to Giuricin.","questions":[{"no":31,"stem":"According to the first two paragraphs, the high-speed rail network in Italy","A":"is seen by tourists as outdated","B":"is a popular option for travelling","C":"is inadequately utilised by locals","D":"is an example of good maintenance","answer":"B"},{"no":32,"stem":"Ferrovie is quoted in Paragraph 3 to show","A":"the common occurrence of train delays","B":"the value of the Italian train network","C":"the wide media coverage of trains","D":"the high efficiency of Trenitalia","answer":"A"},{"no":33,"stem":"Which of the following is one cause of the disruptions in the network?","A":"Complex train schedules.","B":"Shortage of investments.","C":"Its limited capacity.","D":"Its massive scale.","answer":"C"},{"no":34,"stem":"It can be learned that the mixed system","A":"provides a wide choice of routes","B":"requires extra operational spending","C":"increases the level of travel comfort","D":"puts the high-speed network in trouble","answer":"D"},{"no":35,"stem":"Improvements to the Italian train network will include","A":"reconstructing the regular train lines","B":"shortening high-speed train intervals","C":"building more stations in urban centres","D":"enhancing the safety of high-speed trains","answer":"B"}]},{"name":"Text 4","instruction":"Read the following four texts. Answer the questions below each text by choosing A, B, C or D. Mark your answers on the ANSWER SHEET. (40 points)","passage":"In 2023, Chicago lost one of its most beloved street festivals. The Silver Room Block Party, staged by Hyde Park community leader Eric Williams, announced it would not return in 2024. What began as a small ne
