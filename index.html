r":"A"},{"no":34,"stem":"A gap year may save money for students by helping them____.","A":"avoid academic failures","B":"establish long-term goals","C":"switch to another college","D":"decide on the right major","answer":"D"},{"no":35,"stem":"The most suitable title for this text would be____.","A":"In Favor of the Gap Year","B":"The ABCs of the Gap Year","C":"The Gap Year Comes Back","D":"The Gap Year: A Dilemma","answer":"A"}]},{"name":"Text 4","instruction":"","passage":"Though often viewed as a problem for western states, the growing frequency of wildfires is a national concern because of its impact on federal tax dollars, says Professor Max Moritz, a specialist in fire ecology and management.\n\nIn 2015, the US Forest Service for the first time spent more than half of its $5.5 billion annual budget fighting fires – nearly double the percentage it spent on such efforts 20 years ago. In effect, fewer federal funds today are going towards the agency's other work – such as forest conservation, watershed and cultural resources management, and infrastructure upkeep – that affect the lives of all Americans.\n\nAnother nationwide concern is whether public funds from other agencies are going into construction in fire-prone districts. As Moritz puts it, how often are federal dollars building homes that are likely to be lost to a wildfire?\n\n\"It's already a huge problem from a public expenditure perspective for the whole country,\" he says. \"We need to take a magnifying glass to that. Like, 'Wait a minute, is this OK?' Do we want instead to redirect those funds to concentrate on lower-hazard parts of the landscape?\"\n\nSuch a view would require a corresponding shift in the way US society today views fire, researchers say.\n\nFor one thing, conversations about wildfires need to be more inclusive. Over the past decade, the focus has been on climate change – how the warming of the Earth from greenhouse gases is leading to conditions that worsen fires.\n\nWhile climate is a key element, Moritz says, it shouldn't come at the expense of the rest of the equation.\n\n\"The human systems and the landscapes we live on are linked, and the interactions go both ways,\" he says. Failing to recognize that, he notes, leads to \"an overly simplified view of what the solutions might be. Our perception of the problem and of what the solution is becomes very limited.\"\n\nAt the same time, people continue to treat fire as an event that needs to be wholly controlled and unleashed only out of necessity, says Professor Balch at the University of Colorado. But acknowledging fire's inevitable presence in human life is an attitude crucial to developing the laws, policies, and practices that make it as safe as possible, she says.\n\n\"We've disconnected ourselves from living with fire,\" Balch says. \"It is really important to understand and try and tease out what is the human connection with fire today.\"","questions":[{"no":36,"stem":"More frequent wildfires have become a national concern because in 2015 they____.","A":"exhausted unprecedented management efforts","B":"consumed a record-high percentage of budget","C":"severely damaged the ecology of western states","D":"caused a huge rise of infrastructure expenditure","answer":"B"},{"no":37,"stem":"Moritz calls for the use of \"a magnifying glass\" to____.","A":"raise more funds for fire-prone areas","B":"avoid the redirection of federal money","C":"find wildfire-free parts of the landscape","D":"guarantee safer spending of public funds","answer":"D"},{"no":38,"stem":"While admitting that climate is a key element, Moritz notes that____.","A":"public debates have not settled yet","B":"fire-fighting conditions are improving","C":"other factors should not be overlooked","D":"a shift in the view of fire has taken place","answer":"C"},{"no":39,"stem":"The overly simplified view Moritz mentions is a result of failing to____.","A":"discover the fundamental makeup of nature","B":"explore the mechanism of the human systems","C":"maximize the role of landscape in human life","D":"understand the interrelations of man and nature","answer":"D"},{"no":40,"stem":"Professor Balch points out that fire is something man should____.","A":"do away with","B":"come to terms with","C":"pay a price for","D":"keep away from","answer":"B"}]}],"newtype":{"form":"matching","instruction":"Read the following text and match each of the numbered items in the left column to its corresponding information in the right column. There are two extra choices in the right column. Mark your answers on the ANSWER SHEET. (10 points)","passage":"The decline in American manufacturing is a common refrain, particularly from Donald Trump. \"We don't make anything anymore,\" he told Fox News, while defending his own made-in-Mexico clothing line.\n\nWithout question, manufacturing has taken a significant hit during recent decades, and further trade deals raise questions about whether new shocks could hit manufacturing.\n\nBut there is also a different way to look at the data.\n\nAcross the country, factory owners are now grappling with a new challenge: Instead of having too many workers, they may end up with too few. Despite trade competition and outsourcing, American manufacturing still needs to replace tens of thousands of retiring boomers every year. Millennials may not be that interested in taking their place. Other industries are recruiting them with similar or better pay.\n\nFor factory owners, it all adds up to stiff competition for workers – and upward pressure on wages. \"They're harder to find and they have job offers,\" says Jay Dunwell, president of Wolverine Coil Spring, a family-owned firm, \"They may be coming [into the workforce], but they've been plucked by other industries that are also doing as well as manufacturing.\" Mr. Dunwell has begun bringing high school juniors to the factory so they can get exposed to its culture.\n\nAt RoMan Manufacturing, a maker of electrical transformers and welding equipment that his father cofounded in 1980, Robert Roth keeps a close eye on the age of his nearly 200 workers. Five are retiring this year. Mr. Roth has three community-college students enrolled in a work-placement program, with a starting wage of $13 an hour that rises to $17 after two years.\n\nAt a worktable inside the transformer plant, young Jason Stenquist looks flustered by the copper coils he's trying to assemble and the arrival of two visitors. It's his first week on the job. Asked about his choice of career, he says at high school he considered medical school before switching to electrical engineering. \"I love working with tools. I love creating,\" he says.\n\nBut to win over these young workers, manufacturers have to clear another major hurdle: parents, who lived through the worst US economic downturn since the Great Depression, telling them to avoid the factory. Millennials \"remember their father and mother both were laid off. They blame it on the manufacturing recession,\" says Birgit Klohs, chief executive of The Right Place, a business development agency for western Michigan.\n\nThese concerns aren't misplaced: Employment in manufacturing has fallen from 17 million in 1970 to 12 million in 2015. When the recovery began, worker shortages first appeared in the high-skilled trades. Now shortages are appearing at the mid-skill levels.\n\n\"The gap is between the jobs that take no skills and those that require a lot of skill,\" says Rob Spohr, a business professor at Montcalm Community College. \"There're enough people to fill the jobs at McDonalds and other places where you don't need to have much skill. It's that gap in between, and that's where the problem is.\"\n\nJulie Parks of Grand Rapids Community College points to another key to luring Millennials into manufacturing: a work/life balance. While their parents were content to work long hours, young people value flexibility. \"Overtime is not attractive to this generation. They really want to live their lives,\" she says.","options":{"A":"says that he switched to electrical engineering because he loves working with tools.","B":"points out that there are enough people to fill the jobs that don't need much skill.","C":"points out that the US doesn't manufacture anything anymore.","D":"believes that it is important to keep a close eye on the age of his workers.","E":"says that for factory owners, workers are harder to find because of stiff competition.","F":"points out that a work/life balance can attract young people into manufacturing.","G":"says that the manufacturing recession is to blame for the lay-off of the young people's parents."},"items":[{"no":41,"stem":"Jay Dunwell","answer":"E"},{"no":42,"stem":"Jason Stenquist","answer":"A"},{"no":43,"stem":"Birgit Klohs","answer":"G"},{"no":44,"stem":"Rob Spohr","answer":"B"},{"no":45,"stem":"Julie Parks","answer":"F"}],"questions":null},"translation":{"instruction":"Translate the following text into Chinese. Write your translation on the ANSWER SHEET. (15 points)","passage":"My dream has always been to work somewhere in an area between fashion and publishing. Two years before graduating from secondary school, I took a sewing and design course thinking that I would move on to a fashion design course. However, during that course I realized I was not good enough in this area to compete with other creative personalities in the future, so I decided that it was not the right path for me. Before applying for university I told everyone that I would study journalism, because writing was, and still is, one of my favourite activities. But, to be honest, I said it, because I thought that fashion and I together were just a dream – I knew that no one could imagine me in the fashion industry at all! So I decided to look for some fashion-related courses that included writing. This is when I noticed the course \"Fashion Media & Promotion.\""},"writing":[{"part":"A","type":"应用文","instruction":"47. Directions:","prompt":"Suppose you are invited by Professor Williams to give a presentation about Chinese culture to a group of international students. Write a reply to\n1)accept the invitation, and\n2)introduce the key points of your presentation.\nYou should write about 100 words on the ANSWER SHEET.\nDo not use your own name. Use \"Li Ming\" instead.\nDo not write your address. (10 points)"},{"part":"B","type":"图表作文","instruction":"48. Directions:","prompt":"Write an essay based on the chart below. In your writing, you should\n1)interpret the chart, and\n2)give your comments.\nYou should write about 150 words on the ANSWER SHEET. (15 points)","chart_desc":"折线图，标题为\"2013-2015年我国博物馆数量和参观人数\"。纵轴为数量（刻度0—10000，间隔2000），横轴为年份（2013、2014、2015）；蓝色菱形折线代表博物馆数量（家），红色方形折线代表参观人数（十万人次）。数据（多机构真题书通行口径，端点经中国教育在线eol.cn范文核对）：博物馆数量2013年约4165家（一说4145）→2014年约4500余家→2015年约4692家（一说4697），逐年稳步上升；参观人数2013年约6378（十万人次，即约6.38亿人次）→2014年约7000余（十万人次）→2015年约7811/7812（十万人次，即约7.8亿人次），逐年上升且增幅大于博物馆数量。两条折线均呈持续上升趋势。"}]},{"year":2018,"sources":["http://edu.people.com.cn/n1/2017/1224/c1053-29725592.html"],"notes":"来源：人民网教育频道2017-12-24发布的2018年考研英语(二)试题及参考答案。完形/阅读/新题型/翻译/作文题干逐字录入；完形与阅读答案字母来自该页所附参考答案。个别明显OCR标点（如句中误加的句号）已按上下文修正。","missing":[],"cloze":{"instruction":"Read the following text. Choose the best word (s) for each numbered blank and mark A, B, C or D on the ANSWER SHEET. (10 points)","passage":"Why do people read negative Internet comments and do other things that will obviously be painful? Because humans have an inherent need to {{1}} uncertainty, according to a recent study in Psychological Science. The new research reveals that the need to know is so strong that people will {{2}} to satisfy their curiosity even when it is clear the answer will {{3}}.\n\nIn a series of four experiments, behavioral scientists at the University of Chicago and the Wisconsin School of Business tested students' willingness to {{4}} themselves to unpleasant stimuli in an effort to satisfy curiosity. For one {{5}} each participant was shown a pile of pens that the researcher claimed were from a previous experiment. The twist? Half of the pens would {{6}} an electric shock when clicked.\n\nTwenty-seven students were told which pens were electrified; another twenty-seven were told only that some were electrified. {{7}} left alone in the room, the students who did not know which ones would shock them clicked more pens and incurred more shocks than the students who knew what would {{8}}. Subsequent experiments reproduced this effect with other stimuli, {{9}} the sound of finger nails on a chalkboard and photographs of disgusting insects.\n\nThe drive to {{10}} is deeply rooted in humans, much the same as the basic drives for {{11}} or shelter, says Christopher Hsee of the University of Chicago. Curiosity is often considered a good instinct—it can {{12}} new scientific advances, for instance—but sometimes such {{13}} can backfire. The insight that curiosity can drive you to do {{14}} things is a profound one.\n\nUnhealthy curiosity is possible to {{15}}, however. In a final experiment, participants who were encouraged to {{16}} how they would feel after viewing an unpleasant picture were less likely to {{17}} to see such an image. These results suggest that imagining the {{18}} of following through on one's curiosity ahead of time can help determine {{19}} it is worth the endeavor. \"Thinking about long-term {{20}} is key to reducing the possible negative effects of curiosity,\" Hsee says. \"In other words, don't read online comments.\"","questions":[{"no":1,"A":"Protect","B":"resolve","C":"discuss","D":"ignore","answer":"B"},{"no":2,"A":"refuse","B":"wait","C":"regret","D":"seek","answer":"D"},{"no":3,"A":"hurt","B":"last","C":"mislead","D":"rise","answer":"A"},{"no":4,"A":"alert","B":"tie","C":"treat","D":"expose","answer":"D"},{"no":5,"A":"message","B":"review","C":"trial","D":"concept","answer":"C"},{"no":6,"A":"remove","B":"weaken","C":"interrupt","D":"deliver","answer":"D"},{"no":7,"A":"when","B":"if","C":"though","D":"unless","answer":"A"},{"no":8,"A":"continue","B":"happen","C":"disappear","D":"change","answer":"B"},{"no":9,"A":"rather than","B":"regardless of","C":"such as","D":"owing to","answer":"C"},{"no":10,"A":"discover","B":"forgive","C":"forget","D":"disagree","answer":"A"},{"no":11,"A":"pay","B":"marriage","C":"schooling","D":"food","answer":"D"},{"no":12,"A":"lead to","B":"rest on","C":"learn from","D":"begin with","answer":"A"},{"no":13,"A":"withdrawal","B":"persistence","C":"inquiry","D":"diligence","answer":"C"},{"no":14,"A":"self-reliant","B":"self-destructive","C":"self-evident","D":"self-deceptive","answer":"B"},{"no":15,"A":"define","B":"resist","C":"replace","D":"trace","answer":"B"},{"no":16,"A":"overlook","B":"predict","C":"design","D":"conceal","answer":"B"},{"no":17,"A":"remember","B":"promise","C":"choose","D":"pretend","answer":"C"},{"no":18,"A":"relief","B":"plan","C":"duty","D":"outcome","answer":"D"},{"no":19,"A":"why","B":"whether","C":"where","D":"how","answer":"B"},{"no":20,"A":"consequences","B":"investments","C":"strategies","D":"limitations","answer":"A"}],"fills":{"1":"resolve","2":"seek","3":"hurt","4":"expose","5":"trial","6":"deliver","7":"when","8":"happen","9":"such as","10":"discover","11":"food","12":"lead to","13":"inquiry","14":"self-destructive","15":"resist","16":"predict","17":"choose","18":"outcome","19":"whether","20":"consequences"}},"reading":[{"name":"Text 1","instruction":"Read the following four texts. Answer the questions below each text by choosing A, B, C or D. Mark your answers on the ANSWER SHEET. (40 points)","passage":"It is curious that Stephen Koziatek feels almost as though he has to justify his efforts to give his students a better future.\n\nMr. Koziatek is part of something pioneering. He is a teacher at a New Hampshire high school where learning is not something of books and tests and mechanical memorization, but practical. When did it become accepted wisdom that students should be able to name the 13th president of the United States but be utterly overwhelmed by a broken bike chain?\n\nAs Koziatek knows, there is learning in just about everything. Nothing is necessarily gained by forcing students to learn geometry at a graffitied desk stuck with generations of discarded chewing gum. They can also learn geometry by assembling a bicycle.\n\nBut he's also found a kind of insidious prejudice. Working with your hands is seen as almost a mark of inferiority. Schools in the family of vocational education \"have that stereotype...that it's for kids who can't make it academically,\" he says.\n\nOn one hand, that viewpoint is a logical product of America's evolution. Manufacturing is not the economic engine that it once was. The job security that the US economy once offered to high school graduates has largely evaporated. More education is the new principle. We want more for our kids, and rightfully so.\n\nBut the headlong push into bachelor's degrees for all – and the subtle devaluing of anything less – misses an important point: That's not the only thing the American economy need. Yes, a bachelor's degree opens more doors. But even now, 54 percent of the jobs in the country are middle-skill jobs, such as construction and high-skill manufacturing. But only 44 percent of workers are adequately trained.\n\nIn other words, at a time when the working class has turned the country on its political head, frustrated that the opportunity that once defined America is vanishing, one obvious solution is staring us in the face. There is a gap in working-class jobs, but the workers who need those jobs most aren't equipped to do them. Koziatek's Manchester school of Technology High School is trying to fill that gap.\n\nKoziatek's school is a wake-up call. When education becomes one-size-fits-all, it risks overlooking a nation's diversity of gifts.","questions":[{"no":21,"stem":"A broken bike chain is mentioned to show students' lack of .","A":"practical ability","B":"academic training","C":"pioneering spirit","D":"mechanical memorization","answer":"A"},{"no":22,"stem":"There exists the prejudice that vocational education is for kids who .","A":"have a stereotyped mind","B":"have no career motivation","C":"are not academically successful","D":"are financially disadvantaged","answer":"C"},{"no":23,"stem":"We can infer from Paragraph 5 that high school graduates .","A":"used to have big financial concerns","B":"used to have more job opportunities","C":"are reluctant to work in manufacturing","D":"are entitled to more educational privileges","answer":"B"},{"no":24,"stem":"The headlong push into bachelor's degrees for all .","A":"helps create a lot of middle-skill jobs","B":"may narrow the gap in working-class jobs","C":"is expected to yield a better-trained workforce","D":"indicates the overvaluing of higher education","answer":"D"},{"no":25,"stem":"The author's attitude toward Koziatek's school can be described as .","A":"supportive","B":"tolerant","C":"disappointed","D":"cautious","answer":"A"}]},{"name":"Text 2","instruction":"","passage":"While fossil fuels—still generate roughly 85 percent of the world's energy supply, it's clearer than ever that the future belongs to renewable sources such as wind and solar. The move to renewables is picking up momentum around the world: They now account for more than half of new power sources going on line.\n\nSome growth stems from a commitment by governments and farsighted businesses to fund cleaner energy sources. But increasingly the story is about the plummeting prices of renewables, especially wind and solar. The cost of solar panels has dropped by 80 percent and the cost of wind turbines by close to one-third in the past eight years.\n\nIn many parts of the world renewable energy is already a principal energy source. In Scotland, for example, wind turbines provide enough electricity to power 95 percent of homes. While the rest of the world takes the lead, notably China and Europe, the United States is also seeing a remarkable shift. In March, for the first time, wind and solar power accounted for more than 10 percent of the power generated in the US, reported the US Energy Information Administration.\n\nPresident Trump has underlined fossil fuels—especially coal—as the path to economic growth. In a recent speech in Iowa, he dismissed wind power as an unreliable energy source. But that message did not play well with many in Iowa, where wind turbines dot the fields and provide 36 percent of the state's electricity generation—and where tech giants like Microsoft are being attracted by the availability of clean energy to power their data centers.\n\nThe question \"What happens when the wind doesn't blow or the sun doesn't shine?\" has provided a quick put-down for skeptics. But a boost in the storage capacity of batteries is making their ability to keep power flowing around the clock more likely.\n\nThe advance is driven in part by vehicle manufacturers, who are placing big bets on battery-powered electric vehicles. Although electric cars are still a rarity on roads now, this massive investment could change the picture rapidly in coming years.\n\nWhile there's a long way to go, the trend lines for renewables are spiking. The pace of change in energy sources appears to be speeding up—perhaps just in time to have a meaningful effect in slowing climate change. What Washington does—or doesn't do—to promote alternative energy may mean less and less at a time of a global shift in thought.","questions":[{"no":26,"stem":"The word \"plummeting\"(Line 3, Para. 2) is closest in meaning to .","A":"stabilizing","B":"changing","C":"falling","D":"rising","answer":"C"},{"no":27,"stem":"According to Paragraph 3, the use of renewable energy in America .","A":"is progressing notably","B":"is as extensive as in Europe","C":"faces many challenges","D":"has proved to be impractical","answer":"A"},{"no":28,"stem":"It can be learned that in Iowa, .","A":"wind is a widely used energy source","B":"wind energy has replaced fossil fuels","C":"tech giants are investing in clean energy","D":"there is a shortage of clean energy supply","answer":"A"},{"no":29,"stem":"Which of the following is true about clean energy according to Paragraphs 5&6?","A":"Its application has boosted battery storage.","B":"It is commonly used in car manufacturing.","C":"Its continuous supply is becoming a reality.","D":"Its sustainable exploitation will remain difficult.","answer":"C"},{"no":30,"stem":"It can be inferred from the last paragraph that renewable energy____.","A":"will bring the USA closer to other countries.","B":"will accelerate global environmental change.","C":"is not really encouraged by the USA government.","D":"is not competitive enough with regard to its cost.","answer":"C"}]},{"name":"Text 3","instruction":"","passage":"The power and ambition of the giants of the digital economy is astonishing—Amazon has just announced the purchase of the upmarket grocery chain Whole Foods for $13.5bn, but two years ago Facebook paid even more than that to acquire the WhatsApp messaging service, which doesn't have any physical product at all. What WhatsApp offered Facebook was an intricate and finely detailed web of its users' friendships and social lives.\n\nFacebook promised the European commission then that it would not link phone numbers to Facebook identities, but it broke the promise almost as soon as the deal went through. Even without knowing what was in the messages, the knowledge of who sent them and to whom was enormously revealing and still could be. What political journalist, what party whip, would not want to know the makeup of the WhatsApp groups in which Theresa May's enemies are currently plotting? It may be that the value of Whole Foods to Amazon is not so much the 460 shops it owns, but the records of which customers have purchased what.\n\nCompetition law appears to be the only way to address these imbalances of power. But it is clumsy. For one thing, it is very slow compared to the pace of Change within the digital economy. By the time a problem has been addressed and remedied it may have vanished in the marketplace, to be replaced by new abuses of power. But there is a deeper conceptual problem, too. Competition law as presently interpreted deals with financial disadvantage to consumers and this is not obvious when the users of these services don't pay for them. The users of their Services are not their customers. That would be the people who buy advertising from them—and Facebook and Google, the two virtual giants, dominate digital advertising to the disadvantage of all other media and entertainment companies.\n\nThe product they're selling is data, and we, the users, convert our lives to date for the benefit of the digital giants. Just as some ants farm the bugs called aphids for the honeydew the produce when they feed, so Google farms us for the data that our digital lives yield. Ants keep predatory insects away from where their aphids feed; Gmail keeps the spamme out of our inboxes. It doesn't feel like a human or democratic relationship, even if both sides benefit.","questions":[{"no":31,"stem":"According to Paragraph 1, Facebook acquired WhatsApp for its .","A":"digital products","B":"user information","C":"physical assets","D":"quality service","answer":"B"},{"no":32,"stem":"Linking phone numbers to Facebook identities may .","A":"worsen political disputes","B":"mess up customer records","C":"pose a risk to Facebook users","D":"mislead the European commission","answer":"C"},{"no":33,"stem":"According to the author, competition law .","A":"should sever the new market powers","B":"may worsen the economic imbalance","C":"should not provide just one legal solution","D":"cannot keep pace with the changing market","answer":"D"},{"no":34,"stem":"Competition law as presently interpreted can hardly protect Facebook users because .","A":"they are not defined as customers","B":"they are not financially reliable","C":"the services are generally digital","D":"the services are paid for by advertisers","answer":"D"},{"no":35,"stem":"The ants analogy is used to illustrate .","A":"a win-win business model between digital giants","B":"a typical competition pattern among digital giants","C":"the benefits provided for digital giants' customers","D":"the relationship between digital giants and their users","answer":"D"}]},{"name":"Text 4","instruction":"","passage":"To combat the trap of putting a premium on being busy, Cal Newport, author of Deep Work: Rules for Focused Success in a Distracted World, recommends building a habit of \"deep work\"-the ability to focus without distraction.\n\nThere are a number of approaches to mastering the art of deep work- be it lengthy retreats dedicated to a specific task; developing a daily ritual; or taking a \"journalistic\" approach to seizing moment of deep work when you can throughout the day. Whichever approach, the key is to determine your length of focus time and stick to it.\n\nNewport also recommends \"deep scheduling\" to combat constant interruptions and get more done in less time. \"At any given point, I should have deep work scheduled for roughly the next month. Once on the calendar, I protect this time like I would a doctor's appointment or important meeting\", he writes.\n\nAnother approach to getting more done in less time is to rethink how you priorities your day – in particular how we craft our to-do lists. Tim Harford, author of Messy: The Power of Disorder to Transform Our Lives, points to a study in the early 1980s that divided undergraduates into two groups: some were advised to set out monthly goals and study activities; others were told to plan activities and goals in much more detail, day by day.\n\nWhile the researchers assumed that the well-structured daily plans would be most effective when it came to the execution of tasks, they were wrong: the detailed daily plans demotivated students. Harford argues that inevitable distractions often render the daily to-do list ineffective, while leaving room for improvisation in such a list can reap the best results.\n\nIn order to make the most of our focus and energy, we also need to embrace downtime, or as Newport suggests, \"be lazy\".\n\n\"Idleness is not just a vacation, an indulgence or a vice; it is as indispensable to the brain as vitamin D is to the body …\"[idleness] is, paradoxically, necessary to getting any work done,\" he argues.\n\nSrini Pillay, an assistant professor of psychiatry at Harvard Medical School, believes this counterintuitive link between downtime and productivity may be due to the may our brains operate. When our brains switch between being focused and unfocused on a task, they tend to be more efficient.\n\n\"What people don't realise is that in order to complete these tasks they need to use both the focus and unfocus circuits in their brain,\" says Pillay.","questions":[{"no":36,"stem":"The key to mastering the art of deep work is to .","A":"keep to your focus time","B":"list your immediate tasks","C":"make specific daily plans","D":"seize every minute to work","answer":"A"},{"no":37,"stem":"The study in the early 1980s cited by Harford shows that .","A":"distractions may actually increase efficiency.","B":"daily schedules are indispensable to studying","C":"students are hardly motivated by monthly goals","D":"detailed plans may not be as fruitful as expected","answer":"D"},{"no":38,"stem":"According to Newport, idleness is .","A":"a desirable mental state for busy people.","B":"a major contributor to physical health","C":"an effective way to save time and energy","D":"an essential factor in accomplishing any work","answer":"D"},{"no":39,"stem":"Pillay believes that our brains' shift between being focused and unfocused .","A":"can result in psychological well-being","B":"can bring about greater efficiency","C":"is aimed at better balance in work","D":"is driven by task urgency","answer":"B"},{"no":40,"stem":"This text is mainly about .","A":"ways to relieve the tension of busy life","B":"approaches to getting more done in less time","C":"the key to eliminating distractions","D":"the cause of the lack of focus time","answer":"B"}]}],"newtype":{"form":"heading","instruction":"Read the following text and answer the questions by choosing the most suitable subtitles from the list A-G for each numbered paragraph (41-45). There are two extra subtitles which you do not need to use. Mark your answers on the ANSWER SHEET. (10 points)","passage":"Five ways to make conversation with anyone\n\nConversations are links, which means when you have a conversation with a new person a link gets formed and every conversation you have after that moment will strengthen the link.\n\nYou meet new people every day: the grocery worker, the cab driver, new people at work or the security guard at the door. Simply starting a conversation with them will form a link.\n\nHere are five simple ways that you can make the first move and start a conversation with strangers.\n\n{{41}}\n\nSuppose you are in a room with someone you don't know and something within you says \"I want to talk with this person\"-this is something that mostly happens with all of us. You wanted to say something-the first word –but it just won't come out, it feels like it is stuck somewhere. I know the feeling and here is my advice: just get it out.\n\nJust think: what is the worst that could happen? They won't talk with you? Well, they are not talking with you now!\n\nI truly believe that once you get that first word out everything else will just flow. So keep it simple: \"Hi\", \"Hey\" or \"Hello\"- do the best you can to gather all of the enthusiasm and energy you can, put on a big smile and say \"Hi\".\n\n{{42}}\n\nIt is a problem all of us face; you have limited time with the person that you want to talk with and you want to make this talk memorable.\n\nHonestly, if we got stuck in the result of \"hi\", \"hello\", \"how are you?\" and \"what is going on?\", you will fail to give the initial jolt to the conversation that can make it so memorable.\n\nSo don't be afraid to ask more personal questions. Trust me, you'll be surprised to see how much people are willing to share if you just ask.\n\n{{43}}\n\nWhen you meet a person for the first time, make an effort to find the things which you and that person have in common so that you can build the conversation from that point. When you start conversation from there and then move outwards, you'll find all of a sudden that the conversation becomes a lot easier.\n\n{{44}}\n\nImagine you are pouring your heart out to someone and they are just busy on their phone, and if you ask for their attention you get the response \"I can multitask\".\n\nSo when someone tries to communicate with you, just be in that communication wholeheartedly. Make eye contact. Trust me, eye contact is where all the magic happens. When you make eye contact, you can feel the conversation.\n\n{{45}}\n\nYou all came into a conversation where you first met the person, but after some time you may have met again and have forgotten their name. Isn't that awkward!\n\nSo, remember the little details of the people you met or you talked with; perhaps the places they have been to, the places they want to go, the things they like, the things they hate - whatever you talk about.\n\nWhen you remember such things you can automatically become investor in their wellbeing. So they feel a responsibility to you to keep that relationship going.\n\nThat's it. Five amazing ways that you can make conversation with almost anyone. Every person is a really good book to read, or to have a conversation with!","options":{"A":"Just say it","B":"Be present","C":"Pay a unique compliment","D":"Name, places, things","E":"Find the \"me too\"s","F":"Skip the small talk","G":"Ask for an opinion"},"items":[{"no":41,"answer":"A"},{"no":42,"answer":"F"},{"no":43,"answer":"E"},{"no":44,"answer":"B"},{"no":45,"answer":"D"}],"questions":null},"translation":{"instruction":"Translate the following text into Chinese. Write your translation neatly on the ANSWER SHEET. (15 points)","passage":"A fifth grader gets a homework assignment to select his future career path from a list of occupations. He ticks \"astronaut\", but quickly adds \"scientist\" to the list and selects it as well. The boy is convinced that if he reads enough, he can explore as many career paths as he likes. And so he reads everything from encyclopedias to science fiction novels. He reads so passionately that his parents have to institute a \"no reading policy\" at the dinner table.\n\nThat boy was Bill Gates, and he hasn't stopped reading yet--not even after becoming one of the most successful people on the planet. Nowadays, his reading material has changed from science fiction and reference books: recently, he revealed that he reads at least 50 nonfiction books a year. Gates chooses nonfiction titles because they explain how the world works. \"Each book opens up new avenues of knowledge,\" Gates says."},"writing":[{"part":"A","type":"应用文","instruction":"47. Directions:","prompt":"Suppose you have to cancel your travel plan and will not be able to visit professor Smith, write him an email to 1) apologize and explain the situation and suggest a future meeting. 2) You should write about 100 words on the ANSWER SHEET. Do not use your own name; Use \"Li Ming\" instead. Do not write your address. (10 points)"},{"part":"B","type":"图表作文","instruction":"48. Directions:","prompt":"Write an essay based on the chart below. In your writing, you should 1) interpret the chart, and 2) give your comments. You should write about 150 words on the ANSWER SHEET. (15 points)","chart_desc":"饼图，标题为\"2017年某市消费者选择餐厅时的关注因素\"，共五个扇区：特色（36.3%）占比最高，其次为服务（26.8%）、环境（23.8%）、价格（8.4%），其他因素占4.7%。"}]},{"year":2019,"sources":["https://www.hqwx.com/mba-kaoshi/news/15530613906221.html","https://kaoyan.eol.cn/shiti/yingyu/201812/t20181224_1638466.shtml","http://file.xdf.cn/uploads/181223/182_181223171103y9JWm3lzlgPOr6Lz.pdf"],"notes":"主来源：环球网校文字完整版；选项顺序与完形答案交叉核对中国教育在线(文都)及新东方答案PDF。eol版完形选项字母排序与hqwx版错位，经新东方答案PDF逐题比对(如1=However在C、2=helps在D、11=track在A)，采用hqwx版选项顺序。hqwx第11题A项OCR误作trash，据eol/新东方订正为track。阅读答案来源页未逐题给出，故省略answer字段。大作文图表数据据新东方在线/启航考研范文确认。","missing":[],"cloze":{"instruction":"Read the following text. Choose the best word (s) for each numbered blank and mark A, B, C or D on the ANSWER SHEET. (10 points)","passage":"Weighing yourself regularly is a wonderful way to stay aware of any significant weight fluctuations. {{1}}, when done too often, this habit can sometimes hurt more than it {{2}}.\n\nAs for me, weighing myself every day caused me to shift my focus from being generally healthy and physically active to focusing {{3}} on the scale. That was counterproductive to my overall fitness goals. I had gained weight in the form of muscle mass, but thinking only of {{4}} the number on the scale, I altered my training program. That conflicted with how I needed to train to {{5}} my goals.\n\nI also found that weighing myself daily did not provide an accurate {{6}} of the hard work and progress I was making in the gym. It takes about three weeks to a month to notice any significant changes in your weight {{7}} altering your training program. The most {{8}} changes will be observed in skill level, strength and inches lost.\n\nFor these {{9}}, I stopped weighing myself every day and switched to a bimonthly weighing schedule {{10}}. Since weight loss is not my goal, it is less important for me to {{11}} my weight each week. Weighing every other week allows me to observe and {{12}} any significant weight changes. That tells me whether I need to {{13}} my training program.\n\nI use my bimonthly weigh-in {{14}} to get information about my nutrition as well. If my training intensity remains the same, but I'm constantly {{15}} and dropping weight, this is a {{16}} that I need to increase my daily caloric intake.\n\nThe {{17}} to stop weighing myself every day has done wonders for my overall health, fitness and well-being. I'm experiencing increased zeal for working out since I no longer carry the burden of a {{18}} morning weigh-in. I've also experienced greater success in achieving my specific fitness goals, {{19}} I'm training according to those goals, not the numbers on a scale.\n\nRather than {{20}} over the scale, turn your focus to how you look, feel how your clothes fit and your overall energy level.","questions":[{"no":1,"A":"Therefore","B":"Otherwise","C":"However","D":"Besides","answer":"C"},{"no":2,"A":"cares","B":"warns","C":"reduces","D":"helps","answer":"D"},{"no":3,"A":"solely","B":"occasionally","C":"formally","D":"initially","answer":"A"},{"no":4,"A":"lowering","B":"explaining","C":"accepting","D":"recording","answer":"A"},{"no":5,"A":"set","B":"review","C":"reach","D":"modify","answer":"C"},{"no":6,"A":"depiction","B":"distribution","C":"prediction","D":"definition","answer":"A"},{"no":7,"A":"regardless of","B":"aside from","C":"along with","D":"due to","answer":"D"},{"no":8,"A":"rigid","B":"precise","C":"immediate","D":"orderly","answer":"C"},{"no":9,"A":"judgements","B":"reasons","C":"methods","D":"claims","answer":"B"},{"no":10,"A":"though","B":"again","C":"indeed","D":"instead","answer":"D"},{"no":11,"A":"track","B":"overlook","C":"conceal","D":"report","answer":"A"},{"no":12,"A":"approve of","B":"hold onto","C":"account for","D":"depend on","answer":"C"},{"no":13,"A":"share","B":"adjust","C":"confirm","D":"prepare","answer":"B"},{"no":14,"A":"features","B":"rules","C":"tests","D":"results","answer":"D"},{"no":15,"A":"anxious","B":"hungry","C":"sick","D":"bored","answer":"B"},{"no":16,"A":"secret","B":"belief","C":"sign","D":"principle","answer":"C"},{"no":17,"A":"necessity","B":"decision","C":"wish","D":"request","answer":"B"},{"no":18,"A":"surprising","B":"restricting","C":"consuming","D":"disappointing","answer":"D"},{"no":19,"A":"because","B":"unless","C":"until","D":"if","answer":"A"},{"no":20,"A":"dominating","B":"puzzling","C":"triumphing","D":"obsessing","answer":"D"}],"fills":{"1":"However","2":"helps","3":"solely","4":"lowering","5":"reach","6":"depiction","7":"due to","8":"immediate","9":"reasons","10":"instead","11":"track","12":"account for","13":"adjust","14":"results","15":"hungry","16":"sign","17":"decision","18":"disappointing","19":"because","20":"obsessing"}},"reading":[{"name":"Text 1","instruction":"Read the following four texts. Answer the questions below each text by choosing A, B, C or D. Mark your answer on the ANSWER SHEET. (40 points)","passage":"Unlike so-called basic emotions such as sadness, fear, and anger, guilt emerges a little later, in conjunction with a child's growing grasp of social and moral norms. Children aren't born knowing how to say \"I'm sorry\"; rather, they learn over time that such statements appease parents and friends—and their own consciences. This is why researchers generally regard so-called moral guilt, in the right amount, to be a good thing: A child who claims responsibility for knocking over a tower and tries to rebuild it is engaging in behavior that's not only reparative but also pro-social.\n\nIn the popular imagination, of course, guilt still gets a bad rap. It evokes Freud's ideas and religious hang-ups. More important, guilt is deeply uncomfortable—it's the emotional equivalent of wearing a jacket weighted with stones. Who would inflict it upon a child? Yet this understanding is outdated. \"There has been a kind of revival or a rethinking about what guilt is and what role guilt can serve,\" Vaish says, adding that this revival is part of a larger recognition that emotions aren't binary—feelings that may be advantageous in one context may be harmful in another. Jealousy and anger, for example, may have evolved to alert us to important inequalities. Too much happiness (think mania) can be destructive.\n\nAnd guilt, by prompting us to think more deeply about our goodness, can encourage humans to atone for errors and fix relationships. Guilt, in other words, can help hold a cooperative species together. It is a kind of social glue.\n\nViewed in this light, guilt is an opportunity. Work by Tina Malti, a psychology professor at the University of Toronto, suggests that guilt may compensate for an emotional deficiency. In a number of studies, Malti and others have shown that guilt and sympathy (and its close cousin empathy) may represent different pathways to cooperation and sharing. Some kids who are low in sympathy may make up for that shortfall by experiencing more guilt, which can rein in their nastier impulses. And vice versa: High sympathy can substitute for low guilt.\n\nIn a 2014 study, for example, Malti and a colleague looked at 244 children, ages 4, 8, and 12. Using caregiver assessments and the children's self-observations, they rated each child's overall sympathy level and his or her tendency to feel negative emotions (like guilt and sadness) after moral transgressions. Then the kids were handed stickers and chocolate coins, and given a chance to share them with an anonymous child. For the low-sympathy kids, how much they shared appeared to turn on how inclined they were to feel guilty. The guilt-prone ones shared more, even though they hadn't magically become more sympathetic to the other child's deprivation.","questions":[{"no":21,"stem":"Researchers think that guilt can be a good thing because it may help","A":"regulate a child's basic emotions","B":"improve a child's intellectual ability","C":"intensify a child's positive feelings","D":"foster child's moral development"},{"no":22,"stem":"According to Paragraph 2, many people still think guilt to be","A":"deceptive","B":"addictive","C":"burdensome","D":"inexcusable"},{"no":23,"stem":"Vaish holds that the rethinking about guilt comes from an awareness that","A":"an emotion can play opposing roles","B":"emotions are socially constructive","C":"emotional stability can benefit health","D":"emotions are context-independent"},{"no":24,"stem":"Malti and others have shown that cooperation and sharing","A":"may help correct emotional deficiencies","B":"can bring about emotional satisfaction","C":"can result from either sympathy or guilt","D":"may be the outcome of impulsive acts"},{"no":25,"stem":"The word \"transgressions\" (line 4, para 5) is closest in meaning to","A":"wrongdoings","B":"discussions","C":"restrictions","D":"teachings"}]},{"name":"Text 2","instruction":"","passage":"Forests give us shade, quiet and one of the harder challenges in the fight against climate change. Even as we humans count on forests to soak up a good share of the carbon dioxide we produce, we are threatening their ability to do so. The climate change we are hastening could one day leave us with forests that emit more carbon than they absorb.\n\nThankfully, there is a way out of this trap—but it involves striking a subtle balance. Helping forests flourish as valuable \"carbon sinks\" long into the future may require reducing their capacity to sequester carbon now. California is leading the way, as it does on so many climate efforts, in figuring out the details.\n\nThe state's proposed Forest Carbon Plan aims to double efforts to thin out young trees and clear brush in parts of the forest, including by controlled burning. This temporarily lowers carbon-carrying capacity. But the remaining trees draw a greater share of the available moisture, so they grow and thrive, restoring the forest's capacity to pull carbon from the air. Healthy trees are also better able to fend off bark beetles. The landscape is rendered less combustible. Even in the event of a fire, fewer trees are consumed.\n\nThe need for such planning is increasingly urgent. Already, since 2010, drought and beetles have killed more than 100 million trees in California, most of them in 2016 alone, and wildfires have scorched hundreds of thousands of acres.\n\nCalifornia's plan envisions treating 35,000 acres of forest a year by 2020, and 60,000 by 2030—financed from the proceeds of the state's emissions-permit auctions. That's only a small share of the total acreage that could benefit, an estimated half a million acres in all, so it will be important to prioritize areas at greatest risk of fire or drought.\n\nThe strategy also aims to ensure that carbon in woody material removed from the forests is locked away in the form of solid lumber, burned as biofuel in vehicles that would otherwise run on fossil fuels, or used in compost or animal feed. New research on transportation biofuels is under way, and the state plans to encourage lumber production close to forest lands. In future the state proposes to take an inventory of its forests' carbon-storing capacity every five years.\n\nState governments are well accustomed to managing forests, including those owned by the U.S. Forest Service, but traditionally they've focused on wildlife, watersheds and opportunities for recreation. Only recently have they come to see the vital part forests will have to play in storing carbon. California's plan, which is expected to be finalized by the governor early next year, should serve as a model.","questions":[{"no":26,"stem":"By saying \"one of the harder challenges\" the author implies that","A":"forests may become a potential threat","B":"people may misunderstand global warming","C":"extreme weather conditions may arise","D":"global climate change may get out of control"},{"no":27,"stem":"To maintain forests as valuable carbon sinks, we may need to","A":"lower their present carbon-absorbing capacity","B":"strike a balance among different plants","C":"accelerate the growth of young trees","D":"preserve the diversity of species in them"},{"no":28,"stem":"California's Forest Carbon Plan endeavors to","A":"cultivate more drought-resistant trees","B":"find more effective ways to kill insects","C":"reduce the density of some of its forests","D":"restore its forests quickly after wildfires"},{"no":29,"stem":"What is essential to California's plan according to paragraph 5?","A":"To carry it out before the year of 2020","B":"To handle the areas in serious danger first","C":"To perfect the emissions-permit auctions","D":"To obtain enough financial support"},{"no":30,"stem":"The author's attitude to California's plan can best be described as","A":"ambiguous","B":"tolerant","C":"cautious","D":"supportive"}]},{"name":"Text 3","instruction":"","passage":"American farmers have been complaining of labor shortages for several years now. The complaints are unlikely to stop without an overhaul of immigration rules for farm workers. Efforts to create a more straightforward agricultural-workers visa that would enable foreign workers to stay longer in the U.S. and change jobs within the industry have so far failed in Congress. If this doesn't change, American businesses, communities and consumers will be the losers.\n\nPerhaps half of U.S. farm laborers are undocumented immigrants. As fewer such workers enter the U.S., the characteristics of the agricultural workforce are changing. Today's farm laborers, while still predominantly born in Mexico, are more likely to be settled rather than migrating, and more likely to be married than single. They are also aging. At the start of this century, about one-third of crop workers were over the age of 35. Now, more than half are. And crop picking is hard on older bodies.\n\nOne oft-debated cure for this labor shortage remains as implausible as it has been all along: Native U.S. workers won't be returning to the farm.\n\nMechanization is not the answer either—not yet at least. Production of corn, cotton, rice, soybeans and wheat has been largely mechanized, but many high-value, labor-intensive crops, such as strawberries, need labor. Even dairy farms, where robots currently do only a small share of milking, have a long way to go before they are automated.\n\nAs a result, farms have grown increasingly reliant on temporary guest workers using the H-2A visa to fill the gaps in the agricultural workforce. Starting around 2012, requests for the visas rose sharply: from 2011 to 2016 the number of visas issued more than doubled.\n\nThe H-2A visa has no numerical cap, unlike the H-2B visa for nonagricultural work, which is limited to 66,000 annually. Even so, employers frequently complain that they aren't allotted all the workers they need. The process is cumbersome, expensive and unreliable. One survey found that bureaucratic delays led H-2A workers to arrive on the job an average of 22 days late. And the shortage is compounded by federal immigration raids, which remove some workers and drive others underground.\n\nIn effect, the U.S. can import food or it can import the workers who pick it. The U.S. needs a simpler, streamlined, multi-year visa for agricultural workers, accompanied by measures to guard against exploitation and a viable path to U.S. residency for workers who meet the requirements. Otherwise growers will continue to struggle with shortages and uncertainty, and the country as a whole will lose out.","questions":[{"no":31,"stem":"What problem should be addressed according to the first two paragraphs?","A":"Discrimination against foreign workers in the U.S.","B":"Biased laws in favor of some American businesses","C":"Flaws in U.S. immigration rules for farm workers","D":"Decline of job opportunities in U.S. agriculture"},{"no":32,"stem":"One trouble with U.S. agricultural workforce is","A":"the rising number of illegal immigrants","B":"the high mobility of crop workers","C":"the lack of experienced laborers","D":"the aging of immigrant farm workers"},{"no":33,"stem":"What is the much-argued solution to the labor shortage in U.S. farming?","A":"To attract younger laborers to farm work","B":"To get native U.S. workers back farming","C":"To use more robots to grow high-value crops","D":"To strengthen financial support for farmers"},{"no":34,"stem":"Agricultural employers complain about the H-2A visa for its","A":"slow granting procedures","B":"limit on duration of stay","C":"tightened requirements","D":"control of annual admissions"},{"no":35,"stem":"Which of the following could be the best title for this text?","A":"U.S. Agriculture in Decline","B":"Import Food or Labor?","C":"America Saved by Mexico?","D":"Manpower vs. Automation"}]},{"name":"Text 4","instruction":"","passage":"Arnold Schwarzenegger, Dia Mirza and Adrian Grenier have a message for you: It's easy to beat plastic. They're part of a bunch of celebrities starring in a new video for World Environment Day—encouraging you, the consumer, to swap out your single-use plastic staples to combat the plastic crisis.\n\nMy biggest concern with leaving it up to the individual, however, is our limited sense of what needs to be achieved. On their own, taking our own bags to the grocery store or quitting plastic straws, for example, will accomplish little and require very little of us. They could even be detrimental, satisfying a need to have \"done our bit\" without ever progressing onto bigger, bolder, more effective actions—a kind of \"moral licensing\" that allays our concerns and stops us doing more and asking more of those in charge.\n\nWhile the conversation around our environment and our responsibility toward it remains centered on shopping bags and straws, we're ignoring the balance of power that implies that as \"consumers\" we must shop sustainably, rather than as \"citizens\" hold our governments and industries to account to push for real systemic change. Nowhere in World Environment Day 2018's key messages is there anything about voting for environmentally progressive politicians, for example. Why not?\n\nIt's important to acknowledge that the environment isn't everyone's priority—or even most people's. We shouldn't expect it to be. In her latest book, Why Good People Do Bad Environmental Things, Wellesley College professor Elizabeth R. De Sombre argues that the best way to collectively change the behavior of large numbers of people is for the change to be structural.\n\nThis might mean implementing policy such as a plastic tax that adds a cost to environmentally problematic action, or banning single-use plastics altogether. India has just announced it will eliminate all single-use plastic in the country by 2022. There are also incentive-based ways of making better environmental choices easier, such as ensuring recycling is at least as easy as trash disposal.\n\nDe Sombre isn't saying people should stop caring about the environment. It's just that individual actions are too slow, she says, for that to be the only, or even primary, approach to changing widespread behavior.\n\nNone of this is about writing off the individual. It's just about putting things into perspective. We don't have time to wait. We need progressive policies that shape collective action (and rein in polluting business), alongside engaged citizens pushing for change. That's not something we can buy.","questions":[{"no":36,"stem":"Some celebrities star in a new video to","A":"demand new laws on the use of plastics","B":"urge consumers to cut the use of plastics","C":"invite public opinion on the plastics crisis","D":"disclose the causes of the plastics crisis"},{"no":37,"stem":"The author is concerned that \"moral licensing\" may","A":"mislead us into doing worthless things","B":"prevent us from making further efforts","C":"weaken our sense of accomplishment","D":"suppress our desire for success"},{"no":38,"stem":"By pointing out our identity as \"citizens,\" the author indicates that","A":"our focus should be shifted to community welfare","B":"our relationship with local industries is improving","C":"we have been actively exercising our civil rights","D":"we should press our governments to lead the combat"},{"no":39,"stem":"De Sombre argues that the best way for a collective change should be","A":"a win-win arrangement","B":"a self-driven mechanism","C":"a cost-effective approach","D":"a top down process"},{"no":40,"stem":"The author concludes that individual efforts","A":"can be too aggressive","B":"are far from sufficient","C":"can be too inconsistent","D":"are far from rational"}]}],"newtype":{"form":"matching","instruction":"You are going to read a list of headings and a text; choose the most suitable heading from the list A-G for each numbered paragraph (41-45). There are two extra choices in the right column. Mark your answers on the ANSWER SHEET. (10 points)","passage":"How seriously should parents take kids' opinions when searching for a home?\n\nIn choosing a new home, Camille McClain's kids have a single demand: a backyard. That seemingly reasonable request turned the Chicago family's home hunt upside down, as there weren't many three-bedroom apartments on the North Side—where the family was looking—that came with yard space. Still, McClain and her husband chose to honor their 4- and 6-year-olds' request.\n\n\"We worked with a few apartment brokers, and it was strange that many of them didn't even know if there was outdoor space, so they'd bring us to an apartment, we'd see that it didn't have a yard, and we'd move on,\" said McClain, who runs Merry Music Makers in Lakeview, a business focused on music education for children.\n\nMcClain's little ones aren't the only kids who have an opinion when it comes to housing, and in many cases youngsters' views weigh heavily on parents' real estate decisions, according to a 2018 Harris Poll survey of more than 2,000 U.S. adults.\n\nRenters paid attention to their kids' preferences even more: 83 percent said their children's opinions will be a factor when they buy a home.\n\nThe idea of involving children in a big decision is a great idea because it can help them feel a sense of control and ownership in what can be an overwhelming process, said Ryan Hooper, clinical psychologist in Chicago.\n\n\"Children may face serious difficulties in coping with significant moves, especially if it removes them from their current school or support system,\" he said.\n\nYounger children should feel like they're choosing their home—without actually getting a choice in the matter, said Adam Bailey, real estate attorney based in New York and author of the upcoming children's book Home, about the search for the perfect home from the viewpoint of a child.\n\nAsking them questions about what they like about the backyard of a potential home—or asking them where their toys would go in the house—will make them feel like they're being included in the decision-making process, Bailey said. Many of the aspects of home buying aren't a consideration for children, said Tracey Hampson, a real estate agent based in Santa Clarita, Calif. And placing too much emphasis on their opinions can ruin a fantastic home purchase.\n\nShe has a client who has been house-hunting for a while, and he always asks his young children their opinion. But when this buyer finally decided to write an offer on a home with a pool, his children burst into tears because they didn't want a pool.\n\n\"They ended up not submitting an offer,\" Hampson said. \"So speaking with your children before you make a real estate decision is wise, but I wouldn't base the purchasing decision solely on their opinions.\"\n\nThe other issue is that many children—especially older ones—may base their real estate knowledge on HGTV shows, which tend to focus on superficial aspects of real estate, said Aaron Norris of The Norris Group in Riverside, Calif.\n\n\"They love Chip and Joanna Gaines just as much as the rest of us,\" he said. \"HGTV has seriously changed how people view real estate. It's not shelter, it's a lifestyle. With that mindset change comes some serious money consequences.\"\n\nKids tend to get stuck in the features and the immediate benefits to them personally, Norris said. And while their opinions on those elements shouldn't reign supreme, the homebuying process could be a time to start talking to kids about money, budgeting, homeownership and other financial decisions.\n\n\"Their opinions can change tomorrow,\" Garner said. \"As harsh as it may be to say, that decision should likely not be made contingent on a child's opinions, but rather made for them with great consideration into what home can meet their needs best—and give them an opportunity to customize it bit and make it their own.\"\n\nThis advice is more relevant now than ever before, even as more parents want to embrace the ideas of their children, despite the current housing crunch.\n\nToday, wannabe homebuyers have to be more open when it comes to must-haves and what you can compromise on, Hampson said.\n\nAnd speaking of compromise: The McClain kids, hungry for outdoor space, fell in love with a home in the North Park neighborhood that had a large yard. But it wasn't ideal by their parents' standards.\n\nThe family ended up renting a house in North Center that had a smaller yard, but it was still big enough for playtime.\n\n\"I had to do a bit of a sales job with the kids since they loved the yard in North Park,\" McClain said. \"But there's a hammock they lounge on, a spot to jump rope, a place to play in the sprinkler, and an area to write with sidewalk chalk.\"","options":{"A":"notes that aspects like children's friends and social activities should be considered upon homebuying","B":"believes that home buying should be based on children's needs rather than their opinions","C":"assumes that many children's views on real estate are influenced by the media","D":"remarks that significant moves may pose challenges to children","E":"says that it is wise to leave kids in the dark about real estate","F":"advises that home purchase should not be based only on children's decisions","G":"thinks that children should be given a sense of involvement in homebuying decisions"},"items":[{"no":41,"stem":"Ryan Hooper","answer":"D"},{"no":42,"stem":"Adam Bailey","answer":"G"},{"no":43,"stem":"Tracey Hampson","answer":"F"},{"no":44,"stem":"Aaron Norris","answer":"C"},{"no":45,"stem":"Julie Garner","answer":"B"}],"questions":null},"translation":{"instruction":"In this section, there is a text in English. Translate it into Chinese. Write your translation on the ANSWER SHEET. (15 points)","passage":"It is easy to underestimate English writer James Herriot. He had such a pleasant, readable style that one might think that anyone could imitate it. How many times have I heard people say, \"I could write a book, I just haven't the time.\" Easily said. Not so easily done. James Herriot, contrary to popular opinion, did not find it easy in his early days of, as he put it, \"having a go at the writing game\". While he obviously had an abundance of natural talent, the final, polished work that he gave to the world was the result of years of practising, re-writing and reading. Like the majority of authors, he had to suffer many disappointments and rejections along the way, but these made him all the more determined to succeed. Everything he achieved in life was earned the hard way and his success in the literary field was no exception."},"writing":[{"part":"A","type":"应用文","instruction":"47. Directions:","prompt":"Suppose Professor Smith asked you to plan a debate on the theme of city traffic. Write him an email to (1) suggest a specific topic with your reason, and (2) tell him about your arrangement. You should write about 100 words neatly on the ANSWER SHEET. Do not sign your own name, use \"Li Ming\" instead. (10 points)"},{"part":"B","type":"图表作文","instruction":"48. Directions:","prompt":"In this section, you are asked to write an essay based on the following chart. (1) Interpret the chart, and (2) Give your comments. You should write at least 150 words. Write your essay on the ANSWER SHEET. (15 points)","chart_desc":"柱状图，标题为某高校毕业生毕业去向选择(2013年与2018年对比)，共三类去向：求职就业(seeking employment)由2013年的68.1%降至2018年的60.7%(下降7.4个百分点)；升学/继续深造(pursuing further education)由26.3%升至34.0%(上升7.7个百分点)；创业(starting their own business)由1.3%升至2.6%(上升1.3个百分点)。"}]},{"year":2020,"sources":["https://m.koolearn.com/kaoyan/20201116/1414076.html"],"notes":"来源：新东方在线移动版2020年英语二真题及答案。完形答案词取自该页所附答案列表。阅读Text1答案据该页所给标注填入；其余阅读答案该页未完整列出，故省略。原文为手机版OCR，已修正明显录入错误(如5 our days→four days, Tats→rats, warming→warning, cations→actions, [PD]等)；人名Loleh Quinn疑为OCR转写，保留原样。大作文饼图数据据该页配图读取。","missing":[],"cloze":{"instruction":"Read the following text. Choose the best word (s) for each numbered blank and mark A, B, C or D on the ANSWER SHEET. (10 points)","passage":"Being a good parent is, of course, what every parent would like to be. But defining what it means to be a good parent is undoubtedly very {{1}}, particularly since children respond differently to the same style of parenting. A calm, rule-following child might respond better to a different sort of parenting than, {{2}}, a younger sibling.\n\n{{3}}, there's another sort of parent that's a bit easier to {{4}}: a patient parent. Children of every age benefit from patient parenting. Still, {{5}} every parent would like to be patient, this is no easy {{6}}. Sometimes parents get exhausted and frustrated and are unable to maintain a {{7}} and composed style with their kids. I understand this.\n\nYou're only human, and sometimes your kids can {{8}} you just a little too far. And then the {{9}} happens: You lose your patience and either scream at your kids or say something that was a bit too {{10}} and does nobody any good. You wish that you could {{11}} the clock and start over. We've all been there.\n\n{{12}}, even though it's common, it's important to keep in mind that in a single moment of fatigue, you can say something to your child that you may {{13}} for a long time. This may not only do damage to your relationship with your child but also {{14}} your child's self-esteem.\n\nIf you consistently lose your {{15}} with your kids, then you are inadvertently modeling a lack of emotional control for your kids. We are all becoming increasingly aware of the {{16}} of modeling tolerance and patience for the younger generation. This is a skill that will help them all throughout life. In fact, the ability to emotionally regulate or maintain emotional control when {{17}} by stress is one of the most important of all life's skills.\n\nCertainly, it's incredibly {{18}} to maintain patience at all times with your children. A more practical goal is to try, to the best of your ability, to be as tolerant and composed as you can when faced with {{19}} situations involving your children. I can promise you this: As a result of working toward this goal, you and your children will benefit and {{20}} from stressful moments feeling better physically and emotionally.","questions":[{"no":1,"A":"tedious","B":"pleasant","C":"instructive","D":"tricky","answer":"D"},{"no":2,"A":"in addition","B":"for example","C":"at once","D":"by accident","answer":"B"},{"no":3,"A":"fortunately","B":"occasionally","C":"accordingly","D":"eventually","answer":"A"},{"no":4,"A":"amuse","B":"assist","C":"describe","D":"train","answer":"B"},{"no":5,"A":"while","B":"because","C":"unless","D":"once","answer":"A"},{"no":6,"A":"answer","B":"task","C":"choice","D":"access","answer":"B"},{"no":7,"A":"tolerant","B":"formal","C":"rigid","D":"critical","answer":"A"},{"no":8,"A":"move","B":"drag","C":"push","D":"send","answer":"C"},{"no":9,"A":"mysterious","B":"illogical","C":"suspicious","D":"inevitable","answer":"D"},{"no":10,"A":"boring","B":"naive","C":"harsh","D":"vague","answer":"C"},{"no":11,"A":"turn back","B":"take apart","C":"set aside","D":"cover up","answer":"A"},{"no":12,"A":"overall","B":"instead","C":"however","D":"otherwise","answer":"C"},{"no":13,"A":"like","B":"miss","C":"believe","D":"regret","answer":"D"},{"no":14,"A":"raise","B":"affect","C":"justify","D":"reflect","answer":"B"},{"no":15,"A":"time","B":"bond","C":"race","D":"cool","answer":"D"},{"no":16,"A":"nature","B":"secret","C":"importance","D":"context","answer":"C"},{"no":17,"A":"cheated","B":"defeated","C":"confused","D":"confronted","answer":"D"},{"no":18,"A":"terrible","B":"hard","C":"strange","D":"wrong","answer":"B"},{"no":19,"A":"trying","B":"changing","C":"exciting","D":"surprising","answer":"B"},{"no":20,"A":"hide","B":"emerge","C":"withdraw","D":"escape","answer":"D"}],"fills":{"1":"tricky","2":"for example","3":"fortunately","4":"assist","5":"while","6":"task","7":"tolerant","8":"push","9":"inevitable","10":"harsh","11":"turn back","12":"however","13":"regret","14":"affect","15":"cool","16":"importance","17":"confronted","18":"hard","19":"changing","20":"escape"}},"reading":[{"name":"Text 1","instruction":"Read the following four texts. Answer the questions below each text by choosing A, B, C or D. Mark your answers on the ANSWER SHEET. (40 points)","passage":"Rats and other animals need to be highly attuned to social signals from others so that they can identify friends to cooperate with and enemies to avoid. To find out if this extends to non-living beings, Leilah Quinn at the University of California, San Diego, and her colleagues tested whether rats can detect social signals from robotic rats.\n\nThey housed eight adult rats with two types of robotic rat—one social and one asocial—for four days. The robots rats were quite minimalist, resembling a chunkier version of a computer mouse with wheels—to move around and colorful markings.\n\nDuring the experiment, the social robot rat followed the living rats around, played with the same toys, and opened caged doors to let trapped rats escape. Meanwhile, the asocial robot simply moved forwards and backwards and side to side.\n\nNext, the researchers trapped the robots in cages and gave the rats the opportunity to release them by pressing a lever.\n\nAcross 18 trials each, the living rats were 52 percent more likely on average to set the social robot free than the asocial one. This suggests that the rats perceived the social robot as a genuine social being. They may have bonded more with the social robot because it displayed behaviours like communal exploring and playing. This could lead to the rats better remembering having freed it earlier, and wanting the robot to return the favour when they get trapped, says Quinn.\n\nThe readiness of the rats to befriend the social robot was surprising given its minimal design. The robot was the same size as a regular rat but resembled a simple plastic box on wheels. \"We'd assumed we'd have to give it a moving head and tail, facial features, and put a scent on it to make it smell like a real rat, but that wasn't necessary,\" says Janet Wiles at the University of Queensland in Australia, who helped with the research.\n\nThe finding shows how sensitive rats are to social cues, even when they come from basic robots. Similarly, children tend to treat robots as if they are fellow beings, even when they display only simple social signals. \"We humans seem to be fascinated by robots, and it turns out other animals are too,\" says Wiles.","questions":[{"no":21,"stem":"Quinn and her colleagues conducted a test to see if rats can .","A":"pick up social signals from non-living rats","B":"distinguish a friendly rat from a hostile one","C":"attain sociable traits through special training","D":"send out warning messages to their fellow","answer":"A"},{"no":22,"stem":"What did the social robot do during the experiment?","A":"It followed the social robot.","B":"It played with some toys.","C":"It set the trapped rats free.","D":"It moved around alone.","answer":"D"},{"no":23,"stem":"According to Quinn, the rats released the social robot because they .","A":"tried to practice a means of escape","B":"expected it to do the same in return","C":"wanted to display their intelligence","D":"considered that an interesting game","answer":"B"},{"no":24,"stem":"Janet Wiles notes that rats .","A":"can remember other rats' facial features","B":"differentiate smells better than sizes","C":"respond more to actions than to looks","D":"can be scared by a plastic box on wheels","answer":"C"},{"no":25,"stem":"It can be learned from the text that rats .","A":"appear to be adaptable to new surroundings","B":"are more socially active than other animals","C":"behave differently from children in socializing","D":"are more sensitive to social cues than expected","answer":"D"}]},{"name":"Text 2","instruction":"","passage":"It is fashionable today to bash Big Business. And there is one issue on which the many critics agree: CEO pay. We hear that CEOs are paid too much (or too much relative to workers), or that they rig others' pay, or that their pay is insufficiently related to positive outcomes. But the more likely truth is CEO pay is largely caused by intense competition.\n\nIt is true that CEO pay has gone up—top ones may make 300 times the pay of typical workers on average, and since the mid-1970s, CEO pay for large publicly traded American corporations has, by varying estimates, gone up by about 500%. The typical CEO of a top American corporation—from the 350 largest such companies—now makes about $18.9 million a year.\n\nWhile individual cases of overpayment definitely exist, in general, the determinants of CEO pay are not so mysterious and not so mired in corruption. In fact, overall CEO compensation for the top companies rises pretty much in lockstep with the value of those companies on the stock market.\n\nThe best model for understanding the growth of CEO pay, though, is that of limited CEO talent in a world where business opportunities for the top firms are growing rapidly. The efforts of America's highest-earning 1% have been one of the more dynamic elements of the global economy. It's not popular to say, but one reason their pay has gone up so much is that CEOs really have upped their game relative to many other workers in the U.S. economy.\n\nToday's CEO, at least for major American firms, must have many more skills than simply being able to \"run the company.\" CEOs must have a good sense of financial markets and maybe even how the company should trade in them. They also need better public relations skills than their predecessors, as the costs of even a minor slipup can be significant. Then there's the fact that large American companies are much more globalized than ever before, with supply chains spread across a larger number of countries. To lead in that system requires knowledge that is fairly mind-boggling.\n\nThere is yet another trend: virtually all major American companies are becoming tech companies, one way or another. An agribusiness company, for instance, may focus on R&D in highly IT-intensive areas such as genome sequencing. Similarly, it is hard to do a good job running the Walt Disney Company just by picking good movie scripts and courting stars; you also need to build a firm capable of creating significant CGI products for animated movies at the highest levels of technical sophistication and with many frontier innovations along the way.\n\nOn top of all of this, major CEOs still have to do the job they have always done—which includes motivating employees, serving as an internal role model, helping to define and extend a corporate culture, understanding the internal accounting, and presenting budgets and business plans to the board. Good CEOs are some of the world's most potent creators and have some of the very deepest skills of understanding.","questions":[{"no":26,"stem":"Which of the following has contributed to CEO pay rise?","A":"The growth in the number of corporations","B":"The general pay rise with a better economy","C":"Increased business opportunities for top firms","D":"Close cooperation among leading economics"},{"no":27,"stem":"Compared with their predecessors, today's CEOs are required to__.","A":"foster a stronger sense of teamwork","B":"finance more research and development","C":"establish closer ties with tech companies","D":"operate more globalized companies"},{"no":28,"stem":"CEO pay has been rising since the 1970s despite__.","A":"continual internal opposition","B":"strict corporate governance","C":"conservative business strategies","D":"repeated governance warnings"},{"no":29,"stem":"High CEO pay can be justified by the fact that it helps__.","A":"confirm the status of CEOs","B":"motivate inside candidates","C":"boost the efficiency of CEOs","D":"increase corporate value"},{"no":30,"stem":"The most suitable title for this text would be__.","A":"CEOs Are Not Overpaid","B":"CEO Pay: Past and Present","C":"CEOs' Challenges of Today","D":"CEO Traits: Not Easy to Define"}]},{"name":"Text 3","instruction":"","passage":"Madrid was hailed as a public health beacon last November when it rolled out ambitious restrictions on the most polluting cars. Seven months and one election day later, a new conservative city council suspended enforcement of the clean air zone, a first step toward its possible demise.\n\nMayor Jose Luis Martinez-Almeida made opposition to the zone a centrepiece of his election campaign, despite its success in improving air quality. A judge has now overruled the city's decision to stop levying fines, ordering them reinstated. But with legal battles ahead, the zone's future looks uncertain at best.\n\nAmong other weaknesses, the measures cities must employ when left to tackle dirty air on their own are politically contentious, and therefore vulnerable. That's because they inevitably put the costs of cleaning the air on to individual drivers—who must pay fees or buy better vehicles—rather than on to the car manufacturers whose cheating is the real cause of our toxic pollution.\n\nIt's not hard to imagine a similar reversal happening in London. The new ultra-low emission zone (Ulez) is likely to be a big issue in next year's mayoral election. And if Sadiq Khan wins and extends it to the North and South Circular roads in 2021 as he intends, it is sure to spark intense opposition from the far larger number of motorists who will then be affected.\n\nIt's not that measures such as London's Ulez are useless. Far from it. Local officials are using the levers that are available to them to safeguard residents' health in the face of a serious threat. The zones do deliver some improvements to air quality, and the science tells us that means real health benefits—fewer heart attacks, strokes and premature births, less cancer, dementia and asthma. Fewer untimely deaths.\n\nBut mayors and councillors can only do so much about a problem that is far bigger than any one city or town. They are acting because national governments—Britain's and others across Europe—have failed to do so.\n\nRestrictions that keep highly polluting cars out of certain areas—city centres, \"school streets\", even individual roads—are a response to the absence of a larger effort to properly enforce existing regulations and require auto companies to bring their vehicles into compliance. Wales has introduced special low speed limits to minimise pollution. We're doing everything but insist that manufacturers clean up their cars.","questions":[{"no":31,"stem":"Which of the following is true about Madrid's clean air zone?","A":"Its effects are questionable","B":"It has been opposed by a judge","C":"It needs tougher enforcement","D":"Its fate is yet to be decided"},{"no":32,"stem":"Which is considered a weakness of the city-level measures to tackle dirty air?","A":"They are biased against car manufacturers.","B":"They prove impractical for city councils.","C":"They are deemed too mild for politicians.","D":"They put too much burden on individual motorists."},{"no":33,"stem":"The author believes that the extension of London's Ulez will .","A":"arouse strong resistance.","B":"ensure Khan's electoral success.","C":"improve the city's traffic.","D":"discourage car manufacturing."},{"no":34,"stem":"Who does the author think should have addressed the problem?","A":"Local residents","B":"Mayors.","C":"Councilors.","D":"National governments."},{"no":35,"stem":"It can be inferred from the last paragraph that auto compani
